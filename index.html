<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reba">
<meta name="theme-color" content="#1A1A18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Reba — Gun Dog Program</title>
<style>
  :root{
    --ink:#E8E4DC; --muted:#8A8578; --bg:#1A1A18; --line:#2E2E2A;
    --alert:#C4513D; --card:#242422; --accent:#5B8C5A;
    --card-hover:#2C2C28; --surface:#1E1E1C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{overscroll-behavior:none;}
  body{margin:0; font-family:-apple-system,system-ui,'Helvetica Neue',Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--ink); font-size:17px; line-height:1.47;
       padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
       touch-action:pan-x pan-y; -webkit-text-size-adjust:100%;
       overscroll-behavior-y:none; -webkit-overflow-scrolling:touch;}
  /* ── screens ── */
  .screen{min-height:100vh; min-height:100dvh;}
  /* ── home screen ── */
  .home-banner{padding:40px 20px 16px; padding-top:calc(40px + env(safe-area-inset-top));
               background:linear-gradient(135deg, rgba(91,140,90,.85), rgba(47,74,50,.9));
               border-radius:0 0 24px 24px; margin-bottom:14px;
               box-shadow:0 4px 16px rgba(0,0,0,.4);}
  .home-title{font-size:28px; font-weight:800; letter-spacing:-.02em; color:#fff;}
  .home-subtitle{font-size:13px; font-weight:600; letter-spacing:.08em; color:rgba(255,255,255,.7); margin-top:2px;}
  .home-build{font-size:11px; color:rgba(255,255,255,.4); margin-top:6px;}
  .home-dogs{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 40px;}
  .dog-card{display:flex; flex-direction:column; align-items:center; justify-content:start;
            gap:8px; border-radius:16px; padding:16px 12px 14px;
            box-shadow:0 2px 8px rgba(0,0,0,.3); cursor:pointer; color:#fff;
            transition:transform .1s ease;}
  .dog-card:active{transform:scale(.95);}
  .dog-avatar{width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.15);
              display:flex; align-items:center; justify-content:center;
              font-size:26px; overflow:hidden; flex-shrink:0; color:rgba(255,255,255,.6);
              border:3px solid rgba(255,255,255,.25);}
  .dog-avatar img{width:100%; height:100%; object-fit:cover;}
  .dog-info{text-align:center; min-width:0; width:100%; overflow:hidden;}
  .dog-name{font-size:17px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dog-status{font-size:11px; color:rgba(255,255,255,.6); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dog-add{display:flex; align-items:center; justify-content:center; gap:8px;
           background:none; border:2px dashed rgba(255,255,255,.2); border-radius:16px;
           padding:14px; color:rgba(255,255,255,.4); font-size:14px;
           font-weight:600; cursor:pointer; width:100%;
           transition:transform .1s ease;}
  .dog-add:active{transform:scale(.95);}
  /* ── hub screen ── */
  .hub-bar{position:sticky; top:0; z-index:10; display:flex; align-items:center;
           gap:10px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top));
           background:rgba(26,26,24,.8); -webkit-backdrop-filter:blur(12px);
           backdrop-filter:blur(12px); border-bottom:0.5px solid rgba(255,255,255,.08);}
  .hub-back,.tab-back{border:0; background:none; font-size:42px; font-weight:300;
                      color:var(--accent); padding:4px 8px; line-height:1; cursor:pointer;
                      min-width:44px; min-height:44px; display:flex; align-items:center;}
  .hub-dog{display:flex; align-items:center; gap:8px; flex:1; min-width:0;}
  .hub-avatar{width:32px; height:32px; border-radius:50%; background:#3A3A36;
              overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; color:var(--muted);}
  .hub-avatar img{width:100%; height:100%; object-fit:cover;}
  .hub-name{font-size:17px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hub-edit{border:0; background:none; font-size:20px; color:var(--muted); cursor:pointer; padding:4px 8px;}
  .hub-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:20px 16px 40px;}
  .hub-tile{border-radius:16px; padding:22px 14px 18px;
            text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.3); cursor:pointer;
            transition:transform .1s ease; border:none; color:#fff; font-family:inherit;}
  .hub-tile:active{transform:scale(.95);}
  .hub-icon{margin-bottom:8px; display:flex; align-items:center; justify-content:center; height:40px;}
  .hub-icon svg{width:32px; height:32px; fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .hub-label{font-size:14px; font-weight:700; letter-spacing:.05em;}
  .hub-sub{font-size:11px; color:rgba(255,255,255,.65); margin-top:4px; min-height:16px;}
  /* ── tab screen bar ── */
  .tab-bar{position:sticky; top:0; z-index:10; display:flex; align-items:center;
           gap:8px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top));
           background:rgba(26,26,24,.8); -webkit-backdrop-filter:blur(12px);
           backdrop-filter:blur(12px); border-bottom:0.5px solid rgba(255,255,255,.08);}
  .tab-title{font-size:17px; font-weight:700; flex:1;}
  .card-step{border:0; background:none; font-size:14px; font-weight:600; color:var(--accent);
             padding:6px 10px; cursor:pointer; min-height:44px;}
  .card-step:active{opacity:.5;}
  .card-step-end{width:50px;}
  main{padding:12px 12px 90px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
  .chip{padding:11px 16px; border:1.5px solid var(--line); border-radius:22px; background:var(--card);
        font-size:14px; font-weight:600; color:var(--muted); min-height:44px;}
  .chip.on{color:#fff; border-color:transparent;}
  .cardrow{display:flex; align-items:center; gap:12px; background:var(--card);
           border-radius:14px; padding:14px 16px; margin-bottom:8px;
           box-shadow:0 2px 8px rgba(0,0,0,.3); cursor:pointer;
           transition:transform .1s ease;}
  .cardrow:active{transform:scale(.98);}
  .cardrow .stripe{width:6px; align-self:stretch; border-radius:3px;}
  .cardrow .code{font-weight:800; font-size:14px; width:52px; letter-spacing:.03em;}
  .cardrow .ti{font-size:16px; flex:1;}
  .cardrow .ty{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  /* card detail */
  .detail{background:var(--card); border-radius:16px; overflow:hidden;
          box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .detail .head{color:#fff; padding:16px 18px;}
  .detail .head .code{font-size:13px; font-weight:700; letter-spacing:.1em; opacity:.85;}
  .detail .head .title{font-size:22px; font-weight:800; line-height:1.25; margin-top:2px;}
  .detail .sec{padding:16px 18px; border-top:1px solid var(--line);}
  .detail h4{margin:0 0 8px; font-size:12px; letter-spacing:.12em; color:var(--muted);}
  .detail .txt{font-size:17px; line-height:1.5;}
  .big .txt{font-size:20px; line-height:1.55;}
  .ifrow{display:grid; grid-template-columns:1fr 1.6fr; gap:12px; padding:10px 0;
         border-top:1px dashed var(--line); font-size:16px; line-height:1.45;}
  .ifrow:first-of-type{border-top:0;}
  .ifrow .if{font-weight:700;}
  .checkrow{display:flex; gap:10px; padding:8px 0; font-size:16px; align-items:center;}
  .checkrow .num{font-weight:800; white-space:nowrap; font-size:17px;}
  .check-progress{height:4px; background:var(--line); border-radius:2px; flex:0 0 60px;}
  .check-fill{height:100%; background:var(--accent); border-radius:2px; transition:width .3s;}
  .capnote{background:#2A2820; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; margin-top:10px;}
  /* requires links */
  .req-link{display:flex; align-items:center; gap:8px; width:100%; padding:10px 0;
            border:0; background:none; text-align:left; font:inherit; cursor:pointer;
            border-top:1px solid rgba(0,0,0,.06);}
  .req-link:first-of-type{border-top:0;}
  .req-code{font-weight:800; font-size:14px; min-width:48px;}
  .req-title{flex:1; font-size:15px; color:var(--muted);}
  .req-arrow{font-size:20px; color:var(--line);}
  /* check items */
  .check-item{padding:10px 0; border-top:1px solid rgba(0,0,0,.06);}
  .check-item:first-child{border-top:0;}
  .check-top{display:flex; align-items:center; gap:8px;}
  .check-id{font-weight:800; font-size:14px; min-width:30px;}
  .check-ratio{font-weight:700; font-size:15px;}
  .check-pct{margin-left:auto; font-size:13px; color:var(--muted); font-weight:600;}
  .check-done{margin-left:auto; font-size:16px; color:var(--accent);}
  .check-label{font-size:15px; color:var(--muted); margin:3px 0 6px 0;}
  .check-assert{font-size:12px; color:var(--muted); font-style:italic; margin:0 0 6px 0;}
  .check-progress{height:4px; background:var(--line); border-radius:2px;}
  .check-fill{height:100%; background:var(--ink); border-radius:2px; transition:width .3s;}
  /* equipment tags */
  .eq-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
  .eq-tag{padding:5px 12px; background:#2E2E2A; border-radius:8px; font-size:13px; font-weight:600;}
  /* log form */
  .fs{background:var(--card); border-radius:14px; padding:14px; margin-bottom:14px;
      box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .fs h3{margin:0 0 4px; font-size:13px; letter-spacing:.12em; color:var(--muted);}
  .fs .why{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
  label.f{display:block; font-size:13px; font-weight:700; margin:12px 0 4px;}
  label.f .hint{font-weight:400; color:var(--muted);}
  input[type=text],input[type=number],input[type=date],textarea{
    width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:16px;
    background:#1E1E1C; color:var(--ink);}
  textarea{min-height:64px;}
  .row2{display:flex; gap:10px;} .row2>*{flex:1;}
  .req{color:var(--alert);}
  .cardlog{border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; background:var(--card);}
  .cardlog .hd{display:flex; align-items:center; gap:8px; font-weight:800;}
  .cardlog .hd .dot{width:10px;height:10px;border-radius:5px;}
  .ckline{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .ckline .lb{flex:1 1 100%; font-size:14px;}
  .ckline input[type=number]{width:64px;}
  .ckline .of{color:var(--muted); font-weight:700;}
  .warn{color:var(--alert); font-weight:700; font-size:14px; margin-top:8px;}
  /* old breadcrumb classes removed — card nav now in tab bar */
  .export{background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:12px; margin-top:14px;}
  pre{white-space:pre-wrap; font-size:13px; background:#1A1A18; padding:10px; border-radius:8px; max-height:340px; overflow:auto; color:var(--muted);}
  .go{width:100%; padding:14px; font-size:17px; font-weight:800; color:#fff; background:var(--accent); border:0; border-radius:12px;}
  .copy{width:100%; padding:12px; font-size:15px; font-weight:700; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; margin-top:8px;}
  .missing{background:#2E2018; border:1px solid var(--alert); border-radius:10px; padding:10px; margin-top:10px; font-size:14px;}
  .subtle{font-size:12.5px; color:var(--muted); text-align:center; margin-top:18px;}
  /* track tiles grid */
  .trk-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .trk-tile{border-radius:16px;padding:14px 10px 12px;text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;transition:transform .1s ease;
    border:none;color:#fff;font-family:inherit;display:flex;flex-direction:column;align-items:center;}
  .trk-tile:active{transform:scale(.95);}
  .trk-ring{width:52px;height:52px;margin-bottom:6px;}
  .trk-tile-tag{font-size:15px;font-weight:800;letter-spacing:.05em;}
  .trk-tile-name{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px;}
  .trk-tile-cur{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;
    font-weight:600;min-height:14px;}
  /* track card tiles (drill-down view) */
  .trk-card-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .trk-card-tile{border-radius:14px;padding:14px 12px 12px;text-align:left;
    box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;transition:transform .1s ease;
    border:none;color:#fff;font-family:inherit;display:flex;flex-direction:column;
    min-height:90px;}
  .trk-card-tile:active{transform:scale(.95);}
  .trk-current{box-shadow:0 0 0 2px var(--accent),0 2px 8px rgba(0,0,0,.3);}
  .trk-card-code{font-size:14px;font-weight:800;letter-spacing:.04em;}
  .trk-card-title{font-size:13px;color:rgba(255,255,255,.8);margin-top:3px;
    line-height:1.3;flex:1;}
  .trk-card-type{font-size:10px;font-weight:800;letter-spacing:.08em;
    color:rgba(255,255,255,.5);margin-top:4px;}
  .trk-card-badge{margin-top:6px;}
  /* tracks */
  .trk{background:var(--card); border-radius:14px; margin-bottom:12px; overflow:hidden;
       box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .trk .th{color:#fff; padding:10px 12px;}
  .trk .th .nm{font-weight:800; font-size:16px;}
  .trk .th .cur{font-size:12.5px; opacity:.9;}
  .srow{display:flex; align-items:center; gap:9px; padding:9px 12px; border-top:1px solid var(--line); font-size:14.5px;}
  .srow.lock{color:var(--muted); background:#1E1E1C;}
  .srow .cd{font-weight:800; width:48px; font-size:13px;}
  .srow .nm{flex:1;}
  .badge{font-size:10.5px; font-weight:800; letter-spacing:.07em; padding:3px 7px; border-radius:10px; white-space:nowrap;}
  .b-banked{background:#2E7D4F; color:#fff;}
  .b-assert{background:#2E7D4F; color:#fff; opacity:.72;}
  .b-prog{background:#C47B2B; color:#fff;}
  .b-short{background:var(--alert); color:#fff;}
  .b-lock{background:#3A3A36; color:#7A7A72;}
  .sd{padding:8px 12px 10px 60px; border-top:1px dashed var(--line); font-size:13px;
      background:#2E2018; color:#D4917A;}
  .sd b{color:var(--alert);}
  .b-none{background:#2E2E2A; color:var(--muted);}
  .why{font-size:12.5px; color:var(--muted);}
  .ckmini{display:flex; gap:8px; padding:5px 12px 5px 60px; font-size:13px; color:var(--muted); border-top:1px dashed var(--line);}
  .ckmini .id{font-weight:800; width:22px;}
  .asof{font-size:12.5px; color:var(--muted); background:#2A2820; border:1px solid var(--line);
        border-radius:8px; padding:9px 11px; margin-bottom:12px;}
  /* week */
  .ribbon{display:flex; gap:10px; align-items:baseline; background:var(--accent); color:#fff;
          border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .ribbon .big{font-size:21px; font-weight:800; letter-spacing:.02em;}
  .ribbon .sub{font-size:12px; opacity:.85; flex:1;}
  .expo{font-size:12.5px; color:var(--muted); margin:-4px 2px 10px;}
  .strip{display:flex; gap:2px; margin-bottom:12px; align-items:center; flex-wrap:wrap;}
  .strip i{width:8px; height:8px; border-radius:4px; background:#3A3A36; display:block; flex:0 0 8px;}
  .strip i.w{background:var(--accent);}
  .strip i.r{background:transparent; border:2px solid #3A3A36; width:8px; height:8px; border-radius:4px; box-sizing:border-box;}
  .strip i.t{outline:2px solid var(--alert); outline-offset:2px;}
  .strip .key{font-size:11px; color:var(--muted); width:100%; text-align:right; margin-top:2px;}
  .wknav{display:flex; gap:12px; margin-bottom:10px;}
  .wknav button{padding:12px 20px; border:1.5px solid var(--line); background:var(--card);
                border-radius:8px; font-weight:800; color:var(--muted);}
  .wknav .lab{flex:1; text-align:center; font-weight:800; letter-spacing:.06em; font-size:13px; padding-top:10px;}
  .day{background:var(--card); border-radius:12px; margin-bottom:8px; overflow:hidden;
       box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .day.today{box-shadow:0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,.3);}
  .day .dh{display:flex; align-items:baseline; gap:8px; padding:9px 12px;
           font-size:12px; letter-spacing:.07em; color:var(--muted);}
  .day .dh b{font-size:15px; color:var(--ink); letter-spacing:0; font-weight:700;}
  .day .dh .rt{margin-left:auto; font-size:10.5px; font-weight:800; letter-spacing:.08em;}
  .ran{display:flex; gap:9px; align-items:baseline; padding:7px 12px; border-top:1px solid var(--line); font-size:14.5px;}
  .ran .cd{font-weight:800; width:52px; font-size:13px;}
  .ran .sc{margin-left:auto; font-weight:800; font-size:13px;}
  .ran .sc.no{color:var(--muted); font-weight:600;}
  .rest{padding:11px 12px; border-top:1px solid var(--line); background:#1E1E1C;
        font-weight:800; letter-spacing:.09em; font-size:12.5px; text-align:center;}
  .empty{padding:9px 12px; border-top:1px solid var(--line); font-size:13px; color:var(--muted);}
  .slot{padding:9px 12px; border-top:1px solid var(--line); font-size:14px;}
  .slot .lb{font-size:10.5px; font-weight:800; letter-spacing:.09em; color:var(--muted);}
  .eq{font-size:12.5px; color:var(--muted); line-height:1.35;}
  .live{padding:9px 12px; border-top:1px solid var(--line); background:#2A2820; font-size:13px;}
  .horizon{background:var(--card); border-radius:14px; padding:12px; margin-top:16px;
           box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .horizon h4{margin:0 0 2px; font-size:12px; letter-spacing:.12em; color:var(--muted);}
  .hz{display:flex; gap:9px; align-items:baseline; padding:8px 0; border-top:1px dashed var(--line); font-size:14px;}
  .hz:first-of-type{border-top:0;}
  .hz .cd{font-weight:800; width:52px; font-size:13px;}
  .hz .ago{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap;}
  .note{font-size:12.5px; color:var(--muted); margin:10px 2px 0;}
  /* diagram viewer */
  .dgmbtn{display:block; width:100%; margin:0 0 10px; padding:12px; border:1.5px solid var(--line);
          background:var(--card); color:var(--ink); border-radius:10px; font-weight:800; letter-spacing:.06em;}
  #dgm{position:fixed; inset:0; background:#fff; z-index:200; display:none;}
  #dgm .close{position:absolute; top:10px; right:12px; z-index:2; padding:9px 14px; border:1.5px solid var(--ink);
              background:#fff; border-radius:8px; font-weight:800;}
  #dgm .turn{position:absolute; bottom:12px; left:0; right:0; text-align:center; font-size:12px;
             letter-spacing:.08em; color:var(--muted);}
  #dgm .wrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  /* An SVG with a viewBox has an intrinsic 432x288 and will sit at that size
     unless it is told to fill. max-width alone caps it and never grows it,
     which put a 6x4 back on a phone at about a third of print size. */
  #dgm img{width:100%; height:100%; object-fit:contain; padding:6px;}
  @media (orientation:portrait){
    /* A 6x4 back shown portrait-fit lands at about 47% of print size and every
       7 pt label disappears. Rotated, it fills the screen and the handler turns
       the phone — which is what the specs assume. */
    #dgm .wrap{transform:rotate(90deg);}
    #dgm .wrap{width:100vh; height:100vw; top:50%; left:50%;
               transform:translate(-50%,-50%) rotate(90deg);}
  }
  @media (orientation:landscape){ #dgm .turn{display:none;} }
  /* floating export button */
  .fab-export{position:fixed; bottom:16px; left:12px; right:12px; z-index:20;
              padding:14px; font-size:17px; font-weight:800; color:#fff; background:var(--accent);
              border:0; border-radius:12px; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.5);
              padding-bottom:calc(14px + env(safe-area-inset-bottom));
              display:none;}
  .fab-export.show{display:block;}
  /* validation error highlight */
  .field-highlight{animation:fieldFlash .6s ease-out;}
  @keyframes fieldFlash{0%{box-shadow:0 0 0 4px var(--alert);}100%{box-shadow:none;}}
  /* track group header in LOG card picker */
  .track-group-hdr{font-size:13px; font-weight:800; letter-spacing:.1em; margin:14px 0 4px; padding:4px 8px; border-left:4px solid; border-radius:2px;}
  /* days since last session */
  .days-since{font-size:13px; color:var(--muted); text-align:center; margin-bottom:10px; padding:6px 0;}
  /* clear confirm state */
  .copy.confirm-warn{background:#D4440A; color:#fff; border-color:#D4440A;}
  /* LOG toggle removed — Log and History are separate hub tiles now */
  /* session history — grid of tiles */
  .hist-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;}
  .hist-tile{background:#2C2C28; border:0; border-radius:14px; padding:14px 8px;
             text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.3); cursor:pointer;
             font-family:inherit; color:var(--ink); transition:transform .1s ease;}
  .hist-tile:active{transform:scale(.95);}
  .hist-tile-day{font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.06em;}
  .hist-tile-date{font-size:17px; font-weight:800; margin:2px 0;}
  .hist-tile-tod{font-size:12px; color:var(--muted);}
  .hist-tile-cards{font-size:11px; color:var(--accent); font-weight:700; margin-top:4px;}
  /* history detail */
  .hist-back{border:0; background:none; font-size:16px; font-weight:600; color:var(--accent);
             padding:8px 0; cursor:pointer; margin-bottom:8px;}
  .hist-detail-header{margin-bottom:14px;}
  .hist-detail-date{font-size:22px; font-weight:800;}
  .hist-detail-meta{font-size:14px; color:var(--muted); margin-top:2px;}
  .hist-card{background:#2C2C28; border-radius:14px; padding:14px 16px; margin-bottom:10px;
             box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .hist-card-head{padding-left:10px; display:flex; align-items:baseline; gap:8px;}
  .hist-card-code{font-weight:800; font-size:15px;}
  .hist-card-title{font-size:14px; color:var(--muted);}
  .hist-card-meta{font-size:13px; color:var(--muted); margin:6px 0 4px 14px;}
  .hist-check{display:flex; gap:8px; align-items:baseline; font-size:15px; padding:4px 0 4px 14px;}
  .hist-check-id{font-weight:700; font-size:13px;}
  .hist-check-label{color:var(--muted); font-size:13px; flex:1;}
  .hist-observed{font-size:14px; color:var(--muted); font-style:italic; padding:6px 0 0 14px;}
  .sh-score{font-weight:700; font-family:monospace; min-width:44px;}
  .sh-pass{color:#2E7D4F;}
  .sh-fail{color:var(--alert);}
  .sh-meta{font-size:12px; color:var(--muted);}
  /* per-card history in detail */
  .ch-row{display:flex; gap:8px; align-items:baseline; padding:4px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .ch-row:last-child{border-bottom:0;}
  .ch-date{font-weight:600; min-width:80px; font-size:13px;}
  /* event log exercises */
  .evex{margin-bottom:8px;}
  .evex-detail{padding:4px 0 4px 12px;}
  /* ── glossary tokens ── */
  .gterm{border-bottom:1px dotted var(--accent);cursor:pointer;}
  .gref{color:var(--accent);font-weight:700;cursor:pointer;}
  /* ── glossary modal ── */
  .gloss-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);
    display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .gloss-box{background:var(--card);border-radius:16px;padding:22px 22px 20px;
    max-width:85vw;max-height:70vh;overflow-y:auto;
    box-shadow:0 8px 32px rgba(0,0,0,.6);}
  .gloss-tname{font-size:21px;font-weight:800;margin-bottom:8px;}
  .gloss-short{font-size:15px;color:var(--accent);font-weight:600;line-height:1.45;
    margin-bottom:12px;}
  .gloss-full{font-size:14px;line-height:1.55;color:var(--ink);white-space:pre-wrap;
    border-top:1px solid var(--line);padding-top:12px;}
  .gloss-also{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .gloss-also-lbl{font-size:11px;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;}
  .gloss-see{border:1px solid var(--line);background:var(--bg);color:var(--accent);
    border-radius:20px;padding:6px 14px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:inherit;margin:0 6px 6px 0;}
  /* ── LEARN tab ── */
  .learn-group-hdr{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);
    margin:18px 0 6px 4px;}
  .learn-group-hdr:first-of-type{margin-top:8px;}
  .learn-row{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;transition:transform .1s ease;}
  .learn-row:active{transform:scale(.98);}
  .learn-row-title{font-size:16px;font-weight:700;line-height:1.35;}
  .learn-row-meta{font-size:12px;color:var(--muted);margin-top:4px;}
  /* article detail */
  .learn-detail{background:var(--card);border-radius:16px;overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .learn-detail-head{padding:20px 18px 16px;
    background:linear-gradient(135deg,rgba(106,59,88,.85),rgba(80,40,68,.9));}
  .learn-detail-cat{font-size:11px;font-weight:800;letter-spacing:.12em;
    color:rgba(255,255,255,.7);}
  .learn-detail-title{font-size:22px;font-weight:800;line-height:1.25;margin-top:4px;color:#fff;}
  .learn-detail-meta{font-size:13px;color:rgba(255,255,255,.6);margin-top:6px;}
  .learn-detail-body{padding:18px 18px 24px;}
  .learn-h2{font-size:17px;font-weight:800;margin:24px 0 10px;color:var(--ink);
    letter-spacing:-.01em;}
  .learn-h2:first-child{margin-top:0;}
  .learn-p{font-size:16px;line-height:1.55;margin:0 0 14px;color:var(--ink);}
  .learn-ul,.learn-ol{margin:0 0 14px;padding-left:20px;}
  .learn-ul li,.learn-ol li{font-size:16px;line-height:1.55;margin-bottom:6px;color:var(--ink);}
  .learn-aref{color:var(--accent);font-weight:700;cursor:pointer;
    border-bottom:1px dotted var(--accent);}
</style>
</head>
<body>

<!-- ── Screen: Home (dog selector) ──────────────────────────────────────── -->
<div id="scrHome" class="screen">
  <div class="home-banner">
    <div class="home-title">Gun Dog Log</div>
    <div class="home-subtitle">Field Card Program</div>
    <div class="home-build" id="bstamp"></div>
  </div>
  <div id="dogList" class="home-dogs"></div>
</div>

<!-- ── Screen: Hub (2x2 icon grid per dog) ──────────────────────────────── -->
<div id="scrHub" class="screen" style="display:none">
  <div class="hub-bar">
    <button class="hub-back" onclick="haptic();goHome()" aria-label="Back">&#8249;</button>
    <div class="hub-dog">
      <div class="hub-avatar" id="hubAvatar"></div>
      <span class="hub-name" id="hubName"></span>
    </div>
    <button class="hub-edit" onclick="haptic();editDog()" aria-label="Edit">&#9998;</button>
  </div>
  <div id="hubGrid" class="hub-grid"></div>
</div>

<!-- ── Screen: Tab content (week/cards/tracks/log) ──────────────────────── -->
<div id="scrTab" class="screen" style="display:none">
  <div class="tab-bar">
    <button class="tab-back" onclick="haptic();goHub()" aria-label="Back">&#8249;</button>
    <span class="tab-title" id="tabTitle"></span>
  </div>
  <main>
    <div id="vWeek"></div>
    <div id="vCards" style="display:none"></div>
    <div id="vTracks" style="display:none"></div>
    <div id="vLog" style="display:none"></div>
    <div id="vLearn" style="display:none"></div>
  </main>
  <button id="fabExport" class="fab-export" onclick="haptic();state.logMode==='event'?doEventExport():doExport()">VALIDATE &amp; EXPORT</button>
</div>

<!-- ── Diagram overlay (unchanged) ──────────────────────────────────────── -->
<div id="dgm"><button class="close" onclick="closeDiagram()">CLOSE</button>
  <div class="wrap"><img id="dgmimg" alt=""></div>
  <div class="turn">TURN THE PHONE SIDEWAYS</div></div>

<script>
window.onerror = function(msg, src, line){
  if (msg === 'Script error.' || !msg) return;
  var d = document.createElement('div');
  d.style.cssText = 'background:#2E2018;border:1px solid #C4513D;border-radius:10px;padding:10px 12px;margin:10px;font-size:13px;color:#D4917A;cursor:pointer';
  d.textContent = 'Error: ' + msg + ' @' + line;
  d.onclick = function(){ d.remove(); };
  document.body.prepend(d);
};
</script>
<script>
/* DECK_START */
const DECK = {"build": "1.0.0\u00b7577","version": "1.0.0","dog": "Reba","palette": {"green": "#2F4A32","rust": "#8C3B2A","tan": "#9A7C42","slate": "#3F5A6B","clay": "#7A5240","olive": "#6B6A2F","teal": "#2C5B57","indigo": "#3B426E","plum": "#6A3B58","alert": "#A32E1E","gray": "#F3F2EE","line": "#C6C2B6","ink": "#232720","muted": "#6B6F64"},"cards": [{"code": "PP-T","id": "puppy.title","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "title","n": null,"title": "Puppy Foundation","drill": "","pass": "","body": "Eight weeks to about five months. Nothing on this track is a command \u2014\ncommands belong to {ref:obedience|track}. This track builds the two things that\ncannot be built later: retrieve desire and neutrality to the world.\n\nMost stages on this track run in parallel. Socialization, retrieve desire,\nnoise conditioning, and crate training all start in the first week and overlap\nfor months. The stage numbers are card order, not a sequence \u2014 read the\nprerequisites on each card to see what actually must come first.\n\nSessions are minutes, not half-hours \u2014 five minutes maximum at this age, and\nevery one ends before the puppy wants it to. There is nothing on this track\nworth a scared or bored puppy. See {learn:session_planning} for more.\n\nSee {learn:program_map} for how all the tracks fit together.\nSee {learn:equipment_guide} for the gear you need at each stage.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-1","id": "puppy.s1","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "stage","n": 1,"title": "Coming Home \u2014 Crate Training","drill": "Day one. The crate becomes the puppy's safe place \u2014 this starts immediately\nand never stops.\n\nPlace every meal inside the crate with the door open. Drop treats in randomly\nthroughout the day. Do not close the door yet \u2014 the goal is a puppy that walks\ninto the crate on its own, not one following a lure. This usually takes one to\nthree days. Once the puppy is entering voluntarily, begin closing the door while\nit eats \u2014 but start at just five seconds. Open before the puppy finishes eating.\nThe progression matters: 5 seconds, 10 seconds, 20 seconds, 30 seconds, one\nminute, two minutes, five minutes, ten minutes. Stay visible. Always open the\ndoor before the puppy fusses \u2014 you are teaching it that the door closing predicts\nthe door opening. If you get fussing, you jumped too far. Go back to the last\nduration that was quiet and rebuild from there.\n\nNever use the crate as punishment \u2014 the crate must always predict good things.\nA worn shirt inside helps the first few nights.\n\nHow long the puppy can stay in the crate depends on age. The rule: age in months\nplus one equals maximum hours during the day. At 8 weeks that is 2\u20133 hours, at\n12 weeks 3\u20134 hours, at 16 weeks 4\u20135 hours. Overnight can be longer \u2014 by five\nmonths most puppies sleep 7\u20138 hours straight. These are caps, not targets.\nShorter is always fine.\n\nOnce the puppy is entering voluntarily, add the word \"kennel\" just before it\nsteps in. Say it once, the puppy enters, mark and reward. After a week of\npairing, the word becomes the cue. Build distance gradually \u2014 by 14 weeks the\npuppy should enter on command from 2\u20133 feet, by 5 months from across the room.\n\"Kennel\" means get IN something \u2014 crate, vehicle, dog box, boat. It is a\nseparate command from \"place\" (get ON something), which is taught on the\nobedience track.\n\nThe {term:release_word} applies to the crate. The dog does not leave when the\ndoor opens \u2014 it leaves when you say the word. Teach this by opening the door\nand waiting. If the dog moves, close the door gently. Re-open. Release only\non the word, with the dog still inside.\n","pass": "Enters the crate voluntarily without a lure 5/5, holds quietly for 10 minutes\nwith the door closed. Enters on the word \"kennel\" from across the room 8/10.\n","body": "","ifthen": [["Cries in the crate","You jumped too far too fast. Go back to the last duration that was quiet and rebuild in smaller steps. Do not let the puppy out while it is crying \u2014 wait for even a brief pause, then open."],["Won't go in the crate","The crate predicts something the puppy dislikes. Feed every meal inside for a week with the door open. No closing until the puppy is running in on its own."],["Leaves the crate when the door opens","The door is not the release. Open the door, wait. If the dog moves, close the door gently. Re-open. Release only on the word, with the dog still inside."]],"checks": [{"id": "c1","label": "Enters crate voluntarily without a lure","hits": 5,"of": 5,"provisional": true},{"id": "c2","label": "Holds quietly 10 minutes with door closed","hits": 3,"of": 3,"provisional": true},{"id": "c3","label": "Enters on 'kennel' from across the room","hits": 8,"of": 10,"provisional": true}],"session_cap": null,"equipment": ["crate"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-2","id": "puppy.s2","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "stage","n": 2,"title": "Loading the Marker","drill": "Before you can train anything, the puppy needs to understand one sound: your\n{term:mark} word. Most handlers use \"yes.\" A clicker works too, but a verbal\nmarker is preferred for field work because your hands will be full of leash,\nbumper, and gun.\n\nLoading the marker is {term:classical_conditioning} \u2014 you are teaching the puppy\nthat the sound predicts food, the same way Pavlov's bell predicted dinner. The\npuppy does not need to do anything to earn it. This is not a command and not a\ntrick. You are building a reflex.\n\nUse the puppy's regular kibble, measured out for the meal. Train at mealtimes \u2014\nthe puppy is hungry, so it is motivated. This also teaches the puppy from day one\nthat food comes from working with you, not from a bowl on the floor. When the\nsession is over, pour the remaining kibble into the bowl and let the puppy finish\nits meal. Save high-value treats (cheese, hot dog, boiled chicken) for later\nstages when you need to compete with distractions \u2014 for now, kibble is plenty.\n\nThe drill: say \"yes\" once, pause half a second, deliver a piece of kibble to the\npuppy's mouth. Do not say it at the same time you give the food \u2014 the mark comes\nfirst, then the kibble. That gap is what teaches the puppy that the sound *means*\nfood is coming.\n\nTiming is everything. The marker must come the instant the action happens \u2014 not a\nsecond before, not a second after. A late marker marks whatever the puppy was\ndoing when it heard the sound, not what you intended. An early marker marks\nnothing, because the behavior has not happened yet. During this loading phase\nthere is no behavior to mark, so the timing is simple: say the word, deliver the\nfood. But build the habit of being precise now, because every card after this one\ndepends on it.\n\nTen reps per session, two to three sessions per day (one at each meal, plus a\nshort midday round if the puppy is alert), for three to five days. Keep sessions\nunder two minutes.\n\nYou will know the marker is loaded when the puppy's ears perk or its head snaps\ntoward you the instant you say the word \u2014 before seeing any food. That\nanticipation is the conditioned response. Once you see it reliably, the marker is\nready and every card in this program that says \"mark\" depends on this foundation.\n\nWhy it matters: the marker is how you communicate with precision. Without it, the\npuppy must guess which part of what it did earned the reward. With it, you can\npinpoint the exact moment \u2014 rump hits the ground, eyes meet yours, mouth closes\non the bumper \u2014 and the puppy knows *that* is what pays. This is\n{term:operant_conditioning} in action: the marker tells the dog which behavior to\nrepeat. See {learn:marker_training} and {learn:four_quadrants} for the science\nbehind why this works.\n","pass": "Puppy visibly anticipates food (ear perk, head snap, or movement toward handler)\non hearing the marker word before seeing food, 8/10 across two sessions.\n","body": "","ifthen": [["No anticipation after 3 days","Kibble may not be high enough value for this puppy. Switch to higher-value food (cheese, meat) for the loading sessions only, then return to kibble once the association is built."],["Anticipates but only when your hand is near the treat pouch","The puppy is reading your hand, not listening to the word. Deliver kibble from a bowl behind you or have someone else hand you the food after you mark."]],"checks": [{"id": "c1","label": "Visibly anticipates food on marker word \u2014 no food visible","hits": 8,"of": 10,"sessions": 2,"provisional": true}],"session_cap": null,"equipment": ["kibble"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-3","id": "puppy.s3","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "stage","n": 3,"title": "Name Response","drill": "Say the puppy's name once. The moment it looks at you, {term:mark} and reward. Repeat\nthroughout the day in short bursts \u2014 three to five reps, then stop. The name\nmeans \"look at me,\" nothing else. Never use the name to scold, and never repeat\nit without a payoff.\n\nStart indoors with no distractions. Once the puppy is snapping its head toward\nyou 8 out of 10 times inside, move to the yard. Then the driveway. Then anywhere\nnew. Each new environment resets difficulty \u2014 expect the hit rate to drop and\nrebuild.\n","pass": "Looks at handler on the name 8/10 across two sessions, indoors and outdoors.\n","body": "","ifthen": [["Ignores the name","The name has no value yet. Pair it with higher-value food (cheese, meat) and say it only when you can reward immediately. Never repeat it without a payoff."],["Works inside but not outside","The environment is too stimulating. Move closer to the door \u2014 halfway between where it works and where it doesn't \u2014 and rebuild from there."]],"checks": [{"id": "c1","label": "Looks at handler on name \u2014 indoors","hits": 8,"of": 10,"sessions": 2,"provisional": true},{"id": "c2","label": "Looks at handler on name \u2014 outdoors","hits": 8,"of": 10,"sessions": 2,"provisional": true}],"session_cap": null,"equipment": ["kibble"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-4","id": "puppy.s4","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "stage","n": 4,"title": "Socialization \u2014 People, Surfaces, Handling","drill": "The socialization window begins closing around 12 weeks and is largely shut by\n16 weeks. The puppy's brain shifts from \"curious about new things\" to \"cautious\nabout new things\" \u2014 an evolutionary survival adaptation. By 14\u201316 weeks that\nshift is mostly complete. What the puppy experiences positively during this\nwindow becomes part of its normal world. Socialization can still happen after\n16 weeks, but it is slower and harder.\n\nOne new thing per outing, food in your pocket, ten minutes at most.\nPeople: men, women, children, hats, beards, sunglasses, uniforms, canes.\nSurfaces: gravel, dock boards, grates, metal, mud, wet grass, carpet, tile.\nHandling: touch paws, ears, mouth, belly, tail daily \u2014 pair each with food.\nThis is preparation for vet visits, grooming, and later training that requires\nthe handler to manipulate the dog's body.\n\nThe puppy approaches on its own. Never carry the puppy to a scary thing or hold\nit at the thing. If it backs off, add distance, drop food on the ground, and\nlet it close the gap at its own pace. One bad experience during this window\noutweighs ten good ones. See {learn:engineer_win} for the principle behind this.\n\nNo dog parks. Unmanaged dogs with unknown temperaments are not socialization \u2014\nthey are a gamble. One rough greeting during the fear period can create a\nlifelong reactivity problem. Use structured playdates with known, vaccinated\ndogs matched for size and play style.\n","pass": "Logged before 16 weeks: 10 new people, 8 new surfaces, 6 handling exercises \u2014\neach ending with a loose body and tail up, recovery inside 30 seconds.\n","body": "","ifthen": [["Backs off or startles at something new","The step was too big. Add distance, drop food on the ground, and let the puppy close the gap itself. Same thing tomorrow, smaller."],["Fine at home, clingy anywhere new","The place is the variable. Sit on the ground and do nothing for five minutes before asking for anything. Let the puppy explore the environment before introducing a specific stimulus."],["A dog or person scares the puppy","Read Fear Periods. Hand-pick every encounter from here. Do not try to 'fix' the fear by re-exposing \u2014 that is {term:flooding}, and it makes it worse."]],"checks": [{"id": "c1","label": "New people, ends loose and tail-up","hits": 10,"of": 10,"provisional": true},{"id": "c2","label": "New surfaces, ends loose","hits": 8,"of": 8,"provisional": true},{"id": "c3","label": "Handling exercises (paws, ears, mouth), calm","hits": 6,"of": 6,"provisional": true}],"session_cap": null,"equipment": ["kibble","leash"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-5","id": "puppy.s5","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "stage","n": 5,"title": "Retrieve Desire \u2014 Hallway Singles","drill": "A hallway with every door shut. Tease with a soft puppy {term:bumper}, toss it 8\u201310\nfeet, let the puppy pounce. The hallway has nowhere to go but back to you \u2014\nthe return happens because the space makes it inevitable, not because you\ncommanded it.\n\nKneel, arms open, **greet the puppy \u2014 not the bumper.** Pet while it holds,\ntake the bumper late, sometimes hand it back. No commands, no waiting, no\nsteadiness. 2\u20133 tosses is a whole session. Read {ref:puppy.ref_stop} first \u2014\nevery decision on this card follows that principle.\n\nNever retrieve every day. Every-other-day is the minimum rest period. The\ndesire builds between sessions, not during them. A puppy that is always\noffered retrieves stops valuing them \u2014 scarcity is what creates the addict.\nThis is the Premack Principle at work \u2014 see {learn:premack_article}.\n\nNever chase a puppy that has the bumper. Never play tug with a retriever\npuppy \u2014 tug teaches grip-and-fight, the opposite of carry-and-deliver.\n","pass": "Comes back to within reach with the bumper on 4/5 tosses, and 5 straight\nsessions end with the puppy still pulling toward the bumper on the last one.\nThe return rate matters, but the desire at the end of each session matters more.\nA puppy that comes back 3 out of 5 but is still fired up on the last toss is in\na better place than one that comes back 5 out of 5 but walks away from the last\none.\n","body": "","ifthen": [["Runs past you or plays keep-away","The space is too big. Narrower hallway, sit on the floor, and never chase \u2014 turn and walk away and the puppy will follow."],["Drops it on the way back","The object is too big or too hard for the puppy's mouth. Smaller and softer, and take it later \u2014 pay the carry before you ever take."],["Interest fades inside a session","You are past the puppy's count. Two tosses is a session. Skip a day and come back scarcer. See {ref:puppy.ref_stop}."]],"checks": [{"id": "c1","label": "Back to within reach with the bumper","hits": 4,"of": 5,"provisional": true},{"id": "c2","label": "Session ends with puppy still wanting more","hits": 5,"of": 5,"provisional": true}],"session_cap": null,"equipment": ["puppy_bumper"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-6","id": "puppy.s6","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "stage","n": 6,"title": "First Water \u2014 Confidence Only","drill": "The product of this stage is a puppy that loves water. There is no retrieve\nrequirement \u2014 just voluntary, happy entry to swimming depth.\n\nWarm shallow water with a walking-in bank, and you wade in first. The puppy\nfollows you in \u2014 no throws until it is splashing on its own. Then tosses in\ninches of water, then to swimming depth only as the puppy pulls for it.\nNever throw past the puppy's current confidence level \u2014 if it is wading to\nits belly, the first retrieve goes to wading depth, not swimming depth.\n\nNever pick up a puppy and put it in water. A single forced submersion can\ncreate a lifelong water aversion. If the puppy is hesitant, wait. Try again\nin a week. Days of patient waiting cost nothing; one bad experience costs\nmonths of rehabilitation.\n\n{ref:water.s1} inherits whatever confidence is built here.\n","pass": "5/5 voluntary entries to swimming depth with a level, quiet swim, across 2\nsessions \u2014 and the puppy leaves the water still asking for more.\n","body": "","ifthen": [["Paws the edge, won't commit","The puppy is unsure of the bottom, not stubborn. Wade in yourself, stand there, and wait. Days if it takes days."],["Splashy, frantic swim","Too deep too soon. Back to belly depth for a week \u2014 the level swim comes from repetition, not from pushing past comfort."],["A dunk or a scare at the water","End on a win the puppy already owns \u2014 wading the shallows. Three days off water, then restart this card from the beginning as if it were new."]],"checks": [{"id": "c1","label": "Voluntary entry to swimming depth, level swim","hits": 5,"of": 5,"sessions": 2,"provisional": true}],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-7","id": "puppy.s7","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "stage","n": 7,"title": "Noise Conditioning \u2014 The Career Gate","drill": "This card protects the dog's entire career. Sound conditioning done wrong\ncreates gun-shyness \u2014 a fear response to gunfire that is extremely difficult\nto fix and may be permanent. Done right, the dog learns that loud sounds\npredict exciting things (food, retrieves, birds).\n\nThe method is {term:classical_conditioning} combined with\n{term:systematic_desensitization}: pair each new sound with something the puppy\nloves, and control two variables \u2014 volume and distance. Increase only one at a\ntime. The puppy does not need to do anything \u2014 it just needs to experience\nsound + good thing together, repeatedly, until the sound itself becomes a\npositive signal.\n\nNINE rungs, one at a time. Never advance until the current rung produces no\nnegative reaction (no flinch, no freeze, no moving away, no pause in eating)\nacross three meals or sessions. A puppy that hears the sound and gets excited\nor looks for food is showing the right response \u2014 that is the goal.\n\nIndoor rungs (mealtime pairing):\n1. Soft hand clap across the room \u2014 start quiet, build louder over sessions.\nClapped hands are controllable; you set the volume precisely.\n2. Louder claps and knocking on surfaces, same room.\n3. Dropped pan or banged pots across the room. These are less controllable than\nhands \u2014 the puppy should already be comfortable with rungs 1\u20132 before hearing\nan unpredictable bang.\n\nOutdoor rungs (mealtime or retrieve pairing):\n4. Cap gun at 100+ yards while the puppy eats.\n5. Cap gun at 50 yards.\n6. Cap gun at 25 yards.\n7. Starter pistol at 100+ yards while the puppy eats or retrieves.\n8. Starter pistol at 50 yards.\n9. Starter pistol at 25 yards.\n\nOnce retrieve desire is established ({ref:puppy.s5}), pair outdoor rungs with\nretrieves \u2014 the excitement of the retrieve masks the sound. This is how\ngunfire becomes a signal that predicts birds, not just food.\n\nThe shotgun itself waits for {ref:steadiness.s3} on the main program.\nNever more than 2\u20133 shots per session. Watch the head, not the clock \u2014 if the\npuppy lifts its head but goes back to eating, stay on this rung until it stops\nlifting.\n","pass": "Each rung: keeps eating or retrieving through 2\u20133 sounds, three sessions in a\nrow, before advancing to the next rung.\n","body": "","ifthen": [["Lifts head, then goes back to eating","A pause, not a fail. Stay on this rung at this distance until the head stops lifting, however many sessions that takes."],["Leaves the food, flinches, or moves away","STOP \u2014 all noise work, not just this rung. A week of no loud anything, then restart two rungs back at double the distance and rebuild over weeks. Pushing through here is how a career ends before it starts."],["Fine in the setup, spooked by a random bang","Do not try to train outside the setup. An unplanned noise is managed by adding distance and staying calm. Do not rush to comfort the puppy \u2014 soothing reinforces the idea that there was something to be afraid of. Stay neutral and let the puppy recover on its own."]],"checks": [{"id": "r1","label": "Soft clap across room, no reaction","hits": 3,"of": 3,"provisional": true},{"id": "r2","label": "Loud clap/knocking same room, no reaction","hits": 3,"of": 3,"provisional": true},{"id": "r3","label": "Dropped pan across room, no reaction","hits": 3,"of": 3,"provisional": true},{"id": "r4","label": "Cap gun at 100+ yds, keeps eating","hits": 3,"of": 3,"provisional": true},{"id": "r5","label": "Cap gun at 50 yds, keeps eating","hits": 3,"of": 3,"provisional": true},{"id": "r6","label": "Cap gun at 25 yds, keeps eating","hits": 3,"of": 3,"provisional": true},{"id": "r7","label": "Starter pistol at 100+ yds, keeps eating/retrieving","hits": 3,"of": 3,"provisional": true},{"id": "r8","label": "Starter pistol at 50 yds, keeps eating/retrieving","hits": 3,"of": 3,"provisional": true},{"id": "r9","label": "Starter pistol at 25 yds, keeps eating/retrieving","hits": 3,"of": 3,"provisional": true}],"session_cap": null,"equipment": ["cap_gun","starter_pistol"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-8","id": "puppy.s8","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "stage","n": 8,"title": "First Birds \u2014 Wing to Pigeon","drill": "Feathers before dead bird, dead bird before live bird. Work in a contained\narea (hallway, fenced yard) or use a light check cord so the puppy cannot\nrun off with the bird. The progression:\n\n1. A loose dried wing on the ground \u2014 let the puppy investigate, pick up,\ncarry. This is feather and scent conditioning, nothing more.\n2. Wing taped to the puppy bumper \u2014 familiar retrieve object with unfamiliar\ntexture. Run hallway tosses like {ref:puppy.s5}.\n3. A frozen pigeon, part-thawed, wings removed if it is too big for the\npuppy's mouth. One or two bird retrieves per session, then back to plain\nbumpers.\n\nNo live birds on this track. Keep bird reps rare and exciting \u2014 the scarcity\nprinciple applies here even more than with bumpers. A puppy that has unlimited\naccess to birds stops finding them special.\n\nIf the puppy chews or plucks, end the bird portion of the session immediately.\nTrade for food, no scolding. Next time, thaw less \u2014 a stiffer, colder bird is\nharder to pluck.\n","pass": "Wing bumper picked up with the same speed as a plain one 3/3, and a dead\npigeon picked up, carried, and brought to reach 3/3 across two sessions,\nwithout plucking.\n","body": "","ifthen": [["Mouths and chews the bird","Feathers are new. Take it sooner than usual, cut to one bird rep, and go back to the wing bumper for the rest of the session."],["Sniffs it, won't pick it up","Too much bird at once. Back to a single wing on a bumper and let the puppy succeed with feathers before it meets mass."],["Plucks or eats feathers","End the bird portion there. Trade for food, no scolding, and next time thaw less \u2014 a stiffer bird is harder to pluck."]],"checks": [{"id": "c1","label": "Wing bumper taken as fast as plain","hits": 3,"of": 3,"provisional": true},{"id": "c2","label": "Dead pigeon carried to reach","hits": 3,"of": 3,"sessions": 2,"provisional": true}],"session_cap": null,"equipment": ["wing","tape","frozen_pigeon","puppy_bumper","check_cord"],"requires": ["PP-5","PP-7"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-G","id": "puppy.gate_teething","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "gate","n": null,"title": "GATE \u2014 Teething Halt","drill": "","pass": "","body": "When baby teeth start falling out (usually around 3.5\u20134 months), stop all\nretrieve and hold work. The puppy's gums are sore, and a puppy that drops\nbumpers during teething is not regressing \u2014 it is in pain.\n\nSigns that teething is active: decreased retrieve enthusiasm, dropping bumpers\nmid-carry, blood on toys or bumpers, chewing ice, visible gaps where teeth\nwere.\n\nResume retrieve work only when all 42 adult teeth are confirmed in \u2014 typically\naround 6\u20137 months. Count them. Do not guess.\n\nWhat continues during the halt: socialization, noise conditioning, obedience\n(sit, recall, heel), crate training, water confidence work. The halt applies\nto retrieves and hold work only.\n\nWhy this matters: doing hold work on sore gums creates the habit of dropping.\nThat habit then requires {term:force_fetch} to fix \u2014 unnecessary pressure caused by a\nhandler who did not wait for adult teeth.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "PP-R1","id": "puppy.ref_fear","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "reference","n": null,"title": "Fear Periods","drill": "","pass": "","body": "Puppies go through at least two sensitive periods where negative experiences\nleave disproportionately deep impressions:\n\nFirst fear imprint period: approximately 8\u201311 weeks. This coincides with the\nweek most puppies come home. The puppy's brain is recording \"safe vs.\ndangerous\" at an accelerated rate. Everything at this age leaves a stronger\nimpression \u2014 positive or negative \u2014 than it will at any other time.\n\nSecondary fear sensitivity: approximately 6\u201314 months. This hits during\nadolescence and catches many handlers off guard \u2014 a dog that was confident at\nfive months may suddenly spook at familiar things at eight months. It is not\nregression. It is a normal developmental phase.\n\nWhat to do: continue socialization, but choose every exposure carefully. Let\nthe puppy set the pace. Keep sessions short and positive. If the puppy shows\nfear, do not force exposure and do not soothe excessively (which can reinforce\nthe fear state). Add distance, stay calm, and let the puppy recover on its\nown terms.\n\nWhat not to do: do not introduce gunfire, new water, or any high-intensity\nexperience during an active fear period unless the puppy is showing zero\nstress. One bad experience during a fear period can outweigh weeks of positive\nconditioning.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "PP-R2","id": "puppy.ref_donts","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "reference","n": null,"title": "Puppy Don'ts","drill": "","pass": "","body": "No force of any kind: no ear pinch, no hold corrections, no \"fetch\" demand.\nForce fetch starts after all 42 adult teeth and after obedience is solid \u2014\nnever on this track.\n\nNo steadiness. Making a puppy wait at this age spends the desire this track\nexists to build. The puppy may break on every throw \u2014 let it.\n\nNo punishment near you. A puppy that came back slow still came back \u2014 pay the\narrival, every time, whatever preceded it. A puppy punished for returning\nlearns to not return.\n\nNo collar pressure, no whistle demands, no drilling. Two reps of anything is\nplenty. No adult-sized bumpers \u2014 use gear the puppy's mouth can win with.\n\nNo surprise gunfire, ever. {ref:puppy.s7} is the only way loud sounds are\nintroduced.\n\nNo dog parks for socialization \u2014 see {ref:puppy.s4}.\n\nNo tug-of-war with a retriever puppy. Tug teaches grip-and-fight, the\nopposite of carry-and-deliver.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "browse","blocked_note": null,"diagram": null},{"code": "PP-R3","id": "puppy.ref_teeth","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "reference","n": null,"title": "Teething Calendar","drill": "","pass": "","body": "28 puppy teeth are in by 6\u20138 weeks. From roughly 12 to 24 weeks the puppy\nswaps them for 42 adult teeth, and for stretches of that window its mouth is\nsore.\n\nWhat it changes: soft bumpers only, and {ref:puppy.ref_carry} carrying rules pause in any\nweek the puppy is chewing ice, bleeding at the gum, or dropping carries it\nowned last week. Dropped bumpers in a sore week are teeth, not training\nregression \u2014 do not fix what is not broken.\n\nWhat it gates: force fetch requires all 42 adult teeth \u2014 the Force & Collar\nteeth gate. Count them at about six months. Never start force on a mixed mouth.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "PP-R4","id": "puppy.ref_stop","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "reference","n": null,"title": "Stop Before You Want To","drill": "","pass": "","body": "Desire is built with scarcity:\n2\u20133 retrieves is a session, a few sessions a week, and every one ends while the\npuppy is still pulling for the next throw.\n\nA bored rep does not just waste time \u2014 it dulls the drive, and retrieve desire\ncannot be rebuilt once it is gone. The damage is invisible on the day you\ncommit it. \"One more\" always looks free \u2014 the puppy wants it, you want it,\nnothing visibly breaks. The damage shows up months later as a dog that trots\nwhen it used to run.\n\nThe bumper is yours, not the puppy's. It lives in a drawer and appears only for\nsessions. A retrieve that is always available stops being worth anything. Chew\ntoys are the puppy's. The bumper never is.\n\nEvery PASS on this track counts sessions that END on desire. That is not\nsentiment \u2014 it is the criterion.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "PP-R5","id": "puppy.ref_sessions","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "reference","n": null,"title": "Session Length by Age","drill": "","pass": "","body": "Caps on formal training time per session. Play, socialization outings, and\nfree exploration do not count against these.\n\n8\u201310 weeks: 3\u20135 minutes, 2\u20133 sessions per day.\n10\u201312 weeks: 5 minutes, 2\u20133 sessions per day.\n12\u201316 weeks: 5\u201310 minutes, 2 sessions per day.\n4\u20135 months: 10 minutes, 1\u20132 sessions per day.\n6+ months: 10\u201315 minutes, once per day for obedience. Field work separate.\n\nEnd every session on a success \u2014 even if you have to make the last ask very\neasy. A session that goes sideways ends on the two easiest wins available, and\nthe next session gets shorter, not longer.\n\nHot weather: first and last light only. Back of your hand on the pavement for\nfive seconds before the puppy's pads touch it. Water before the session, not\nonly after.\n\nMultiple short sessions across the day beat one long one. The puppy's brain\nconsolidates learning during sleep \u2014 the overnight gap between sessions is\nwhen the lesson actually sticks.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "browse","blocked_note": null,"diagram": null},{"code": "PP-R6","id": "puppy.ref_carry","track": "PP","trackName": "Puppy Foundation","color": "#6B6A2F","type": "reference","n": null,"title": "Carrying Culture","drill": "","pass": "","body": "From day one, the puppy is paid for having things in its mouth and never\ngrabbed from. This is not formal hold conditioning \u2014 that comes after teething,\nwhen all 42 adult teeth are in and obedience is solid. This is a set of rules\nthat protect retrieve desire and build a voluntary carrying habit.\n\n**Never snatch.** Use a trade \u2014 produce something else (treat, second bumper,\nanother toy) and wait for the puppy to release. If you take things fast, your\nhand starts predicting loss, and the puppy learns to run or guard.\n\n**Never chase.** Running away from a puppy that has the bumper is far more\neffective than chasing. Chasing teaches keep-away. Walking away teaches follow.\n\n**Never tug.** Tug teaches grip-and-fight \u2014 the opposite of carry-and-deliver.\nPossession is what you are building, and tug teaches the puppy to compete for\nit rather than bring it to you.\n\n**Let the puppy parade.** If it picks up a shoe, a stick, or a bumper and walks\naround proudly, let it. Praise the carry. Trade when you need the object back.\nA puppy that is never corrected for carrying things becomes a dog that loves to\ncarry things \u2014 and that is the foundation of every retrieve.\n\n**Pause during teething.** A puppy that drops bumpers during a sore week is not\nregressing \u2014 it is in pain. Do not correct it. See {ref:puppy.gate_teething}.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "browse","blocked_note": null,"diagram": null},{"code": "OB-T","id": "obedience.title","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "title","n": null,"title": "Basic Obedience","drill": "","pass": "","body": "Basic obedience builds the foundational commands every gun dog needs: sit,\nrecall, heel, and down. These commands are taught here through positive methods\n\u2014 no e-collar, no force, no pressure. The e-collar comes later, on a separate\ntrack, and only to reinforce commands the dog already understands. Pressure on a\ncommand the dog does not understand is just pain with no information.\n\nDogs learn in a specific order: they learn the physical movement first, then\nconnect it to a hand signal, then connect it to a word. Every command on this\ntrack follows that sequence \u2014 {term:lure} the behavior, fade the lure to a hand\nsignal, then add the word. The word is never spoken until the dog is already\ndoing the behavior reliably. Adding a word too early poisons it \u2014 the dog\nlearns that the sound means nothing.\n\nThis track's finish line is half the Force & Collar gate: no force fetch until\nall 42 adult teeth are in AND Stage 6 here has passed.\n\nThere is no \"stay\" command \u2014 sit means sit until the {term:release_word}. The\ne-collar appears nowhere on this track.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "OB-1","id": "obedience.s1","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "stage","n": 1,"title": "Sit \u2014 Lure to Command","drill": "Hold food at the puppy's nose and draw it slowly back over the skull. As the\nnose goes up, the hindquarters go down. The instant the rump hits the ground,\n{term:mark} it (\"yes\" or a clicker) and deliver the food. Do this 3\u20135 times\nwithout saying the word \"sit\" \u2014 the puppy is learning the physical movement,\nnot a word.\n\nFade the lure: move the food to a closed fist (same gesture, hidden food).\nWhen the puppy sits reliably on the closed fist, switch to an empty hand.\nNow you have a hand-signal sit with food delivered from the other hand after\nthe marker.\n\nAdd the word: only after the dog sits reliably on the hand signal alone, say\n\"sit\" once, just before the signal. The dog learns: word predicts signal,\nsignal predicts sit, sit predicts reward. After 20\u201330 repetitions, begin\nfading the hand signal so the word alone works.\n\nAdd the release word: a sit does not end when the dog decides to get up. It\nends when you say the {term:release_word} (chosen during intake).\nTeach the release by saying the word, stepping back to draw the dog forward,\nand rewarding the movement. Without a release word, the dog learns to\nself-release \u2014 which is the first crack in steadiness.\n","pass": "Sits on the hand signal with no food visible 8/10 across two sessions. Then\nsits on the word alone \u2014 first command, no signal \u2014 10/10 across two sessions,\nholding 3 seconds to the release word.\n","body": "","ifthen": [["Backs up instead of sitting","The lure is too far forward. Work the puppy's rear toward a wall and draw the food straight back over the skull, slower."],["Pops up the moment it sits","You are paying too late. Mark and reward while the rump is down, several times per sit, and release before the dog chooses to leave."],["Sits only when food is visible","The lure became a bribe. Empty hand, same motion. Reward from the other hand or a pocket after the sit."]],"checks": [{"id": "c1","label": "Sits on hand signal, no food visible","hits": 8,"of": 10,"sessions": 2,"provisional": true},{"id": "c2","label": "Sits on the word alone, first command","hits": 10,"of": 10,"sessions": 2,"provisional": true},{"id": "c3","label": "Holds 3 sec until the release word","hits": 8,"of": 10,"provisional": true}],"session_cap": null,"equipment": ["kibble"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "OB-2","id": "obedience.s2","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "stage","n": 2,"title": "Here \u2014 Recall on Check Cord","drill": "The recall is the most important safety command and the easiest to ruin. The\nfoundational rule: never say the recall word unless you can enforce it. Every\ntime the dog ignores \"here\" and nothing happens, it learns that the word is\noptional. This is not about punishment \u2014 it is about the word meaning\nsomething every single time.\n\nStage 1 \u2014 Play recall (8\u201312 weeks). Get on your knees, clap, use an excited\nvoice. Call only when the puppy glances at you or is already moving toward\nyou \u2014 set it up to win. Mark the moment of arrival at your feet, not halfway.\nMake arriving at you the best thing that happens all day.\n\nStage 2 \u2014 Check cord (3-4 months). A check cord is a 20-30 ft lightweight\nrope (not a retractable leash) clipped to a flat buckle collar.\nLet the puppy wander. Say \"here\" once, then give 3\u20134 light rhythmic tugs \u2014\nnot a single hard jerk. The moment the puppy turns toward you, release all\npressure and give excited encouragement. Mark and reward at your feet, hand\non the collar before the food. 3\u20134 reps per session maximum.\n\nNever call the dog to you to do something it dislikes (nail trim, crating\nwhen it does not want to, ending play). If you must do those things, go get\nthe dog instead of calling it. Calling the dog to you for something unpleasant\nteaches the dog that coming when called sometimes ends badly.\n","pass": "First-command recall on a short cord 8/10 across two sessions. Then\nfirst-command at 25\u201330 ft with the cord slack and untouched, 10/10 across\ntwo sessions. Zero second commands throughout.\n","body": "","ifthen": [["Starts toward you, then stalls or detours","The cord finishes the rep in silence. Do not repeat the word. Draw the puppy all the way to your feet and reward big."],["Comes, but stops out of reach","The pay position is wrong. Back up as the puppy arrives and reward at your knee, hand on the collar before the food."],["Ignores the first command outright","The word was said in a picture too exciting to win. Shorten the cord, cut the distraction, and see One Command, One Meaning."]],"checks": [{"id": "c1","label": "First-command recall, short cord","hits": 8,"of": 10,"sessions": 2,"provisional": true},{"id": "c2","label": "First-command at 25-30 ft, cord slack, untouched","hits": 10,"of": 10,"sessions": 2,"provisional": true}],"session_cap": null,"equipment": ["kibble","check_cord"],"requires": ["OB-1"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "OB-3","id": "obedience.s3","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "stage","n": 3,"title": "Heel \u2014 Position and Pace","drill": "The dog heels on the left because the handler carries the gun on the right.\nThis is not arbitrary \u2014 the dog on the left stays out of the swing of the\nfirearm. Establish this from the first heel session and never break it.\n\nWork on a 4\u20136 foot lead, not the check cord. The lead stays loose \u2014 it is a\nsafety net, not a steering wheel.\n\nHeel position: the dog's right shoulder at the seam of your left leg, head\nup, attentive. Not forging (nose ahead of your leg) and not lagging (falling\nbehind).\n\nTeach position before movement. Stand with the dog sitting on your left. Lure\nthe dog's nose to your left thigh and mark/reward. Do this a dozen times until\nthe dog naturally swings to your left thigh on the signal.\n\nAdd movement: one step forward, \"heel,\" lure to your thigh, stop, sit.\nMark and reward the sit. Gradually add steps between rewards. If the dog\nforges, reverse direction sharply (about-turn) \u2014 the dog finds itself behind\nyou and must hustle to catch up. If it lags, forward pressure on the lead.\n\nThe auto-sit: the dog automatically sits when you stop walking, without a\nverbal command. Teach it by stopping and saying \"sit\" once. After 20\u201330\nrepetitions, stop and wait two seconds before saying \"sit.\" The dog begins to\nanticipate. Mark and reward that heavily. Within a few sessions, stop and say\nnothing. The auto-sit becomes automatic.\n\nBuild the pattern in stages, not all at once. Start with 10 steps in a\nstraight line with one stop/auto-sit. Then add one turn. Then two turns.\nThen a pace change. Then stretch the duration. A 2-minute pattern with 6\nturns and pace changes is the end state, not the first session.\n\nHeel must include left turns, right turns, about-turns (a sharp 180-degree\nreversal), and pace changes (slow, fast, normal). A dog that only heels in\na straight line in the backyard has not learned heel \u2014 it has learned \"walk\nin a straight line in the backyard.\"\n","pass": "A 2-minute heel pattern with 6+ turns and 2 pace changes, lead slack\nthroughout, 8/10 patterns clean across two sessions. Automatic sit on the\nstop 9/10.\n","body": "","ifthen": [["Forges past your leg","About-turn the moment the shoulder passes your knee \u2014 the turn is the correction. Do not haul the dog back with the lead."],["Swings wide or lags","Run the pattern along a wall or fence on the dog's off side, and reward at the seam while you are still moving."],["Crooked or slow sits on the stop","Halt along the fence so crooked has nowhere to go. Re-set every crooked sit without a word."]],"checks": [{"id": "c1","label": "2-min pattern, 6+ turns, lead slack throughout","hits": 8,"of": 10,"sessions": 2,"provisional": true},{"id": "c2","label": "Automatic sit on the stop","hits": 9,"of": 10,"provisional": true}],"session_cap": null,"equipment": ["kibble","lead"],"requires": ["OB-2"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "OB-4","id": "obedience.s4","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "stage","n": 4,"title": "Duration \u2014 Sit Means Sit","drill": "There is no separate \"stay\" command. Sit means sit until the {term:release_word}.\nAdding a separate \"stay\" implies that \"sit\" without \"stay\" means \"sit for a\nmoment and then you can move\" \u2014 exactly the wrong message for a dog that\nneeds to be steady on the line.\n\nBuild duration using the three D's: Duration, Distance, Distraction \u2014 see\n{learn:three_ds} for the full framework. Change only one at a time. Most\nsteadiness failures happen because the handler raised two or three at once.\n\nDuration first: sit the dog, take one step back, wait 5 seconds, step back in,\nreward. Build to 15 \u2192 30 \u2192 60 seconds at one step before adding a single yard\nof distance.\n\nDistance second: at 10 seconds, step back to 3 \u2192 5 \u2192 10 yards. Return to\nthe dog's side to release four reps in five \u2014 a hold the dog is always called\nout of decays into a creep, because the dog learns that holding still leads\nto coming toward you anyway.\n\nDistraction last: only after duration and distance are solid. Start with mild\ndistractions (another person walking past) and drop distance and duration back\nto their floors. Build back up.\n\nThe rule: when you raise one D, lower the other two. If you add a new\ndistraction, stand right next to the dog and ask for a short hold. This is\nnot being soft \u2014 this is how learning works. See {learn:reading_dog} for\nhow to read your dog's stress signals during these sessions.\n","pass": "60 sec at one step, 8/10 across two sessions. 10 sec at 10 yds, 8/10.\nThen the combination: 60 sec at 10 yds, handler returns to release, 9/10\nacross two sessions.\n","body": "","ifthen": [["Breaks as you step away","Distance climbed before the clock was solid. Back to one step and make 60 seconds boring before you add a yard."],["Creeps toward you mid-hold","Too many releases came toward you. Return to the dog's side to release, and re-place the dog on the exact spot after every creep."],["Holds, but fidgets and scans","The duration jumped too fast. Halve it and climb again in smaller steps."]],"checks": [{"id": "c1","label": "60 sec hold at one step","hits": 8,"of": 10,"sessions": 2,"provisional": true},{"id": "c2","label": "10 sec hold at 10 yds","hits": 8,"of": 10,"provisional": true},{"id": "c3","label": "60 sec at 10 yds, handler returns to release","hits": 9,"of": 10,"sessions": 2,"provisional": true}],"session_cap": null,"equipment": ["kibble"],"requires": ["OB-1"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "OB-5","id": "obedience.s5","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "stage","n": 5,"title": "Place Board","drill": "The place board is a portable, slightly elevated platform (3\u20136 inches off the\nground, non-slip surface) that gives the dog a clear physical boundary. Unlike\n\"sit\" on open ground, the board provides a tactile edge the dog can feel \u2014\nthe dog knows exactly where the boundary is.\n\n\"Place\" means get ON something \u2014 a board, a dog stand, a platform, a mat.\nThis is a separate command from \"kennel\" (get IN something), which is taught\non the puppy track ({ref:puppy.s1}).\n\nIntroduction: place the board in a hallway where the dog naturally walks near\nit. Lure the dog toward it with food. Mark and reward the first paw that\ntouches the board. Then two paws. Then three. Then all four. This is\n{term:shaping} \u2014 rewarding small steps toward the final behavior rather than\nwaiting for the whole thing at once. Within a few days, the dog is voluntarily\njumping onto the board seeking the reward. Add the word \"place\" once the dog\nis reliably driving to the board with all four feet.\n\nBuild duration on the board the same way you built duration on the sit \u2014\nseconds first, then distance, then distractions. The {term:release_word}\napplies here. The dog does not leave the board until released.\n","pass": "Drives to the place board on command from 10 ft 9/10, holds 60 sec, across\ntwo sessions.\n","body": "","ifthen": [["Won't get on the board","The board is unfamiliar. Lay it flat on the ground, scatter treats on it, and let the dog discover it. Do not lift or push the dog onto it."],["Gets on, then immediately jumps off","Duration was not built. Reward on the board rapidly \u2014 every 2 seconds at first \u2014 and release before the dog self-releases."]],"checks": [{"id": "c1","label": "Drives to place board on command from 10 ft","hits": 9,"of": 10,"sessions": 2,"provisional": true},{"id": "c2","label": "Holds on place board 60 sec","hits": 8,"of": 10,"provisional": true}],"session_cap": null,"equipment": ["kibble","place_board"],"requires": ["OB-1"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "OB-6","id": "obedience.s6","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "stage","n": 6,"title": "Off Lead \u2014 Proofing in Novel Locations","drill": "Two things happen in this stage: the lead comes off, and the dog proves it\ncan do everything it learned in new locations.\n\nOff-lead progression: check cord (actively managed) \u2192 dragging line (attached\nbut on the ground \u2014 the dog feels free but you can step on it if needed) \u2192\n{term:tab} (a 4\u20136 inch stub clipped to the collar \u2014 just a handle when the dog comes\nto you) \u2192 bare collar. Spend weeks in each phase, not days. If you find\nyourself picking up the line frequently, the dog is not ready to advance.\n\nNovel locations: dogs do not generalize automatically. A dog that sits\nperfectly in your living room does not automatically know that \"sit\" means\nthe same thing at the boat ramp. The first time you practice in a new\nlocation, treat it as a first lesson \u2014 reduce your expectations, increase\nrewards, and be patient. The dog is not being stubborn \u2014 it has not yet\nlearned that the command applies everywhere.\n\nThe \"one D up, two D's down\" rule applies here more than anywhere. A new\nlocation is a massive distraction increase. Drop distance and duration back\nto their floors and rebuild. Three novel locations with clean sessions is the\nbar \u2014 not three perfect sessions in the backyard.\n","pass": "In novel locations: first-command sit at 20 yds, 9/10. First-command here\npast a mild dist
