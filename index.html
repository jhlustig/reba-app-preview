ion, distance, distraction\n\nEvery training scenario has three variables (see\n{article:three_ds} for the full breakdown). The rule: move one lever\nat a time and keep the other two easy.\n\n**Example:** You are working {term:recall} (calling the dog to you) in\nthe yard with no distractions.\nThe dog comes every time. You take it to the park \u2014 new location, new\nsmells, other dogs walking past. The dog ignores you. It is not being\nstubborn. You moved all three levers at once: new distance (bigger\nspace), new distraction (other dogs), and new duration (longer time\nbetween rewards). Drop back: short distance, low distraction corner\nof the park, high reward rate. Rebuild.\n\n## How to recognize \"too hard\" before the dog fails\n\nThe dog will tell you it is struggling before it actually fails. Learn\nthese signals:\n\n**Slow responses.** The dog used to snap into the sit. Now it takes two\nseconds. That is not laziness \u2014 the dog is uncertain.\n\n**Displacement behaviors.** The dog suddenly starts sniffing the ground,\nscratching, yawning, or lip-licking in the middle of a drill. These are\nnot random \u2014 they are stress signals. The dog is saying \"this is too\nmuch right now.\"\n\n**Avoidance.** The dog looks away from you, moves away, or orients its\nbody toward the exit. It is telling you it wants out of the situation.\n\n**Whale eye.** The dog turns its head away but keeps its eyes locked on\nyou \u2014 you can see the white crescent at the edge of the eye. This is a\ndog under pressure.\n\n**Offering random behaviors.** The dog sits when you asked for a recall.\nIt lies down when you asked for a sit. It is guessing, not defying. A dog\nthat throws random behaviors does not understand what you are asking.\n\nWhen you see any of these, the next rep should be easier \u2014 not harder.\nDrop back one step to something the dog owns and let it win. End the\nsession on that win. Come back tomorrow at a lower level and rebuild.\n\n## Confused is not defiant\n\nThe most common mistake handlers make is reading confusion as defiance.\nA confused dog moves slowly, looks away, and offers random behaviors. A\ndefiant dog \u2014 one that knows the command and chooses not to comply \u2014 is\nrare, and it almost always means the handler jumped ahead of the dog's\nunderstanding.\n\n**Example:** The dog has a solid sit in the living room. You take it to\nthe boat ramp and say \"sit.\" The dog stands there staring at the water.\nThat is not defiance. The dog has not learned that \"sit\" means the same\nthing at the boat ramp. It is a generalization problem (see\n{article:three_ds}), not a respect problem. The fix is training, not\ncorrection.\n\nIf you are correcting the dog more than once a session, the drill is\ntoo hard. Drop a step. Make it winnable.\n\n## The phrase to remember\n\nBefore every rep, ask yourself: \"Can the dog win this?\" If the answer\nis not a confident yes, make it easier until it is. The dog that wins\nten easy reps learns more than the dog that fails one hard one.\n"},"marker_training": {"title": "Marker Training \u2014 Why 'Yes' Matters","category": "foundations","reading_min": 4,"experience": "all","summary": "How a single word bridges the gap between the behavior and the reward, and why timing matters more than the size of the treat.","body": "Every time you say \"yes\" and hand the dog a piece of kibble, you are\nusing a {term:mark} \u2014 a sound that tells the dog \"that exact thing you\njust did earned a reward.\" The marker is the most important tool in this\nprogram. It is how you communicate with precision, and it is what makes\nevery card in this app work.\n\n## What the marker does\n\nImagine you are teaching the dog to sit. The rump hits the ground. You\nreach into your pocket, pull out a piece of kibble, and deliver it. By\nthe time the food arrives, the dog has already looked at a bird, shifted\nits weight, and scratched its ear. Which behavior did the food reward?\nThe dog has no idea.\n\nNow add the marker. The rump hits the ground. You say \"yes\" \u2014 instantly,\nwithin half a second. Then you reach for the kibble. The dog heard \"yes\"\nat the exact moment the rump touched. The food can take two or three\nseconds to arrive and it does not matter, because the marker already told\nthe dog which behavior paid. The marker helps the dog take a snapshot of\nthe exact moment the behavior happened \u2014 a bridge between the behavior\nand the reward \u2014 it buys you time to deliver the food without losing\nprecision.\n\n## Why \"yes\" instead of a clicker\n\nA clicker makes a sharp, consistent sound and works well for pet\nobedience. But in gun dog work, your hands are full \u2014 leash in one hand,\nbumper or bird in the other, whistle around your neck. You cannot\noperate a clicker. A verbal marker (\"yes\") is always available. It is\nslightly less precise than a clicker \u2014 your voice varies more than a\nmechanical click \u2014 but the convenience is worth the trade-off in the\nfield.\n\n## Timing is everything\n\nThe marker must hit within half a second of the behavior. Not a second\nlater. Not two seconds later. Half a second.\n\n**Example \u2014 good timing:** You say \"sit.\" The rump hits the ground. You\nsay \"yes\" instantly. The dog connects sit \u2192 \"yes\" \u2192 food.\n\n**Example \u2014 late timing:** You say \"sit.\" The rump hits the ground. The\ndog looks up at you. You say \"yes.\" The dog connects looking up at you\n\u2192 \"yes\" \u2192 food. You just marked the wrong behavior.\n\n**Example \u2014 early timing:** You say \"sit.\" The dog is halfway down. You\nsay \"yes.\" The rump has not touched yet. The dog connects hovering\nhalfway \u2192 \"yes\" \u2192 food. You just taught a half-sit.\n\nDuring the loading phase ({ref:puppy.s2}), there is no behavior to time\n\u2014 you are just pairing the sound with food. But build the habit of being\nprecise now. Every card after that one depends on your timing.\n\n## The marker-then-reward sequence\n\nSay \"yes\" first. Then deliver the food. Never at the same time. If the\nfood appears at the same instant as the marker, the dog sees the food\nand ignores the sound. The marker loses its meaning.\n\nThe sequence: behavior \u2192 marker (within half a second) \u2192 pause (half a\nsecond to a full second) \u2192 food. The pause between the marker and the\nfood is what teaches the dog to listen for the sound. If the food is\nalways simultaneous, the dog watches your hands, not your voice.\n\n## When to stop marking every rep\n\nIn the beginning, mark and reward every correct rep \u2014 this is called a\ncontinuous schedule. The dog needs to learn the connection between\nbehavior, marker, and reward.\n\nOnce the behavior is reliable \u2014 the dog is performing it 8 out of 10\ntimes without help \u2014 begin skipping some reps. On some correct reps,\nyou mark and reward. On others, you say nothing and move to the next\nrep. What varies is whether the mark-and-reward pair happens at all \u2014\nnot what the reward is. Every \"yes\" is still followed by a reward.\nYou never say \"yes\" without paying. The marker is a promise.\n\nThis is {term:variable_reinforcement}. The dog never knows which rep\nwill earn the mark, so it performs every rep as if it might. You can\nalso vary the type of reward \u2014 sometimes kibble, sometimes a retrieve\nopportunity, sometimes enthusiastic praise \u2014 but the marker itself\nalways means the same thing: \"that earned something.\"\n\nDo not stop marking entirely. Even a finished dog benefits from an\noccasional \"yes\" and a reward. The marker keeps behaviors sharp.\n\n## Common mistakes\n\n**Using \"yes\" as praise.** \"Yes\" is not \"good dog.\" It is information \u2014\na precise signal that a specific behavior earned a reward. If you say\n\"yes\" when the dog is just being cute, you dilute the marker. Use \"good\ndog\" or \"good\" for general praise. Save \"yes\" for marking.\n\n**Marking without rewarding.** If you say \"yes\" and do not follow with\nfood, the marker loses its power. Every \"yes\" must be followed by a\nreward \u2014 at least during the first year of training. The marker is a\npromise. Break the promise enough times and the dog stops believing it.\n\n**Repeating the marker.** One \"yes\" per behavior. Not \"yes yes yes.\"\nMultiple markers blur the precision \u2014 the dog does not know which\n\"yes\" was the real one.\n"},"three_ds": {"title": "Duration, Distance, Distraction \u2014 Change One at a Time","category": "foundations","reading_min": 3,"experience": "all","summary": "The most common training failure is raising two variables at once. This framework keeps you from outrunning your dog.","body": "Every training scenario has three variables. Learning to manage them is\nthe difference between a dog that progresses steadily and a dog that\n\"suddenly forgot everything.\"\n\n## The three D's\n\n**Duration** \u2014 how long the dog holds the behavior. A 5-second sit and a\n60-second sit are different skills, even though the command is the same.\n\n**Distance** \u2014 how far away you are when the dog performs the behavior.\nA sit at your feet and a sit at 20 yards are different skills.\n\n**Distraction** \u2014 what is competing for the dog's attention. A sit in\nyour quiet living room and a sit at the boat ramp with ducks landing\nare different skills.\n\n## The rule: move one, lower the other two\n\nThis is the single most important rule in this article. When you raise\none variable, lower the other two.\n\n**Example \u2014 adding distance:** The dog holds a 60-second sit at one step\naway with no distractions. You want to add distance. Move to 5 yards \u2014\nbut drop the duration to 10 seconds and keep distractions at zero. You\nchanged one thing. The dog can win.\n\n**Example \u2014 adding distraction:** The dog holds a 30-second sit at 10\nyards in the backyard. You want to add a distraction \u2014 another person\nwalking past. Drop back to 5 yards and 10 seconds. Now add the person.\nOne variable changed. The dog can win.\n\n**Example \u2014 what happens when you move all three:** The dog has a solid\nsit in the backyard. You take it to a hunt test training day \u2014 new\nlocation (massive distraction), 40-yard distance, 2-minute hold while\nbirds are thrown. The dog breaks. It is not being bad. You moved every\nlever to maximum at once. No dog succeeds in that picture without being\nbuilt up to it one variable at a time.\n\n## New locations reset the clock\n\nDogs do not generalize well. A dog that sits perfectly in your yard does\nnot automatically know that \"sit\" means the same thing at the park, the\nvet's office, or the boat ramp. A new location is a massive distraction\nincrease \u2014 even if there is nothing visibly distracting about it to you.\n\n**Example:** Your dog heels beautifully in the backyard. You take it to\na friend's property \u2014 no other dogs, no birds, just a new field. The\ndog forges, lags, and ignores the auto-sit. It did not forget heel. It\nhas never heeled *here* before. The new location is the distraction.\nTreat it as a first lesson: short distance, high reward rate, low\nexpectations. Rebuild.\n\nThe app's Off Lead stage (OB-6) requires clean sessions in three\ndifferent novel locations. That is not busywork \u2014 it is the minimum\nneeded for the dog to generalize \"these commands work everywhere.\"\n\n## How to plan a session using the three D's\n\nBefore you walk out the door, decide which variable you are testing\ntoday. Write it down if it helps.\n\n- Working on **duration**? Stay close, keep distractions low, and\n  stretch the clock.\n- Working on **distance**? Keep the hold short, keep distractions low,\n  and move farther away.\n- Working on **distraction**? Stay close, keep the hold short, and add\n  one new element.\n\nIf the dog fails two reps in a row, you moved too fast. Drop the\nvariable you are testing by one step and rebuild. Two failures in a row\nis the signal \u2014 not three, not five. Two.\n\n## \"The dog forgot\" \u2014 no, it didn't\n\nWhen a handler says \"the dog forgot how to sit,\" what actually happened\nis the handler changed too many variables. The dog did not forget. It\nwas never taught the sit in that picture. The sit in the living room is\na different behavior, in the dog's brain, than the sit at the boat ramp\nwith shotguns going off.\n\nThe fix is always the same: lower the variables, rebuild, and add\ndifficulty one step at a time. There is no shortcut. But there is good\nnews \u2014 the rebuild is faster than the original teaching, because the\ndog has the foundation. It just needs to learn that the foundation\napplies here too. The answer to a failure is always the same:\nsimplify, simplify, simplify.\n"},"session_planning": {"title": "How to Plan a Training Session","category": "field_craft","reading_min": 3,"experience": "first_dog","summary": "The app tells you which card to work on. This article teaches you how to structure the 15\u201320 minutes around that card.","body": "You checked the NEXT tile, picked a card, grabbed your gear. Now what?\nA training session has a shape \u2014 a warm-up, a working block, and an\nending \u2014 and getting the shape right matters as much as the drill\nitself.\n\n## Start with a win\n\nNever open a session with the hardest thing. Start with something the\ndog already owns \u2014 a quick sit, a short recall, one easy retrieve. This\ndoes two things: it gets the dog's brain into training mode, and it\nputs a success on the board before you ask for anything difficult.\n\n**Example:** Today's card is whistle casting (WH-5). Before you touch\nthe whistle, run one short {term:pile} retrieve the dog has done a hundred\ntimes. The dog succeeds, you mark and reward, and now both of you are\nwarmed up and confident.\n\n## One card, one session\n\nPick one card and work that card. Do not bolt on extras. If you are\nworking OB-3 (Heel), that is the session \u2014 heel patterns, auto-sits,\nturns. Do not add \"a few marks at the end\" because the dog seems\nenergetic. Marks are a different card with a different skill. Mixing\nskills in one session muddies the learning.\n\nThe exception is the warm-up rep \u2014 that is a known behavior used to\nopen the session, not a second skill being trained.\n\n## Session length by age\n\nShorter is almost always better. The dog's brain consolidates learning\nduring sleep, not during the session. A 5-minute session that ends on\na win teaches more than a 20-minute session that ends in frustration.\n\n- Puppies (8\u201316 weeks): 3\u20135 minutes, 2\u20133 times per day\n- Young dogs (4\u20138 months): 10\u201315 minutes, once or twice per day\n- Adults (8+ months): 15\u201320 minutes for obedience, field work may run\n  longer but should still end before the dog fades\n\nThese are caps, not targets. A session that goes well in 8 minutes\ndoes not need to run to 15.\n\n## When to quit\n\n**Quit while the dog is winning.** The last rep should be the best rep\n\u2014 or at least a clean one. If the dog nails three heel patterns in a\nrow, stop. Do not push for a fourth to see if it holds. The fourth\nrep is where things go wrong, and now the dog sleeps on failure\ninstead of success.\n\n**Quit after two failures in a row.** Two missed reps means the drill\nis too hard right now. Do not push for a third. Drop back to something\nthe dog can win, run one clean rep, and end there. Come back tomorrow\nat a lower level.\n\n**Quit for heat.** First and last light only in summer. Back of your\nhand on the pavement for five seconds before the dog's pads touch it.\nIf it burns your hand, it burns their feet. Water before the session,\nnot only after. If the dog is panting hard and not recovering\nquickly in the shade, stop immediately and begin cooling \u2014 that is\nheat stress, not tiredness. Get to a vet if the dog shows glazed\neyes, stumbling, or thick drool.\n\n**Quit for frustration \u2014 yours or the dog's.** If you are angry, the\nsession is over. Dogs read your body language better than they read\nyour commands. An angry handler produces a confused, shut-down dog.\nWalk away, come back tomorrow.\n\n## Log immediately\n\nOpen the LOG tab right after the session, while memory is fresh. What\ncard did you work? How many reps? What went well? What broke? The\nnotes you write today are the plan you read tomorrow. A handler who\nlogs consistently makes better session decisions than one who relies\non memory.\n"},"reading_dog": {"title": "Reading Your Dog \u2014 What the Body Language Tells You","category": "field_craft","reading_min": 4,"experience": "all","summary": "Every IF/THEN on the cards assumes you can read the dog's state. This article teaches you what to watch for \u2014 and what to do about it.","body": "Your dog cannot talk, but it is always communicating. Every card in\nthis program has IF/THEN rows \u2014 \"if the dog does X, do Y.\" Those rows\nassume you can see what the dog is telling you. This article teaches\nyou to read it.\n\n## The three states\n\nAt any moment, your dog is in one of three states: drive, neutral, or\nstress. Each one looks different, and each one calls for a different\nresponse from you.\n\n## Drive \u2014 the dog is locked in\n\nThis is the state you want during field work. The dog is focused,\nforward, intense. Signs:\n\n- **Hard stare at the fall.** The eyes are locked on where the bumper\n  landed. The head does not move.\n- **Trembling sit.** The dog vibrates with anticipation \u2014 muscles\n  loaded, ready to launch. This is not fear. This is desire.\n- **Whining.** A dog that whines on the line is not misbehaving. It is\n  overflowing with drive. Whining is managed (you can shape quieter\n  holds over time), not punished. Punishing whining punishes drive \u2014\n  and drive is the one thing you cannot rebuild once you kill it.\n- **Forward body position.** Ears up, weight on the front feet, tail\n  up or level. Everything about the dog says \"send me.\"\n\n**What to do in drive:** Ride it. This is the zone. Keep the session\nshort so the dog leaves still wanting more. Do not add difficulty\njust because the dog looks good \u2014 save that for the next session.\n\n## Neutral \u2014 the dog is calm and ready\n\nThis is the state you want during obedience work. The dog is relaxed,\nattentive, and responsive. Signs:\n\n- **Soft eyes.** The gaze is on you but not intense. No hard stare.\n- **Loose body.** No tension in the shoulders or jaw. The tail is\n  relaxed, not rigid.\n- **Quick responses.** The dog hears the command and performs it\n  promptly \u2014 not frantically, not slowly.\n\n**What to do in neutral:** Train. This is the learning state. The dog\nis absorbing information. Push the session to the planned difficulty\nlevel and work the card.\n\n## Stress \u2014 the dog is struggling\n\nThis is the state that tells you to adjust. The dog is confused,\noverwhelmed, or in pain. Signs:\n\n- **Lip-licking.** A quick tongue flick when there is no food around.\n  The dog is uncomfortable.\n- **Yawning.** Not tired yawning \u2014 stress yawning. Often repeated,\n  sometimes with a whine.\n- **Displacement sniffing.** The dog suddenly drops its nose to the\n  ground mid-drill and sniffs frantically. It is not smelling something\n  interesting \u2014 it is avoiding the situation. This is the dog's way of\n  saying \"I need a break from this.\"\n- **Whale eye.** The dog turns its head away but keeps its eyes on you.\n  You see a white crescent at the edge of the eye. The dog is under\n  pressure and unsure what to do.\n- **Slow responses.** The dog used to snap into the sit. Now it takes\n  two seconds and looks away first. That is not laziness \u2014 it is\n  uncertainty.\n- **Moving away from you.** The dog orients toward the exit, backs up,\n  or turns its body away. It wants out of the situation.\n- **Tucked tail.** Fear or submission. The dog is not in a state to\n  learn anything.\n\n**What to do in stress:** Make the next rep easier. Drop back to\nsomething the dog owns \u2014 a simple sit, a short recall, one easy\nretrieve. End on that win. Come back tomorrow at a lower level. Do not\npush through stress hoping the dog will \"get over it.\" A dog that is\nstressed is not learning. It is surviving.\n\n## Dogs read what they see before what they hear\n\nDogs process body language first, hand signals second, and words last.\nYour posture, the tension in your shoulders, the speed of your\nmovements \u2014 the dog reads all of this before it processes your verbal\ncommand. An angry handler who says \"good dog\" in a cheerful voice is\nnot fooling the dog. The dog sees the stiffness in your walk and the\njerkiness in your hands.\n\nThis is also why hand signals are learned faster than verbal commands.\nThe dog is built to watch movement, not listen to words. The training\nsequence on every obedience card reflects this: lure \u2192 hand signal \u2192\nverbal command. You teach what the dog sees before you teach what the\ndog hears.\n\n## Confused is not defiant\n\nThis is worth repeating from {article:engineer_win} because it is the\nmost common mistake handlers make.\n\nA confused dog moves slowly, looks away, and throws random behaviors \u2014\nit sits when you asked for a {term:recall}, it walks away when you asked\nfor a sit.\nIt is guessing because it does not understand the question.\n\nA defiant dog \u2014 one that knows the command and chooses not to comply \u2014\nis rare. Most of the time, what looks like defiance is confusion. The\ndog has not generalized the command to this location, this distraction\nlevel, or this distance. The fix is always training, not correction.\n\n**Example:** You say \"here\" at the park. The dog looks at you, then\nlooks at the other dog across the field, then sniffs the ground. That\nis not defiance. The dog has never been asked to recall past that level\nof distraction. It does not know how. Go closer, increase the value\nof the reward, make the recall winnable, and rebuild.\n\n## Heat stress \u2014 the emergency state\n\nHeat stress is not a training problem. It is a medical emergency.\nKnow the signs:\n\n- Panting that does not slow after two minutes of rest in the shade\n- Bright red gums and tongue\n- Glazed or unfocused eyes\n- Stumbling, wobbling, or loss of coordination\n- Drooling thick, ropy saliva\n- Vomiting or diarrhea\n\nIf you see these signs, stop everything. This is a veterinary\nemergency \u2014 begin cooling and get to a vet immediately. Move the dog\nto shade or air conditioning. Apply cool (not ice-cold) water to the\nbelly, armpits, and paw pads. Do not wait to see if the dog improves\non its own. Heatstroke can kill a dog in under an hour.\n\nPrevention: train at first and last light in summer. Carry water for\nthe dog, not just for yourself. Back of your hand on the pavement for\nfive seconds \u2014 if it burns you, it burns the dog's pads. A skipped\nsession costs nothing. A dead dog costs everything.\n"},"ecollar_levels": {"title": "Finding the Right E-Collar Level","category": "equipment","reading_min": 5,"experience": "all","summary": "Model-specific guidance for finding your dog's working level \u2014 the lowest stimulation the dog consistently acknowledges.","body": "The e-collar is a communication tool, not a punishment device. Used\ncorrectly, it is a tap on the shoulder at 100 yards \u2014 a reminder of\na command the dog already knows. Used incorrectly, it creates fear,\nconfusion, and {term:learned_helplessness}. The difference between\nthe two is the level.\n\n## What \"working level\" means\n\nThe working level is the lowest stimulation setting at which the dog\nshows a subtle, consistent acknowledgment \u2014 not a flinch, not a yelp,\nnot a freeze. A tiny sign that the dog felt something:\n\n- A slight ear rotation toward you\n- A small head turn\n- A brief pause in movement\n- A muscle twitch below the ears\n\nThat is the working level. It is the softest touch the dog notices.\nEverything in this program uses that level as the baseline.\n\n## The level-finding protocol\n\nDo this in a quiet, familiar place with no distractions. The dog\nshould be calm \u2014 not excited, not tired, not in drive.\n\n1. Set the collar to the lowest available setting.\n2. Press the stimulation button briefly \u2014 one to two seconds of\n   continuous, or a single nick.\n3. Watch the dog's face and ears. If there is no visible response,\n   increase by one level.\n4. Repeat. The first level at which you see a subtle acknowledgment\n   is the working level.\n5. Test it three times at that level to confirm consistency.\n\nDo not skip levels. Do not start in the middle and work down. Always\nstart at the bottom and climb. The goal is to find the floor, not\nthe ceiling.\n\n## Model-specific guidance\n\nDifferent collars have different level ranges and controls. The\nnumbers below are typical starting points for adult retrievers \u2014 your\ndog may be higher or lower.\n\n**Garmin Sport PRO / PRO 550 Plus**\n- 10 stimulation levels plus tone and vibrate\n- Typical working range for retrievers: levels 1\u20133\n- Momentary (a brief pulse) and continuous (held while you press)\n  modes. Use momentary for most training. Continuous is for specific\n  situations like holding a whistle sit at distance.\n- Tone can serve as a pre-cue (\"you are about to feel the collar\")\n  but must be conditioned separately \u2014 the dog does not know what\n  tone means until you teach it.\n\n**Dogtra 1900S / 2700 T&B**\n- 127 stimulation levels, Nick and Constant modes\n- Typical working range for retrievers: levels 8\u201320\n- The rheostat dial allows fine adjustment mid-session. Turn the\n  dial while pressing \u2014 the level changes in real time.\n- Nick is a single pulse. Constant is held. Same principle as\n  Garmin's momentary/continuous.\n\n**SportDOG SD-1825X / 2525**\n- 21 stimulation levels plus tone and vibrate\n- Typical working range for retrievers: levels 2\u20135\n- Fewer levels means bigger jumps between settings. If level 2\n  gets no response and level 3 seems too strong, stay at level 2\n  and work with it \u2014 the dog may show a subtle response you missed.\n  Do not extend press duration as a substitute for a higher level.\n\nIf your collar is not listed here, the protocol is the same: start\nat the bottom, climb by one, and stop at the first acknowledgment.\n\n## When to adjust the level\n\nThe working level is not a fixed number. It changes with conditions.\n\n**Going up:**\n- The dog is in high drive (chasing a bird, locked on a mark) and\n  blows through the working level. Bump up one or two levels for\n  field work, then return to the baseline for obedience.\n- Thick winter coat or snow jacket \u2014 the contact points may not\n  be reaching the skin. Reseat the collar tighter or increase one\n  level.\n\n**Going down:**\n- The dog is wet. Water conducts electricity \u2014 a wet coat makes the\n  same level feel stronger. After a water retrieve, drop the level\n  by a few points. Re-test if you are unsure.\n- The dog vocalizes, tucks its tail, or shuts down. You are too high.\n  Drop immediately and re-find the working level in a calm setting.\n- A tired dog is more sensitive. Late in a long session, the same\n  level may hit harder than it did at the start.\n\n## The rule\n\nIf in doubt, you are too high. Lower it.\n\nA level that is too low does nothing \u2014 the dog ignores it and you\ntry again. A level that is too high creates fear. One outcome wastes\na rep. The other can damage the dog's trust in you and in the collar\nfor months. Always err on the side of too low.\n\n## Collar fit and contact\n\nThe collar must be snug enough that the contact points touch skin,\nnot just fur. Two fingers between the strap and the neck \u2014 tight\nenough for contact, loose enough to breathe. Check the fit every\nsession. A collar that rides up or rotates delivers inconsistent\nstimulation, and the dog learns nothing from inconsistency.\n\nRemove the collar after every session. Prolonged wear can cause\npressure sores under the contact points. After water work, dry the\ndog's neck before putting the collar back on.\n"},"equipment_guide": {"title": "Gear You Need (and Gear You Don't)","category": "equipment","reading_min": 5,"experience": "first_dog","summary": "A stage-by-stage checklist so you buy what you need when you need it \u2014 not everything at once, and not the wrong things.","body": "New handlers tend to do one of two things: buy everything on the\ninternet before the puppy comes home, or show up with nothing but a\nleash and a bag of treats. This article is a stage-by-stage checklist.\nBuy what you need for the stage you are in. Everything else can wait.\n\n## Puppy Foundation (PP)\n\n- **Crate.** Wire or plastic, sized so the puppy can stand, turn, and\n  lie down but not wander. Too big and the puppy uses one end as a\n  bathroom. A divider panel lets you buy one crate and resize it as\n  the puppy grows.\n- **Flat buckle collar.** Not a choke, not a prong, not a martingale.\n  A simple flat collar with a D-ring for the leash.\n- **Leash.** 4\u20136 feet, lightweight. Not a retractable leash \u2014 those\n  teach the dog that pulling creates more distance.\n- **Kibble.** The puppy's regular meal is the training reward. No\n  special treats needed at this stage.\n- **Puppy bumpers.** Small, soft canvas or rubber bumpers sized for a\n  puppy's mouth. Standard-size bumpers are too big and too hard for\n  an 8-week-old. Two or three puppy bumpers is plenty.\n\nYou do not need: a whistle, an e-collar, a place board, a launcher,\nor adult-sized bumpers. All of those come later.\n\n## Basic Obedience (OB)\n\n- **Check cord.** 20\u201330 feet of lightweight rope, not a retractable\n  leash. Used for recall training. Get one with no handle loop on the\n  end \u2014 a loop can snag on brush if the cord is dragging.\n- **Place board.** A portable, slightly elevated platform (3\u20136 inches\n  off the ground) with a non-slip surface. You can buy a commercial\n  dog training platform or build one from plywood and rubber matting.\n- **Tab leash.** A 4\u20136 inch stub clipped to the collar \u2014 just a\n  handle for when the dog comes to you. Used in the transition from\n  on-lead to off-lead.\n- **Whistle.** A standard plastic pea whistle or a Roy Gonia Special.\n  You do not need an expensive silent whistle or an Acme Thunderer\n  at this stage. Pick one and stick with it \u2014 the dog learns that\n  specific sound.\n\nYou do not need: an e-collar (not until the Force & Collar track),\na launcher, or birds. Do not buy an e-collar \"to have ready.\"\nHaving it in the bag tempts you to use it before the dog is ready.\n\n## Steadiness & Marking (MK) / Whistle & Casting (WH)\n\n- **E-collar.** Now, and only now. See {article:ecollar_levels} for\n  model-specific guidance. Buy from an established brand: Garmin,\n  Dogtra, or SportDOG. Do not buy a cheap collar from a brand you\n  have never heard of \u2014 inconsistent stimulation teaches the dog\n  nothing.\n- **Standard bumpers.** White and orange, full size. White for land\n  (visible against cover), orange for water (visible against glare).\n  A dozen of each is a reasonable working inventory.\n- **Launcher or winger.** For solo marks training. See the Solo\n  Handler reference card ({ref:steadiness.ref_solo}) for types and\n  brands. One single-shot remote launcher is all you need to start.\n- **Blank pistol or starter pistol.** For noise conditioning ladder\n  rungs and marks with gunfire. Cap guns work for early rungs.\n\nYou do not need: live birds (not until advanced marks work), a duck\ncall (not until the Hunt Preparation track), or a boat (not until\nwater blinds).\n\n## Water (WA) / Hunt Preparation (HU)\n\n- **Neoprene dog vest.** For cold-water work. Not needed in warm\n  weather, essential once water temperatures drop below 60\u00b0F.\n- **Dead fowl trainer.** A weighted canvas dummy shaped like a duck,\n  with wings. Bridges the gap between bumpers and real birds.\n- **Training birds.** Ducks or pigeons, bought from a game farm or\n  saved from hunting season. Start with thawed birds \u2014 a frozen bird\n  is too hard for a young dog's mouth and can cause discomfort.\n  See the Bumper to Bird reference card ({ref:steadiness.ref_birds}).\n- **Decoys.** A small spread for decoy introduction and steadiness\n  around decoys. You do not need a hundred decoys \u2014 a dozen is enough\n  for training.\n- **Duck call.** For conditioning the dog to the sound and teaching\n  it that the call predicts birds.\n\n## What you do not need \u2014 ever\n\n- **Dog boots.** Unless the dog has a specific foot injury.\n- **Training vests with 40 pockets.** A canvas pouch or an apron\n  that holds bumpers and kibble is all you need.\n- **Multiple e-collars.** One collar, one dog. You do not need a\n  second collar \"for backup\" unless you train professionally.\n- **A $300 whistle.** The dog does not care about the brand. It\n  cares about the consistency of the sound.\n- **Anything marketed as a shortcut.** There are no shortcuts. The\n  gear serves the training, and the training takes as long as the\n  dog needs it to take.\n\n## The principle\n\nBuy for the stage you are in, not the stage you hope to reach. A\npuppy handler with a crate, a leash, some kibble, and a few puppy\nbumpers has everything they need for months of productive training.\nThe expensive gear earns its place later \u2014 when the dog is ready\nfor it and the handler knows how to use it.\n"}},"state": {"as_of": "2026-10-18","tracks": {"HU": {"stood_down": null,"banked_stages": ["HU-1"],"current": "HU-2","current_title": "Decoys \u2014 Through and Around","next": "HU-2","blocked_by": []},"LN": {"stood_down": null,"banked_stages": ["LN-1","LN-2","LN-3","LN-4","LN-5"],"current": null,"current_title": null,"next":       const tgtCard = cards[item.card];
      const spec = tgtCard ? (tgtCard.checks||[]).find(k => k.id === item.check) : null;
      if (!spec) { allOk = false; detail.push({card:item.card,check:item.check,have:0,need:0,error:'no such check'}); continue; }
      const nsess = item.sessions != null ? item.sessions : (spec.sessions||1);
      const bucket = perCheck[pcKey(item.card,item.check)] || [];
      const good = bucket.filter(r => String(r.date||'') > sd.date && countsEffective(r,tgtCard)[0] && r.hits!=null && r.hits>=spec.hits);
      detail.push({card:item.card,check:item.check,have:good.length,need:nsess,hits:spec.hits,of:spec.of});
      if (good.length < nsess) allOk = false;
    }
    lifted[code] = allOk; liftDetail[code] = detail;
  }
  function checkGateOpen(code, spec, bk) { return (spec.requires||[]).every(r => bk.has(r)); }
  const bankedCards = new Set();
  for (let iter = 0; iter < Object.keys(cards).length + 2; iter++) {
    const gs = {}; let changed = false;
    for (const [code, card] of Object.entries(cards)) gs[code] = (card.requires||[]).every(r => bankedCards.has(r));
    for (const [code, card] of Object.entries(cards)) {
      if (!(card.checks||[]).length || !gs[code]) continue;
      if (code in standDowns && !lifted[code]) continue;
      let ok = true;
      for (const spec of card.checks) {
        if (asserts[code+'|'+spec.id]) continue;
        if (!checkGateOpen(code,spec,bankedCards)) { ok = false; break; }
        const bucket = perCheck[pcKey(code,spec.id)] || [];
        const good = bucket.filter(r => countsEffective(r,card)[0] && r.hits!=null && r.hits>=spec.hits);
        if (good.length < (spec.sessions||1)) { ok = false; break; }
      }
      if (ok && !bankedCards.has(code)) { bankedCards.add(code); changed = true; }
    }
    if (!changed) break;
  }

  for (const code of Object.keys(cards).sort()) {
    const card = cards[code];
    const gateOpen = (card.requires||[]).every(r => bankedCards.has(r));
    const blockers = (card.requires||[]).filter(r => !bankedCards.has(r));
    const checks = [];
    for (const spec of (card.checks||[])) {
      const rowsc = perCheck[pcKey(code,spec.id)] || [];
      const need = spec.sessions||1, good = [], logged = [];
      for (const r of rowsc) {
        const [eff, why] = countsEffective(r, card);
        const rec = {date:r.date,hits:r.hits,of:r.of,counts:eff,why:why,machine:r.machine||false,source:r.source||'',assertion:r.assertion||false};
        logged.push(rec);
        if (eff && r.hits!=null && r.hits>=spec.hits) good.push(rec);
      }
      const asserted = asserts[code+'|'+spec.id];
      const cgate = checkGateOpen(code,spec,bankedCards);
      const cblock = (spec.requires||[]).filter(r => !bankedCards.has(r));
      let status;
      if (asserted) status = 'banked_assertion';
      else if (!rowsc.length) status = 'not_recorded';
      else if (!(gateOpen && cgate)) status = 'pre_gate';
      else if (good.length >= need) status = 'banked';
      else if (good.length > 0) status = 'in_progress';
      else status = 'short';
      const hv = logged.filter(s=>s.hits!=null).map(s=>s.hits);
      checks.push({id:spec.id,label:spec.label||'',requires:spec.requires||[],blocked_by:cblock,
        need_hits:spec.hits,of:spec.of,need_sessions:need,banked_sessions:good.length,
        status:status,best_hits:hv.length?Math.max(...hv):null,asserted:!!asserted,
        assertion_source:(asserted||{}).source||'',assertion_note:(asserted||{}).note||'',
        prose_sessions:good.filter(g=>!g.machine).length,assertion_sessions:good.filter(g=>g.assertion).length,
        sessions:logged});
    }
    let cstatus;
    if ((card.checks||[]).length) {
      if (code in standDowns && !lifted[code]) cstatus = 'stood_down';
      else if (bankedCards.has(code)) cstatus = 'banked';
      else if (!gateOpen) cstatus = 'locked';
      else if (checks.some(c => c.status==='in_progress'||c.status==='short')) cstatus = 'in_progress';
      else if (checks.every(c => c.status==='not_recorded')) cstatus = 'not_started';
      else cstatus = 'in_progress';
    } else cstatus = 'no_checks';
    const sd = standDowns[code];
    outCards[code] = {code:code,track:card.track,type:card.type,n:card.n,title:card.title,
      status:cstatus,gate_open:gateOpen,blocked_by:blockers,requires:card.requires||[],checks:checks,
      stood_down:sd?{date:sd.date||null,why:sd.why||null,lifts_when:sd.lifts_when||null,
        criterion_set:!!(sd.revalidate&&sd.revalidate.length),lifted:!!lifted[code],progress:liftDetail[code]||[]}:null};
  }
  const trackBuckets = {};
  for (const [code, c] of Object.entries(outCards)) { if (!trackBuckets[c.track]) trackBuckets[c.track] = []; trackBuckets[c.track].push(code); }
  const positions = {};
  for (const [tag, codes] of Object.entries(trackBuckets)) {
    const stages = codes.map(c=>outCards[c]).filter(c=>c.type==='stage').sort((a,b)=>(a.n||0)-(b.n||0));
    const banked = stages.filter(s=>s.status==='banked').map(s=>s.code);
    const current = stages.find(s=>(s.status==='in_progress'||s.status==='not_started')&&s.gate_open);
    const sdStage = stages.find(s=>s.status==='stood_down');
    const nxt = stages.find(s=>s.status!=='banked');
    positions[tag] = {stood_down:sdStage?sdStage.code:null,banked_stages:banked,
      current:current?current.code:null,current_title:current?current.title:null,
      next:nxt?nxt.code:null,blocked_by:nxt?nxt.blocked_by:[]};
  }
  return {cards:outCards,tracks:positions,
    orphans:orphans.map(r=>({card:r.card,check:r.check,date:r.date})),
    superseded:superseded.map(r=>({card:r.card,check:r.check,date:r.date,hits:r.hits,of:r.of}))};
}

/* ── IndexedDB session storage + live state recompute ───────────────────── */
function openSessionsDB() {
  return new Promise((resolve, reject) => {
    /* Version 4: add 'events' store for non-card sessions (HRC tests, etc).
       Version 3 added 'outings'. Version 2 wiped stale test data.
       The 'rows' store is preserved across this upgrade. */
    const req = indexedDB.open('reba-sessions', 4);
    req.onupgradeneeded = (e) => {
      const db = req.result;
      if (e.oldVersion < 2) {
        if (db.objectStoreNames.contains('rows')) db.deleteObjectStore('rows');
        db.createObjectStore('rows', { autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('outings')) {
        db.createObjectStore('outings', { autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('events')) {
        db.createObjectStore('events', { autoIncrement: true });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGetAll(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('rows', 'readonly');
    const req = tx.objectStore('rows').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutAll(db, rows) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('rows', 'readwrite');
    const store = tx.objectStore('rows');
    for (const r of rows) store.put(r);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function idbGetOutings(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('outings', 'readonly');
    const req = tx.objectStore('outings').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutOuting(db, outing) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('outings', 'readwrite');
    tx.objectStore('outings').put(outing);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function historyToRows() {
  const hist = (DECK.week || {}).history || {};
  const rows = [];
  for (const [date, entries] of Object.entries(hist)) {
    for (const e of entries) {
      rows.push({ card: e.code, check: e.check, date: String(date),
        hits: e.hits, of: e.of, counts: e.counts !== false,
        tod: e.tod, assist: 'none', rung: e.rung != null ? e.rung : undefined, machine: false, source: 'history' });
    }
  }
  return rows;
}
async function recomputeState() {
  try {
    const db = await openSessionsDB();
    const idbRows = await idbGetAll(db);
    const histRows = historyToRows();
    const allRows = histRows.concat(idbRows);
    const asserts = (DECK.state || {}).asserts || {};
    const standDowns = (DECK.state || {}).stand_downs || {};
    const result = computeState(DECK.cards, allRows, asserts, standDowns);
    const asOf = (DECK.state || {}).as_of || '';
    DECK.state = Object.assign(result, { asserts: asserts, stand_downs: standDowns, as_of: asOf });
    /* Patch DECK.week.history with IDB rows so the cadence strip, "last
       session" label, staleness, and day-row history all reflect sessions
       logged since the last build. */
    if (idbRows.length) {
      if (!DECK.week) DECK.week = {};
      if (!DECK.week.history) DECK.week.history = {};
      for (const r of idbRows) {
        if (!r.date || !r.card) continue;
        if (!DECK.week.history[r.date]) DECK.week.history[r.date] = [];
        const already = DECK.week.history[r.date].some(
          h => h.code === r.card && h.check === r.check);
        if (!already) {
          DECK.week.history[r.date].push({
            code: r.card, check: r.check,
            hits: r.hits, of: r.of, counts: r.counts !== false
          });
        }
      }
    }
    /* Merge IDB outings into DECK.sessions so the History tab shows
       sessions logged since the last build. */
    const idbOutings = await idbGetOutings(db);
    if (idbOutings.length) {
      if (!DECK.sessions) DECK.sessions = [];
      const built = new Set(DECK.sessions.map(o => o.date + '|' + (o.tod || '')));
      for (const o of idbOutings) {
        const key = o.date + '|' + (o.tod || '');
        if (!built.has(key)) { DECK.sessions.push(o); built.add(key); }
      }
      DECK.sessions.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    }
    /* Merge IDB events into DECK.events for the History tab */
    const idbEvents = await idbGetEvents(db);
    if (idbEvents.length) {
      if (!DECK.events) DECK.events = [];
      const builtE = new Set(DECK.events.map(e => e.date + '|' + (e.tod || '') + '|' + (e.event_type || '')));
      for (const ev of idbEvents) {
        const key = ev.date + '|' + (ev.tod || '') + '|' + (ev.event_type || '');
        if (!builtE.has(key)) { DECK.events.push(ev); builtE.add(key); }
      }
      DECK.events.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    }
    render();
  } catch (e) { console.error('recomputeState failed:', e); }
}
function idbGetEvents(db) {
  return new Promise((resolve, reject) => {
    if (!db.objectStoreNames.contains('events')) { resolve([]); return; }
    const tx = db.transaction('events', 'readonly');
    const req = tx.objectStore('events').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutEvent(db, event) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('events', 'readwrite');
    tx.objectStore('events').put(event);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ── Firestore REST API — no SDK, just fetch ──────────────────────────────── */
const FS_PROJECT = 'reba-training-app';
const FS_API_KEY = 'AIzaSyDUL6hF8_W-ysx_3uSlqhNL-AYazzNj9BI';
const FS_BASE = 'https://firestore.googleapis.com/v1/projects/' + FS_PROJECT + '/databases/(default)/documents';

function fsDocValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === 'string') return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(fsDocValue) } };
  if (typeof v === 'object') {
    const fields = {};
    for (const [k, val] of Object.entries(v)) fields[k] = fsDocValue(val);
    return { mapValue: { fields } };
  }
  return { stringValue: String(v) };
}

function fsWrite(collection, data) {
  const fields = {};
  for (const [k, v] of Object.entries(data)) fields[k] = fsDocValue(v);
  // Add server timestamp
  fields.created_at = { timestampValue: new Date().toISOString() };
  return fetch(FS_BASE + '/' + collection + '?key=' + FS_API_KEY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields }),
  });
}

function fsReadAll(collection) {
  return fetch(FS_BASE + '/' + collection + '?key=' + FS_API_KEY + '&pageSize=500')
    .then(r => r.json())
    .then(data => (data.documents || []).map(doc => {
      const out = {};
      for (const [k, v] of Object.entries(doc.fields || {})) out[k] = fsParseValue(v);
      return out;
    }));
}

function fsParseValue(v) {
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return parseInt(v.integerValue, 10);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fsParseValue);
  if ('mapValue' in v) {
    const out = {};
    for (const [k, fv] of Object.entries(v.mapValue.fields || {})) out[k] = fsParseValue(fv);
    return out;
  }
  return null;
}

/* ── GPS + site matching ──────────────────────────────────────────────────── */
const GEO_OPTS = { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 };
let lastGeoFix = null;

function geoMetres(a, b, c, d) {
  if ([a,b,c,d].some(v => !Number.isFinite(v))) return Infinity;
  const R = 6371000, r = Math.PI / 180;
  const p1 = a * r, p2 = c * r, dp = (c - a) * r, dl = (d - b) * r;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function matchSite(lat, lon) {
  if (!SITES.length) return null;
  const scored = SITES.map(s => ({
    s, m: geoMetres(lat, lon, s.lat, s.lon)
  })).sort((a, b) => a.m - b.m);
  const inside = scored.filter(x => x.m <= x.s.radius_m);
  if (inside.length === 1) return { match: 'hit', site: inside[0].s, dist: inside[0].m };
  if (inside.length > 1) return { match: 'ambiguous', sites: inside.map(x => x.s), dists: inside.map(x => x.m) };
  return { match: 'none', nearest: scored[0].s, dist: scored[0].m };
}

function detectLocation() {
  if (!navigator.geolocation) {
    renderGeoResult({ error: 'No GPS on this device.' });
    return;
  }
  renderGeoResult({ acquiring: true });
  navigator.geolocation.getCurrentPosition(
    p => {
      lastGeoFix = p;
      const result = matchSite(p.coords.latitude, p.coords.longitude);
      result.accuracy = p.coords.accuracy;
      result.lat = p.coords.latitude;
      result.lon = p.coords.longitude;
      renderGeoResult(result);
      // Auto-set location if we got a clean match
      if (result.match === 'hit') {
        S.location = result.site.label;
        // Also fetch weather
        fetchSessionWeather(p.coords.latitude, p.coords.longitude);
      }
      render();
    },
    e => {
      const msgs = {
        1: 'Location denied. Allow in Settings.',
        2: 'No position. Try open sky.',
        3: 'Timed out — try again.'
      };
      renderGeoResult({ error: msgs[e.code] || 'GPS failed.' });
    },
    GEO_OPTS
  );
}
window.detectLocation = detectLocation;

function renderGeoResult(r) {
  const el = document.getElementById('geoResult');
  if (!el) return;
  if (r.acquiring) {
    el.innerHTML = '<span style="color:var(--muted)">Acquiring fix\u2026</span>';
    return;
  }
  if (r.error) {
    el.innerHTML = '<span style="color:var(--alert)">' + r.error + '</span>';
    return;
  }
  if (r.match === 'hit') {
    el.innerHTML = '<span style="color:#2F4A32;font-weight:700">\u2713 ' + r.site.label +
      '</span> <span style="color:var(--muted);font-size:12px">' + Math.round(r.dist) +
      ' m, fix \u00b1' + Math.round(r.accuracy) + ' m</span>';
  } else if (r.match === 'ambiguous') {
    el.innerHTML = '<span style="color:#9A7C42;font-weight:700">Multiple matches:</span> ' +
      r.sites.map((s, i) => s.label + ' (' + Math.round(r.dists[i]) + ' m)').join(', ');
  } else {
    el.innerHTML = '<span style="color:var(--muted)">No match — nearest: ' +
      r.nearest.label + ' at ' + Math.round(r.dist) + ' m</span>';
  }
}

/* ── Weather auto-fetch (Open-Meteo, same as reba-lab) ─────────────────── */
function fetchSessionWeather(lat, lon) {
  const vars = 'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m';
  const units = '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago';
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(5) +
    '&longitude=' + lon.toFixed(5) + '&current=' + vars + units;
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (data.current && data.current.temperature_2m != null) {
        S.temp_f = String(Math.round(data.current.temperature_2m));
        const el = document.getElementById('wxInfo');
        if (el) {
          const c = data.current;
          const feels = c.apparent_temperature != null ? Math.round(c.apparent_temperature) : null;
          let info = Math.round(c.temperature_2m) + '\u00b0F';
          if (feels != null && Math.abs(feels - Math.round(c.temperature_2m)) >= 3)
            info += ' (feels ' + feels + '\u00b0)';
          if (c.wind_speed_10m) info += ', wind ' + Math.round(c.wind_speed_10m) + ' mph';
          // Heat warning for the dog
          if (feels != null && feels >= 90) {
            info = '\u26a0\ufe0f ' + info + ' — LIMIT WORK';
            el.style.color = '#A32E1E';
          } else if (feels != null && feels >= 80) {
            info = info + ' — shorter sessions';
            el.style.color = '#B8860B';
          } else {
            el.style.color = '#2F4A32';
          }
          el.textContent = info;
        }
        render();
      }
    })
    .catch(() => {}); // fail silently — manual entry is always there
}

// Also fetch weather when location is tapped manually (if we know coords)
function weatherForSite(label) {
  const site = SITES.find(s => s.label === label);
  if (site) fetchSessionWeather(site.lat, site.lon);
  else if (lastGeoFix) fetchSessionWeather(lastGeoFix.coords.latitude, lastGeoFix.coords.longitude);
}

function getActiveDog() {
  const name = localStorage.getItem(ACTIVE_DOG_KEY);
  const dogs = getDogs();
  if (name && dogs.find(d => d.name === name)) return name;
  if (dogs.length) { localStorage.setItem(ACTIVE_DOG_KEY, dogs[0].name); return dogs[0].name; }
  const seed = [{ name: 'Reba', breed: 'Golden Retriever' }];
  localStorage.setItem(DOG_KEY, JSON.stringify(seed)); /* don't call saveDogs to avoid Firestore write of seed data */
  localStorage.setItem(ACTIVE_DOG_KEY, 'Reba');
  return 'Reba';
}
function setActiveDog(name) { localStorage.setItem(ACTIVE_DOG_KEY, name); }
function getHandler() { return localStorage.getItem(HANDLER_KEY) || 'jason'; }
function setHandler(name) { localStorage.setItem(HANDLER_KEY, name); }
/* restore dog list from Firestore if localStorage only has the default seed */
function syncDogList() {
  const existing = getDogs();
  if (existing.length > 1) return; /* already have custom dogs locally */
  fsReadAll('dog_list').then(docs => {
    if (!docs.length) return;
    /* find the doc with the most dogs (latest save) */
    let best = null;
    for (const d of docs) {
      if (d.dogs && Array.isArray(d.dogs) && (!best || d.dogs.length > best.dogs.length)) best = d;
    }
    if (best && best.dogs.length > existing.length) {
      localStorage.setItem(DOG_KEY, JSON.stringify(best.dogs));
      renderHome();
    }
  }).catch(e => console.warn('Dog list sync skipped:', e));
}

/* restore photos from Firestore if localStorage is empty (reinstall) */
function syncDogPhotos() {
  const existing = getDogPhotos();
  if (Object.keys(existing).length > 0) return; /* already have photos locally */
  fsReadAll('dog_photos').then(docs => {
    if (!docs.length) return;
    const photos = {};
    /* keep the newest photo per dog (latest created_at) */
    for (const d of docs) {
      const name = (d.dog || '').toLowerCase();
      if (!name || !d.photo) continue;
      photos[name.charAt(0).toUpperCase() + name.slice(1)] = d.photo;

    if (Object.keys(photos).length) {
      localStorage.setItem(DOG_PHOTO_KEY, JSON.stringify(photos));
      renderHome();
      renderHub();
    }
  }).catch(e => console.warn('Photo sync skipped:', e));
}

/* ── Photo cropper: drag to position, pinch to zoom ──────────────────────── */
function showPhotoCropper(dogName, dataUrl) {
  const img = new Image();
  img.onload = function() {
    let scale = 1, ox = 0, oy = 0;
    const viewSize = 260;
    // Initial: fit image so shorter side = viewSize
    const fitScale = viewSize / Math.min(img.width, img.height);
    scale = fitScale;

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;';

    const cropArea = document.createElement('div');
    cropArea.style.cssText = `width:${viewSize}px;height:${viewSize}px;border-radius:50%;overflow:hidden;position:relative;border:3px solid #fff;touch-action:none;`;

    const photo = document.createElement('img');
    photo.src = dataUrl;
    photo.style.cssText = 'position:absolute;transform-origin:0 0;pointer-events:none;';
    function updatePhoto() {
      photo.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
    }
    updatePhoto();
    cropArea.appendChild(photo);

    // Drag to position
    let dragging = false, lastX = 0, lastY = 0;
    let lastDist = 0;
    cropArea.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        dragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        dragging = false;
        lastDist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX,
                              e.touches[1].clientY - e.touches[0].clientY);
      }
      e.preventDefault();
    }, {passive: false});
    cropArea.addEventListener('touchmove', function(e) {
      if (e.touches.length === 1 && dragging) {
        ox += e.touches[0].clientX - lastX;
        oy += e.touches[0].clientY - lastY;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        updatePhoto();
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX,
                                e.touches[1].clientY - e.touches[0].clientY);
        if (lastDist > 0) {
          const delta = dist / lastDist;
          scale *= delta;
          scale = Math.max(fitScale * 0.5, Math.min(fitScale * 5, scale));
          updatePhoto();
        }
        lastDist = dist;
      }
      e.preventDefault();
    }, {passive: false});

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:16px;margin-top:24px;';

    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    cancelBtn.style.cssText = 'padding:12px 28px;border:2px solid #fff;background:none;color:#fff;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;';
    cancelBtn.onclick = () => overlay.remove();

    const saveBtn = document.createElement('button');
    saveBtn.textContent = 'Save';
    saveBtn.style.cssText = 'padding:12px 28px;border:none;background:var(--accent);color:#fff;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;';
    saveBtn.onclick = function() {
      const canvas = document.createElement('canvas');
      canvas.width = 120; canvas.height = 120;
      const ctx = canvas.getContext('2d');
      const outScale = 120 / viewSize;
      ctx.drawImage(img, -ox / scale, -oy / scale, viewSize / scale, viewSize / scale, 0, 0, 120, 120);
      setDogPhoto(dogName, canvas.toDataURL('image/jpeg', 0.85));
      overlay.remove();
      renderHub();
      renderHome();
    };

    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(saveBtn);

    const hint = document.createElement('div');
    hint.textContent = 'Drag to position \u00b7 Pinch to zoom';
    hint.style.cssText = 'color:rgba(255,255,255,.6);font-size:13px;margin-top:12px;';

    overlay.appendChild(cropArea);
    overlay.appendChild(btnRow);
    overlay.appendChild(hint);
    document.body.appendChild(overlay);
  };
  img.src = dataUrl;
}

/* ------------------------------ GLOSSARY -------------------------------- */
function renderText(text) {
  if (!text) return '';
  const TOKEN = /\{(term|ref|learn):([^}]+)\}/g;
  let result = '';
  let last = 0;
  let m;
  while ((m = TOKEN.exec(text)) !== null) {
    // escape plain segment before this token
    result += esc(text.slice(last, m.index));
    last = m.index + m[0].length;
    const type = m[1];
    const val  = m[2];
    if (type === 'term') {
      const entry = DECK.glossary && DECK.glossary[val];
      const display = entry ? entry.term : val;
      result += `<span class="gterm" data-gkey="${esc(val)}">${esc(display)}</span>`;
    } else if (type === 'learn') {
      const art = DECK.learn && DECK.learn[val];
      const display = art ? art.title : val;
      result += `<span class="learn-aref" data-article="${esc(val)}">${esc(display)}</span>`;
    } else {
      // {ref:id} or {ref:trackid|track} or {ref:id|full}
      const pipeIdx = val.indexOf('|');
      if (pipeIdx !== -1) {
        const trackId = val.slice(0, pipeIdx);
        const mode    = val.slice(pipeIdx + 1);
        if (mode === 'track') {
          // find any card whose id starts with trackId + "."
          const tc = DECK.cards.find(x => x.id && x.id.startsWith(trackId + '.'));
          const label = tc ? tc.trackName : trackId;
          result += `<span class="gref" data-track="${esc(trackId)}">${esc(label)}</span>`;
        } else {
          // {ref:id|full} — link to specific card
          const fc = DECK.cards.find(x => x.id === trackId);
          const label = fc ? fc.code : trackId;
          result += `<span class="gref" data-ref="${esc(trackId)}">${esc(label)}</span>`;
        }
      } else {
        // plain {ref:id}
        const fc = DECK.cards.find(x => x.id === val);
        const label = fc ? fc.code : val;
        result += `<span class="gref" data-ref="${esc(val)}">${esc(label)}</span>`;
      }
    }
  }
  result += esc(text.slice(last));
  return result;
}

function showGlossary(key) {
  const old = document.getElementById('gloss-overlay');
  if (old) old.remove();
  const entry = DECK.glossary && DECK.glossary[key];
  if (!entry) return;

  const overlay = document.createElement('div');
  overlay.className = 'gloss-overlay';
  overlay.id = 'gloss-overlay';
  overlay.onclick = () => overlay.remove();

  let seeAlso = '';
  if (entry.see_also && entry.see_also.length) {
    seeAlso = `<div class="gloss-also">
      <div class="gloss-also-lbl">SEE ALSO</div>
      ${entry.see_also.map(k => {
        const e2 = DECK.glossary && DECK.glossary[k];
        const lbl = e2 ? e2.term : k;
        return `<button class="gloss-see" data-gkey="${esc(k)}">${esc(lbl)}</button>`;
      }).join('')}
    </div>`;
  }

  const box = document.createElement('div');
  box.className = 'gloss-box';
  box.onclick = e => e.stopPropagation();
  box.innerHTML = `<div class="gloss-tname">${esc(entry.term)}</div>
    <div class="gloss-short">${esc(entry.short)}</div>
    <div class="gloss-full">${esc((entry.full || '').trim())}</div>
    ${seeAlso}`;

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  // Wire see-also buttons after DOM insertion — can't use document-level
  // delegation because box.onclick calls stopPropagation().
  box.querySelectorAll('.gloss-see').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      haptic();
      showGlossary(btn.dataset.gkey);
    });
  });
}

/* ── Body text: collapse YAML line wraps, keep paragraph breaks ────────── */
function renderBodyText(text) {
  if (!text) return '';
  return text.split(/\n\n+/).map(function(para) {
    return renderText(para.replace(/\n/g, ' '));
  }).join('<br><br>');
}

  /* Restore standard tab bar when showing the card list — but only if cards is the active tab,
     otherwise render() calling all renderers would overwrite the tab bar for other tabs */

    h += `<button class="chip ${state.trackFilter===t.tag?'on':''}" style="${state.trackFilter===t.tag?'background:'+t.color:''}" onclick="haptic();state.trackFilter='${t.tag}';render()">${t.tag}</button>`;
  h += '</div>';
  for(const c of DECK.cards){
    if(state.trackFilter && c.track!==state.trackFilter) continue;
    const ty = c.type==='stage'?'':(c.type==='gate'?'GATE':(c.type==='reference'?'REF':'TRACK'));
    h += `<div class="cardrow" onclick="state.prevTab=null;state.openCard='${c.code}';render()">
      <div class="stripe" style="background:${c.type==='gate'?'var(--alert)':c.color}"></div>
      <div class="code">${c.code}</div><div class="ti">${esc(c.title)}</div><div class="ty">${ty}</div></div>`;
  }
  v.innerHTML = h;
}
function cardDetail(c){
  const accent = c.type==='gate' ? 'var(--alert)' : c.color;
  const list = DECK.cards.filter(x => !state.trackFilter || x.track===state.trackFilter);
  const i = list.findIndex(x => x.code===c.code);
  const prev = i > 0 ? list[i-1] : null;
  const next = i < list.length-1 ? list[i+1] : null;
  const cs = (DECK.state && DECK.state.cards) ? DECK.state.cards[c.code] : null;

  /* Update the tab bar to show card-level navigation.
     Back goes to where you came from — if opened from Tracks, back goes to Tracks. */
  const backAction = state.prevTab && state.prevTab !== 'cards'
    ? `state.openCard=null;tab('${state.prevTab}')`
    : `state.openCard=null;render()`;
  const backLabel = state.prevTab && state.prevTab !== 'cards'
    ? ({week:'Week',tracks:'Tracks',log:'Log'}[state.prevTab] || 'Back')
    : 'Cards';
  const tabBar = document.querySelector('.tab-bar');
  if (tabBar) {
    tabBar.innerHTML = `<button class="tab-back" onclick="haptic();${backAction}" aria-label="Back">&#8249;</button>` +
      (prev ? `<button class="card-step" onclick="haptic();state.openCard='${prev.code}';render()">&#8249; ${prev.code}</button>` : '<span class="card-step-end"></span>') +
      `<span class="tab-title" style="text-align:center">${c.code}</span>` +
      (next ? `<button class="card-step" onclick="haptic();state.openCard='${next.code}';render()">${next.code} &#8250;</button>` : '<span class="card-step-end"></span>');
  }

  let h = '';

  /* ── card header ── */
  h += `<div class="detail ${state.bigType?'big':''}"><div class="head" style="background:${accent}">
        <div class="code">${c.code} · ${esc(c.trackName)}${c.trigger?' · '+esc(c.trigger):''}</div>
        <div class="title">${esc(c.title)}</div>`;
  if (cs) h += `<div style="margin-top:6px">${badge(cs.status)}</div>`;
  h += `</div>`;

  /* ── requires (tappable links) ── */
  if (c.requires && c.requires.length) {
    const blocked = cs && cs.status === 'locked';
    h += `<div class="sec" style="background:${blocked?'#FDF0EE':'#FBF6E9'}">
      <h4>${blocked ? 'BLOCKED BY' : 'REQUIRES'}</h4>`;
    for (const r of c.requires) {
      const rc = DECK.cards.find(x => x.code === r);
      h += `<button class="req-link" onclick="haptic();state.openCard='${esc(r)}';render()">
        <span class="req-code">${esc(r)}</span>
        <span class="req-title">${rc ? esc(rc.title) : ''}</span>
        <span class="req-arrow">&#8250;</span></button>`;
    }
    h += `</div>`;
  }

  if(c.diagram) h += `<div class="sec"><button class="dgmbtn" onclick="openDiagram('${c.diagram}','${c.code}')">VIEW DIAGRAM &nbsp;&#8250;</button></div>`;
  if(c.body) h += `<div class="sec"><div class="txt">${renderBodyText(c.body.trim())}</div></div>`;
  if(c.drill) h += `<div class="sec"><h4>DRILL</h4><div class="txt">${renderBodyText(c.drill.trim())}</div></div>`;
  if(c.pass) h += `<div class="sec"><h4>PASS</h4><div class="txt">${renderBodyText(c.pass.trim())}</div></div>`;

  /* ── checks with progress bars ── */
  if(c.checks.length){
    h += `<div class="sec"><h4>CHECKS</h4>`;
    for(const k of c.checks){
      const ck = cs ? (cs.checks||[]).find(x => x.id === k.id) : null;
      const status = ck ? ck.status : 'not_recorded';
      const banked = status === 'banked' || status === 'banked_assertion';
      const asserted = ck && ck.asserted;
      const needSess = k.sessions || 1;
      const haveSess = ck ? (ck.banked_sessions || 0) : 0;
      const pct = banked ? 100 : (needSess > 0 ? Math.min(100, Math.round(haveSess / needSess * 100)) : 0);
      const statusLabel = banked ? (asserted ? '✓*' : '✓') : `${haveSess}/${needSess}`;
      h += `<div class="check-item">
        <div class="check-top">
          <span class="check-id">${esc(k.id)}</span>
          <span class="check-ratio">${k.hits}/${k.of}${needSess>1?' × '+needSess+'s':''}</span>
          <span class="${banked?'check-done':'check-pct'}">${statusLabel}</span>
        </div>
        <div class="check-label">${esc(k.label)}</div>
        ${asserted ? `<div class="check-assert">Banked on your word — no counted sessions</div>` : ''}
        <div class="check-progress"><div class="check-fill" style="width:${pct}%;${banked?'background:var(--accent)':''}"></div></div>
      </div>`;
    }
    h += `</div>`;
  }

  /* ── if/then ── */
  if(c.ifthen.length){
    h += `<div class="sec"><h4>IF / THEN</h4>`;
    for(const r of c.ifthen) h += `<div class="ifrow"><div class="if">${renderText(r[0])}</div><div>${renderText(r[1])}</div></div>`;
    h += `</div>`;
  }

  /* ── equipment / caps / notes ── */
  if(c.session_cap || c.equipment.length || c.blocked_note){
    h += `<div class="sec">`;
    if(c.equipment.length) h += `<h4>EQUIPMENT</h4><div class="eq-list">${c.equipment.map(e => `<span class="eq-tag">${esc(e)}</span>`).join('')}</div>`;
    if(c.session_cap) h += `<div class="capnote">CAP: ${esc(c.session_cap.note || (c.session_cap.reps+' reps max'))}</div>`;
    if(c.blocked_note) h += `<div class="capnote">${renderText(c.blocked_note)}</div>`;
    h += `</div>`;
  }

  /* ── per-card session history ── */
  const cardOutings = (DECK.sessions||[]).filter(o =>
    (o.cards||[]).some(x => x.card === c.code));
  if(cardOutings.length){
    h += `<div class="sec"><h4>SESSIONS (${cardOutings.length})</h4>`;
    for(const o of cardOutings){
      const oc = o.cards.find(x => x.card === c.code);
      if(!oc) continue;
      h += `<div class="ch-row"><span class="ch-date">${esc(o.date)} ${esc(o.tod||'')}</span>`;
      for(const k of (oc.checks||[])){
        const spec = c.checks.find(s => s.id === k.id);
        const threshold = spec ? spec.hits : null;
        const met = threshold !== null && k.hits >= threshold;
        h += `<span class="sh-score ${met?'sh-pass':'sh-fail'}">${esc(k.id)} ${k.hits}/${k.of}</span>`;
      }
      if(oc.assist && oc.assist !== 'none') h += `<span class="sh-meta">${esc(oc.assist)}</span>`;
      h += `</div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}
