, across\ntwo sessions. Fail on delivery only \u2014 fix it here, do not carry it into Stage 2.\n","body": "","ifthen": [["Drops it at the bank to shake","Back up as the dog lands so it must follow you to deliver. Never reach for it at the water's edge."],["Arcs wide on the return, or parades","Fails this PASS, not just Marks. See {ref:steadiness.ref_parade}."],["Shops the bank for a shallow entry","That is {term:bank_running} starting. See {ref:water.ref_bank} now, not in a year."],["Swims low, thrashes, or tires fast","Stop. Drop to 10 yds and rebuild. A confident swimmer is this track's prerequisite, not its goal."]],"checks": [{"id": "c1","label": "Straight entry at 20 yds","hits": 5,"of": 5,"sessions": 2},{"id": "c2","label": "To hand, no drop or shake first","hits": 5,"of": 5,"sessions": 2}],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WA-2","id": "water.s2","track": "WA","trackName": "Water","color": "#3F5A6B","type": "stage","n": 2,"title": "Entries \u2014 Straight Off the Bank","drill": "Multiple entry types, one at a time: clean bank, then mud, then cover. Wade\neach new entry yourself before the dog's first send off it \u2014 {ref:water.ref_safety}.\nLine the dog square and send. The entry must be straight off the line you gave \u2014\nno scanning for a better spot. Change entry type only when the current one is\nboring.\n\nIf an elevated entry is available (dock, high bank, boat ramp ledge), train it\nseparately \u2014 the height is a different variable from the footing.\n","pass": "5/5 straight entries on each of clean bank, mud, and cover at 25\u201340 yds.\nElevated entry counted separately if available, 5/5.\n","body": "","ifthen": [["Runs the bank before entering","Angle the setup so the bank offers no shortcut; shorten until the dog takes water straight. See {ref:water.ref_bank}."],["Balks at mud or cover","The dog is unsure of the footing, not testing you. Walk in WITH the dog once, then send from 10 yds and rebuild distance."],["Hesitates at an elevated entry","Height, not water. Sit the dog on the edge, throw short, let it choose to go. Never push a dog off a height."]],"checks": [{"id": "c1","label": "Clean bank entry, straight","hits": 5,"of": 5},{"id": "c2","label": "Mud entry, straight","hits": 5,"of": 5},{"id": "c3","label": "Cover entry, straight","hits": 5,"of": 5},{"id": "c4","label": "Elevated entry (if available)","hits": 5,"of": 5}],"session_cap": null,"equipment": [],"requires": ["WA-1"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WA-3","id": "water.s3","track": "WA","trackName": "Water","color": "#3F5A6B","type": "stage","n": 3,"title": "Water Singles with Steadiness","drill": "Parallel to {ref:steadiness|track}, not gated behind it. Rebuild the steadiness\nladder in miniature because water re-opens the break \u2014 the excitement of the\nentry, the splash, and the swimming are all new stimuli that can override a sit\nthe dog holds easily on dry ground. Do not assume land steadiness transfers.\n\nThree rungs: 1. Lead on, foot on the lead, easy 20 yd single, 1\u20132 sec delay.\n2. Stretch the delay, randomized. 3. Launcher fired across the water. Off lead\nonly once the on-lead hold is boring.\n","pass": "1. 10/10 held on lead through the fall at 20 yds. 2. 8/10 through randomized\n8\u201310 sec delays. 3. 8/10 off lead. Two sessions at each rung.\n","body": "","ifthen": [["Steady on land, breaks at the water","Expected. Different picture. Foot on the lead, back to a 1-sec delay, rebuild."],["Whines at the water's edge","Held too long too early. Halve the delay and build back up."],["Loses drive into the water","Pull steadiness for a week, run happy water marks. Water desire costs as much to rebuy as marking desire."]],"checks": [{"id": "r1","label": "On lead, holds through the fall at 20 yds","hits": 10,"of": 10,"sessions": 2},{"id": "r2","label": "Randomized 8-10 sec delay","hits": 8,"of": 10,"sessions": 2},{"id": "r3","label": "Off lead, steady through fall and delay","hits": 8,"of": 10,"sessions": 2}],"session_cap": null,"equipment": ["lead"],"requires": ["WA-2"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WA-G","id": "water.gate","track": "WA","trackName": "Water","color": "#3F5A6B","type": "gate","n": null,"title": "GATE \u2014 Force to Water","drill": "","pass": "","body": "Do not run Stages 4\u20137 until all three are true: land force to pile is complete,\nStages 1\u20133 have passed, and the dog is a happy, confident swimmer under no\npressure at all.\n\nBeyond that, each late stage carries its own dependency. Swim-by additionally\nrequires {ref:whistle.s6}. Water T requires {ref:whistle.s8}. Water blinds require\n{ref:whistle.s7} and {ref:lining.s6}.\n\nIntroducing force to water too early creates a water-shy dog, and water shyness\nis the hardest thing on this list to undo. A dog that will not enter water is\nnot a duck dog.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WA-4","id": "water.s4","track": "WA","trackName": "Water","color": "#3F5A6B","type": "stage","n": 4,"title": "Force to Water","drill": "Force to water is the e-collar overlay on the water entry command \u2014 the same\nconcept as force to pile on land. The dog already enters water happily and\nalready knows the entry command. The collar reinforces that command, it does not\nteach it.\n\nShort, straight, shallow entries first \u2014 the dog must be able to walk out, not\nswim. Pressure only on a refusal to enter, never on a slow return. Start at the\nlowest e-collar level the dog acknowledges. Never end a session on a pressure rep.\n\nWater temperature matters: force to water in cold water is a double aversive \u2014\ncollar pressure plus uncomfortable water. Run early force-to-water sessions in\nwarm or moderate water (above 60\u00b0F). Cold-water force work comes later, after\nthe dog enters willingly under pressure in comfortable conditions.\n","pass": "10/10 immediate entries on command at three distances with the collar on, two\nconsecutive sessions. Then 10/10 with the collar off.\n","body": "","ifthen": [["Turns away, sniffs, freezes","Avoidance. Level too high or picture too hard. Stop and run happy water marks for a week."],["Enters well, returns slowly","Not a force problem. Never add pressure to a return. Shorten the retrieve instead."],["Sharp with the collar, sloppy without","Collar-wise. Vary which sessions the dog wears it, and put it on for non-training days."]],"checks": [{"id": "c1","label": "Immediate entry on command, collar on","hits": 10,"of": 10,"sessions": 2},{"id": "c2","label": "Same with the collar off","hits": 10,"of": 10,"sessions": 2}],"session_cap": null,"equipment": [],"requires": ["WA-3"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WA-5","id": "water.s5","track": "WA","trackName": "Water","color": "#3F5A6B","type": "stage","n": 5,"title": "Swim-By","drill": "Casting transfers from land to water. The setup needs a piece of land that\nsticks out into the water \u2014 a point, a peninsula, or a narrow strip of bank.\nThe dog starts on one side and the pile is on the other side. The straight line\nto the pile goes through open water, swimming past the tip of the land. The\ncheating route is to climb out onto the land, run across it on dry ground, and\nre-enter the water on the other side. Dogs naturally take the dry route because\nswimming is harder than running \u2014 this drill teaches the dog to hold a water\nline even when land is available.\n\nNote: the whistle sit in open water means the dog stops forward progress\nand treads in place, facing you. The dog cannot literally sit in deep water \u2014\ntreading while stationary is the water version of the sit.\n\nWhistle sit in open water first \u2014 confirm the dog will stop and tread while\nswimming. Then back, then overs one side at a time. The cast must be taken in\nthe water \u2014 the moment the dog touches land the rep is over and does not count.\nTeach back first, same as on land.\n\nCap swim-by sessions at 8-10 reps. Swimming is physically expensive, and\na tired dog cheats to land because it is exhausted, not because it is\ndisobedient. See {ref:water.ref_safety} for water intoxication signs.\n","pass": "9/10 whistle sit held in open water. 8/10 each on back, left over, and right\nover, taken without touching land. Two sessions.\n","body": "","ifthen": [["Cheats to land on the cast","Move the setup so land is not a shortcut. Shorten until the dog wins. See {ref:water.ref_bank}."],["Will not sit in water","Back to {ref:whistle.s4} on land. Open water is not where you teach a sit."],["Pops mid-swim","Over-handled. Run several water lines with no whistle at all before returning."]],"checks": [{"id": "c1","label": "Whistle sit held in open water","hits": 9,"of": 10},{"id": "c2","label": "Back, taken in water","hits": 8,"of": 10,"sessions": 2},{"id": "c3","label": "Left over, taken in water","hits": 8,"of": 10,"sessions": 2},{"id": "c4","label": "Right over, taken in water","hits": 8,"of": 10,"sessions": 2}],"session_cap": null,"equipment": [],"requires": ["WA-4","WH-6"],"trigger": null,"blocked_note": null,"diagram": "wa-5"},{"code": "WA-6","id": "water.s6","track": "WA","trackName": "Water","color": "#3F5A6B","type": "stage","n": 6,"title": "Water T","drill": "The Single T pattern from {ref:whistle.s8} moved onto water. Back pile across the\npond, two side piles in the shallows or on the far bank. Whistle-sit the dog\nmid-swim and cast. Everything the dog learned on land now happens in water, a\nmedium that requires real physical effort \u2014 the dog must stop swimming, tread\nwater on the sit, and then drive in a new direction on the cast. Cut the rep\ncount compared to land \u2014 water T is physically expensive. Cap at 6\nreps per session. See {ref:water.ref_safety} for water intoxication signs.\n","pass": "8/10 pattern runs with a clean mid-swim stop and any of three casts taken, across\ntwo sessions.\n","body": "","ifthen": [["Slows mid-swim anticipating the stop","Run several reps with no whistle at all until the swim is honest again."],["Veers toward the near bank","Suction. Re-run the straight back line alone until it is a highway."],["Tires fast","Water T is physically expensive. Cut the rep count, never the standard. See {ref:water.ref_safety}."]],"checks": [{"id": "c1","label": "Mid-swim stop plus three casts clean","hits": 8,"of": 10,"sessions": 2}],"session_cap": null,"equipment": [],"requires": ["WA-5","WH-8"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WA-7","id": "water.s7","track": "WA","trackName": "Water","color": "#3F5A6B","type": "stage","n": 7,"title": "Water Blinds & Cheating Singles","drill": "The hunt-day picture. A blind across water the dog has not seen planted, and\ncheating singles \u2014 marks deliberately set so the bank route looks shorter or\neasier than swimming the straight line. The dog must take the water line on the\nhandler's send even when dry ground is the obvious shortcut.\n\nThis is where every water skill converges: entry, steadiness, casting, and the\ntrust built in force to water. You pick up the diversion yourself \u2014 the dog\nis never rewarded for the cheat.\n","pass": "3/4 water blinds at 50\u201370 yds with one handle or fewer, and 4/5 cheating singles\ntaken straight through the water.\n","body": "","ifthen": [["Takes the bank route","Shorten the blind, increase the angle so the bank costs more than it saves. See {ref:water.ref_bank}."],["Handles well but slows down","Reduce reps. Water blinds are expensive. End early and end on a win."],["No-go on the send","The dog does not believe anything is out there. Show the plant for a few reps to rebuild confidence, then go back to planting out of sight."]],"checks": [{"id": "c1","label": "Water blind 50-70 yds, one handle or fewer","hits": 3,"of": 4},{"id": "c2","label": "Cheating single taken through the water","hits": 4,"of": 5}],"session_cap": null,"equipment": [],"requires": ["WA-6","LN-6","WH-7"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WA-R1","id": "water.ref_bank","track": "WA","trackName": "Water","color": "#3F5A6B","type": "reference","n": null,"title": "Bank Running \u2014 Kill It Early","drill": "","pass": "","body": "Bank running is the dog choosing the dry route. Every time it works it is\nreinforced by success \u2014 the dog still got the bumper.\n\nIt is not disobedience. It is efficiency, and the dog is right. Your job is to\nmake the straight line the easier one, not to punish the dog for taking the\neasier path.\n\nFixes: angle the setup so the bank offers no shortcut \u00b7 shorten until the dog\ntakes water straight \u00b7 use a channel or cove where dry land is not adjacent to\nthe line \u00b7 stop the rep the moment the dog climbs out, so a cheat never finishes.\n\nCatch it in {ref:water.s1}. A bank runner that has been doing it for years is a\nrebuild, not a fix.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "failure","blocked_note": null,"diagram": null},{"code": "WA-R2","id": "water.ref_safety","track": "WA","trackName": "Water","color": "#3F5A6B","type": "reference","n": null,"title": "Water Safety \u2014 Entry, Heat, Gulping","drill": "","pass": "","body": "Submerged obstructions. Wade every entry before the dog's first send off it, and\nagain after high water. A limb a swimming dog never touches sits at chest height\nfor a dog launching off a bank at speed. Entries move with water level \u2014 pin\neach to a fixed object on the bank, not to the waterline.\n\nWater intoxication. Gulping while retrieving can dilute blood sodium enough to\nswell brain cells. Onset is fast \u2014 hours. Signs: vomiting, staggering, lethargy,\nglazed eyes, dilated pupils, drooling, bloating; seizures or collapse when\nsevere. This is a veterinary emergency. Smaller dogs are at higher risk.\n\nPrevention: frequent breaks, a hard cap on continuous reps, and stop the session\nif the dog gulps on the swim.\n\nHeat: warm water will not cool a working dog. Watch for overheating in the water,\nnot just on the bank. Ears: dry them after every session.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "HU-T","id": "hunt.title","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "title","n": null,"title": "Blind & Hunt Day","drill": "","pass": "","body": "This track teaches the dog to generalize skills learned on the other tracks to\nreal hunting environments \u2014 blinds, decoy spreads, boats, low light, and cold\nweather. Most of it is environmental conditioning, not new skill, so it runs\nalongside anything in the program.\n\nTwo things here are not conditioning and will hurt the dog if run early: a gun\nfired inside a box the dog cannot leave ({ref:hunt.gate}), and a send made while\na gun is still up ({ref:hunt.ref_order}). Both have their own cards. Read them first.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "HU-1","id": "hunt.s1","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "stage","n": 1,"title": "Blind and Layout Manners","drill": "A blind (or pit, or layout) is the structure you hunt from \u2014 a box the dog sits\nin beside you, sometimes for hours, while you call, watch, and shoot. This stage\nconditions the dog to settle in that environment without the excitement of birds.\n\nStart with an elevated platform or dog stand. Load the dog on command, then be a\nhunter around it: sit, stand, shoulder an unloaded gun, move the {term:blind_bag}, work\nthe call. The dog does not move. NEVER run a correction on the stand \u2014 the dog\nshould load voluntarily because the stand is a positive place, and that\nassociation is bought once and lost once.\n","pass": "Settles inside 30 sec and holds 10 min \u2014 no whine, no exit, no second\ncommand \u2014 3 sessions. Then 5/5 holds through you standing and shouldering\nan unloaded gun.\n","body": "","ifthen": [["Breaks the stand to follow you","Shorten to 2 min and rebuild. Walk back and re-place the dog \u2014 never call it off and never correct on it."],["Whines but stays","Duration ran ahead. Halve it, pay the quiet, build again. A whining dog in a blind is a dog nobody invites twice."],["Winds up when you work the call","The call has become a bird cue. See {ref:hunt.ref_call} before another rep."]],"checks": [{"id": "c1","label": "Settles inside 30 sec, holds 10 min, one command","hits": 1,"of": 1,"sessions": 3},{"id": "c2","label": "Holds through the handler standing and shouldering an unloaded gun","hits": 5,"of": 5}],"session_cap": null,"equipment": ["invisilab","unloaded_gun","blind_bag","duck_call"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "HU-2","id": "hunt.s2","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "stage","n": 2,"title": "Decoys \u2014 Through and Around","drill": "On land, most dogs learn to ignore decoys quickly \u2014 they look interesting but\ndo nothing, and the bumper is the obvious reward. Throw a bumper past a 6-decoy\nspread at 20 yds; the dog goes THROUGH, out and back, not around. If the dog\nalready ignores decoys on land, this is a confirmation, not a teaching step.\n\nWater is the real challenge and is gated behind {ref:water.s1} and {ref:water.s2}:\na floating decoy sits at the dog's eye level, rides the chop, and sits on a line\nthe dog can tangle in. The dog cannot step around it the way it can on land \u2014 it must\nswim through the spread without mouthing, investigating, or diverting from the\nline.\n","pass": "Land 5/5 through a 6-decoy spread at 20 yds, no mouthing, no investigating,\n1 session. Water 5/5 through a 12-decoy spread, no mouthing, no diverting,\nno fouled line, 2 sessions. A head turn is a pass; a changed line is not.\n","body": "","ifthen": [["Picks a decoy up","Stop the rep, take it, no correction. Shorten so the bumper is the obvious answer, then rebuild the spread."],["Swims around the spread, not through","That is bank running in a different coat. See {ref:water.ref_bank}."],["Refuses to enter through decoys","Open a lane, send through it, close the lane over sessions. Never push the dog into a spread."]],"checks": [{"id": "c1","label": "LAND \u2014 5/5 through a 6-decoy spread at 20 yds","hits": 5,"of": 5},{"id": "c2","label": "WATER \u2014 5/5 through a 12-decoy spread, nothing fouled","hits": 5,"of": 5,"sessions": 2,"requires": ["WA-1","WA-2"]}],"session_cap": null,"equipment": ["decoys","bumpers"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "HU-3","id": "hunt.s3","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "stage","n": 3,"title": "Gunfire from the Blind","drill": "Read {ref:hunt.gate} first. Gunfire inside a blind is a different event from\ngunfire on open ground \u2014 the enclosed space amplifies the sound, reflects it\nback at the dog, and the dog has no room to move away from it. This is why\n{ref:steadiness.s4} (steady through the gun on open ground) is the gate, not a\nsuggestion.\n\nGunfire starts OUTSIDE the blind at distance and moves closer over sessions \u2014\nnever fire the first shot of a day from inside. Shot, then a mark. Six shots\nfrom inside the blind per session, maximum.\n","pass": "8/10 steady in the stand through a shot fired from inside, followed by a\nmark, 2 sessions.\n","body": "","ifthen": [["Flinches or checks out at the report","STOP. Gun back outside and out to distance, happy retrieves only, rebuild over weeks. Do not push through."],["Breaks off the stand on the shot","Steadiness, not noise. Back to {ref:steadiness.s4} on open ground; the box makes a break worse, not better."],["Fine outside, tense inside","The box is the variable. Same shot, stand door open, then closed. One axis."]],"checks": [{"id": "c1","label": "Steady in the stand, shot from inside, then a mark","hits": 8,"of": 10,"sessions": 2}],"session_cap": {"reps": 6,"applies_to": "shots fired from inside","note": "Six shots from inside the stand a session, maximum."},"equipment": ["invisilab","poppers_12ga","bumpers"],"requires": ["MK-4","HU-1"],"trigger": null,"blocked_note": "Needs MK-4. Read the Gate card before the first rep.","diagram": null},{"code": "HU-4","id": "hunt.s4","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "stage","n": 4,"title": "Boat and Stand Work","drill": "Many hunts happen from a boat \u2014 the dog must load, hold position, and unload on\ncommand in an unstable environment. Start tied off at the bank, engine off,\nbefore anything moves. Load on command, sit, unload on command \u2014 the gunwale (the top edge of the boat's side) is\na height problem, the same as an elevated entry in {ref:water.s2}. Then hold\nposition while YOU rock the boat from inside. Never lift the dog in and never\npush it out.\n","pass": "5/5 load and unload on command from a stationary boat. Holds position 10 min\nwith the boat rocking, 2 sessions.\n","body": "","ifthen": [["Will not load","Height, not water. Lower the step: bank first, then a stable boat edge. Let the dog choose to go."],["Scrambles when it rocks","Footing. Mat the deck and rock it less. Rebuild the amplitude, not the dog's tolerance for slipping."],["Jumps out on the mark","Steadiness in a new picture. Lead on, back to a 1-sec delay, rebuild in the boat."]],"checks": [{"id": "c1","label": "Loads and unloads on command, boat stationary","hits": 5,"of": 5},{"id": "c2","label": "Holds position 10 min with the boat rocking","hits": 1,"of": 1,"sessions": 2}],"session_cap": null,"equipment": ["boat","invisilab","lead"],"requires": ["HU-1"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "HU-5","id": "hunt.s5","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "stage","n": 5,"title": "Honoring and Multiple Dogs","drill": "Honoring means the dog holds steady while another dog works \u2014 one of the\nhardest steadiness tests because the dog is watching everything it wants to do\nbeing done by someone else.\n\nAnother dog is sent; your dog holds. On lead for the first sessions \u2014 the lead\nis the drill, not a crutch, and it is what makes the break impossible while the\nrule is being learned. Your dog's turn comes second at first, so holding pays.\n","pass": "Honors another dog's retrieve 5/5 \u2014 no break, no whining, no creeping off\nthe stand \u2014 2 sessions.\n","body": "","ifthen": [["Breaks when the other dog is sent","Lead under your foot and shorten the other dog's retrieve. Prevent it; do not correct it."],["Whines while honoring","The dog is held past what it can hold. Send your dog first for a few reps, then alternate."],["Fine on lead, breaks off it","The dog was holding the lead. Same wean as {ref:steadiness.s4} \u2014 tab on, stay close."]],"checks": [{"id": "c1","label": "Honors another dog's retrieve, no break, no whining","hits": 5,"of": 5,"sessions": 2}],"session_cap": null,"equipment": ["lead","invisilab"],"requires": ["MK-7"],"trigger": null,"blocked_note": "This stage needs a SECOND DOG and a helper. There is no solo version.","diagram": null},{"code": "HU-6","id": "hunt.s6","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "stage","n": 6,"title": "Low Light, Real Cover, Cold","drill": "Not a new skill \u2014 a re-validation, which is exactly why it gets skipped. Take\nnumbers the dog has already passed and re-meet them in the conditions a hunt\nactually happens in: legal shooting light, 30 minutes before sunrise, and\nstanding cover. A dog that is solid at noon on a mowed field has not proven it\ncan do the same thing in the dark in heavy cover.\n\nThe full blind structure goes up here \u2014 {ref:hunt.s1} used a bare platform and\nthe blind is the new variable, added alone.\n\nNo gunfire on this card. Gunfire in the blind is {ref:hunt.s3}'s job. This\ncard tests the environment \u2014 low light, cover, cold \u2014 not the gun.\n\nCold weather safety: a dog working in cold water before sunrise is at real\nrisk. Watch for shivering that does not stop within 2 minutes of exiting\nthe water, lethargy, stumbling, or a tucked posture. If water temperature\nis below 45\u00b0F, limit water retrieves to 3-4 per session and dry the dog\nbetween retrieves. Wind chill amplifies the risk \u2014 a wet dog in wind loses\nheat fast. A neoprene vest helps but does not eliminate the risk.\n","pass": "Re-meet {ref:hunt.s1}'s 10 min hold and {ref:hunt.s2}'s land 5/5, at shooting\nlight and in standing cover, 2 sessions each.\n","body": "","ifthen": [["Numbers drop in the dark","Expected, and it is the point. Drop the distance, not the standard, and rebuild in the low light."],["Settles on the bare stand, not in the blind","The blind is the variable. Sides down one at a time, roof last."],["Hunts short in standing cover","Cover eats a mark. Shorten until the dog wins, then stretch \u2014 this is {ref:steadiness.s5}'s rule, borrowed."]],"checks": [{"id": "c1","label": "HU-1's 10 min hold re-met at shooting light, in the blind","hits": 1,"of": 1,"sessions": 2},{"id": "c2","label": "HU-2's land 5/5 re-met in standing cover, low light","hits": 5,"of": 5,"sessions": 2}],"session_cap": null,"equipment": ["invisilab","mock_blind","decoys","bumpers"],"requires": ["HU-1","HU-2"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "HU-7","id": "hunt.s7","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "stage","n": 7,"title": "Simulated Hunts \u2014 The Whole Picture","drill": "Everything at once, and nothing new. Blind, spread, calls, a shot, land and\nwater falls, retrieve order, guns down before any send. Run it like a hunt,\nnot like a training session: no coaching, no re-cast, no second try.\n\nThe purpose is diagnostic, not teaching. What breaks here tells you which card\nto go back to \u2014 it is not a thing you fix on the day.\n","pass": "2 consecutive simulated hunts with zero breaks, zero unplanned handles on\nmarks (handles on blinds are expected and do not count against the pass),\nand correct retrieve order throughout.\n","body": "","ifthen": [["One thing breaks every time","Good \u2014 that is the card. Go back to it and stop running simulations until it holds."],["Everything is loose at once","Too much at once too soon. Drop back to HU-6 and add one element per session."],["Handles well but has stopped enjoying it","See {ref:steadiness.ref_suppression}. A finished dog that does not want to go is not finished."]],"checks": [{"id": "c1","label": "Simulated hunt \u2014 no break, no unplanned handle on marks, correct order","hits": 2,"of": 2}],"session_cap": null,"equipment": [],"requires": ["HU-1","HU-2","HU-3","HU-4","HU-5","HU-6","MK-4","WA-3"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "HU-G","id": "hunt.gate","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "gate","n": null,"title": "GATE \u2014 Gunfire from the Blind","drill": "","pass": "","body": "Do not run {ref:hunt.s3} until {ref:steadiness.s4} has banked: off lead,\nsteady through fall, delay and gun, on open ground.\n\nOn open ground the dog can move away from the report. In a blind it cannot \u2014\nit is close range, over the dog's head, in a box that reflects the sound back.\nThat is a different event, and the dog meets it with no exit.\n\n{ref:steadiness.s3}'s own IF row reads \"Stop. Do not push through. Rebuild over\nweeks.\" A flinch at the report costs weeks and it is the one fault on this track\nthat gets harder to fix the longer it runs.\n\nNever fire the first shot of a training day from inside the blind.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "HU-R1","id": "hunt.ref_call","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "reference","n": null,"title": "The Duck Call Is a Stillness Cue","drill": "","pass": "","body": "Read before {ref:hunt.s1}. The duck call is RESERVED for this track. Do not use\nit during marking or steadiness work \u2014 the call must never predict a bird.\n\nProtect it. On hunt day you blow a call with the dog beside you, repeatedly, and\nmost of those calls end in nothing at all. If a call predicts a bird you have\nbuilt a dog that winds up every time you work a flock, which is every few\nminutes, for four hours.\n\nSo condition the opposite, from the first session. Call while the dog is settled\non the stand and NOTHING happens. Pay the stillness, not the sound. Work the\ncall through the dead time between reps, never in the second before a throw.\n\nThe test is simple and it is easy to fail without noticing: if the dog's head\ncomes up on the call, the call has become a cue. Stop throwing anywhere near it\nfor a week and re-pay the stillness.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "HU-R2","id": "hunt.ref_order","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "reference","n": null,"title": "Retrieve Order and Safety","drill": "","pass": "","body": "Read before {ref:hunt.s5} and {ref:hunt.s7}, and before any hunt with other\nguns. The strongest language in the deck, and it is about the people.\n\nNOBODY SENDS UNTIL EVERY GUN IS DOWN AND THE SHOOTING IS OVER. In a party\nof four the send is a social act, not a handler's decision. You send\nbecause the shooting stopped and you said so out loud \u2014 not because you\nsaw a bird fall.\n\nTHE DOG WORKS IN FRONT OF A LINE OF GUNS. Its outbound path crosses lanes\nbelonging to people who are not watching it. Know where the line runs before\nthe dog is on it.\n\nOrder: cripples (wounded birds still moving) first, farthest cripple before the nearest, dead birds\nlast. A bird still swimming is the only reason to break the order, and it\nis decided before the send.\n\nSay the plan out loud before the first flight. A blind is loud and your\nfriends are not reading your mind.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "HU-R3","id": "hunt.ref_test","track": "HU","trackName": "Blind & Hunt Day","color": "#7A5240","type": "reference","n": null,"title": "Hunt Test vs. Hunting","drill": "","pass": "","body": "This deck serves both hunters and handlers training for hunt tests. Where the\ntwo diverge, the handler decides which wins \u2014 the app's AI personalization will\nset this preference at intake.\n\nWhere they do NOT diverge, and it is most of the way: steadiness, marking,\nhonoring, a clean delivery to hand, a stop at distance. HRC (Hunting Retriever Club) runs tests that mirror the hunting picture \u2014 a\nhunting picture, which is why club days are worth going to.\n\nWhat a test buys you that a hunt does not: a scored, dated, third-party read\non a dog you see every day. What it costs: reps spent on polish that a duck\ndoes not check. Spend them knowingly.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "browse","blocked_note": null,"diagram": null}],"glossary": {"angle_back": {"term": "angle back","short": "A cast sending the dog to a pile at 45 degrees between straight back and over.","full": "The arm signal is between vertical (back) and flat (over) \u2014 arm raised at\nroughly 45 degrees. Right arm at 45 degrees sends the dog to the right\nangle-back pile; left arm at 45 degrees to the left. Different from a\nright or left hand back, which sends the dog to the straight-back pile\nwith a controlled spin direction.\n","see_also": ["back","right_hand_back","left_hand_back","over","casting","wagon_wheel"],"tracks": ["WH"]},"back": {"term": "back","short": "A cast sending the dog straight away from the handler.","full": "The handler raises one hand straight overhead. The dog turns and drives\ndirectly away. In baseball, back sends the dog to second base. The hand\nused (right or left) determines spin direction \u2014 see right hand back and\nleft hand back.\n","see_also": ["right_hand_back","left_hand_back","angle_back","casting"],"tracks": ["WH","LN"]},"backing": {"term": "backing","short": "One dog freezing in a point posture when it sees another dog on point.","full": "Also called honoring. The backing dog has not smelled the bird \u2014 it is\nresponding to the visual cue of seeing another dog locked up on point.\nBacking is partially instinctive in well-bred pointing breeds but must be\nproofed under excitement. Not the same as honoring in a duck blind, where\na retriever holds steady while another dog retrieves.\n","see_also": ["honoring"],"tracks": ["BK","PT"]},"bank_running": {"term": "bank running","short": "The dog choosing the dry land route instead of swimming the straight line.","full": "Not disobedience \u2014 it is efficiency. Swimming is harder than running, and\nthe dog is right that the bank is easier. The handler's job is to make\nthe water line the easier path, not to punish the dog for taking the\nshorter route. Catch it early \u2014 a dog that has been bank running for\nyears is a rebuild, not a fix.\n","see_also": ["cheating_single","swim_by"],"tracks": ["WA"]},"baseball": {"term": "baseball","short": "A casting drill with the dog on the pitcher's mound and piles at first, second, and third base.","full": "First base is the right over pile, second base is straight back, third\nbase is left over. Teaches the dog to take direction on the handler's\nhand signal. Back is taught first, then overs one side at a time, then\nmixed. Right and left hand backs and angle backs are added in later stages.\n","see_also": ["casting","back","over","wagon_wheel"],"tracks": ["WH"]},"blind_bag": {"term": "blind bag","short": "A gear bag holding calls, shells, and supplies kept in the hunting blind.","full": "A blind bag is a waterproof gear bag kept inside the hunting blind or\nlayout. It holds duck calls, extra shotgun shells, hand warmers, snacks,\nand other supplies. The dog must learn to ignore it \u2014 the blind bag\nmoving, opening, or rustling should not trigger excitement.\n","see_also": [],"tracks": ["HU"]},"blind": {"term": "blind","short": "A retrieve the dog did not see planted \u2014 or the structure a hunter sits in.","full": "Two meanings depending on context. (1) A blind retrieve: the dog is sent\nto pick up a bumper or bird it did not watch fall. The dog must trust the\nhandler's line and drive to a destination on faith. (2) A duck blind: the\nphysical structure (box, pit, layout) the handler hunts from. Context\nmakes the meaning clear \u2014 \"run a blind\" vs. \"sit in the blind.\"\n","see_also": ["pattern_blind","cold_blind","memory_retrieve"],"tracks": ["LN","HU"]},"bumper": {"term": "bumper","short": "A plastic or canvas training dummy used in place of a bird.","full": "Also called a dummy. Comes in puppy size (smaller, softer) and standard\n(2-inch or 3-inch diameter). Used for all retrieve training before birds\nare introduced, and for most drill work throughout the program. The bumper\nlives in a drawer and appears only for sessions \u2014 a retrieve that is\nalways available stops being worth anything.\n","see_also": [],"tracks": ["PP","MK","LN","WA"]},"capture": {"term": "capture","short": "Marking and rewarding a behavior the dog offers naturally, without luring or shaping it.","full": "You cannot lure a dog into yawning, or into the spontaneous relaxation of\na settle. You can only notice it happening and mark it in the moment.\nCapturing works well for behaviors that already occur naturally. In this\nprogram, settle is taught by capturing \u2014 when the dog visibly relaxes\n(hips roll, eyes soften), mark gently and reward.\n","see_also": ["lure","shaping","mark","settle"],"tracks": ["OB"]},"casting": {"term": "casting","short": "Directing the dog left, right, or back using hand signals.","full": "The handler uses arm position to tell the dog which direction to go. Arm\nflat to the side = over (go that direction). Arm straight overhead = back\n(go directly away). Arm at 45 degrees = angle back. Casts are always\nnamed from the handler's perspective, never the dog's.\n","see_also": ["back","over","angle_back","right_hand_back","baseball"],"tracks": ["WH","LN","WA"]},"check_cord": {"term": "check cord","short": "A long lightweight line (20-50 ft) attached to the dog's collar for training at distance.","full": "Gives the handler the ability to enforce commands at distance without an\ne-collar. The dog experiences freedom but the handler can step on the line\nor pick it up if needed. Used for recall training, early steadiness, and\nright/left hand back work. Not a retractable leash \u2014 a simple rope or\nlightweight line.\n","see_also": ["tab","dragging_line"],"tracks": ["OB","WH","PP"]},"collar_wise": {"term": "collar-wise","short": "A dog that obeys commands only when wearing the e-collar.","full": "A collar-wise dog has learned to distinguish when the collar is on versus\noff, complying only when it feels the collar's presence. This indicates\nthe dog learned to avoid the stimulation rather than understanding the\ncommand. The fix is to vary collar on/off during known-command work so\nthe dog cannot predict.\n","see_also": [],"tracks": ["WH","WA"]},"cheating_single": {"term": "cheating single","short": "A mark deliberately set so the bank route looks easier than swimming the straight line.","full": "Used to test and train the dog's commitment to taking a water line. The\nthrown bumper lands across water, but a strip of bank offers a shortcut.\nThe dog must take the water line on the handler's send even when dry\nground is the obvious shortcut.\n","see_also": ["bank_running","swim_by"],"tracks": ["WA"]},"classical_conditioning": {"term": "classical conditioning","short": "Learning by association \u2014 a neutral stimulus becomes meaningful by being paired with something the dog already responds to.","full": "Pavlov's dogs salivated at a bell because the bell had been paired with\nfood. The same mechanism drives noise conditioning: pair a sound with food\nrepeatedly, and the sound itself becomes a positive signal. Also how the\nduck call becomes a stillness cue \u2014 pair the call with calm waiting, and\nthe call triggers calm. The dog does not choose this response; its nervous\nsystem learns the association automatically.\n","see_also": ["flooding","systematic_desensitization","operant_conditioning"],"tracks": ["PP","HU"]},"cold_blind": {"term": "cold blind","short": "A blind retrieve on ground the dog has never trained on, with no prior knowledge of where the bumper is.","full": "The final skill in the lining progression. Everything before it \u2014 backstop\nlines, memory retrieves, pattern blinds \u2014 builds the dog's confidence and\ntrust that the handler is sending it somewhere real. A cold blind is the\ntest of whether that trust holds on unfamiliar ground.\n","see_also": ["blind","pattern_blind","memory_retrieve"],"tracks": ["LN"]},"diversion": {"term": "diversion","short": "A thrown bumper or bird meant to tempt the dog off its sent line.","full": "The handler throws or plants a visible temptation to one side, then sends\nthe dog on a different line. The dog must ignore the diversion and take\nthe handler's line. On a hunt day, a bird falls and the dog must ignore\nit to run a blind to a different bird \u2014 that is the real-world picture\nthis drill prepares for.\n","see_also": ["blind","cheating_single"],"tracks": ["LN","WA"]},"double": {"term": "double","short": "Two marks thrown in sequence \u2014 the dog retrieves the second throw first, then the first.","full": "The first throw is the memory bird (the one the dog must remember). The\nsecond throw is the go-bird (retrieved first because it is freshest in\nmemory). Retrieve order is always last-down first. The second throw is\nthe biggest break trigger in steadiness training because the dog is\nalready excited from the first fall.\n","see_also": ["memory_bird","go_bird","single"],"tracks": ["MK"]},"dragging_line": {"term": "dragging line","short": "A check cord attached to the collar but trailing on the ground, not held by the handler.","full": "The step between a managed check cord and a tab. The dog feels free but\nthe handler can step on the line if needed. Used during the transition to\noff-lead work \u2014 the dog experiences freedom while the handler retains a\nbackup. Spend weeks in this phase, not days.\n","see_also": ["check_cord","tab"],"tracks": ["OB"]},"engineer_the_win": {"term": "engineer the win","short": "Set the dog up to succeed. If the dog cannot win at the current difficulty, simplify until it can.","full": "The overarching training principle. Every drill should be designed so the\ndog is likely to succeed. If it fails, the difficulty was too high \u2014 drop\nback to a level the dog can win at and build from there. A dog that\npractices failing learns to fail. A dog that practices winning learns the\nbehavior you want.\n","see_also": ["three_ds"],"tracks": []},"extinction_burst": {"term": "extinction burst","short": "A behavior getting dramatically worse before it goes away, when the reward for it is removed.","full": "When a behavior that used to work stops working, the dog escalates \u2014 louder,\nharder, more persistent \u2014 before giving up. Like hitting a vending machine\nthat stopped dispensing. The burst is a sign the approach is working, not\nfailing. If you give in during the burst, you teach the dog that the\nescalated version is the one that works.\n","see_also": [],"tracks": []},"flyer": {"term": "flyer","short": "A live bird released during training \u2014 the dog retrieves after the shot.","full": "A flyer is a live bird (usually a pigeon or duck) that is released from a\nlauncher or thrown by a helper and shot in the air. The dog must remain\nsteady through the flush, shot, and fall before being sent. Flyers add\nunpredictability that bumpers and dead birds cannot replicate.\nClipped-wing flyers have wing feathers trimmed to limit flight distance.\n","see_also": ["steadiness"],"tracks": ["MK","HU"]},"flooding": {"term": "flooding","short": "Forcing exposure to a fear trigger at full intensity. Dangerous \u2014 can create permanent fear responses.","full": "The opposite of systematic desensitization. Instead of gradual, positive\nexposure, the dog is exposed to the full stimulus with no escape. A gun\nfired over an unprepared dog's head is flooding. A puppy thrown into deep\nwater is flooding. The result is usually sensitization (fear gets worse),\nnot habituation. Gun-shyness is almost always the product of flooding.\n","see_also": ["systematic_desensitization","classical_conditioning"],"tracks": ["PP"]},"force_fetch": {"term": "force fetch","short": "Trained retrieve using pressure to teach a reliable hold and delivery to hand.","full": "Also called conditioned retrieve or trained retrieve. Uses ear pinch, toe\nhitch, or e-collar pressure to teach the dog to pick up, hold, and\ndeliver on command \u2014 not as a choice but as a trained response. Requires\nall 42 adult teeth and solid basic obedience. Never started during\nteething, never started before the dog understands the commands being\nasked. The e-collar reinforces a command already learned through force\nfetch \u2014 it does not replace the teaching.\n","see_also": ["hold"],"tracks": ["FO"]},"go_bird": {"term": "go-bird","short": "The last mark thrown in a double or triple \u2014 retrieved first.","full": "In a double, two bumpers are thrown. The go-bird is the second throw \u2014\nthe one the dog retrieves first because it is freshest in memory. The\nfirst throw is the memory bird, retrieved second. Retrieve order is\nalways last-down first.\n","see_also": ["memory_bird","double"],"tracks": ["MK"]},"handle": {"term": "handle","short": "Stopping a dog with a whistle and redirecting it with a hand signal.","full": "Handling is the process of using the whistle sit to stop the dog mid-run\nand giving a directional cast (back, over, angle back) to redirect it\ntoward a bird or bumper it did not see fall. Handling is the core skill\nof blind retrieves.\n","see_also": ["casting","back","over"],"tracks": ["WH","LN","WA","HU"]},"hold": {"term": "hold","short": "The dog keeping a bumper or bird in its mouth until the handler takes it.","full": "Before force fetch, hold is built as a voluntary carrying culture \u2014 the\ndog is rewarded for having things in its mouth and never grabbed from.\nAfter force fetch, hold is a trained command. A reliable hold is what\nproduces a clean delivery to hand instead of a dropped bird at the\nhandler's feet.\n","see_also": ["force_fetch"],"tracks": ["PP","FO"]},"honoring": {"term": "honoring","short": "Holding steady while another dog works.","full": "In waterfowl hunting, honoring means one dog sits quietly while another\ndog retrieves. In upland hunting with pointing breeds, honoring (also\ncalled backing) means freezing in a point posture when seeing another dog\non point. Both require the dog to watch everything it wants to do being\ndone by someone else \u2014 one of the hardest steadiness tests.\n","see_also": ["backing","steadiness"],"tracks": ["HU","MK","BK"]},"left_hand_back": {"term": "left hand back","short": "A back cast given with the left hand raised vertical \u2014 the dog spins over its right shoulder.","full": "Same destination as a regular back (straight back pile / second base),\nbut the left hand raised cues the dog to spin to its right. Used for\ninfluence control \u2014 keeping the dog off hazards, banks, or other dogs'\nlines by controlling which direction it turns. Different from a left\nangle back, which sends the dog to a different destination at 45 degrees.\n","see_also": ["right_hand_back","back","angle_back"],"tracks": ["WH"]},"learned_helplessness": {"term": "learned helplessness","short": "A state where the dog stops trying because it cannot predict, understand, or escape pressure.","full": "When a dog receives pressure it cannot connect to any behavior \u2014 no\naction makes the pressure stop \u2014 it eventually gives up. The dog\nbecomes passive: not calm, not obedient, just shut down. It looks\ncompliant on the surface but has stopped learning entirely. Learned\nhelplessness is caused by unpredictable, uncontrollable aversive\nstimulation \u2014 most commonly an e-collar used before the dog\nunderstands the command being enforced. Recovery is possible but\nslow. Prevention is the reason this program teaches every command\nwith positive reinforcement before any collar pressure is applied.\n","see_also": ["operant_conditioning","classical_conditioning"],"tracks": ["WH"]},"lure": {"term": "lure","short": "Using food or a toy to physically guide the dog into a behavior.","full": "The treat in front of the nose draws the sit. The treat on the floor\ndraws the down. Luring is fast and clear but must be faded quickly \u2014\nwithin a few repetitions \u2014 by hiding the food in a closed fist, then\nan empty hand, then transitioning to a pure hand signal. A dog trained\nonly with visible food has learned to follow food, not to respond to a\ncommand.\n","see_also": ["shaping","capture","mark"],"tracks": ["OB"]},"mark": {"term": "mark","short": "A precise signal ('yes' or a clicker) that tells the dog 'that exact thing you just did earned a reward.'","full": "The marker bridges the gap between the behavior and the delivery of the\nreward. Without a marker, the dog must guess which part of everything it\ndid earned the treat. The instant the rump hits the ground, you say 'yes'\n\u2014 that sound marks the exact behavior. You then have 2-3 seconds to\ndeliver the reward without losing precision. Also called a bridge signal.\nA verbal 'yes' is preferred over a clicker for field work because your\nhands are often full of gun, leash, and bumper.\n","see_also": ["lure","shaping","capture"],"tracks": ["OB","PP"]},"memory_bird": {"term": "memory bird","short": "The first mark thrown in a double \u2014 retrieved second.","full": "The dog must remember where this bumper landed while it retrieves the\ngo-bird first. Memory bird retrieves test the dog's ability to hold a\nmental picture of a fall location through the excitement of a second\nthrow and a retrieve. Doubles are the foundation of all advanced marking.\n","see_also": ["go_bird","double"],"tracks": ["MK"]},"memory_retrieve": {"term": "memory retrieve","short": "Walking the dog to a planted bumper, then walking back and sending \u2014 the dog saw the plant but must remember it.","full": "The bridge between a seen retrieve and a blind. The dog watches you plant\nthe bumper, then must hold the memory while you walk back to the send\npoint. Builds trust that something is out there even when the send\nhappens from a distance. The about-turn direction matters \u2014 turn away\nfrom the plant, not across the dog's line to it.\n","see_also": ["blind","pattern_blind","cold_blind"],"tracks": ["LN"]},"no_bird": {"term": "no-bird","short": "A throw where the dog does not get sent to retrieve.","full": "The bumper is thrown, the dog holds, and the handler walks out and picks\nit up instead of sending the dog. Teaches the dog that a throw does not\nalways mean a retrieve \u2014 the dog releases to its name, not to the throw.\nUsed sparingly (one rep in eight at most) to prevent anticipation. Too\nmany no-birds sour the dog on the drill.\n","see_also": ["steadiness"],"tracks": ["MK"]},"operant_conditioning": {"term": "operant conditioning","short": "Learning from consequences \u2014 the dog does something, something happens, and future behavior changes.","full": "Four quadrants: positive reinforcement (add something good to increase\nbehavior), negative reinforcement (remove something unpleasant to increase\nbehavior), positive punishment (add something unpleasant to decrease\nbehavior), negative punishment (remove something good to decrease\nbehavior). Puppy training uses almost exclusively positive reinforcement\nand negative punishment. The e-collar (negative reinforcement and positive\npunishment) enters only after commands are fully learned.\n","see_also": ["classical_conditioning","premack_principle"],"tracks": []},"over": {"term": "over","short": "A cast sending the dog to the left or right \u2014 arm extended flat to the side.","full": "The handler extends one arm straight out to the side \u2014 left arm for\nleft over, right arm for right over. The dog turns and runs in that\ndirection. One of the three basic casts (back, left over, right over).\n","see_also": ["back","angle_back"],"tracks": ["WH"]},"pile": {"term": "pile","short": "A stack of bumpers placed at a known spot \u2014 the dog retrieves from the pile repeatedly.","full": "A pile is a group of bumpers (usually 3\u20135) placed in a visible\nlocation. The dog is sent to the pile, picks up one bumper, and\ndelivers it. Pile work teaches the dog to run a straight line to a\nknown destination, which is the foundation of blind retrieves. It\nalso builds the pattern of running out, picking up, and returning\nwithout the excitement of a thrown mark.\n","see_also": ["pattern_blind"],"tracks": ["WH","LN"]},"parading": {"term": "parading","short": "The dog running loops or victory laps with the bumper instead of returning straight to the handler.","full": "A recall problem with a bumper in the mouth, not a hold problem. Every\nlap rewards the dog with possession plus movement. The fix is prevention\n(check cord, narrow corridor) not correction (chasing makes it worse).\nDiagnosed by consistency: always to the same side = handler habit, either\nside = attitude.\n","see_also": ["hold"],"tracks": ["MK"]},"pattern_blind": {"term": "pattern blind","short": "A blind retrieve on familiar ground where the dog has run the same line before.","full": "The dog's first true blind \u2014 a bumper planted out of sight on the same\nbackstop used since lining Stage 1. The familiar ground reduces variables\nso the dog can learn to trust the handler's line without the added\ndifficulty of unfamiliar terrain. Pattern blinds bridge the gap between\nmemory retrieves and cold blinds.\n","see_also": ["blind","cold_blind","memory_retrieve"],"tracks": ["LN"]},"place_board": {"term": "place board","short": "A portable elevated platform (3-6 inches) that gives the dog a clear physical boundary.","full": "Unlike sit on open ground, the board provides a tactile edge the dog can\nfeel. The dog knows exactly where the boundary is. Used to teach place\ncommand, build duration, and create a portable home base for any training\ncontext. Introduction uses shaping \u2014 reward the first paw, then two, then\nall four.\n","see_also": ["shaping"],"tracks": ["OB","WH"]},"popping": {"term": "popping","short": "The dog stopping mid-retrieve to look back at the handler for direction when none was asked for.","full": "A sign of over-handling \u2014 the dog expects to be stopped on every send and\nis checking in rather than driving to the fall. Caused by too many whistle\nstops relative to free retrieves. The fix is fewer stops: let the dog run\nmore lines without handling before returning to whistle work. Expensive to\nfix once established \u2014 catch it early.\n","see_also": ["over_suppression"],"tracks": ["WH","LN","WA"]},"premack_principle": {"term": "Premack principle","short": "Using what the dog wants most (the retrieve) as the reward for what you need it to do first (sit still).","full": "The entire mechanical foundation of steadiness training. The dog watches\na bird fall and wants nothing more than to go get it. Sitting still is\nthe last thing it wants to do. The Premack principle turns the retrieve\ninto the reward for the sit: hold still first, then you get to go. Over\ntime, the sit itself takes on the excitement of what follows it \u2014 the dog\nsits with intensity rather than reluctance.\n","see_also": ["steadiness","variable_reinforcement"],"tracks": []},"recall": {"term": "recall","short": "Calling the dog to come to you \u2014 the most important safety command.","full": "The recall is the command that brings the dog back to you. In this\nprogram, the verbal recall is \"here\" and the whistle recall is a\nseries of rapid blasts. The recall must be reliable in every\nsituation because it is a safety tool \u2014 a dog that will not come\nwhen called is a dog the handler cannot control in the field.\n","see_also": ["release_word"],"tracks": ["OB","WH"]},"release_word": {"term": "release word","short": "The word that ends a command \u2014 the dog does not move until it hears this word.","full": "Chosen by the handler at intake. Common choices: okay, free, break. Sit\nmeans sit until the release word. Place means stay on the board until the\nrelease word. The crate door opening is not the release \u2014 the word is.\nEveryone who handles the dog must use the same release word. Pick\nsomething you do not say often in conversation.\n","see_also": [],"tracks": ["OB","MK"]},"right_hand_back": {"term": "right hand back","short": "A back cast given with the right hand raised vertical \u2014 the dog spins over its left shoulder.","full": "Same destination as a regular back (straight back pile / second base),\nbut the right hand raised cues the dog to spin to its left (away from the\nraised hand). Used for influence control on blinds and in water \u2014 keeping\nthe dog off banks, spreads, or other dogs' lines. Different from a right\nangle back, which sends the dog to a different destination at 45 degrees.\n","see_also": ["left_hand_back","back","angle_back"],"tracks": ["WH"]},"settle": {"term": "settle","short": "A mental state cue \u2014 lie down in a relaxed posture with hips rolled, head lowered, breathing slow.","full": "Different from down, which is a positional command (lie down, can be\nalert). Settle means decompress and wait. This is the blind picture \u2014 a\ndog flat and loose at your side for hours. Taught by capturing: when the\ndog visibly relaxes, mark gently and reward. Over time, adding the cue\nword (chosen at intake) lets you ask for the relaxed state.\n","see_also": ["capture"],"tracks": ["OB","HU"]},"shaping": {"term": "shaping","short": "Rewarding small steps toward the final behavior rather than waiting for the whole thing at once.","full": "If the goal is all four paws on the place board, shaping starts by\nrewarding the first paw that touches. Then two paws. Then three. Then all\nfour. The dog is an active problem-solver \u2014 it offers behaviors and learns\nfrom the consequences. Shaping builds confidence and a dog that tries new\nthings. Slower than luring but produces deeper understanding.\n","see_also": ["lure","capture"],"tracks": ["OB"]},"single": {"term": "single","short": "One mark thrown \u2014 the dog retrieves one bumper.","full": "The simplest retrieve setup. Most early training is singles. In\nsteadiness work, singles are used to build the hold before adding the\ncomplexity of a second throw (doubles). A hallway single is the first\nretrieve a puppy ever does.\n","see_also": ["double","memory_bird","go_bird"],"tracks": ["MK","PP"]},"steadiness": {"term": "steadiness","short": "The dog holding position through excitement \u2014 a throw, a shot, another dog working \u2014 until released.","full": "The core discipline of a finished gun dog. A steady dog does not break\nwhen a bird falls, does not chase when a gun fires, does not move when\nanother dog is sent. Steadiness is built by preventing the break (lead,\ntab, mechanical management), never by punishing it. Marking desire is\nprotected throughout \u2014 a slow, reluctant dog is a far more expensive\nproblem than a dog that breaks.\n","see_also": ["premack_principle","over_suppression"],"tracks": ["MK","WA","HU"]},"swim_by": {"term": "swim-by","short": "A water casting drill where the dog must swim past a point of land instead of running across it.","full": "The setup needs land that sticks out into the water \u2014 a point, peninsula,\nor narrow strip of bank. The dog starts on one side and the pile is on\nthe other. The straight line goes through open water, swimming past the\ntip. The cheating route is to climb out, run across on dry ground, and\nre-enter. Dogs naturally take the dry route because swimming is harder \u2014\nthis drill teaches the dog to hold a water line even when land is\navailable.\n","see_also": ["bank_running","cheating_single"],"tracks": ["WA"]},"systematic_desensitization": {"term": "systematic desensitization","short": "Gradual, positive exposure to a fear trigger \u2014 starting below the fear threshold and building up slowly.","full": "The opposite of flooding. The dog is exposed to the trigger at low\nintensity, paired with something positive, and intensity increases only\nwhen the current level produces zero negative reaction. The noise\nconditioning ladder (pan drops \u2192 cap gun at distance \u2192 starter pistol) is\nsystematic desensitization. Each rung stays until the dog shows no\nconcern before advancing. If the dog shows fear at any step, go back\ntwo rungs and rebuild.\n","see_also": ["flooding","classical_conditioning"],"tracks": ["PP"]},"tab": {"term": "tab","short": "A short (4-6 inch) handle attached to the collar \u2014 gives the handler something to grab without the drag of a full lead.","full": "The step between a dragging line and bare collar in the off-lead\nprogression. The tab provides a handle when the dog comes to you but no\nlength to grab or step on at distance. It tests whether the dog has truly\ninternalized the commands or was just responsive because the long line was\nthere.\n","see_also": ["check_cord","dragging_line"],"tracks": ["OB","MK"]},"three_ds": {"term": "three D's","short": "Duration, Distance, Distraction \u2014 the three variables that make a command harder. Change only one at a time.","full": "Duration is how long the dog holds. Distance is how far the handler is.\nDistraction is anything competing for the dog's attention. When you raise\none, lower the other two. Most steadiness failures happen because the\nhandler raised two or three at once. A new location counts as a massive\ndistraction increase \u2014 drop distance and duration back to their floors\nand rebuild.\n","see_also": ["engineer_the_win","steadiness"],"tracks": ["OB","MK"]},"variable_reinforcement": {"term": "variable reinforcement","short": "Rewarding correct behavior unpredictably \u2014 sometimes after one rep, sometimes after five.","full": "When first teaching a behavior, reward every time (continuous\nreinforcement). Once the behavior is reliable, begin varying when rewards\ncome. The unpredictability is what keeps the dog performing \u2014 like a slot\nmachine, the dog keeps trying because this time might be the one that\npays. Variable reinforcement makes behaviors more persistent. But never\nthin rewards so far that the training environment becomes unrewarding\ncompared to the world around the dog.\n","see_also": ["premack_principle","operant_conditioning"],"tracks": []},"winger": {"term": "winger","short": "A spring- or rubber-loaded launcher that tosses a bumper or bird in an arc.","full": "A winger simulates a falling bird by launching a bumper into the air. The\nhandler triggers it remotely or a helper trips it. Different from a remote\nlauncher (electronic) \u2014 a winger is mechanical. Used for marks when\ntraining alone or when a consistent throw arc is needed.\n","see_also": ["bumper"],"tracks": ["MK","HU"]},"wagon_wheel": {"term": "wagon wheel","short": "A 5-pile casting drill \u2014 back, two overs, and two angle backs arranged in a semicircle.","full": "The full casting picture. Five piles at equal distance: right over, right\nangle back, straight back, left angle back, left over. Teaches the dog to\ndiscriminate between all five cast directions based on the handler's arm\nangle. Built after three-handed casting (baseball) is solid. Each angle\nback is taught in isolation before all five piles go out together.\n","see_also": ["baseball","angle_back","casting"],"tracks": ["WH"]},"over_suppression": {"term": "over-suppression","short": "A dog that has been corrected too much \u2014 slow, reluctant, checking in instead of driving.","full": "Warning signs: going slow off the line, refusing to leave the handler's\nside on the send, stopping mid-retrieve to look back (popping), glancing\nat the handler before the send as if asking permission, hesitating to\nleave the sit even after the release word. Any of these means the dog is\nworried about being wrong. The fix is always less pressure, not more.\nThrow fun retrieves to rebuild drive. A slow dog is a far more expensive\nproblem than a dog that breaks.\n","see_also": ["popping","steadiness"],"tracks": ["MK","WH"]}},"learn": {"program_map": {"title": "How This Program Works \u2014 The Big Picture","category": "program","reading_min": 5,"experience": "all","summary": "Seven tracks, 90+ cards \u2014 and a reason behind the order. How the program fits together and where your dog fits in it.","body": "You opened the app and saw seven tracks and 90+ cards. It looks like a\nlot. This article explains how the pieces fit together so you can trust\nthe order and focus on the card in front of you instead of worrying about\nwhat comes next.\n\n## The program is a prerequisite map\n\nSome tracks run side by side. Others cannot start until a specific stage\non another track is complete \u2014 because the later skill depends on the\nearlier one. Think of it like building a house: you can frame walls and\nrun plumbing at the same time, but you cannot hang drywall until the\nframing is done. The program works the same way. It is not a calendar \u2014\nthere is no \"week 6, start whistle work.\" Instead, each card lists what\nmust be finished before it opens the next card. A fast dog might reach the Water track\nin four months. A dog that needs more time on obedience might take eight.\nBoth paths are correct if the prerequisites are met.\n\n## The two universal tracks\n\nEvery dog starts with **Puppy Foundation (PP)** and **Basic Obedience\n(OB)**. These two tracks run in parallel from day one and cover the\nskills every gun dog needs regardless of what it will hunt: crate\ntraining, the marker word, socialization, retrieve desire, sit, recall,\nheel, duration, and place.\n\n**PP** builds two things that cannot be built later: retrieve desire and\nneutrality to the world. **OB** builds the commands the handler needs to\ncommunicate with the dog in the field. Everything after the first two\ntracks assumes the foundation is solid \u2014 the framing and plumbing of\nthe house are done.\n\n## The fork: what comes after OB\n\nAfter obedience, the handler's path determines which tracks open.\nWaterfowl retrievers move into the full retriever program:\n\n**Steadiness & Marking (MK)** \u2014 The dog learns to sit steady while a\nbumper or bird is thrown, wait for the release word, and retrieve to hand.\nThis track also introduces force fetch (the trained retrieve) and the\ne-collar, but only after obedience is complete and all 42 adult teeth are\nin. Force fetch is not punishment \u2014 it teaches the dog that retrieving is\na job, not a choice. The e-collar is a communication tool that reinforces\ncommands the dog already knows. Neither one appears until the dog is ready.\n\n**Whistle & Casting (WH)** \u2014 The dog learns to stop on a whistle blast\nand take directional casts (back, left, right) from the handler. This is\nhow you guide the dog to a bird it did not see fall. Whistle work requires\na solid sit from OB and the e-collar conditioning from MK.\n\n**Lining (LN)** \u2014 The dog learns to run a straight line in the direction\nthe handler points, across ditches, hedgerows, and other terrain changes that\npull it off course. Lining is the foundation of blind retrieves \u2014 sends\nwhere the dog did not see the bird fall. It requires casting fundamentals\nfrom WH.\n\n**Water (WA)** \u2014 Every skill the dog learned on land transfers to water.\nWater entries, swimming marks, water blinds, and handling in current. The\nrule: master any skill on land before introducing it in water.\n\n**Hunt Preparation (HU)** \u2014 The finishing track. Decoys, boats, blinds,\nhonoring another dog's retrieve, hunting in cold weather, and the\ntransition from training birds to wild birds. This track ties everything\ntogether.\n\nUpland dogs follow a different set of tracks after OB. Versatile dogs\nthat hunt both waterfowl and upland get both. The app shows only the\ntracks that apply to your dog's path \u2014 chosen during the intake flow.\n\n## Why the order matters\n\nEvery track in the program exists in this order for a reason. The short\nversion: a dog that learns independence before dependence learns to solve\nproblems without the handler. Once that habit is set, it takes far longer\nto fix than if handling had been built first.\n\nThe instinct of most handlers is to run marks first because the dog loves\nit. Marks are fun, the dog is excited, and it feels like progress. But a\ndog that chases every throw before it knows how to sit still is a dog that\nhas to unlearn breaking before it can learn steadiness. A dog that runs\nblinds before it understands whistle commands is a dog the handler cannot\nredirect when it veers off line.\n\nThe program builds dependence first (obedience, force fetch), then\ninterdependence (whistle, casting, handling), then independence (hunting,\nadvanced marks). This is the sequence the major professional retriever\nprograms follow \u2014 because it works. Trust the sequencing even when it\nfeels slow. Skipping a step does not save time. It creates a gap that\nsurfaces later, at a stage where fixing it takes far more time than\nbuilding it right would have.\n\n## What \"banked\" and \"current\" mean\n\nA card with a green checkmark is **banked** \u2014 the dog passed every check\non that card and the stage is complete. A card marked **current** is the\none you are working on. The app tracks this for you.\n\nA banked card is not gone \u2014 you can always go back and re-run a stage if\nthe dog's performance slips. But you cannot advance past a card until it\nis banked. The prerequisites on each card enforce this: if a card requires\nMK-3, you cannot start it until MK-3 is banked.\n\n## The NEXT tile\n\nThe hub screen shows a NEXT tile \u2014 the app's suggestion for what to work\non today. It looks at which cards are current, which prerequisites are\nmet, and how recently each card was practiced. It is a suggestion, not a\nmandate. If the weather is wrong for water work, skip it. If the dog is\nhaving a great obedience day, ride it. The NEXT tile is a compass, not a\nGPS.\n"},"four_quadrants": {"title": "The Four Quadrants \u2014 How Dogs Learn from Consequences","category": "theory","reading_min": 5,"experience": "all","summary": "Positive and negative do not mean good and bad. The four ways a consequence changes behavior \u2014 and why this program sequences them the way it does.","body": "Every time something happens after a behavior, the dog is learning. It\neither becomes more likely to repeat the behavior or less likely.\nBehavioral psychology calls this {term:operant_conditioning} \u2014 a\nframework that describes the four ways consequences change behavior.\nUnderstanding it is not academic \u2014 it explains why this program starts\nwith treats and does not introduce the e-collar until much later.\n\n## The vocabulary\n\nTwo words need redefining because they do not mean what they mean in\neveryday English.\n\n**Positive** does not mean good. It means you are **adding** something.\n**Negative** does not mean bad. It means you are **removing** something.\n**Reinforcement** is any consequence that increases the likelihood of a\nbehavior being repeated.\n**Punishment** is any consequence that decreases the likelihood of a\nbehavior being repeated.\n\n## The four quadrants\n\n**Positive reinforcement \u2014 add something good to increase the likelihood\nof a behavior.** The dog sits, you give a treat. The likelihood of the\ndog sitting again increases because it paid off. This is the dominant\ntool through the puppy and obedience tracks. Treats,\nthe retrieve itself (see {article:premack_article}), and praise all fall\nhere. It is the safest quadrant \u2014 the worst outcome is the dog does not\nlearn; it does not create fear or avoidance.\n\n**Negative punishment \u2014 remove something good to decrease the likelihood\nof a behavior.** The dog breaks from the sit before the release word, so\nthe retrieve opportunity disappears (a no-bird). The likelihood of\nbreaking decreases because it cost the dog the thing it wanted most.\nThis is the primary correction tool for\nyoung dogs in this program. Ending a session early, taking away the\nbumper, turning your back on a jumping puppy \u2014 all negative punishment.\n\n**Negative reinforcement \u2014 remove something unpleasant to increase the\nlikelihood of a behavior.** The e-collar applies low-level stimulation.\nThe dog sits, and the stimulation stops. The likelihood of the dog\nsitting on command increases because sitting made the unpleasant\nthing go away. This is how the e-collar works in this program \u2014 the dog\nalready knows the command from positive reinforcement on the obedience\ntrack. The collar reinforces a known behavior at distance. It does not\nteach new ones.\n\n**Positive punishment \u2014 add something unpleasant to decrease the\nlikelihood of a behavior.** The dog chases a snake, and something bad\nhappens. The likelihood of chasing a snake again decreases.\nThis quadrant is rare in this program and reserved for danger behaviors\nonly \u2014 situations where the dog's safety is at stake and the behavior\nmust stop immediately. It is never used for obedience failures, slow\nrecalls, or sloppy sits.\n\n## Why the sequence matters\n\nThis program moves through the quadrants in order: positive reinforcement\nfirst, negative punishment second, negative reinforcement third, positive\npunishment almost never. The reason is not philosophy \u2014 it is how\nlearning works.\n\nPressure on a behavior the dog has not learned yet is not training. It is\nconfusion. If you collar-correct a dog for breaking a sit it does not\nfully understand, the dog does not learn \"sit means sit.\" It learns \"bad\nthings happen at the line and I do not know why.\" The result is a dog\nthat shuts down, avoids the handler, or freezes \u2014 the opposite of the\nconfident, driven gun dog this program builds.\n\nThe e-collar enters in the Force & Collar track, only after the dog has\npassed all obedience stages. It reminds the dog of a known command at\ndistances where your voice and your feet cannot reach. Used this way, the\ncollar is a tool. Used before the dog is ready, it is a source of fear.\n\n## Learned helplessness \u2014 the worst-case outcome\n\nWhen a dog receives pressure it cannot predict, cannot understand, and\ncannot escape by doing the right thing, it eventually stops trying. This\nis called {term:learned_helplessness}. The dog becomes passive \u2014 not calm,\nnot obedient, just shut down. It looks compliant on the surface, but\nunderneath the dog has given up. A dog in learned helplessness has stopped\nlearning entirely.\n\nThis happens when pressure has no off-switch the dog can control. The\ne-collar fires, but the dog does not know what behavior will make it\nstop. After enough repetitions, the dog concludes that nothing it does\nmatters and stops responding to anything.\n\nLearned helplessness is the reason this program sequences the way it does.\nThe dog learns the command first, with no pressure. Then the collar\nconfirms what the dog already knows. The dog always has the answer before\nthe question is asked. That is the difference between communication and\npunishment.\n"},"premack_article": {"title": "The Premack Principle \u2014 Why Steadiness Works","category": "theory","reading_min": 4,"experience": "all","summary": "The retrieve is the most powerful reward you have. Steadiness harnesses it \u2014 and the science behind it is simpler than you think.","body": "Steadiness is the hardest thing this program teaches. The dog wants\nnothing more in the world than to chase that bumper \u2014 and you are asking\nit to sit still and wait. Why would a dog do that? The answer is a\nconcept called the {term:premack_principle}, and it is the engine that\nmakes the entire marking track work.\n\n## The principle in one line\n\nA behavior the dog wants to do can be used to reinforce a behavior the\ndog does not want to do. Psychologist David Premack discovered this in\nthe 1950s, and dog trainers have been using it ever since \u2014 whether they\nknow the name or not.\n\nIn plain terms: \"do the boring thing, and then you get the fun thing.\"\n\n## How it works for gun dogs\n\nThe retrieve is the most powerful reward you have \u2014 more powerful than\nany treat, any praise, any toy. A retriever lives to retrieve. That\ndesire is the lever.\n\nThe sequence: sit \u2192 the bumper is thrown \u2192 hold the sit \u2192 the handler\nsays the release word \u2192 the dog retrieves. Every single rep, the sit\ngets stronger because it predicts the retrieve. The dog is not sitting\nbecause it was told to. It is sitting because sitting is the fastest\npath to the thing it wants most.\n\nThis is why steadiness builds over time instead of breaking down. The\nmore retrieves the dog earns by holding the sit, the more the sit is\nworth. The sit becomes charged with anticipation \u2014 not dread, not\nobedience, but excitement. A steady dog trembling on the line is not\nmiserable. It is loaded.\n\n## Variable reinforcement makes it stronger\n\nSometimes the dog gets sent to retrieve. Sometimes it is a no-bird \u2014\nthe bumper is thrown, the dog holds, and no retrieve happens. The dog\ndoes not know which rep will pay off. This uncertainty is called\n{term:variable_reinforcement}, and it makes the sit harder to break,\nnot easier.\n\nThis is the same mechanism that makes a slot machine compelling. If the\nmachine paid every pull, you would get bored. If it never paid, you\nwould walk away. Because it pays unpredictably, you keep pulling. The\ndog keeps holding the sit for the same reason \u2014 the next rep might be\nthe one that pays.\n\n## The balance: too much no-bird kills drive\n\nThere is a limit. If the dog sits through ten throws and retrieves\nnone of them, the sit stops predicting the retrieve. It starts\npredicting nothing. The dog loses drive \u2014 not because it is defiant,\nbut because the equation broke. The sit no longer buys anything.\n\nWatch for the signs: a dog that used to tremble on the line now sits\nflat. A dog that used to drive hard to the fall now trots. A dog that\nloses interest in the bumper. These are signs that the ratio of\nno-birds to retrieves is too high. The fix is simple: more retrieves,\nfewer no-birds, until the drive comes back.\n\nThe ratio is a judgment call, not a formula. Most trainers keep\nno-birds to one in four or one in five during early steadiness work.\nAs the dog matures and the sit is rock-solid, the ratio can shift.\nBut if the dog's drive drops, the answer is always more retrieves.\n\n## Why this matters in the real world\n\nA dog that breaks on a hunt is a safety problem. It runs into the\nfield of fire. It flushes birds the hunters are not ready for. It\ndisrupts other dogs. Steadiness is not a competition nicety \u2014 it is\nthe difference between a gun dog and a dog with a gun nearby.\n\nA dog that holds until sent is a finished gun dog. The Premack\nPrinciple is why that hold is possible \u2014 not through force, but\nthrough desire. The dog holds because holding is the fastest way to\nget what it wants.\n"},"engineer_win": {"title": "Engineer the Win","category": "foundations","reading_min": 4,"experience": "all","summary": "The program's core principle: set the dog up to succeed, simplify until it wins, and build from there. How to recognize \"too hard\" before the dog fails.","body": "This principle appears on nearly every card in the program. It is the\nsingle most important idea in this app, and it applies to every session,\nevery drill, every new skill: set the dog up to succeed, simplify until\nit wins, and build from there.\n\n## Why practicing failure teaches failure\n\nEvery time the dog performs a behavior, the pathway for that behavior\ngets stronger in its brain \u2014 whether the behavior was right or wrong. A\ndog that breaks from a sit five times in a row has practiced breaking\nfive times. A dog that holds the sit five times in a row has practiced\nholding five times. Both dogs are learning. One is learning the right\nthing.\n\nThis is why prevention matters more than correction. A dog that cannot\nbreak does not practice breaking. A dog on a lead that physically\nprevents the break holds the sit \u2014 and the hold pathway gets stronger.\nThe correction was never needed because the failure never happened.\n\n**Example:** You are teaching sit-stay at 10 feet. The dog holds. You\nmove to 15 feet. The dog holds. You jump to 30 feet. The dog breaks.\nYou just taught the dog to break at 30 feet. The fix: go back to 15\nfeet, then 18, then 20, then 22. Build in steps the dog can win. If\nthe dog never breaks, the dog never practices breaking.\n\n## The three levers: durat
