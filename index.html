. Same shot, stand door open, then closed. One axis."]], "checks": [{"id": "c1", "label": "Steady in the stand, shot from inside, then a mark", "hits": 8, "of": 10, "sessions": 2}], "session_cap": {"reps": 6, "applies_to": "shots fired from inside", "note": "Six shots from inside the stand a session, maximum."}, "equipment": ["invisilab", "poppers_12ga", "bumpers"], "requires": ["MK-4", "HU-1"], "trigger": null, "blocked_note": "UNREACHABLE AS WRITTEN — needs MK-4, locked behind MK-3, stood down 2026-08-09. Read the Gate card before the first rep.", "diagram": null}, {"code": "HU-4", "id": "hunt.s4", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 4, "title": "Boat and Stand Work", "drill": "Tied off at the bank, engine off, before anything moves. Load on command,\nsit, unload on command — the gunwale is a height problem, the same one the\ndock is in Water 2. Then hold position while YOU rock the boat from\ninside. Never lift her in and never push her out.\n", "pass": "5/5 load and unload on command from a stationary boat. Holds position 10 min\nwith the boat rocking, 2 sessions.\n", "body": "", "ifthen": [["Will not load", "Height, not water. Lower the step: bank first, then a stable gunwale. Let her choose to go."], ["Scrambles when it rocks", "Footing. Mat the deck and rock it less. Rebuild the amplitude, not her tolerance for slipping."], ["Jumps out on the mark", "Steadiness in a new picture. Lead on, back to a 1-sec delay, rebuild in the boat."]], "checks": [{"id": "c1", "label": "Loads and unloads on command, boat stationary", "hits": 5, "of": 5}, {"id": "c2", "label": "Holds position 10 min with the boat rocking", "hits": 1, "of": 1, "sessions": 2}], "session_cap": null, "equipment": ["boat", "invisilab", "lead"], "requires": ["HU-1"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-5", "id": "hunt.s5", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 5, "title": "Honoring and Multiple Dogs", "drill": "Another dog is sent; she holds. On lead for the first sessions — the lead is\nthe drill, not a crutch, and it is what makes the break impossible while the\nrule is being learned. Her turn comes second at first, so holding pays.\n", "pass": "Honors another dog's retrieve 5/5 — no break, no vocalising, no creeping off\nthe stand — 2 sessions.\n", "body": "", "ifthen": [["Breaks when the other dog is sent", "Lead under your foot and shorten the other dog's retrieve. Prevent it; do not correct it."], ["Vocalises while honoring", "She is held past what she can hold. Send her first for a few reps, then alternate."], ["Fine on lead, breaks off it", "She was holding the lead. Same wean as Marks 4 — tab on, stay close."]], "checks": [{"id": "c1", "label": "Honors another dog's retrieve, no break, no vocalising", "hits": 5, "of": 5, "sessions": 2}], "session_cap": null, "equipment": ["lead", "invisilab"], "requires": ["MK-7"], "trigger": null, "blocked_note": "DECLARED EXCEPTION TO SOLO-FIRST — this stage needs a SECOND DOG and a helper. Not a fallback; there is no solo version. Run it at a North Louisiana HRC club day. Also needs MK-7, which is far.", "diagram": null}, {"code": "HU-6", "id": "hunt.s6", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 6, "title": "Low Light, Real Cover, Cold", "drill": "Not a new skill — a re-validation, which is exactly why it gets skipped. Take\nnumbers she has already banked and re-meet them in the conditions a hunt\nhappens in: legal shooting light, 30 min before sunrise, and standing cover.\nTHE MOCK BLIND GOES UP HERE, per the 08-10 ruling — HU-1 ran off the bare\nstand and the blind is the new variable, added alone.\n", "pass": "Re-meet Hunt 1's 10 min hold and Hunt 2's land 5/5, at shooting\nlight and in standing cover, 2 sessions each.\n", "body": "", "ifthen": [["Numbers drop in the dark", "Expected, and it is the point. Drop the distance, not the standard, and rebuild in the low light."], ["Settles on the bare stand, not in the blind", "The blind is the variable. Sides down one at a time, roof last."], ["Hunts short in standing cover", "Cover eats a mark. Shorten until she wins, then stretch — this is Marks 5's rule, borrowed."]], "checks": [{"id": "c1", "label": "HU-1's 10 min hold re-met at shooting light, in the blind", "hits": 1, "of": 1, "sessions": 2}, {"id": "c2", "label": "HU-2's land 5/5 re-met in standing cover, low light", "hits": 5, "of": 5, "sessions": 2}], "session_cap": null, "equipment": ["invisilab", "mock_blind", "decoys", "bumpers"], "requires": ["HU-1", "HU-2"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-7", "id": "hunt.s7", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 7, "title": "Simulated Hunts — The Whole Picture", "drill": "Everything at once, and nothing new. Blind, spread, calls, a shot, land and\nwater falls, retrieve order, guns down before any send. Run it like a hunt,\nnot like a session: no coaching, no re-cast, no second try. What breaks here\nis a card you go back to, not a thing you fix on the day.\n", "pass": "2 consecutive simulated hunts with zero breaks, zero handled retrieves, and\ncorrect retrieve order throughout.\n", "body": "", "ifthen": [["One thing breaks every time", "Good — that is the card. Go back to it and stop running simulations until it holds."], ["Everything is loose at once", "Too much at once too soon. Drop back to HU-6 and add one element per session."], ["Handles well but has stopped enjoying it", "Read Over-Suppression. A finished dog that does not want to go is not finished."]], "checks": [{"id": "c1", "label": "Simulated hunt — no break, no handle, correct order", "hits": 2, "of": 2}], "session_cap": null, "equipment": [], "requires": ["HU-1", "HU-2", "HU-3", "HU-4", "HU-5", "HU-6", "MK-4", "WA-3"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-G", "id": "hunt.gate", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "gate", "n": null, "title": "GATE — Gunfire from the Blind", "drill": "", "pass": "", "body": "Do not run Hunt 3 until Marks 4 has banked: off lead,\nsteady through fall, delay and gun, on open ground.\n\nOn open ground she can move away from the report. In a blind she cannot —\nit is close range, over her head, in a box that reflects the sound back at\nher. That is a different event, and she meets it with no exit.\n\nThe program has already priced this. Marks 3's own IF row reads\n\"Stop. Do not push through. Rebuild over weeks,\" and the 08-09 dove-field\nruling kept her out of a field of fast guns for the same reason. A flinch at\nthe report costs weeks and it is the one fault on this track that gets\nharder to fix the longer it runs.\n\nNever the first gun of the day fired from inside the blind.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-R1", "id": "hunt.ref_call", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "reference", "n": null, "title": "The Duck Call Is a Stillness Cue", "drill": "", "pass": "", "body": "Read before Hunt 1. The beeper is the training cue and the duck call\nis RESERVED for this track — that ruling is why she has never heard a call\nmean \"a bird is coming for you.\"\n\nProtect it. On hunt day you blow a call with her beside you, repeatedly, and\nmost of those calls end in nothing at all. If a call predicts a bird you have\nbuilt a dog who winds up every time you work a flock, which is every few\nminutes, for four hours.\n\nSo condition the opposite, from the first session. Call while she is settled\non the stand and NOTHING happens. Pay the stillness, not the sound. Work the\ncall through the dead time between reps, never in the second before a throw.\n\nThe test is simple and it is easy to fail without noticing: if her head comes\nup on the call, the call has become a cue. Stop throwing anywhere near it for\na week and re-pay the stillness.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null, "diagram": null}, {"code": "HU-R2", "id": "hunt.ref_order", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "reference", "n": null, "title": "Retrieve Order and Safety", "drill": "", "pass": "", "body": "Read before Hunt 5 and Hunt 7, and before any hunt with other\nguns. The strongest language in the deck, and it is about the people.\n\nNOBODY SENDS UNTIL EVERY GUN IS DOWN AND THE SHOOTING IS OVER. In a party\nof four the send is a social act, not a handler's decision. You send\nbecause the shooting stopped and you said so out loud — not because you\nsaw a bird fall.\n\nSHE WORKS IN FRONT OF A LINE OF GUNS. Her outbound path crosses lanes\nbelonging to people who are not watching her. Know where it runs before\nshe is on it.\n\nOrder: cripples first, farthest cripple before the nearest, dead birds\nlast. A bird still swimming is the only reason to break the order, and it\nis decided before the send.\n\nSay the plan out loud before the first flight. A blind is loud and your\nfriends are not reading your mind.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null, "diagram": null}, {"code": "HU-R3", "id": "hunt.ref_test", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "reference", "n": null, "title": "Hunt Test vs. Hunting", "drill": "", "pass": "", "body": "Kept on Jason's ruling 2026-08-10, though the program's own premise already\nanswers it — this deck may end up in other hands, and the person holding it\nmay be training for a ribbon.\n\nWhere the two diverge in THIS program, hunting wins. Concretely: she is\ntrained to a duck blind at Caddo and Yang Ming, not function idbPutAll(db, rows) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('rows', 'readwrite');
    const store = tx.objectStore('rows');
    for (const r of rows) store.put(r);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function idbGetOutings(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('outings', 'readonly');
    const req = tx.objectStore('outings').getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutOuting(db, outing) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('outings', 'readwrite');
    tx.objectStore('outings').put(outing);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function historyToRows() {
  const hist = (DECK.week || {}).history || {};
  const rows = [];
  for (const [date, entries] of Object.entries(hist)) {
    for (const e of entries) {
      rows.push({ card: e.code, check: e.check, date: String(date),
        hits: e.hits, of: e.of, counts: e.counts !== false,
        assist: 'none', rung: e.rung != null ? e.rung : undefined, machine: false, source: 'history' });
    }
  }
  return rows;
}
async function recomputeState() {
  try {
    const db = await openSessionsDB();
    const idbRows = await idbGetAll(db);
    const histRows = historyToRows();
    const allRows = histRows.concat(idbRows);
    const asserts = (DECK.state || {}).asserts || {};
    const standDowns = (DECK.state || {}).stand_downs || {};
    const result = computeState(DECK.cards, allRows, asserts, standDowns);
    const asOf = (DECK.state || {}).as_of || '';
    DECK.state = Object.assign(result, { asserts: asserts, stand_downs: standDowns, as_of: asOf });
    /* Patch DECK.week.history with IDB rows so the cadence strip, "last
       session" label, staleness, and day-row history all reflect sessions
       logged since the last build. */
    if (idbRows.length) {
      if (!DECK.week) DECK.week = {};
      if (!DECK.week.history) DECK.week.history = {};
      for (const r of idbRows) {
        if (!r.date || !r.card) continue;
        if (!DECK.week.history[r.date]) DECK.week.history[r.date] = [];
        const already = DECK.week.history[r.date].some(
          h => h.code === r.card && h.check === r.check);
        if (!already) {
          DECK.week.history[r.date].push({
            code: r.card, check: r.check,
            hits: r.hits, of: r.of, counts: r.counts !== false
          });
        }
      }
    }
    /* Merge IDB outings into DECK.sessions so the History tab shows
       sessions logged since the last build. */
    const idbOutings = await idbGetOutings(db);
    if (idbOutings.length) {
      if (!DECK.sessions) DECK.sessions = [];
      const built = new Set(DECK.sessions.map(o => o.date + '|' + (o.tod || '')));
      for (const o of idbOutings) {
        const key = o.date + '|' + (o.tod || '');
        if (!built.has(key)) { DECK.sessions.push(o); built.add(key); }
      }
      DECK.sessions.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    }
    render();
  } catch (e) { console.error('recomputeState failed:', e); }
}

/* ── Firestore REST API — no SDK, just fetch ──────────────────────────────── */
const FS_PROJECT = 'reba-training-app';
const FS_API_KEY = 'AIzaSyDUL6hF8_W-ysx_3uSlqhNL-AYazzNj9BI';
const FS_BASE = 'https://firestore.googleapis.com/v1/projects/' + FS_PROJECT + '/databases/(default)/documents';

function fsDocValue(v) {
  if (v === null || v === undefined) return { nullValue: null };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  if (typeof v === 'string') return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(fsDocValue) } };
  if (typeof v === 'object') {
    const fields = {};
    for (const [k, val] of Object.entries(v)) fields[k] = fsDocValue(val);
    return { mapValue: { fields } };
  }
  return { stringValue: String(v) };
}

function fsWrite(collection, data) {
  const fields = {};
  for (const [k, v] of Object.entries(data)) fields[k] = fsDocValue(v);
  // Add server timestamp
  fields.created_at = { timestampValue: new Date().toISOString() };
  return fetch(FS_BASE + '/' + collection + '?key=' + FS_API_KEY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields }),
  });
}

function fsReadAll(collection) {
  return fetch(FS_BASE + '/' + collection + '?key=' + FS_API_KEY + '&pageSize=500')
    .then(r => r.json())
    .then(data => (data.documents || []).map(doc => {
      const out = {};
      for (const [k, v] of Object.entries(doc.fields || {})) out[k] = fsParseValue(v);
      return out;
    }));
}

function fsParseValue(v) {
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return parseInt(v.integerValue, 10);
  if ('doubleValue' in v) return v.doubleValue;
  if ('booleanValue' in v) return v.booleanValue;
  if ('nullValue' in v) return null;
  if ('timestampValue' in v) return v.timestampValue;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fsParseValue);
  if ('mapValue' in v) {
    const out = {};
    for (const [k, fv] of Object.entries(v.mapValue.fields || {})) out[k] = fsParseValue(fv);
    return out;
  }
  return null;
}

function fetchSites() {

/* ── GPS + site matching ──────────────────────────────────────────────────── */
const GEO_OPTS = { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 };
let lastGeoFix = null;

function geoMetres(a, b, c, d) {
  if ([a,b,c,d].some(v => !Number.isFinite(v))) return Infinity;
  const R = 6371000, r = Math.PI / 180;
  const p1 = a * r, p2 = c * r, dp = (c - a) * r, dl = (d - b) * r;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function matchSite(lat, lon) {
  if (!SITES.length) return null;
  const scored = SITES.map(s => ({
    s, m: geoMetres(lat, lon, s.lat, s.lon)
  })).sort((a, b) => a.m - b.m);
  const inside = scored.filter(x => x.m <= x.s.radius_m);
  if (inside.length === 1) return { match: 'hit', site: inside[0].s, dist: inside[0].m };
  if (inside.length > 1) return { match: 'ambiguous', sites: inside.map(x => x.s), dists: inside.map(x => x.m) };
  return { match: 'none', nearest: scored[0].s, dist: scored[0].m };
}

function detectLocation() {
  if (!navigator.geolocation) {
    renderGeoResult({ error: 'No GPS on this device.' });
    return;
  }
  renderGeoResult({ acquiring: true });
  navigator.geolocation.getCurrentPosition(
    p => {
      lastGeoFix = p;
      const result = matchSite(p.coords.latitude, p.coords.longitude);
      result.accuracy = p.coords.accuracy;
      result.lat = p.coords.latitude;
      result.lon = p.coords.longitude;
      renderGeoResult(result);
      // Auto-set location if we got a clean match
      if (result.match === 'hit') {
        S.location = result.site.label;
        // Also fetch weather
        fetchSessionWeather(p.coords.latitude, p.coords.longitude);
      }
      render();
    },
    e => {
      const msgs = {
        1: 'Location denied. Allow in Settings.',
        2: 'No position. Try open sky.',
        3: 'Timed out — try again.'
      };
      renderGeoResult({ error: msgs[e.code] || 'GPS failed.' });
    },
    GEO_OPTS
  );
}
window.detectLocation = detectLocation;

function renderGeoResult(r) {
  const el = document.getElementById('geoResult');
  if (!el) return;
  if (r.acquiring) {
    el.innerHTML = '<span style="color:var(--muted)">Acquiring fix\u2026</span>';
    return;
  }
  if (r.error) {
    el.innerHTML = '<span style="color:var(--alert)">' + r.error + '</span>';
    return;
  }
  if (r.match === 'hit') {
    el.innerHTML = '<span style="color:#2F4A32;font-weight:700">\u2713 ' + r.site.label +
      '</span> <span style="color:var(--muted);font-size:12px">' + Math.round(r.dist) +
      ' m, fix \u00b1' + Math.round(r.accuracy) + ' m</span>';
  } else if (r.match === 'ambiguous') {
    el.innerHTML = '<span style="color:#9A7C42;font-weight:700">Multiple matches:</span> ' +
      r.sites.map((s, i) => s.label + ' (' + Math.round(r.dists[i]) + ' m)').join(', ');
  } else {
    el.innerHTML = '<span style="color:var(--muted)">No match — nearest: ' +
      r.nearest.label + ' at ' + Math.round(r.dist) + ' m</span>';
  }
}

/* ── Weather auto-fetch (Open-Meteo, same as reba-lab) ─────────────────── */
function fetchSessionWeather(lat, lon) {
  const vars = 'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m';
  const units = '&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago';
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(5) +
    '&longitude=' + lon.toFixed(5) + '&current=' + vars + units;
  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (data.current && data.current.temperature_2m != null) {
        S.temp_f = String(Math.round(data.current.temperature_2m));
        const el = document.getElementById('wxInfo');
        if (el) {
          const c = data.current;
          const feels = c.apparent_temperature != null ? Math.round(c.apparent_temperature) : null;
          let info = Math.round(c.temperature_2m) + '\u00b0F';
          if (feels != null && Math.abs(feels - Math.round(c.temperature_2m)) >= 3)
            info += ' (feels ' + feels + '\u00b0)';
          if (c.wind_speed_10m) info += ', wind ' + Math.round(c.wind_speed_10m) + ' mph';
          // Heat warning for the dog
          if (feels != null && feels >= 90) {
            info = '\u26a0\ufe0f ' + info + ' — LIMIT WORK';
            el.style.color = '#A32E1E';
          } else if (feels != null && feels >= 80) {
            info = info + ' — shorter sessions';
            el.style.color = '#B8860B';
          } else {
            el.style.color = '#2F4A32';
          }
          el.textContent = info;
        }
        render();
      }
    })
    .catch(() => {}); // fail silently — manual entry is always there
}

// Also fetch weather when location is tapped manually (if we know coords)
function weatherForSite(label) {
  const site = SITES.find(s => s.label === label);
  if (site) fetchSessionWeather(site.lat, site.lon);
  else if (lastGeoFix) fetchSessionWeather(lastGeoFix.coords.latitude, lastGeoFix.coords.longitude);
}

     can go NEXT, and the two were previously mixed into one row of four buttons
     that all looked alike. The CURRENT card is dead text, deliberately: a button
     that returns you to the screen you are already on reads as broken. */
  let h = `<div class="crumb1">
      <button class="backbtn" onclick="state.trackFilter=null;state.openCard=null;render()">&larr; ALL</button>
      <button class="backbtn" onclick="state.trackFilter='${c.track}';state.openCard=null;render()">&larr; ${c.track}</button>
      <button class="bigbtn" onclick="state.bigType=!state.bigType;render()">A${state.bigType?'a':'A'}</button>
    </div>`;
  h += `<div class="crumb2">` +
    (prev ? `<button class="crumbbtn" onclick="state.openCard='${prev.code}';render()">&lsaquo; ${prev.code}</button>`
          : `<span class="crumbend">&lsaquo;</span>`) +
    `<span class="crumbnow">${c.code}</span>` +
    (next ? `<button class="crumbbtn" onclick="state.openCard='${next.code}';render()">${next.code} &rsaquo;</button>`
          : `<span class="crumbend">&rsaquo;</span>`) +
    `</div>`;
  h += `<div class="detail ${state.bigType?'big':''}"><div class="head" style="background:${accent}">
        <div class="code">${c.code} · ${esc(c.trackName)}${c.trigger?' · '+esc(c.trigger):''}</div>
        <div class="title">${esc(c.title)}</div></div>`;
  if(c.diagram) h += `<div class="sec"><button class="dgmbtn" onclick="openDiagram('${c.diagram}','${c.code}')">DIAGRAM &nbsp;&rarr;</button>
    <div class="why">Full screen. Turn the phone sideways — a 6&times;4 back read portrait loses every label.</div></div>`;
  if(c.body) h += `<div class="sec"><div class="txt">${esc(c.body.trim())}</div></div>`;
  if(c.drill) h += `<div class="sec"><h4>DRILL</h4><div class="txt">${esc(c.drill.trim())}</div></div>`;
  if(c.pass) h += `<div class="sec"><h4>PASS</h4><div class="txt">${esc(c.pass.trim())}</div></div>`;
  if(c.checks.length){
    h += `<div class="sec"><h4>CHECKS</h4>`;
    for(const k of c.checks)
      h += `<div class="checkrow"><span class="num">${k.hits}/${k.of}${k.sessions?' ×'+k.sessions+'s':''}</span><span>${esc(k.label)}</span></div>`;
    h += `</div>`;
  }
  if(c.ifthen.length){
    h += `<div class="sec"><h4>IF / THEN</h4>`;
    for(const r of c.ifthen) h += `<div class="ifrow"><div class="if">${esc(r[0])}</div><div>${esc(r[1])}</div></div>`;
    h += `</div>`;
  }
  if(c.session_cap || c.equipment.length || c.blocked_note){
    h += `<div class="sec">`;
    if(c.equipment.length) h += `<h4>EQUIPMENT</h4><div class="txt">${esc(c.equipment.join(' · '))}</div>`;
    if(c.session_cap) h += `<div class="capnote">CAP: ${esc(c.session_cap.note || (c.session_cap.reps+' reps max'))}</div>`;
    if(c.blocked_note) h += `<div class="capnote">${esc(c.blocked_note)}</div>`;
    h += `</div>`;
  }
  /* per-card session history */
  const cardOutings = (DECK.sessions||[]).filter(o =>
    (o.cards||[]).some(x => x.card === c.code));
  if(cardOutings.length){
    h += `<div class="sec"><h4>SESSIONS (${cardOutings.length})</h4>`;
    for(const o of cardOutings){
      const oc = o.cards.find(x => x.card === c.code);
      if(!oc) continue;
      h += `<div class="ch-row"><span class="ch-date">${esc(o.date)} ${esc(o.tod||'')}</span>`;
      for(const k of (oc.checks||[])){
        const spec = c.checks.find(s => s.id === k.id);
        const threshold = spec ? spec.hits : null;
        const met = threshold !== null && k.hits >= threshold;
        h += `<span class="sh-score ${met?'sh-pass':'sh-fail'}">${esc(k.id)} ${k.hits}/${k.of}</span>`;
      }
      if(oc.assist && oc.assist !== 'none') h += `<span class="sh-meta">${esc(oc.assist)}</span>`;
      h += `</div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}


/* ------------------------------ TRACKS TAB ------------------------------
   Screen 2 of the wireframe: progress per track, locked rows greyed with what
   clears them.

   THE HONESTY CONSTRAINT. This app stores nothing — the export block pasted
   into SESSIONS.md is the record — so it cannot recompute where she is. What
   ships here is a SNAPSHOT computed by tools/state.py at build time, and it
   carries the date it was taken. A progress screen that quietly goes stale is
   worse than no progress screen, so the date is on the tab, not in a footnote. */
const BADGE = {
  banked:           ['b-banked','BANKED'],
  banked_assertion: ['b-assert','BANKED*'],
  in_progress:      ['b-prog','IN PROGRESS'],
  short:            ['b-short','SHORT'],
  pre_gate:         ['b-none','BANKS NOTHING'],
  not_recorded:     ['b-none','NOT RECORDED'],
  locked:           ['b-lock','LOCKED'],
  not_started:      ['b-none','NOT STARTED'],
  stood_down:       ['b-short','STOOD DOWN'],
  no_checks:        ['b-none','']
};
function badge(st){ const b = BADGE[st]||BADGE.no_checks;
  return b[1] ? `<span class="badge ${b[0]}">${b[1]}</span>` : ''; }

function renderTracks(){
  const v = document.getElementById('vTracks');
  const ST = DECK.state;
  if(!ST){ v.innerHTML = '<div class="asof">This build carries no state.</div>'; return; }
  let h = `<div class="asof"><b>State as of ${esc(ST.as_of)||'unstamped'}</b> — computed from
    tracks.yaml and the logged sessions when this build was made, not live. Log a session,
    paste it into SESSIONS.md, rebuild, and these numbers move.
    <b>BANKED*</b> means banked on the record's word with no counts behind it.</div>`;

  for(const t of TRACKS){
    const p = ST.tracks[t.tag] || {};
    h += `<div class="trk"><div class="th" style="background:${t.color}">
        <div class="nm">${t.tag} · ${esc(t.name)}</div>
        <div class="cur">${p.current ? 'on '+p.current+' · '+esc(p.current_title||'')
              : (p.stood_down ? p.stood_down+' stood down — nothing open' : 'nothing open')}</div></div>`;
    for(const c of DECK.cards){
      if(c.track!==t.tag) continue;
      const cs = ST.cards[c.code];
      if(!cs || cs.status==='no_checks') continue;
      const lock = cs.status==='locked';
      /* A card whose PASS rests on an assertion must not read as plainly
         BANKED. MK-1 is banked on Jason's word with no counts anywhere in the
         record, and a screen that hides that is the screen that lets an
         unverified pass harden into a fact. */
      const st = (cs.status==='banked' && cs.checks.some(k=>k.status==='banked_assertion'))
                 ? 'banked_assertion' : cs.status;
      h += `<div class="srow ${lock?'lock':''}" onclick="state.openCard='${c.code}';tab('cards')">
        <div class="cd">${c.code}</div><div class="nm">${esc(c.title)}
        ${lock&&cs.blocked_by.length?`<div class="why">needs ${cs.blocked_by.join(', ')}</div>`:''}</div>
        ${badge(st)}</div>`;
      /* A stand-down outranks the graph on screen, because it is the more
         recent fact and it is the one that says do not run this today. */
      if(cs.stood_down){
        h += `<div class="sd"><b>STOOD DOWN ${esc(cs.stood_down.date)}</b> — ${esc(cs.stood_down.why)}
          <br><b>Lifts when:</b> ${esc(cs.stood_down.lifts_when)}
          ${cs.stood_down.criterion_set ? (cs.stood_down.progress||[]).map(g =>
              `<br>&nbsp;&nbsp;${g.card} ${g.check} &middot; ${g.hits}/${g.of}
               &middot; <b>${g.have}/${g.need}</b> sessions since the stand-down`).join('')
            : '<br><b>This lift condition has no number. The standing rule says it needs one.</b>'}</div>`;
      }
      /* checks are shown for the card she is actually on — everywhere else they
         are noise, and a screen full of NOT RECORDED teaches nothing. */
      /* Also open a LOCKED card's checks when reps have been run against it
         anyway. WH-2 is the case: r1 10/10 and r2 5/5 are real numbers run
         ahead of the WH-1 gate, and hiding them would make the app look like it
         had lost work the handler actually did. They are shown, and they are
         labelled as banking nothing. */
      if(c.code===p.current || cs.status==='in_progress'
         || cs.checks.some(k=>k.status==='pre_gate')){
        for(const k of cs.checks){
          let right = '';
          if(k.status==='banked'||k.status==='in_progress')
            right = `${k.banked_sessions}/${k.need_sessions} sessions`;
          else if(k.status==='banked_assertion') right = 'on the record\u2019s word';
          else if(k.status==='short') right = `ran ${k.best_hits}/${k.of}, wants ${k.need_hits}`;
          else if(k.status==='pre_gate')
            right = `ran ${k.best_hits}/${k.of} \u00b7 banks nothing yet`;
          /* NOT RECORDED renders as words, never as the target number. Printed
             bare, "3/3" reads as a score she made rather than a check nobody
             ever ran, and absence is not evidence. */
          else right = `NOT RECORDED \u00b7 wants ${k.need_hits}/${k.of}`;
          const dim = (k.status==='not_recorded') ? ' style="color:var(--alert)"' : '';
          h += `<div class="ckmini"><span class="id">${k.id}</span>
            <span style="flex:1">${esc(k.label)}</span><span${dim}>${right}</span></div>`;
        }
      }
    }
    h += `</div>`;
  }
  v.innerHTML = h;
}

/* ------------------------------- WEEK TAB -------------------------------
   Wireframe screen 1 (Today) folded into a week, ruled 2026-08-09. Two screens
   computing "what runs now" from one state engine is two places to drift.

   THE RULE THIS SCREEN LIVES UNDER. APP_WIREFRAME.md 3 says no timeline:
   "a calendar turns a gate into a suggestion." What is forbidden is a FUTURE
   WITH CARDS WRITTEN ON IT by the app. So:

     PAST    the record. Built into the payload from history_seed.yaml and the
             export blocks in SESSIONS.md. Never guessed.
     TODAY   computed. What the gate graph says is legally open right now, with
             equipment and cap. This is screen 1.
     FUTURE  slots and rest days YOU set. The app never assigns a card to a
             date. The HORIZON block carries no dates at all — distance in
             stages, never in weeks.

   localStorage holds INTENTIONS ONLY, never outcomes. Clear it and nothing that
   matters is gone: the export pasted into SESSIONS.md is still the record.

   Rest renders as a FILLED block, not a gap. One full rest day a week is a
   standing program rule, and a screen that draws it as a hole is a streak
   counter wearing a hat — which APP_SESSIONLOG.md 6 bans outright. */

/* Real dates appear in exactly one place, per the wireframe: seasonal windows.
   As of 0.6.0 that place is SEASON.yaml, read by build_app.py and baked into the
   payload above. This was a hand-maintained const until 2026-08-10, and it drifted
   from REBA_PROGRAM.md — the 08-09 correction found two whole closures hiding
   inside spans both copies described as "split". One file, one set of dates, each
   carrying its own source: and checked:.

   Build-time, not runtime: the app must never fetch SEASON.yaml. That would make
   it a precached asset and force a service-worker cache bump on every date fix. */
const SEASON = (DECK.season && DECK.season.markers) || [];
const DOWN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

/* Date maths on the YYYY-MM-DD string via UTC, so nothing shifts a day when the
   phone is in Central and the browser reaches for local midnight. todayCentral()
   already names the zone; everything downstream is string arithmetic. */
function dnum(s){ const p = s.split('-').map(Number); return Date.UTC(p[0], p[1]-1, p[2]); }
function dstr(t){ return new Date(t).toISOString().slice(0,10); }
function addDays(s,n){ return dstr(dnum(s) + n*86400000); }
function dow(s){ return new Date(dnum(s)).getUTCDay(); }
function daysBetween(a,b){ return Math.round((dnum(b)-dnum(a))/86400000); }
function dlabel(s){ const d = new Date(dnum(s));
  return DOWN[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONN[d.getUTCMonth()]; }

const PLAN_KEY = 'reba.plan.v1';
function planLoad(){ try{ return JSON.parse(localStorage.getItem(PLAN_KEY) || '{}'); }
                     catch(e){ return {}; } }
function planSave(){ try{ localStorage.setItem(PLAN_KEY, JSON.stringify(PLAN)); }catch(e){} }
let PLAN = planLoad();
function planFor(d){ return PLAN[d] || {}; }

window.wkNav   = n => { state.weekStart = addDays(state.weekStart, n*7); state.dayOpen = null; render(); };
window.wkToday = () => { state.weekStart = todayCentral(); state.dayOpen = null; render(); };
window.dayTap  = d => { state.dayOpen = (state.dayOpen===d ? null : d); render(); };
window.setRest = d => { haptic(); const p = planFor(d); p.rest = !p.rest; PLAN[d] = p; planSave(); render(); };
window.setSlot = (d, slot, code) => { haptic(); const p = planFor(d);
  let arr = Array.isArray(p[slot]) ? p[slot].slice() : (p[slot] ? [p[slot]] : []);
  const i = arr.indexOf(code);
  if(i >= 0) arr.splice(i, 1); else if(arr.length < 2) arr.push(code);
  p[slot] = arr.length ? arr : null;
  PLAN[d] = p; planSave(); render(); };

function hist(d){ return (DECK.week && DECK.week.history && DECK.week.history[d]) || []; }
function ranOn(d){ return hist(d).length > 0; }

/* The active check on a card: the first one not already banked. This is what
   the handler is actually working, and it is what the slot chip should say. */
function activeCheck(code){
  const cs = DECK.state && DECK.state.cards[code];
  if(!cs || !cs.checks) return null;
  return cs.checks.find(k => k.status!=='banked' && k.status!=='banked_assertion') || null;
}

/* What is legally open right now, per track. A STOOD-DOWN track does not report
   its stage — it reports the cards its own lift condition names, because those
   are the reps that reopen it. */
function openNow(){
  const ST = DECK.state, out = [];
  if(!ST) return out;
  for(const t of TRACKS){
    const p = ST.tracks[t.tag] || {};
    if(p.stood_down){
      const cs = ST.cards[p.stood_down];
      const names = [];
      for(const g of ((cs.stood_down && cs.stood_down.progress) || []))
        if(names.indexOf(g.card) < 0) names.push(g.card);
      for(const nm of names){
        const c = DECK.cards.find(x => x.code===nm);
        if(c) out.push({card:c, why:'lifts ' + p.stood_down});
      }
      continue;
    }
    if(p.current){
      const c = DECK.cards.find(x => x.code===p.current);
      if(c) out.push({card:c, why:''});
    }
  }
  return out;
}

/* ---- Suggestion engine (ruled 2026-08-13) ----
   Rank open cards by: 1) one-away from banking, 2) gate leverage,
   3) staleness. Returns up to n suggestions. */
function suggest(openCards, n){
  const ST = DECK.state;
  if(!ST) return openCards.slice(0, n);
  const today = todayCentral();
  const histAll = (DECK.week && DECK.week.history) || {};

  /* gate leverage: how many locked cards sit behind each card (by id) */
  const idToCode = {};
  for(const c of DECK.cards) idToCode[c.id || ''] = c.code;
  const depCount = {};
  for(const c of DECK.cards){
    for(const rid of (c.requires || [])){
      const rcode = idToCode[rid];
      if(rcode) depCount[rcode] = (depCount[rcode] || 0) + 1;
    }
  }

  /* staleness: days since last session on this card */
  function staleDays(code){
    const dates = Object.keys(histAll).filter(d => {
      const recs = histAll[d];
      return recs && recs.some(r => r.card === code);
    }).sort();
    if(!dates.length) return 999;
    return daysBetween(dates[dates.length - 1], today);
  }

  const scored = openCards.map(o => {
    const code = o.card.code;
    const ac = activeCheck(code);
    const oneAway = ac && ac.need_sessions > 0 && ac.banked_sessions >= ac.need_sessions - 1 ? 1 : 0;
    const leverage = depCount[code] || 0;
    const stale = staleDays(code);
    return {o, oneAway, leverage, stale};
  });

  scored.sort((a, b) =>
    (b.oneAway - a.oneAway) ||
    (b.leverage - a.leverage) ||
    (b.stale - a.stale));

  return scored.slice(0, n).map(s => {
    let why = [];
    if(s.oneAway) why.push('1 session from banking');
    if(s.leverage) why.push('unlocks ' + s.leverage + ' card' + (s.leverage>1?'s':''));
    if(s.stale > 0 && s.stale < 999) why.push(s.stale + 'd since last');
    return {card: s.o.card, why: why.join(' · ')};
  });
}

function slotLine(c, why){
  const k = activeCheck(c.code);
  const eq = [];
  if(c.equipment && c.equipment.length) eq.push(c.equipment.join(' \u00b7 '));
  if(c.session_cap) eq.push('CAP ' + (c.session_cap.note || (c.session_cap.reps + ' reps max')));
  return `<div class="ran" onclick="state.openCard='${c.code}';tab('cards')">
      <div class="cd">${c.code}</div>
      <div style="flex:1">${esc(c.title)}
        ${k ? `<div class="eq">${esc(k.id)} \u00b7 ${esc(k.label)} \u00b7 wants ${k.need_hits}/${k.of}${k.need_sessions>1?' \u00d7'+k.need_sessions+'s':''}</div>` : ''}
        ${eq.length ? `<div class="eq">${esc(eq.join(' \u00b7 '))}</div>` : ''}
        ${why ? `<div class="eq">${esc(why)}</div>` : ''}</div></div>`;
}

function renderWeek(){
  const v = document.getElementById('vWeek');
  const today = todayCentral();
  /* A ROLLING SEVEN DAYS from today, not a Mon-Sun grid. The question this
     screen answers is "what is coming," and on a Sunday a Mon-Sun week is
     seven days of history with nothing left to plan. Nav moves by 7. */
  if(!state.weekStart) state.weekStart = today;
  const ws = state.weekStart;
  let h = '';

  /* days since last session */
  const histAll = (DECK.week && DECK.week.history) || {};
  const histDates = Object.keys(histAll).filter(d => histAll[d].length > 0).sort();
  if(histDates.length){
    const lastDate = histDates[histDates.length - 1];
    const gap = daysBetween(lastDate, today);
    const label = gap === 0 ? 'Last session: today' : gap === 1 ? 'Last session: yesterday' : `Last session: ${gap} days ago`;
    h += `<div class="days-since">${esc(label)}</div>`;
  }

  /* ---- season ribbon. The one place real dates are allowed. ---- */
  const tgt = SEASON.find(s => s.kind==='target');
  if(tgt){
    const n = daysBetween(today, tgt.date);
    h += `<div class="ribbon"><div class="big">${n>0? n+' days' : (n===0?'TODAY':'open')}</div>
      <div class="sub">${esc(tgt.label)}<br>${esc(tgt.date)}</div></div>`;
  }
  const others = SEASON.filter(s => s!==tgt && daysBetween(today, s.date) >= 0);
  if(others.length)
    h += `<div class="expo">` + others.map(s =>
      `${esc(s.label)} ${esc(s.date)}${s.kind==='exposure'?' \u2014 exposure, not a target':''}`).join(' &nbsp;\u00b7&nbsp; ') + `</div>`;

  /* ---- five-week cadence strip. Not a streak: worked, rest, and nothing are
     three neutral marks and none of them is scored. ---- */
  const end = addDays(ws, 6);
  const stripEnd = end > today ? today : end;   // the record never runs forward
  h += '<div class="strip">';
  for(let i = 34; i >= 0; i--){
    const d = addDays(stripEnd, -i);
    const p = planFor(d);
    const cls = ranOn(d) ? 'w' : (p.rest ? 'r' : '');
    h += `<i class="${cls}${d===today?' t':''}" title="${d}"></i>`;
  }
  h += '<span class="key">5 wks \u00b7 worked / rest</span></div>';

  /* ---- week nav ---- */
  h += `<div class="wknav"><button onclick="wkNav(-1)">&lsaquo;</button>
    <div class="lab">${esc(dlabel(ws))} \u2014 ${esc(dlabel(end))}</div>
    <button onclick="wkToday()">TODAY</button>
    <button onclick="wkNav(1)">&rsaquo;</button></div>`;

  const open = openNow();
  let restInWeek = false;

  for(let i = 0; i < 7; i++){
    const d = addDays(ws, i);
    const p = planFor(d);
    const rows = hist(d);
    const isToday = d===today, past = d < today;
    if(p.rest) restInWeek = true;

    h += `<div class="day ${isToday?'today':''}">
      <div class="dh" onclick="dayTap('${d}')"><b>${esc(dlabel(d))}</b>
      ${isToday?'<span class="rt">TODAY</span>':(past?'':'<span class="rt">TAP TO PLAN</span>')}</div>`;

    if(p.rest){
      h += `<div class="rest">REST DAY \u2014 one a week, standing rule</div>`;
    }

    /* PAST AND TODAY: what actually ran. The record, never a plan. */
    for(const r of rows){
      const c = DECK.cards.find(x => x.code===r.code);
      h += `<div class="ran" onclick="state.openCard='${r.code}';tab('cards')">
        <div class="cd">${esc(r.code)}</div>
        <div style="flex:1">${esc(c ? c.title : '')}
          <div class="eq">${esc(r.check)}${r.counts?'':' \u00b7 banks nothing'}</div></div>
        <div class="sc ${r.counts?'':'no'}">${r.hits}/${r.of}</div></div>`;
    }

    /* TODAY: screen 1. What is open, computed, with equipment. */
    if(isToday){
      const live = Object.keys(S.cards);
      if(live.length)
        h += `<div class="live"><b>Logging now:</b> ${live.map(esc).join(' \u00b7 ')} \u2014 in the LOG tab.
          Saved locally and synced to Firestore on export.</div>`;
      if(!p.rest){
        const sug = suggest(open, 2);
        if(sug.length){
          h += `<div class="slot"><span class="lb">SUGGESTED</span></div>`;
          for(const s of sug) h += slotLine(s.card, s.why);
          const rest = open.filter(o => !sug.some(s => s.card.code === o.card.code));
          if(rest.length){
            h += `<div class="slot"><span class="lb">ALSO OPEN</span></div>`;
            for(const o of rest) h += slotLine(o.card, o.why);
          }
        } else {
          h += `<div class="empty">Nothing open. Every track is banked, locked, or stood down.</div>`;
        }
      }
      for(const sl of ['am','pm']){
        const codes = Array.isArray(p[sl]) ? p[sl] : (p[sl] ? [p[sl]] : []);
        if(codes.length){ h += `<div class="slot"><span class="lb">${sl.toUpperCase()} \u2014 YOU PLANNED</span>`;
          for(const cd of codes){ const c = DECK.cards.find(x => x.code===cd); if(c) h += slotLine(c,''); }
          h += `</div>`; }
      }
    } else {
      /* FUTURE / PAST: only what YOU put there. */
      for(const sl of ['am','pm']){
        const codes = Array.isArray(p[sl]) ? p[sl] : (p[sl] ? [p[sl]] : []);
        if(codes.length){ h += `<div class="slot"><span class="lb">${sl.toUpperCase()}</span>`;
          for(const cd of codes){ const c = DECK.cards.find(x => x.code===cd); if(c) h += slotLine(c,''); }
          h += `</div>`; }
      }
      if(p.note) h += `<div class="empty">${esc(p.note)}</div>`;
      const hasAm = Array.isArray(p.am) ? p.am.length : !!p.am;
      const hasPm = Array.isArray(p.pm) ? p.pm.length : !!p.pm;
      if(!rows.length && !p.rest && !hasAm && !hasPm && !p.note)
        h += `<div class="empty">${past ? 'nothing recorded' : 'open \u2014 no slot set'}</div>`;
    }

    /* the day editor, only where planning is legal */
    if(state.dayOpen===d && !past){
      h += `<div class="slot"><span class="lb">PLAN THIS DAY</span>
        <div class="chips"><button class="chip ${p.rest?'on':''}" style="${p.rest?'background:var(--ink)':''}"
          onclick="setRest('${d}')">REST DAY</button></div>`;
      if(!p.rest){
        for(const sl of ['am','pm']){
          const sel = Array.isArray(p[sl]) ? p[sl] : (p[sl] ? [p[sl]] : []);
          h += `<span class="lb">${sl.toUpperCase()} (pick up to 2)</span><div class="chips">` +
            open.map(o => { const on = sel.includes(o.card.code);
              return `<button class="chip ${on?'on':''}"
              style="${on?'background:'+o.card.color:''}"
              onclick="setSlot('${d}','${sl}','${o.card.code}')">${o.card.code}</button>`; }).join('') + `</div>`;
        }
        h += `<div class="eq">Only cards that are open TODAY are offered. What is open next
          week depends on what happens this week, which is why the app will not write it for you.</div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  }

  if(!restInWeek && end >= today)
    h += `<div class="note">No rest day set this week. One full rest day a week is a standing rule
      \u2014 tap a day and set it.</div>`;

  /* ---- HORIZON. No dates, by design. Distance in stages. ---- */
  const ST = DECK.state;
  if(ST){
    h += `<div class="horizon"><h4>ON THE HORIZON</h4>
      <div class="eq" style="font-size:12.5px;color:var(--muted);margin-bottom:6px">
        What opens next, and what it waits on. No dates \u2014 a gate clears when the reps clear it.</div>`;
    for(const t of TRACKS){
      const p = ST.tracks[t.tag] || {};
      const last = lastRan(t.tag);
      let line;
      if(p.stood_down) line = `<b>${p.stood_down} stood down</b> \u2014 re-run the cards above to lift it`;
      else if(p.current) line = `on <b>${p.current}</b>${p.next && p.next!==p.current ? ` \u00b7 then ${p.next}` : ''}`;
      else if(p.next) line = `<b>${p.next}</b> locked \u2014 needs ${ (p.blocked_by||[]).join(', ') || 'a gate' }`;
      else line = 'nothing open';
      h += `<div class="hz"><div class="cd" style="color:${t.color}">${t.tag}</div>
        <div style="flex:1">${line}</div>
        <div class="ago">${last ? daysBetween(last, today)+'d ago' : 'not recorded'}</div></div>`;
    }
    h += `</div>`;
  }

  h += `<div class="note">The record is the past. Today is computed. The future is slots you set
    \u2014 the app will not put a card on a date it cannot know. Plans live on this phone only;
    clearing them loses nothing, because the export pasted into SESSIONS.md is the record.</div>`;

  v.innerHTML = h;
}

/* days since a track last ran, from the record only */
function lastRan(tag){
  const H = (DECK.week && DECK.week.history) || {};
  let best = null;
  for(const d of Object.keys(H))
    for(const r of H[d])
      if(r.code.indexOf(tag + '-')===0 && (!best || d > best)) best = d;
  return best;
}

/* ------------------------------- LOG TAB ------------------------------- */
function chipset(list, cur, setter, color){
  return `<div class="chips">` + list.map(x =>
    `<button class="chip ${cur===x?'on':''}" style="${cur===x?'background:'+(color||'var(--ink)'):''}" onclick="${setter}('${x}')">${x}</button>`).join('') + `</div>`;
}
function toggleChip(on, label, setter){
  return `<button class="chip ${on?'on':''}" style="${on?'background:var(--ink)':''}" onclick="${setter}()">${label}</button>`;
}
function haptic(ms){ if(navigator.vibrate) navigator.vibrate(ms||10); }
window.setLoc = v => { haptic(); S.location=v; if(v!=='Other') weatherForSite(v); render(); };
window.setHS = v => { haptic(); S.handler_state=v; render(); };
window.setTOD = v => { haptic(); S.tod=v; render(); };
window.setArc = v => { haptic(); S.arc=v; render(); };
window.setEnd = v => { haptic(); S.ended_on=v; render(); };
window.setWTK = v => { haptic(); S.water_temp_kind=v; render(); };
window.tSite = () => { haptic(); S.new_site=!S.new_site; render(); };
window.tGround = () => { haptic(); S.new_ground=!S.new_ground; render(); };
window.tHelper = () => { haptic(); S.helper=!S.helper; render(); };
window.tBirds = () => { haptic(); S.birds=!S.birds; render(); };
window.tCard = code => {
  haptic();
  if(S.cards[code]) delete S.cards[code];
  else S.cards[code] = {assist:'none', checks:{}, no_count:'', no_count_why:'', modes:[], observed:'',
                        rung:'', dog_state:''};
  render();
};
window.setAssist = (code,v) => { haptic(); S.cards[code].assist=v; render(); };
window.setDog = (code,v) => { haptic(); S.cards[code].dog_state=v; render(); };
/* A block is ONE rung, so the rung sits at card level — which is also where
   state.py reads it (`k.get("rung", c.get("rung"))`). Shown only for cards that
   actually declare a rung-gated check, so it never appears where it is noise. */
function rungGated(c){ return (c.checks||[]).some(k => k.rung !== undefined && k.rung !== null); }
function rungOf(c){ const k = (c.checks||[]).find(k => k.rung !== undefined && k.rung !== null); return k ? k.rung : null; }
window.tCheck = (code,id) => {
  haptic();
  const ck = S.cards[code].checks;
  if(ck[id]) delete ck[id]; else ck[id]={hits:''};
  render();
};
window.tMode = (code,i) => {
  haptic();
  const m = S.cards[code].modes;
  const j = m.indexOf(i); if(j>=0) m.splice(j,1); else m.push(i);
  render();
};
function bind(id, path){ // text inputs write straight into S without re-render
  setTimeout(()=>{ const el=document.getElementById(id); if(!el) return;
    el.oninput = e => { let o=S, p=path.slice(); const k=p.pop(); for(const q of p) o=o[q]; o[k]=e.target.value; }; },0);
}

/* ---- THE OUTING HEADER IS NOT ALLOWED TO SURVIVE A DAY ------------------
   Export defect 1, found 2026-08-10: three blocks run that morning all exported
   carrying date 2026-08-09, plus a stale temp and a length_min of 10 covering 25
   reps. Cause: `S` is built once at page load and never reset, and a PWA launched
   from the home screen is never reloaded — so the header typed on the 9th was
   still sitting there on the 10th. Corrected by hand that day, which does not
   scale and is exactly the kind of rule that depends on someone remembering.
   Two mechanisms, because either alone leaks: a hard block at export when the
   header's date is not today, and a reset offered the moment an export lands. */
function newOuting(){
  S = { date: todayCentral(), tod:'',
        location:'', locOther:'', new_site:false, new_ground:false,
        temp_f:'', length_min:'', helper:false, birds:false, handler_state:'',
        cards:{}, water_temp_f:'', water_temp_kind:'',
        arc:'', ended_on:'', notes:'' };
  render();
}
window.newOuting = newOuting;
window.useToday = () => { S.date = todayCentral(); render(); };

function setLogMode(m){ state.logMode=m; render(); }
window.setLogMode = setLogMode;

function toggleHistOuting(key){
  state.histOpen[key] = !state.histOpen[key]; render();
}
window.toggleHistOuting = toggleHistOuting;

function renderHistory(){
  const outings = DECK.sessions || [];
  let h = '';
  if(!outings.length){
    h += '<div style="text-align:center;color:var(--muted);padding:30px 0">No sessions recorded yet.</div>';
    return h;
  }
  for(const o of outings){
    const key = o.date + '|' + (o.tod||'');
    const open = state.histOpen[key];
    const loc = o.location || '';
    const meta = [o.tod, loc, o.length_min ? o.length_min+'m' : '', o.temp_f ? o.temp_f+'°F' : ''].filter(Boolean).join(' · ');
    const ncards = o.cards ? o.cards.length : 0;
    h += `<div class="sh-outing">`;
    h += `<div class="sh-head" onclick="haptic();toggleHistOuting('${key}')">
      <div><div class="sh-date">${esc(o.date)}</div><div class="sh-meta">${esc(meta)}</div></div>
      <div class="sh-meta">${ncards} card${ncards!==1?'s':''} ${open?'▾':'▸'}</div></div>`;
    if(open && o.cards){
      h += '<div class="sh-body">';
      for(const c of o.cards){
        const dc = DECK.cards.find(x=>x.code===c.card);
        h += `<div class="sh-card"><div class="sh-cname" style="color:${dc?dc.color:'var(--ink)'}">${esc(c.card)}${dc?' · '+esc(dc.title):''}</div>`;
        if(c.dog_state) h += `<div class="sh-meta">dog: ${esc(c.dog_state)}${c.assist && c.assist!=='none' ? ' · assist: '+esc(c.assist) : ''}</div>`;
        for(const k of (c.checks||[])){
          const spec = dc ? dc.checks.find(s=>s.id===k.id) : null;
          const threshold = spec ? spec.hits : null;
          const met = threshold !== null && k.hits >= threshold;
          h += `<div class="sh-check"><span class="sh-score ${met?'sh-pass':'sh-fail'}">${k.hits}/${k.of}</span>`;
          h += `<span>${esc(k.id)}</span>`;
          if(spec) h += `<span class="sh-label">${esc(spec.label)}</span>`;
          if(!k.counts) h += `<span class="sh-meta">(no-count)</span>`;
          h += `</div>`;
        }
        if(c.observed) h += `<div class="sh-meta" style="padding:4px 0 0 12px;font-style:italic">${esc(c.observed)}</div>`;
        h += `</div>`;
      }
      h += '</div>';
    }
    h += '</div>';
  }
  return h;
}

function renderLog(){
  const v = document.getElementById('vLog');
  let h = '';

  /* toggle: Log Session / History */
  h += `<div class="log-toggle">
    <button class="${state.logMode==='log'?'on':''}" onclick="haptic();setLogMode('log')">LOG SESSION</button>
    <button class="${state.logMode==='history'?'on':''}" onclick="haptic();setLogMode('history')">HISTORY</button></div>`;

  if(state.logMode==='history'){
    h += renderHistory();
    v.innerHTML = h;
    /* hide fab in history mode */
    const fab = document.getElementById('fabExport');
    if(fab) fab.classList.remove('show');
    return;
  }

  const wa = Object.keys(S.cards).some(c=>c.startsWith('WA-'));

  const today = todayCentral();
  if(S.date !== today){
    h += `<div class="warn"><b>This header is dated ${esc(S.date)}. Today is ${today}.</b><br>
      An outing header left open overnight is what stamped three 08-10 sessions as 08-09.
      <div style="margin-top:8px"><button class="chip" style="background:var(--alert)" onclick="useToday()">USE ${today}</button>
      <button class="chip" onclick="newOuting()">START A NEW OUTING</button></div>
      Keep the old date only if you are deliberately logging an earlier session.</div>`;
  }

  h += `<div class="fs"><h3>1 · BEFORE — outing context</h3>
    <div class="why">Once per trip. Handler state is asked before, not after — after is rationalisation.</div>
    <div class="row2"><div><label class="f">Date <span class="hint">Central</span></label><input type="date" id="f_date" value="${S.date}"></div>
    <div><label class="f">Length <span class="hint">min</span></label><input type="number" id="f_len" value="${S.length_min}"></div></div>
    <label class="f">AM or PM <span class="req">*</span> <span class="hint">not pre-filled on purpose — a wrong default is worse than a blank</span></label>${chipset(TOD, S.tod, 'setTOD')}
    <label class="f">Location</label>
    <div style="margin:6px 0 4px"><button class="chip" style="background:var(--ink);color:#fff;border-color:var(--ink)" onclick="detectLocation()">📍 WHERE AM I?</button> <span id="geoResult" style="font-size:13px"></span></div>
    <div id="wxInfo" style="font-size:13px;font-weight:600;margin:0 0 6px;min-height:18px"></div>
    ${chipset(LOCS(), S.location, 'setLoc')}
    ${S.location==='Other'?`<input type="text" id="f_loco" placeholder="where" value="${esc(S.locOther)}">`:''}
    <label class="f">New to whom? <span class="hint">site = new place for you · ground = new footing/area for HER</span></label>
    <div class="chips">${toggleChip(S.new_site,'new SITE','tSite')}${toggleChip(S.new_ground,'new GROUND','tGround')}</div>
    <div class="row2"><div><label class="f">Air temp °F</label><input type="number" id="f_temp" value="${S.temp_f}"></div>
    <div><label class="f">Handler state <span class="req">*</span></label>${chipset(HSTATE, S.handler_state, 'setHS')}</div></div>
    <div class="chips">${toggleChip(S.helper,'helper','tHelper')}${toggleChip(S.birds,'birds','tBirds')}</div>
  </div>`;

  h += `<div class="fs"><h3>2 · CARDS RUN — counts first</h3>
    <div class="why">Counts anchor before any summary. Chips below are generated from tracks.yaml build ${DECK.build} — never hand-written.</div>
    <div class="why"><b>Tap every card you ran — one outing holds as many as you like.</b> Three blocks in a
      morning is one outing with three cards, not three exports. (This always worked; nothing on screen said so.)</div>`;
  const logCards = DECK.cards.filter(c=>c.type==='stage'||c.type==='reference');
  for(const t of TRACKS){
    const tc = logCards.filter(c=>c.track===t.tag);
    if(!tc.length) continue;
    h += `<div class="track-group-hdr" style="color:${t.color}">${t.tag}</div><div class="chips">` +
      tc.map(c=>
        `<button class="chip ${S.cards[c.code]?'on':''}" style="${S.cards[c.code]?'background:'+c.color:''}" onclick="tCard('${c.code}')">${c.code}</button>`).join('') +
      `</div>`;
  }

  for(const code of Object.keys(S.cards)){
    const c = DECK.cards.find(x=>x.code===code); const cs = S.cards[code];
    h += `<div class="cardlog"><div class="hd"><span class="dot" style="background:${c.color}"></span>${code} · ${esc(c.title)}</div>`;
    if(c.session_cap) h += `<div class="capnote">CAP: ${esc(c.session_cap.note || (c.session_cap.reps+' reps max'))}</div>`;
    if(c.checks.length){
      h += `<label class="f">Checks attempted <span class="hint">tap to add — hits required for each</span></label>`;
      for(const k of c.checks){
        const on = cs.checks[k.id];
        h += `<div class="ckline">
          <button class="chip ${on?'on':''}" style="${on?'background:'+c.color:''}" onclick="tCheck('${code}','${k.id}')">${k.id}</button>
          <span class="lb">${esc(k.label)}</span>`;
        if(on){ const iid = `hits_${code}_${k.id}`;
          h += `hits <input type="number" id="${iid}" value="${on.hits}"> <span class="of">/ ${k.of}</span>`;
          bind(iid, ['cards',code,'checks',k.id,'hits']);
        }
        h += `</div>`;
      }
    }
    if(rungGated(c)){
      const rid = `rung_${code}`;
      h += `<label class="f">Rung <span class="req">*</span> <span class="hint">this card's PASS counts at rung ${rungOf(c)} only — a rung-less row banks nothing</span></label>
        <input type="number" id="${rid}" value="${cs.rung}" min="1">`;
      bind(rid, ['cards',code,'rung']);
    }
    h += `<label class="f">HER state, this block <span class="req">*</span> <span class="hint">not yours — asked per block, because it changes between them</span></label>${
      DSTATE.map(x=>`<button class="chip ${cs.dog_state===x?'on':''}" style="${cs.dog_state===x?'background:'+c.color:''}" onclick="setDog('${code}','${x}')">${x}</button>`).join(' ')}`;
    // filter assists: required equipment is NOT an assist (08-09 ruling)
    // equipment tokens → assist tokens they exclude
    const EQ_TO_ASSIST = {lead:'lead_foot', check_cord:'check_cord', corridor:'corridor',
      feature_one_side:'feature_one_side', place_board:'place_board', handler_proximity:'handler_proximity'};
    const excluded = new Set((c.equipment||[]).map(e => EQ_TO_ASSIST[e]).filter(Boolean));
    const avail = ASSISTS.filter(a => a === 'none' || !excluded.has(a));
    if (avail.length > 1) {
      h += `<label class="f">Assist</label>${avail.map(a=>
        `<button class="chip ${cs.assist===a?'on':''}" style="${cs.assist===a?'background:var(--ink)':''}" onclick="setAssist('${code}','${a}')">${a}</button>`).join(' ')}
      <div class="why">Assisted reps are the training, not the test — anything but <b>none</b> is logged and does not count toward PASS.</div>`;
    } else {
      // all assists are required equipment — auto-set none, skip the picker
      cs.assist = 'none';
    }
    const nid=`nc_${code}`, nyid=`ncw_${code}`, oid=`obs_${code}`;
    h += `<div class="row2"><div><label class="f">No-counts</label><input type="number" id="${nid}" value="${cs.no_count}"></div>
      <div><label class="f">Why</label><input type="text" id="${nyid}" value="${esc(cs.no_count_why)}"></div></div>`;
    bind(nid,['cards',code,'no_count']); bind(nyid,['cards',code,'no_count_why']);
    if(c.ifthen.length){
      h += `<label class="f">Failure modes seen <span class="hint">from this card's IF rows only</span></label><div class="chips">` +
        c.ifthen.map((r,i)=>`<button class="chip ${cs.modes.includes(i)?'on':''}" style="${cs.modes.includes(i)?'background:var(--alert)':''}" onclick="tMode('${code}',${i})">${esc(r[0].slice(0,42))}</button>`).join('') + `</div>`;
    }
    h += `<label class="f">OBSERVED — outside scored reps <span class="hint">what you noticed, not what you scored</span></label>
      <textarea id="${oid}">${esc(cs.observed)}</textarea></div>`;
    bind(oid,['cards',code,'observed']);
  }
  h += `</div>`;

  h += `<div class="fs"><h3>3 · AFTER — wrap</h3>`;
  if(wa){
    h += `<label class="f">Water temp °F <span class="req">* required on water outings</span></label>
      <div class="row2"><div><input type="number" id="f_wt" value="${S.water_temp_f}"></div>
      <div>${chipset(['reading','estimate'], S.water_temp_kind, 'setWTK')}</div></div>`;
  }
  h += `<label class="f">Session arc</label>${chipset(['built','flat','declined'], S.arc, 'setArc')}
    <label class="f">Ended on</label>${chipset(['fun rep','neutral','pressure rep'], S.ended_on, 'setEnd')}
    ${S.ended_on==='pressure rep'?'<div class="warn">Standing rule: never end a session on a pressure rep. Logged as it happened.</div>':''}
    <label class="f">Notes</label><textarea id="f_notes">${esc(S.notes)}</textarea></div>`;

  h += `<div id="exportBox"></div><button id="inlineExport" class="go" onclick="haptic();doExport()">VALIDATE &amp; EXPORT</button>
    <div class="subtle">Nothing is stored in this app. The export block pasted into SESSIONS.md is the record.</div>`;
  v.innerHTML = h;
  /* floating export button visibility — hide inline when fab is showing */
  const fab = document.getElementById('fabExport');
  const hasCards = Object.keys(S.cards).length > 0 && state.tab==='log';
  if(fab) fab.classList.toggle('show', hasCards);
  const ib = document.getElementById('inlineExport');
  if(ib) ib.style.display = hasCards ? 'none' : '';
  bind('f_notes',['notes']); bind('f_temp',['temp_f']); bind('f_len',['length_min']);
  bind('f_wt',['water_temp_f']); bind('f_loco',['locOther']); bind('f_date',['date']);
}

function doExport(){
  const miss = [];  // each entry: {msg, anchor} where anchor is an element id or selector
  if(!S.handler_state) miss.push({msg:'handler state (asked before the session)', anchor:'f_date'});
  if(!S.location) miss.push({msg:'location', anchor:'f_date'});
  if(!S.tod) miss.push({msg:'AM or PM — SESSIONS.md headings are dated AND timed', anchor:'f_date'});
  if(!Object.keys(S.cards).length) miss.push({msg:'at least one card run', anchor:null});
  const wa = Object.keys(S.cards).some(c=>c.startsWith('WA-'));
  if(wa && !S.water_temp_f) miss.push({msg:'water temp — required on water outings', anchor:'f_wt'});
  if(wa && S.water_temp_f && !S.water_temp_kind) miss.push({msg:'water temp: reading or estimate?', anchor:'f_wt'});
  const today = todayCentral();
  if(S.date !== today) miss.push({msg:`header dated ${S.date}, today is ${today} — use the banner at the top to fix it, or keep it deliberately`, anchor:'f_date'});
  for(const [code,cs] of Object.entries(S.cards)){
    for(const [id,ck] of Object.entries(cs.checks))
      if(ck.hits==='') miss.push({msg:`${code} ${id}: hits count — required, not skippable`, anchor:`hits_${code}_${id}`});
    const c = DECK.cards.find(x=>x.code===code);
    if(rungGated(c) && cs.rung==='')
      miss.push({msg:`${code}: rung — this card's PASS is rung-gated and a row without one banks nothing`, anchor:`rung_${code}`});
    if(!cs.dog_state) miss.push({msg:`${code}: her state for this block`, anchor:null});
  }
  const softs = [];
  const hr = parseInt(new Intl.DateTimeFormat('en-GB',{timeZone:'America/Chicago',hour:'2-digit',hour12:false}).format(new Date()),10);
  if(S.date===today && S.tod==='AM' && hr>=12) softs.push(`logged AM but it is ${hr}:00 Central — right if you are writing up this morning, wrong if this was the evening block`);
  if(S.date===today && S.tod==='PM' && hr<12) softs.push(`logged PM but it is ${hr}:00 Central — check the date and the half`);
  const box = document.getElementById('exportBox');
  if(miss.length){
    box.innerHTML = `<div class="missing"><b>Cannot export — required fields missing:</b><br>` +
      miss.map(m => m.anchor
        ? `<div style="cursor:pointer;padding:3px 0" onclick="scrollToField('${m.anchor}')">· ${esc(m.msg)}</div>`
        : `<div style="padding:3px 0">· ${esc(m.msg)}</div>`).join('') + `</div>`;
    return;
  }
  let y = `# session ${S.date} — exported by reba app (deck ${DECK.build})\noutin`+`g:\n`;
  y += `  date: ${S.date}   # America/Chicago\n  tod: ${S.tod}\n  location: ${S.location==='Other'?(S.locOther||'other'):S.location}\n`;
  y += `  new_site: ${S.new_site}\n  new_ground: ${S.new_ground}\n`;
  if(S.temp_f) y += `  temp_f: ${S.temp_f}\n`;
  if(S.length_min) y += `  length_min: ${S.length_min}\n`;
  y += `  helper: ${S.helper}\n  birds: ${S.birds}\n  handler_state: ${S.handler_state}\n`;
  if(S.water_temp_f) y += `  water_temp_f: ${S.water_temp_f}   # ${S.water_temp_kind}\n`;
  y += `dog_sessions:\n  - dog: ${getActiveDog().toLowerCase()}\n    cards:\n`;
  for(const [code,cs] of Object.entries(S.cards)){
    const c = DECK.cards.find(x=>x.code===code);
    y += `      - card: ${code}\n        assist: ${cs.assist}\n`;
    if(cs.rung!=='') y += `        rung: ${cs.rung}\n`;
    if(cs.dog_state) y += `        dog_state: ${cs.dog_state}\n`;
    const cks = Object.entries(cs.checks);
    if(cks.length){ y += `        checks:\n`;
      for(const [id,ck] of cks){
        const spec = c.checks.find(k=>k.id===id);
        y += `          - {id: ${id}, hits: ${ck.hits}, of: ${spec.of}, counts: ${cs.assist==='none'}}\n`;
      }}
    if(cs.no_count) y += `        no_count: {reps: ${cs.no_count}, why: "${cs.no_count_why}"}\n`;
    if(cs.modes.length) y += `        failure_modes:\n` + cs.modes.map(i=>`          - "${c.ifthen[i][0]}"\n`).join('');
    if(cs.observed) y += `        observed: "${cs.observed.replace(/"/g,"'")}"\n`;
  }
  if(S.arc) y += `    arc: ${S.arc}\n`;
  if(S.ended_on) y += `    ended_on: ${S.ended_on.replace(' ','_')}\n`;
  if(S.notes) y += `    notes: "${S.notes.replace(/"/g,"'")}"\n`;
  box.innerHTML = `<div class="export"><h3 style="margin:0 0 6px">EXPORT — paste into SESSIONS.md</h3>` +
    (softs.length ? `<div class="warn">${softs.map(esc).join('<br>')}</div>` : '') +
    `<pre id="yml">${esc(y)}</pre>
    <button class="copy" onclick="haptic();navigator.clipboard.writeText(document.getElementById('yml').textContent).then(()=>{haptic();this.textContent='COPIED'})">COPY</button>
    <button class="copy" id="clearBtn" onclick="confirmClear(this)">PASTED — CLEAR FOR THE NEXT OUTING</button>
    <div class="subtle">Clear it before the app goes in your pocket. A header left open overnight is what dated three 08-10 blocks as 08-09.</div></div>`;
  /* ── store session rows in IndexedDB and recompute state ── */
  (async function(){
    try {
      const sessionRows = [];
      for (const [code, cs] of Object.entries(S.cards)) {
        const c = DECK.cards.find(x => x.code === code);
        for (const [id, ck] of Object.entries(cs.checks)) {
          const spec = c.checks.find(k => k.id === id);
          sessionRows.push({
            card: code, check: id, date: S.date,
            hits: Number(ck.hits), of: spec.of,
            counts: cs.assist === 'none',
            assist: cs.assist || 'none',
            rung: cs.rung !== '' ? Number(cs.rung) : undefined,
            machine: true, source: 'app',
          });
        }
      }
      if (sessionRows.length) {
        const db = await openSessionsDB();
        await idbPutAll(db, sessionRows);
        /* ── store outing object in IDB so History tab works between builds ── */
        const outingObj = {
          date: S.date,
          tod: S.tod,
          location: S.location === 'Other' ? (S.locOther || 'other') : S.location,
          temp_f: S.temp_f || null,
          length_min: S.length_min || null,
          water_temp_f: S.water_temp_f || null,
          cards: Object.entries(S.cards).map(([code, cs]) => {
            const c = DECK.cards.find(x => x.code === code);
            return {
              card: code, assist: cs.assist,
              rung: cs.rung !== '' ? Number(cs.rung) : null,
              dog_state: cs.dog_state || null,
              observed: cs.observed || null,
              checks: Object.entries(cs.checks).map(([id, ck]) => {
                const spec = c.checks.find(k => k.id === id);
                return { id, hits: Number(ck.hits), of: spec ? spec.of : 10, counts: cs.assist === 'none' };
              }),
            };
          }),
        };
        await idbPutOuting(db, outingObj);
        /* ── fire-and-forget Firestore write (REST, no SDK) ── */
        fsWrite('sessions', {
          dog: getActiveDog().toLowerCase(),
          handler: getHandler(),
          outing: {
            date: S.date,
            tod: S.tod,
            location: S.location === 'Other' ? (S.locOther || 'other') : S.location,
            new_site: S.new_site,
            new_ground: S.new_ground,
            helper: S.helper,
            birds: S.birds,
            handler_state: S.handler_state,
            temp_f: S.temp_f || null,
            length_min: S.length_min || null,
            water_temp_f: S.water_temp_f || null,
            water_temp_kind: S.water_temp_kind || null,
          },
          cards: Object.entries(S.cards).map(([code, cs]) => {
            const c = DECK.cards.find(x => x.code === code);
            return {
              card: code,
              assist: cs.assist,
              rung: cs.rung !== '' ? Number(cs.rung) : null,
              dog_state: cs.dog_state || null,
              observed: cs.observed || null,
              checks: Object.entries(cs.checks).map(([id, ck]) => {
                const spec = c.checks.find(k => k.id === id);
                return { id, hits: Number(ck.hits), of: spec ? spec.of : 10, counts: cs.assist === 'none' };
              }),
            };
          }),
          deck_build: DECK.build,
        }).then(r => {
          if (r.ok) {
            const t = document.createElement('div');
            t.textContent = 'Synced to cloud';
            t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#2E7D4F;color:#fff;padding:6px 16px;border-radius:8px;z-index:999;font-size:13px;';
            document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
          } else {
            r.text().then(txt => {
              const t = document.createElement('div');
              t.textContent = 'Cloud sync failed: ' + r.status;
              t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#A32E1E;color:#fff;padding:6px 16px;border-radius:8px;z-index:999;font-size:13px;max-width:90%;';
              document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
              console.error('Firestore REST error:', r.status, txt);
            });
          }
        }).catch(e => {
          console.warn('Firestore offline, will retry later:', e);
        });
        await recomputeState();
        const note = document.createElement('div');
        note.textContent = 'State updated';
        note.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:8px;font-size:14px;font-weight:700;z-index:99;opacity:1;transition:opacity .5s;';
        document.body.appendChild(note);
        setTimeout(() => { note.style.opacity = '0'; }, 1500);
        setTimeout(() => { note.remove(); }, 2100);
      }
    } catch(e) { console.error('Session store failed:', e); }
  })();
  box.scrollIntoView({behavior:'smooth'});
}

/* scroll to and highlight a field on validation error tap */
window.scrollToField = function(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('field-highlight');
  void el.offsetWidth;  // force reflow to restart animation
  el.classList.add('field-highlight');
  el.addEventListener('animationend', () => el.classList.remove('field-highlight'), {once:true});
};

/* two-step clear confirmation */
let clearTimer = null;
function confirmClear(btn){
  haptic();
  if(btn.dataset.armed){
    clearTimeout(clearTimer); clearTimer = null;
    btn.dataset.armed = '';
    newOuting();
    return;
  }
  btn.dataset.armed = '1';
  btn.textContent = 'TAP AGAIN TO CLEAR';
  btn.classList.add('confirm-warn');
  clearTimer = setTimeout(() => {
    btn.textContent = 'PASTED \u2014 CLEAR FOR THE NEXT OUTING';
    btn.classList.remove('confirm-warn');
    btn.dataset.armed = '';
  }, 3000);
}
window.confirmClear = confirmClear;

function render(){ renderWeek(); renderCards(); renderTracks(); renderLog(); }

/* ── Boot: show home screen, then load data in background ──────────────── */
renderHome();
recomputeState();

/* ── Firestore sync on load — merge sessions from other devices (REST) ──── */
(async function syncFromFirestore() {
  try {
    const allDocs = await fsReadAll('sessions');
    const activeDog = getActiveDog().toLowerCase();
    const docs = allDocs.filter(d => (d.dog || '').toLowerCase() === activeDog);
    if (!docs.length) return;
    const db = await openSessionsDB();
    const existing = await idbGetAll(db);
    const seen = new Set(existing.map(r => `${r.date}|${r.card}|${r.check}`));
    const toMerge = [];
    for (const d of docs) {
      if (!d.outing || !d.cards) continue;
      const date = d.outing.date;
      for (const cs of d.cards) {
        for (const ck of (cs.checks || [])) {
          const key = `${date}|${cs.card}|${ck.id}`;
          if (!seen.has(key)) {
            seen.add(key);
            toMerge.push({
              card: cs.card, check: ck.id, date,
              hits: ck.hits, of: ck.of, counts: ck.counts,
              assist: cs.assist || 'none',
              rung: cs.rung != null ? cs.rung : undefined,
              machine: true, source: 'firestore',
            });
          }
        }
      }
    }
    if (toMerge.length) {
      await idbPutAll(db, toMerge);
      await recomputeState();
    }
  } catch (e) { console.warn('Firestore sync skipped (offline?):', e); }
})();

/* ---------- pull to refresh — CARDS AND WEEK ONLY ---------- */
(function(){
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;'
    + 'display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;'
    + 'background:var(--bg);color:var(--muted);font-size:12px;letter-spacing:.08em;'
    + 'z-index:99;transition:height .12s ease-out;';
  document.body.appendChild(bar);
  const MAX = 80, TRIP = 56;
  let y0 = null, armed = false;
  const atTop = () => (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
  const reset = () => { bar.style.height = '0px'; y0 = null; armed = false; };
  addEventListener('touchstart', e => {
    if((state.screen !== 'tab' || (state.tab !== 'cards' && state.tab !== 'week')) || state.openCard || !atTop() || e.touches.length !== 1
       || document.getElementById('dgm').style.display === 'block'){ y0 = null; return; }
    y0 = e.touches[0].clientY; armed = false;
  }, {passive:true});
  addEventListener('touchmove', e => {
    if(y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if(dy <= 0){ bar.style.height = '0px'; armed = false; return; }
    const h = Math.min(MAX, dy * 0.55);
    bar.style.height = h + 'px';
    armed = h >= TRIP;
    bar.textContent = armed ? 'RELEASE TO REFRESH' : 'PULL TO REFRESH';
  }, {passive:true});
  addEventListener('touchend', () => {
    if(y0 === null) return;
    if(armed){ bar.textContent = 'REFRESHING'; location.reload(); }
    else reset();
  }, {passive:true});
  addEventListener('touchcancel', reset, {passive:true});
})();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
