raction, 10/10 across two sessions. A 2-min hold with the\ndistraction moving at 10 yds, 8/10. One clean zero-second-command session\nin each of three novel locations.\n","body": "","ifthen": [["Solid at home, sloppy anywhere new","That is habit, not obedience. Treat every new place as a new dog: drop all three D's to their floors and re-climb."],["Falls apart when a distraction appears","You raised distraction without dropping distance and duration. One D moves at a time."],["Needs a second command more than once a session","The first command is going optional. That command goes back on the line for a week, every first command enforced."]],"checks": [{"id": "c1","label": "First-command sit at 20 yds, novel ground","hits": 9,"of": 10,"provisional": true},{"id": "c2","label": "First-command here past a mild distraction","hits": 10,"of": 10,"sessions": 2,"provisional": true},{"id": "c3","label": "2-min hold, distraction moving at 10 yds","hits": 8,"of": 10,"provisional": true},{"id": "c4","label": "Zero-second-command session in a novel location","hits": 3,"of": 3,"provisional": true}],"session_cap": null,"equipment": ["check_cord","tab"],"requires": ["OB-2","OB-3","OB-4","OB-5"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "OB-R1","id": "obedience.ref_oneword","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "reference","n": null,"title": "One Command, One Meaning","drill": "","pass": "","body": "Every command is one word, said once. A repeated command teaches the dog that\nthe first one was optional. If the dog does not respond to the first command,\ndo not say it again \u2014 get up, walk to the dog, and physically guide it into\nthe correct position in silence. The correction is the walk, not a louder\nvoice.\n\nPick one word per action and use it forever. No synonyms: \"sit down\" is two\ncommands, and \"down\" is not \"sit.\" There is no \"stay\" \u2014 sit means sit until\nthe release word.\n\n\"Here\" is the recall until the whistle takes it over \u2014 the whistle overlays\nthe word the same way it overlays \"sit\" in {ref:whistle.s1}. Do not use\nthe recall word in situations you cannot enforce or would rather not win.\n\nPick one release word and guard it. Not a word the household says all day.\nEveryone who handles the dog uses the same command set or none of it.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "OB-R2","id": "obedience.ref_corrections","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "reference","n": null,"title": "Corrections Before the Collar","drill": "","pass": "","body": "No e-collar anywhere on this track. Before the collar, a correction is one\nof three things:\n\nPrevention \u2014 the lead or the wall makes the mistake impossible. A dog that\ncannot break does not practice breaking.\n\nEnforcement \u2014 the cord or your feet finish the command the dog ignored.\nWalk to the dog in silence, re-place it, then run a rep it can win.\n\nReset \u2014 re-place the dog on the exact spot and try again at a lower\ndifficulty. No scolding, no emotion.\n\nWhat a correction is never: a louder repeat of the command, a lead jerk in\nanger, or pressure on a command the dog has not finished learning. Below the\n8/10 teaching bar, a miss is a training-level problem, not disobedience \u2014\ndrop a step instead of correcting.\n\nThe walk-out is the enforcement that matters, and it caps your working\ndistance: if you cannot reach the dog, you cannot enforce, so you do not\ngive the command. That is why distance climbs slowly on this track.\n\nThe e-collar arrives in Force & Collar, only on commands that passed Stage 6.\nIt reminds the dog of a known command. It never teaches one.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "OB-R3","id": "obedience.ref_delivery","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "reference","n": null,"title": "Delivery to Hand","drill": "","pass": "","body": "A clean delivery means the dog comes straight in, sits squarely in front\nof you, and holds the bumper (or bird) in its mouth until you take it. Not\na drop at your feet, not a circling approach, not a head turn that makes\nyou chase the bumper out of the dog's mouth.\n\nDelivery is built in three phases:\n\n1. Come to front. On recall, the dog sits facing you within arm's reach.\nIf the dog swings wide or sits beside you instead of in front, use a wall\nor fence behind you to funnel the approach. Mark and reward every square\nfront sit. This is an obedience behavior \u2014 train it without a bumper first.\n\n2. Hold on arrival. With a bumper in its mouth, the dog comes to front and\nholds until you reach under the chin with one hand and take the bumper\nwith the other. Say \"give\" or \"drop\" (one word, always the same) as you\ntake it. If the dog drops early, put the bumper back in the dog's mouth,\nsay \"hold,\" and count to three before taking it. The dog learns that\ndropping does not end the hold \u2014 it restarts it.\n\n3. Hold under excitement. After a thrown mark, the dog retrieves and\ndelivers to front with a clean hold. This is the test \u2014 excitement makes\nthe hold harder. A sloppy delivery after an exciting mark means the hold\nis not solid enough. Go back to phase 2.\n\nA dog that drops the bird in the marsh instead of delivering to hand is a\ndog that loses birds. A dog that runs past you is a dog that gets a second\nretrieve ({term:parading}) instead of a clean exchange. On a hunt test, a dropped\nbird or a sloppy delivery is a failed retrieve.\n\nThe carrying culture in {ref:puppy.ref_carry} builds voluntary hold habits. This\ncard turns that culture into a trained, reliable behavior.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "OB-R4","id": "obedience.ref_sessions","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "reference","n": null,"title": "Session Length by Age","drill": "","pass": "","body": "Caps on formal obedience time per session. Play, socialization, and retrieve\nsessions do not count against these.\n\n8\u201310 weeks: 3\u20135 minutes, 2\u20133 sessions per day.\n10\u201312 weeks: 5 minutes, 2\u20133 sessions per day.\n12\u201316 weeks: 5\u201310 minutes, 2 sessions per day.\n4\u20136 months: 8\u201310 minutes, 1\u20132 sessions per day.\n6\u201312 months: 10\u201315 minutes, once per day.\n\nMultiple short sessions across the day beat one long one at every age. The\ndog's brain consolidates learning during sleep \u2014 the overnight gap between\nsessions is when the lesson actually sticks.\n\nEnd every session on a success. If the session goes sideways, run the two\neasiest wins available and quit. The next session gets shorter, not longer.\nA session that ends on failure is a session the dog sleeps on failure.\n\nHot weather: first and last light only. Back of your hand on the pavement for\nfive seconds before the dog's pads touch it. Water before the session, not\nonly after.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "browse","blocked_note": null,"diagram": null},{"code": "OB-R5","id": "obedience.ref_settle","track": "OB","trackName": "Basic Obedience","color": "#2C5B57","type": "reference","n": null,"title": "Settle \u2014 Calm in the Blind","drill": "","pass": "","body": "Settle is a mental state, not a command. It means the dog lies down in a\nrelaxed posture \u2014 hips rolled to one side, head lowered, breathing slow. This\nis the blind picture: a dog flat and loose at your side, not fidgeting, not\nscanning, not whining.\n\nYou cannot lure a mental state \u2014 you {term:capture} it. When the dog is lying\nquietly and begins to visibly relax (hips roll, eyes soften), {term:mark}\ngently and quietly reward. Do not use an excited marker voice \u2014 match the\nenergy you want. Over many sessions, the dog begins offering relaxation, and\nyou add a cue word (\"settle,\" \"easy,\" or your choice).\n\nThis is not a formal obedience command. Many retriever programs do not teach\na \"down\" command at all \u2014 sit is the working position on the line, at heel,\nand while {term:honoring}. Settle is a practical hunting behavior for long waits in\nthe blind, in the truck, or at the vet. A dog with a solid sit-stay will often\nlie down on its own during extended waits \u2014 settle just gives you a way to\nencourage and reward that relaxation.\n\nIf the settle looks pinned or stiff rather than relaxed, you drilled it like\na command. Back off. Settle is rewarded boredom \u2014 longer sittings, lower\nstakes, reward only the loose hip.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "browse","blocked_note": null,"diagram": null},{"code": "MK-T","id": "steadiness.title","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "title","n": null,"title": "Steadiness in Marking Drills","drill": "","pass": "","body": "A mark is a retrieve the dog watches fall \u2014 a bumper thrown by a helper or\nlaunched by a machine. Steadiness is the dog's ability to sit and wait for\nyour release word instead of chasing the moment something is thrown. These\ntwo pull against each other: the more exciting the mark, the harder it is to\nhold still. Buy steadiness by preventing the break (using a lead, tab, or\nmechanical restraint), not by punishing it. Marking desire comes first \u2014\nnever trade it away. Add difficulty on one axis at a time; keep the mark\nitself easy whenever steadiness is the thing being tested.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "MK-R1","id": "steadiness.ref_solo","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "reference","n": null,"title": "Training Solo \u2014 How Far You Can Go Without a Helper","drill": "","pass": "","body": "Most of this program was designed to run with one person and one dog. Helpers matter in only two places, and one of those places has a workaround.\n\nTWO TYPES OF LAUNCHERS\n\nThe most important piece of equipment a solo handler can own is a launcher \u2014 a device that throws a bumper from a position in the field while you work the dog at the line. There are two distinct types and they are not interchangeable.\n\nWINGER-STYLE LAUNCHERS\n\nA {term:winger} uses a swinging arm to throw a bumper or a live bird in a realistic arc \u2014 the same flight path a hand-thrown mark makes. Because the throw comes from downfield, not from your feet, it is the closest thing to a real gun in the field. Wingers can also handle live birds, which matters when you reach the bird introduction stages in advanced training. They are remote-triggered by radio transmitter. Common brands: Zinger Winger and Gunners Up. Both are in active production and well-regarded at all levels of retriever training.\n\nDUMMY LAUNCHERS\n\nA dummy launcher fires a foam bumper from a tube using a blank cartridge. The trajectory is a straight line at a fixed angle rather than an arc. Two versions exist.\n\nHandheld: you hold the tube at the line and fire it yourself \u2014 the bumper lands 40\u201380 yards in front of you. The shot comes from your position, not from downfield. This is useful for noise conditioning (MK-3) and early marks work, but it is not a true remote setup. Common brands: Retriev-R-Trainer and DT Systems Super Pro.\n\nRemote: the launcher sits in the field and you trigger it with a transmitter from the line. This is the true solo-training setup \u2014 the mark comes from downfield, same as a gun in the field. Single-shot and multi-shot versions are available from Retriev-R-Trainer (Versa-Launch) and DT Systems (RDL series), among others.\n\nFOR THE SOLO TRAINER\n\nEither a winger or a remote dummy launcher gets the job done for marks work. The winger's realistic arc and ability to handle birds gives it an edge for long-term versatility. The remote dummy launcher is more compact and the entry price is similar. A handheld dummy launcher is a useful noise-conditioning tool but cannot replace a downfield launcher for marks training. For the stages in this program, one single-shot remote launcher \u2014 winger or tube \u2014 is all you need to train marks alone.\n\nTRACK-BY-TRACK REALITY\n\n\u2022 Puppy Foundation \u2014 100% solo. No launcher needed.\n\u2022 Obedience \u2014 100% solo.\n\u2022 Marks (this track) \u2014 Solo with a remote launcher for all single-mark stages. MK-3 (Noise Ladder) rungs 1 and 4 require a person downfield \u2014 that card explains how to skip those two rungs and come back when a helper is available. They do not block the rest of the track.\n\u2022 Doubles (MK-6, MK-7) \u2014 require two throws, but one launcher plus a hand throw from the line runs solo. See Doubles Solo below.\n\u2022 Whistle \u2014 Almost entirely solo. Stages 5 through 8 use pile work, not throws. See the Working Solo reference card in the Whistle track.\n\u2022 Lining \u2014 100% solo. Walking patterns and pile work.\n\u2022 Water \u2014 100% solo. The handler does all the throwing.\n\u2022 Hunt Preparation \u2014 Mostly solo. HU-5 (Honoring) is the only stage in the entire program with no solo version. See the Honest Exception below.\n\nRUNNING DOUBLES SOLO\n\nA double means two bumpers are thrown from two locations and the dog watches both before retrieving either. With one remote launcher: set the launcher at the memory bird position (the first throw, farther out) and trigger it from the line. Immediately throw the go-bird (the second throw, closer in) by hand from your position. The dog retrieves the go-bird first \u2014 last thrown, first retrieved \u2014 then you send it back to the memory bird location.\n\nThe limitation is that one throw always comes from your feet and one from the launcher. That is a consistent picture and good for building the skill. When you do get a helper, run both throws from field positions so the dog sees the full picture.\n\nTHE HONEST EXCEPTION\n\nHU-5 (Honoring and Multiple Dogs) requires a second dog and a second handler. There is no solo version. Options:\n\u2022 Find one training partner. One other person with a retriever is a training group.\n\u2022 Contact a local retriever club. Most welcome visitors and allow non-members to join a session.\n\u2022 HRC (Hunting Retriever Club) hold group training days before hunt tests. Attend once and introduce yourself.\n\nThis is one stage in a large program. Run everything else to completion and circle back when the opportunity comes.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "browse","blocked_note": null,"diagram": null},{"code": "MK-1","id": "steadiness.s1","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "stage","n": 1,"title": "Held Hold on Singles","drill": "This is the first stage of steadiness \u2014 teaching the dog to hold a sit while\na bumper is thrown and hits the ground (the fall). The dog wants nothing more\nthan to chase it. Your job is to make chasing physically impossible so the dog\nnever practices breaking.\n\nUse a short tab (a 4-6 inch handle clipped to the collar) or a lead at heel.\nYou can also step on the lead so both hands are free. Throw one easy short\nbumper (a single) at 10-15 yards. Hold the dog sitting through the fall,\npause 1-2 seconds, then send the dog with the release word. The lead does\nthe enforcing, not you \u2014 a break should be mechanically impossible. The goal\nat this stage is zero corrections. If the dog never gets to break, the dog\nnever practices breaking.\n","pass": "Holds through the fall with slack in the lead, not straining against it, across\n~10 reps and 2\u20133 sessions. The hold feels automatic before you ask for it\nwithout restraint.\n","body": "","ifthen": [["Straining against the lead","Mark is too exciting. Shorten the throw, cut the delay to zero, rebuild."],["You find yourself correcting","Go back to foot-on-lead. At this stage you prevent, you do not correct."]],"checks": [{"id": "c1","label": "Holds through the fall, slack in the lead","hits": 10,"of": 10,"sessions": 3}],"session_cap": null,"equipment": ["lead"],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "MK-2","id": "steadiness.s2","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "stage","n": 2,"title": "Release Delay","drill": "Same easy single, still managed. Stretch the pause from 1\u20132 sec toward\n5\u201310+. Vary the timing every rep. Occasionally hold and pick the bumper up\nyourself instead of sending (a {term:no_bird} \u2014 the throw happened but the dog does\nnot get to retrieve it) \u2014 sparingly. The dog releases to the name, not to the throw.\n","pass": "Sits quietly through delays up to 8\u201310 sec \u2014 no whining, creeping, or\nanticipating \u2014 and does not flinch toward a no-bird.\n","body": "","ifthen": [["Creeps as the delay stretches","The delay grew on a schedule the dog can read. Randomize: 2 sec, 9 sec, 3 sec, 6 sec."],["Sours on no-birds","You are using them too often. One rep in eight at the very most."],["Return goes wide, or parades","Off-axis for this stage, but it will not fix itself. See {ref:steadiness.ref_parade}."]],"checks": [{"id": "c1","label": "Quiet through randomized 8-10 sec delays","hits": 8,"of": 10,"sessions": 2},{"id": "c2","label": "No flinch toward a no-bird","hits": 3,"of": 3}],"session_cap": null,"equipment": [],"requires": ["MK-1"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "MK-3","id": "steadiness.s3","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "stage","n": 3,"title": "Add Excitement \u2014 Noise Ladder","drill": "Prereq: {ref:steadiness.s2} PASS and an honest return \u2014 meaning the dog comes\nstraight back to hand without looping, parading, or dropping the bumper. If the\nreturn is not honest, fix it first ({ref:steadiness.ref_parade}). Lightest loads\navailable, low angle. Tube geometry: {ref:steadiness.ref_launcher}.\n\nFIVE rungs, one at a time; each new noise resets the delay to 2 sec.\n1. A gun (a helper standing in the field) throws the bumper, no shot.\n2. Remote launch (a remote-controlled bumper launcher replaces the helper).\n3. Add the beep 1-2 sec ahead (the electronic beeper on the launcher that\n   sounds before it fires).\n4. Popper at the line (handler fires a 12-gauge popper load), a gun throws.\n5. Handheld launcher at the line (the handler fires the launcher \u2014 this\n   report is significantly louder than a popper and comparable to a shotgun).\n\nSolo handlers: rungs 1 and 4 require a helper. If training solo, start at\nrung 2 and work rungs 2, 3, and 5. Return to rungs 1 and 4 when a helper\nis available \u2014 they do not gate later rungs.\n\nThe beep drops at rung 4. One rep in five is a shot with NO SEND.\nOn lead all stage.\n","pass": "1. 6/6 at 2 sec, x2.\n2. 8/10 at randomized 8\u201310 sec.\n3. 8/10 with the beep, back to 8 sec.\n4. 8/10 with the popper.\n5. 8/10 with the handheld, x2.\nSix loud reps a session, max.\n","body": "","ifthen": [["Breaks when a new noise is added","You stacked two. Pull the new one, re-establish, add it back alone at 2 sec."],["Creeps or whines watching the tube","The tube has become the cue. Not enough no-send reps \u2014 go to one in four."],["Flinches or checks out at the report","Stop. Do not push through. Tube to 100+ yds, happy retrieves only, rebuild over weeks."]],"checks": [{"id": "r1","label": "A gun throws, no shot, 2 sec delay","hits": 6,"of": 6,"sessions": 2,"needs_helper": true},{"id": "r2","label": "Remote launch, randomized 8-10 sec delay","hits": 8,"of": 10},{"id": "r3","label": "Beep added, delay back to 8 sec","hits": 8,"of": 10},{"id": "r4","label": "Popper at the line, a gun throws","hits": 8,"of": 10,"needs_helper": true},{"id": "r5","label": "Handheld launcher at the line","hits": 8,"of": 10,"sessions": 2}],"session_cap": {"reps": 6,"applies_to": "launcher and popper reps","note": "Six loud reps a session, maximum. Thrown-bumper reps are not capped."},"equipment": ["lead","bumpers","sidekick","light_loads","beeper","poppers_12ga","handheld_launcher"],"requires": ["MK-2","MK-R6"],"trigger": null,"blocked_note": "Rungs 1 and 4 need a GUN in the field \u2014 a second person. Rungs 2, 3 and 5 run solo.","diagram": "mk-3"},{"code": "MK-4","id": "steadiness.s4","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "stage","n": 4,"title": "Wean the Lead","drill": "Drop the lead but keep a tab on and stay close enough to intercept. A tab is\na short (6\u201312 inch) handle attached to the collar \u2014 it gives you something to\ngrab without the drag of a full lead.\n\nStart back at short delay plus easy mark, then rebuild delay and excitement off\nlead. You are transferring the hold from mechanical restraint to a chosen sit \u2014\nthe dog sits because sitting is the pattern, not because a lead is preventing\nmovement. If you need the tab more than once in a session, you moved here too early.\n","pass": "Multiple clean sessions of off-lead singles \u2014 steady through fall, delay, and\ngun \u2014 with no break and no need to touch the tab.\n","body": "","ifthen": [["Breaks the moment the lead comes off","The dog was holding the lead, not the sit. Back to Stage 1, foot on lead, for a week. See {ref:steadiness.ref_breaks}."],["You keep reaching for the tab","You moved into the stage too early. Stand closer \u2014 do not hold tighter."]],"checks": [{"id": "c1","label": "Off-lead single, steady through fall/delay/gun","hits": 10,"of": 10,"sessions": 3}],"session_cap": null,"equipment": [],"requires": ["MK-3"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "MK-5","id": "steadiness.s5","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "stage","n": 5,"title": "Harder / Longer Marks","drill": "Only now do you make the retrieve itself demanding, with steadiness already\nbanked. Add distance, cover, angles, terrain \u2014 one axis at a time. That means:\nif you are stretching distance, keep the cover short and the terrain flat. If you\nare adding heavy cover, keep the throw short. Stacking two new challenges in the\nsame session is how steadiness falls apart at a distance it was holding last week.\n\nCover means the cover you hunt: standing timber, open-water bank, short grass,\nmarsh. Train the pictures you will see on a hunt day.\n","pass": "Steady on singles at 60+ yards or in moderate cover (tall grass, brush,\ntimber), marking within 10 yards of the fall area, 8/10 across two sessions.\nDrive and steadiness both intact.\n","body": "","ifthen": [["Steadiness wobbles as marks get hard","Drop the mark difficulty back down. Do not crank corrections to hold the line."],["Hunting short, poor marks","You added two axes at once. Distance or cover, not both in the same session."]],"checks": [{"id": "c1","label": "Steady on 60+ yd or cover singles, marks within 10 yds of fall","hits": 8,"of": 10,"sessions": 2}],"session_cap": null,"equipment": [],"requires": ["MK-4"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "MK-R2","id": "steadiness.ref_birds","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "reference","n": null,"title": "Bumper to Bird \u2014 The Transition","drill": "","pass": "","body": "The program trains on bumpers (plastic or canvas dummies). But the dog\nwill retrieve real birds \u2014 ducks, geese, pheasants \u2014 and real birds are\nnothing like bumpers. They are wet, slimy, feathered, and they smell like\nsomething the dog has never held in its mouth. The transition from bumper\nto bird is a distinct training step, not something that happens naturally\non opening day.\n\nThe progression, one step at a time:\n\n1. Frozen duck, partially thawed \u2014 still firm enough that the dog cannot\neasily chew or crush it. Short tosses (10-15 yds) on familiar ground. Let\nthe dog investigate, pick up, carry. A stiff bird teaches a clean hold from\nthe start. Once the dog is carrying the frozen bird cleanly 3/3, progress\nto fully thawed. Some dogs mouth or roll a thawed bird \u2014 this is normal on\nthe first few contacts. Do not correct mouthing yet. The dog is processing\na new texture. 3-5 bird retrieves per session, then back to bumpers.\n\n2. Fresh-killed bird. Warmer, softer, smellier. The scent is stronger and\nsome dogs get mouthy \u2014 chewing, crunching, or refusing to give. If the\ndog has completed force fetch, use the hold command. If not, trade for\nhigh-value food and do not fight for the bird.\n\n3. Clipped-wing {term:flyer}. A live pigeon with clipped flight feathers, thrown\nor launched. The bird flutters, moves, and is wildly exciting. This is the\nsingle biggest steadiness test in the entire program \u2014 a live, moving bird\nin front of a dog that has only seen bumpers and dead birds. Run this on\nlead the first time. No exceptions.\n\n4. Full flyer. A live bird launched at distance, shot by the handler or a\nhelper. The complete hunting picture: bird in the air, gun fires, bird\nfalls, dog retrieves. Only after steps 1-3 are solid.\n\nTiming: steps 1-2 can run alongside MK-4 or MK-5. Step 3 requires\n{ref:steadiness.s4} (off-lead steadiness) to be solid. Step 4 requires\nstep 3 plus noise conditioning through {ref:steadiness.s3}'s full ladder.\n\nHard mouth warning: a dog that crunches or chews on a bird is developing\nhard mouth. This is easier to prevent than to fix. If the dog mouths at\nstep 1, extend step 1 with more frozen-bird reps and enforce the hold\nbefore advancing. Hard mouth that persists past step 2 is a force fetch\nissue \u2014 go back to hold conditioning.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "MK-6","id": "steadiness.s6","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "stage","n": 6,"title": "Doubles on Lead","drill": "Lead back on. Mark the memory bird (the first throw \u2014 the one the dog must\nremember), HOLD; mark the go-bird (the second throw \u2014 the one the dog retrieves\nfirst), HOLD; release word for the go-bird; then send back for the memory.\nThe retrieve order is always last-down first: the go-bird is freshest in memory,\nso it goes first. Physical management through both falls. The second throw is the\nsingle biggest break trigger there is.\n","pass": "Holds cleanly through both throws, on lead, until the pattern is boring. No\nlunge on the second fall.\n","body": "","ifthen": [["Lunges on the second throw","Widen the two falls and lengthen the gap between them. Narrow it again later."],["Forgets the memory bird","Steadiness is eating the marking. Make the memory bird closer and easier."]],"checks": [{"id": "c1","label": "On-lead double, holds through both throws","hits": 8,"of": 10,"sessions": 2}],"session_cap": null,"equipment": ["lead"],"requires": ["MK-5"],"trigger": null,"blocked_note": null,"diagram": "mk-67"},{"code": "MK-7","id": "steadiness.s7","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "stage","n": 7,"title": "Doubles Off Lead","drill": "The finished marking picture: the dog sits off lead, watches two bumpers\nthrown from different locations, holds through both throws and the gunfire,\nand retrieves each on your release word \u2014 last-down first.\n\nWean the lead on doubles the same way you did on singles in {ref:steadiness.s4}.\nStart with the tab on and stay close enough to step in if the dog moves.\nThe second throw is the hardest moment \u2014 the dog is already excited from the\nfirst fall, and the second bumper going airborne is the biggest break trigger\nin the program. If the dog is solid on-lead doubles ({ref:steadiness.s6}),\nthe wean is usually quick \u2014 3-5 sessions.\n\nThis is a maintenance skill, not a completed one. Steadiness on doubles\nrequires ongoing work. A dog that has not run doubles in two weeks should\nstart on lead for the first session back.\n","pass": "Consistent off-lead doubles, steady through both throws and the gun, marking\nboth birds cleanly. 8/10 across three sessions.\n","body": "","ifthen": [["Switching between birds","The dog is confused about which fall to retrieve first. Back to on-lead doubles with wider separation between the falls \u2014 make the go-bird obvious. Rebuild to closer falls once the dog consistently takes the go-bird first."],["Steady but slow","See {ref:steadiness.ref_suppression}. The dog is worried about being wrong. Pull steadiness work for a week and run fun, easy marks with no holds. Rebuild drive before re-introducing the double."],["Breaks on the second throw","The on-lead doubles were not solid enough. Go back to {ref:steadiness.s6} for another week. The second throw is the hardest moment \u2014 it must be boring on lead before the lead comes off."]],"checks": [{"id": "c1","label": "Off-lead double, steady through both throws and gun","hits": 8,"of": 10,"sessions": 3}],"session_cap": null,"equipment": [],"requires": ["MK-6"],"trigger": null,"blocked_note": null,"diagram": "mk-67"},{"code": "MK-R3","id": "steadiness.ref_breaks","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "reference","n": null,"title": "If the Dog Breaks","drill": "","pass": "","body": "1. Ideal: the dog never does, because you managed it.\n2. Stop the dog with the tab. Walk back to the exact spot. Reset.\n3. Re-throw or have the thrower pick it up \u2014 the break earns nothing.\n4. The lesson is simple and it is the only lesson: breaking = no retrieve.\n5. Save the e-collar nick-on-sit for a clear, deliberate break once the rule is\nplainly understood. Do not hammer a green dog at the line.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "failure","blocked_note": null,"diagram": null},{"code": "MK-R4","id": "steadiness.ref_suppression","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "reference","n": null,"title": "Over-Suppression \u2014 Back Off","drill": "","pass": "","body": "Warning signs: going slow off the line or no-going (refuses to leave your side\non the send) \u00b7 {term:popping} (stopping mid-retrieve to look back for direction when\nnone was asked for) \u00b7 glancing back at you before the send as if asking\npermission \u00b7 sticky or reluctant releases (hesitates to leave the sit even after\nthe release word).\n\nAny of these means the dog is worried about being wrong. The fix is always less\npressure, not more. Throw fun free-for-all bumpers to rebuild drive. Re-introduce\nsteadiness gentler. Marking desire first, always. A slow dog is a far more\nexpensive problem than a dog that breaks.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "failure","blocked_note": null,"diagram": null},{"code": "MK-R5","id": "steadiness.ref_launcher","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "reference","n": null,"title": "Solo Launcher Sessions","drill": "","pass": "","body": "Anchor the dog so the break is prevented mechanically: place board, stake-out chain,\nor lead under your foot. Anchor \u2192 launch \u2192 HOLD \u2192 release word. The place\nboard helps most: leaving it is an obvious, enforceable event.\n\nTube placement. Perpendicular to the running line, throwing across it. Never\naimed at the dog, at you, or across ground you will walk. What matters is\ntube-to-FALL, not tube-to-dog: a light load carries ~50 yds alone, so a tube at\n50 yds throwing flat gives a 70 yd mark. Lower the angle or move the tube in.\n\nSame side, same direction for the whole of {ref:steadiness.s3} \u2014 the excitement is the new\nvariable, not the geometry. Lightest loads available while steadiness is being built.\nNever dry fire a hand launcher: the dummy absorbs the charge. No dummy, no shot.\n\nSun behind the dog, wind quartering in. Where they fight, take the sun \u2014 the dog has\nto SEE the fall, and a tailwind only costs scent on a mark watched down.\nWind wins later, on blinds. The sunset bearing swings 40\u00b0+ from August to November.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": "mk-r3"},{"code": "MK-R6","id": "steadiness.ref_parade","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "reference","n": null,"title": "The Parading Return","drill": "","pass": "","body": "Parading is a recall problem with a bumper in the mouth, not a hold problem. Every lap pays in possession.\n\nDiagnose first. If the dog always loops to the same side, the handler is likely\nstepping or reaching toward that side \u2014 change your body, not the dog. If the dog\nloops to either side unpredictably, it is an attitude problem: the dog has learned\nthat possession plus movement is more fun than delivering. In both cases, stand\nstill and do not reach.\n\nPrevent, do not correct. 50 ft cord on the ground, slack, at the distance the return is honest \u2014\nblock the loop by stepping on the cord as the dog approaches, preventing a\nwide turn. Never reel the dog in. Move away on the return. Drop the platform ritual. No collar:\npressure plus possession buys a slow return. Pay every clean rep.\n\nFade ladder\n1. Corridor, fenced both sides, cord dragging untouched.\n2. Same corridor, line off-centre, last 10 yds outside the fence.\n3. Open ground, one feature on the arcing side \u2014 {ref:lining.s1}'s picture.\n4. Open ground, no feature, cord dragging.\n\nPASS \u2014 rung 4 only. Rungs 1\u20133 are logged and never count.\n9 of 10 straight to hand, cord dragging untouched.\nTwo sessions.\n","ifthen": [],"checks": [{"id": "c1","label": "Straight to hand, cord dragging untouched \u2014 RUNG 4 ONLY","hits": 9,"of": 10,"sessions": 2,"rung": 4}],"session_cap": null,"equipment": ["check_cord"],"requires": [],"trigger": "failure","blocked_note": null,"diagram": "mk-r4"},{"code": "MK-R7","id": "steadiness.ref_funrep","track": "MK","trackName": "Steadiness & Marking","color": "#2F4A32","type": "reference","n": null,"title": "The Fun Rep","drill": "","pass": "","body": "The fun bumper is the period at the end of the session \u2014 a no-pressure rep\nthat should close every session. Desire is not the problem, so this is not\nmedicine; it is a ritual. Rationed and rules-lite, never rule-free.\n\nOne or two, never more. Announce it with its own release word, never a working\ncommand. Throw short, easy, seen, into open ground. Steadiness is waived \u2014\nbreaking on the throw IS the fun.\n\nOne rule survives: the bumper still ends in your hand. No front sit, no\nformality. On the pickup, turn and walk toward the truck; the dog catches up\ncarrying and you take it at your side without reaching \u2014 or let the dog carry at\nheel the whole way. Possession WITH you pays what the dog wants, in your direction.\n\nNever chase, reach, or play keep-away. Never tug \u2014 possession is the fault\nline. If the dog parades: no correction, no second bumper. The game simply ends.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "browse","blocked_note": null,"diagram": null},{"code": "WH-T","id": "whistle.title","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "title","n": null,"title": "Whistle Sit \u2192 Casting","drill": "","pass": "","body": "The whistle sit is one short blast that means \"sit immediately.\" {term:casting} is\na set of hand signals that tell the dog which direction to go \u2014 left, right,\nor straight back. This track teaches both, starting with the whistle and\nbuilding to the full casting picture.\n\nThe one hard rule: the whistle never enters the bird picture until Stage 4 is\nfinished. No whistle while the dog is running to a thrown bumper. No whistle\non a return from a retrieve. {ref:whistle|track} lives on bare ground with\npiles (pre-placed groups of bumpers) \u2014 no thrown marks, no flyers.\n\nSession 10-15 min, 2-3x/week, always after marking work. Never combine\ne-collar conditioning (collar-condition) with force-to-pile work in the same\nsession. Never end on a pressure rep. If marking goes sideways, skip\n{ref:whistle|track} entirely that day.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WH-1","id": "whistle.s1","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "stage","n": 1,"title": "Whistle Sit at Heel, On Lead","drill": "The whistle sit is the most important command in the field program. One short\nblast on the training whistle means sit immediately \u2014 butt on the ground the\ninstant the sound hits, head up, eyes on you. Every cast, every blind, every\nwater correction flows through this command.\n\nThe dog already knows \"sit\" from {ref:obedience.s1}. The whistle overlays\nthat known command. Here is how to pair them: blow one short blast, then\nimmediately say \"sit.\" The whistle predicts the verbal. After 20-30 paired\nreps across 2-3 sessions, drop the verbal and let the whistle carry the\ncommand alone. If the dog does not sit on the whistle alone, re-pair for\nanother session \u2014 do not add lead pressure on a command the dog has not yet\nlearned.\n\nWalk at heel on lead. Blow, dog sits, pause, release with the release word.\nThen trot, blow, sit, release. Work both directions. Sessions are 10-15\nminutes, 15-20 reps.\n","pass": "10/10 clean across three consecutive sessions, from a walk and from a trot,\nboth directions. Zero forward creep after the sit. The dog sits on the\nwhistle alone \u2014 no verbal \"sit\" needed.\n","body": "","ifthen": [["Sits late, after a beat","The pairing is not solid. Re-pair: blow the whistle, immediately say 'sit,' guide with the lead. Do not escalate to a lead pop \u2014 help the dog, do not correct a command it is still learning."],["Creeps forward on the sit","Heel the dog TOWARD a wall or fence and blast a stride short of it \u2014 the creep has nowhere to go. Re-sit every creep, no scolding."],["Looks away after sitting","Not a pressure fix yet. Step in, get the eyes with a hand at your chest, release."]],"checks": [{"id": "c1","label": "Butt on the sound, from a walk and from a trot","hits": 10,"of": 10,"sessions": 3}],"session_cap": null,"equipment": ["lead"],"requires": ["OB-1"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WH-2","id": "whistle.s2","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "stage","n": 2,"title": "Off Lead: Sit in Motion, Stop at Distance","drill": "The whistle sit now moves off lead and adds momentum \u2014 the dog must stop\nmid-stride on a single blast. This is the skill that makes handling at\ndistance possible: a dog that will not stop in motion cannot be cast.\n\nFour steps, in order. Each must pass before starting the next.\n\n1. Heel off lead, one blast, the dog plants \u2014 KEEP WALKING 10+ steps past\nthe dog without pausing or looking back. The dog must hold the sit even\nas you walk away. This tests whether the sit is solid without the lead.\n\n2. Remote stay: leave the dog on a sit, walk to 10 yds, then 20, 30, 40.\nHold at each distance for 30 seconds. The dog does not move.\n\n3. The stop in motion: the dog is moving freely (no bumper, no pile, just\nloose movement) and you blow one blast. The dog stops and sits wherever\nit is. See {ref:whistle.ref_stop} for the full teaching progression.\nStart at 10 yds and build to 40.\n\n4. Stop on recall: call the dog with \"here,\" then blow the whistle sit\nwhile the dog is running toward you at ~15 yds. The dog stops mid-recall\nand sits. This step begins only after step 3 has passed \u2014 the rule\nagainst recalling off a stop applies during step 3, not after it.\n","pass": "1. 10/10 plants while handler keeps walking, turning both left and right. 2. 5/5 at 40 yds, 30-sec hold, zero\ncreep. 3. 9/10 first-whistle stops at 40 in motion, two sessions, slide under\none body length. 4. 5/5 at 15 yds. Step 3 is the money skill.\n","body": "","ifthen": [["Stays in 2, busts the stop in 3","A stay is not a stop. Drop to 10 yds in motion and re-climb."],["Ignores the whistle at distance","Halve the distance. Never re-blow. See {ref:whistle.ref_refusal}."],["Recall slows, or creeps in watching","Stop drilled into recall. Max 3 stops a session; end on 2 free recalls."],["Slides past a body length","The dog is carrying too much momentum into the stop. Drop back to a shorter distance where the dog can stop cleanly, and rebuild distance in 5-yard steps. See {ref:whistle.ref_stop} for the full progression."]],"checks": [{"id": "r1","label": "Heel off lead, holds through 10 steps","hits": 10,"of": 10},{"id": "r2","label": "Remote stay at 40 yds, 30 sec hold","hits": 5,"of": 5},{"id": "r3","label": "First-whistle stop at 40 yds in motion","hits": 9,"of": 10,"sessions": 2},{"id": "r4","label": "Stop on recall at 15 yds","hits": 5,"of": 5}],"session_cap": null,"equipment": [],"requires": ["WH-1"],"trigger": null,"blocked_note": null,"diagram": "wh-2"},{"code": "WH-R1","id": "whistle.ref_recall","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "reference","n": null,"title": "The Come-In Whistle","drill": "","pass": "","body": "The whistle sit (one short blast = sit) is the primary whistle command.\nBut you also need a way to call the dog in from 100+ yards when the verbal\n\"here\" will not carry \u2014 the come-in whistle.\n\nThe come-in whistle is a series of short, rapid blasts: tweet-tweet-tweet-\ntweet (4-5 quick blasts in a row). It means \"come to me now.\" This is\ndifferent from the single blast of the whistle sit \u2014 one blast means stop\nand sit, multiple rapid blasts mean come in.\n\nTeaching it follows the same pairing method as the whistle sit in\n{ref:whistle.s1}: blow the come-in pattern, immediately say \"here,\" and\nenforce with the check cord if needed. After 20-30 paired reps across\nseveral sessions, drop the verbal and let the whistle pattern carry the\ncommand.\n\nWhen to use it:\n- Calling the dog off a hunt in the wrong area (the dog is searching where\n  the bird did not fall)\n- Ending a session or calling the dog in from distance\n- Safety: recalling the dog from a hazard at range where your voice will\n  not reach\n\nWhen NOT to use it:\n- On a return from a retrieve (the dog is already coming \u2014 the whistle\n  adds nothing and may cause a sit instead of a return)\n- As a substitute for the whistle sit (if you want the dog to stop, use\n  one blast, not the come-in)\n- After a whistle sit (sit means sit \u2014 do not sit the dog and then\n  immediately recall it, or the dog learns that every sit is followed by\n  a recall and stops holding the sit)\n\nThe come-in whistle is a safety tool as much as a training tool. A dog\nthat will not come in from 100 yards on the whistle is a dog the handler\ncannot control in the field.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "WH-3","id": "whistle.s3","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "stage","n": 3,"title": "Sit and Look at Me","drill": "On a place board at 10 yds, sit the dog facing you. Square matters because a\ncast (a hand signal telling the dog which direction to go) is a body\nmovement \u2014 a dog sitting with a cocked hip cannot push off evenly in\nboth directions, and a dog looking at the pile instead of the handler takes itself\nout of the conversation before the cast is given.\n\nSquare is taught by resetting, not repeating: if the hip cocks, step one pace\nsideways \u2014 the dog must re-rotate to face you \u2014 and pay only the square sit.\nEye contact is paid from the front: mark the instant the eyes find yours, treat\nat nose height. Climb 10\u219220\u219230 yds, then stretch the hold to 10 sec.\n\nEnd state: squared, facing, eyes held until you cast or release. A crooked or\nscanning dog cannot take a cast. Non-negotiable before any casting work.\n","pass": "Square, facing, eyes locked, holding through a 10-second pause at 30 yards.\n","body": "","ifthen": [["Sits crooked, hip cocked","The dog cannot cast left off a cocked right hip. Reset until it is square every single rep."],["Eyes drift to the pile","Pattern-guessing. Pause longer so the cast, not the pile, becomes the cue."],["Fidgets and re-adjusts","Shorten the hold, build back up. A fidgety sit becomes a break under bird pressure."]],"checks": [{"id": "c1","label": "Square, facing, eyes locked through 10 sec at 30 yds","hits": 9,"of": 10,"sessions": 2}],"session_cap": null,"equipment": ["place_board"],"requires": ["WH-2"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WH-4","id": "whistle.s4","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "stage","n": 4,"title": "Collar-Condition the Sit","drill": "Indirect pressure only \u2014 the e-collar reinforces the whistle, it does not teach\nthe sit. The dog must already sit on the whistle reliably before this stage\nbegins. Momentary nick simultaneous with the whistle \u2014 not before, not after.\nBefore means the dog learns to dread the collar; after means the collar is\ndisconnected from the command.\n\nStart at the lowest level the dog acknowledges (a flick of the ear or a head\nturn, not a yelp) and raise only if ignored. If you are unsure of the right\nlevel, you are too high. See {learn:ecollar_levels} to find the right level\nbefore this stage begins.\n","pass": "Sits on the whistle at all distances with the collar on and with it off. No\nhesitation, no anticipation of the nick.\n","body": "","ifthen": [["Yelps or shuts down","Level too high. Drop it now, return to Stage 1 on lead, rebuild trust before retrying."],["Sits before the whistle","Reading your body, not the sound. Vary posture and timing; whistle from odd positions."],["Sticky or slow on retrieves","You stacked pressure. Pull {ref:whistle|track} for a week, run happy marks. See {ref:steadiness.ref_suppression}."]],"checks": [{"id": "c1","label": "Sits on the whistle at all distances, collar on","hits": 10,"of": 10,"sessions": 2},{"id": "c2","label": "Same with the collar off","hits": 10,"of": 10,"sessions": 2}],"session_cap": null,"equipment": [],"requires": ["WH-3"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WH-5","id": "whistle.s5","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "stage","n": 5,"title": "Baseball \u2014 Back and Overs","drill": "Baseball is the foundation of casting \u2014 teaching the dog to take direction on\nyour hand signal. The name comes from the setup: the dog sits on the pitcher's\nmound with three piles of bumpers at equal distance (start at 15 yds) \u2014 first\nbase (right over), second base (straight back), third base (left over).\n\nTeach back (second base) first \u2014 it is the natural direction and the one the dog\nalready wants. The back cast is a raised hand overhead. Then overs (side casts),\none side at a time \u2014 arm extended flat to the side you want the dog to go. The\ndog should drive to the pile, pick up one bumper, and return. Then mix all three.\n\nAt this stage, spin direction on the back cast does not matter \u2014 the dog just\nneeds to turn and go. Right and left hand backs are the next card.\n","pass": "Clean singles on back, left over, and right over. Takes the cast on the first\nsignal \u2014 no re-cast, no self-selecting a pile. 9/10 on each cast, mixed\nrandomly, across two sessions.\n","body": "","ifthen": [["Takes the wrong pile","The dog is guessing. Stop mixing. Ten straight reps of the failing cast, then reintroduce choice. See {ref:lining.ref_casts}."],["Won't leave on 'back'","The pile is not established. Walk the dog to it, throw a bumper into it, restart at 5 yds."],["Spins before casting","The sit is not square. That is a {ref:whistle.s3} failure \u2014 go back one card."]],"checks": [{"id": "c1","label": "Back, first signal","hits": 9,"of": 10},{"id": "c2","label": "Left over, first signal","hits": 9,"of": 10},{"id": "c3","label": "Right over, first signal","hits": 9,"of": 10},{"id": "c4","label": "Mixed casts, no self-selecting","hits": 8,"of": 10,"sessions": 2}],"session_cap": null,"equipment": [],"requires": ["WH-4"],"trigger": null,"blocked_note": null,"diagram": "wh-5"},{"code": "WH-6","id": "whistle.s6","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "stage","n": 6,"title": "Right and Left Hand Backs","drill": "Same 3-pile baseball setup. Now the back cast splits into two signals: right\nhand raised vertical sends the dog spinning over its left shoulder (away from\nyour raised hand); left hand raised vertical sends it spinning over its right\nshoulder. The destination is the same \u2014 second base \u2014 but the spin direction\n(which way the dog turns its body before running back) is now controlled.\n\nWhy this matters: on a blind or in water, spin direction keeps the dog off\nhazards. A dog sent back with the wrong spin may turn into a bank, a decoy\nspread, or another dog's line. This is influence control, and it is invisible\nuntil you need it.\n\nTransition from {ref:whistle.s5}: on baseball, the dog has been spinning\neither direction freely on every back cast. Do not start by correcting the\nwrong spin \u2014 start by rewarding the right one. Use body english (a slight\nstep or lean toward the spin direction) to cue which way to turn. The body\nenglish is the early teacher; the hand signal takes over as you fade the\nbody. Only after the dog is offering the correct spin on body english alone\nat least 7/10 should you add the check cord to prevent wrong spins.\n\nStart at 10-15 yds with a check cord on once the body-english phase is\nsolid. If the dog takes the wrong spin, stop it immediately with the cord\nbefore it reaches the pile \u2014 a wrong spin that finds the bumper is a wrong\nspin that gets reinforced.\n\nTeach one spin direction until it is clean, then the other, then mix.\n","pass": "Right hand back with correct spin 9/10, left hand back with correct spin 9/10,\nthen mixed randomly 8/10 \u2014 all at 15+ yds with no body-position assist and no\ncheck cord. Two sessions.\n","body": "","ifthen": [["Always spins the same direction regardless of hand","The dog is ignoring the hand and defaulting to a dominant side. Isolate the weak side \u2014 ten reps before reintroducing the strong side. Use the check cord to stop wrong spins before they pay."],["Correct spin but drifts off the back line","The dog is reading the body english as a directional cast, not a spin cue. Fade your step and positioning \u2014 stand square and let the hand alone carry the signal."],["Clean at 15 yds, falls apart at distance","The hand signal is not readable at range. Exaggerate the arm \u2014 fully vertical, held longer \u2014 and rebuild distance in 10 yd steps. Video yourself to check that your right and left signals actually look different from the dog's perspective."]],"checks": [{"id": "c1","label": "Right hand back, correct spin, no body assist","hits": 9,"of": 10,"sessions": 2},{"id": "c2","label": "Left hand back, correct spin, no body assist","hits": 9,"of": 10,"sessions": 2},{"id": "c3","label": "Mixed right/left backs, no self-selecting spin","hits": 8,"of": 10,"sessions": 2}],"session_cap": null,"equipment": ["check_cord"],"requires": ["WH-5"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WH-7","id": "whistle.s7","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "stage","n": 7,"title": "Angle Backs \u2014 Wagon Wheel","drill": "Add two piles at 45 degrees between the back pile and each over pile, making a\n5-pile wagon wheel. The arm signal for an angle back is between vertical (back)\nand flat (over) \u2014 arm raised at roughly 45 degrees. Right arm at 45 degrees\nsends the dog to the right angle-back pile; left arm at 45 degrees to the left.\n\nThis is a new destination, not a variation on the back cast. The dog must learn\nthat a vertical arm means straight back (second base) and an angled arm means a\ndifferent pile at 45 degrees. That discrimination is what makes this stage harder\nthan anything before it \u2014 the dog now has two adjacent wrong answers on every\nangle-back cast (the straight-back pile and the over pile).\n\nTeach each angle back in isolation first. Remove the straight-back pile and work\nangle back vs. over only \u2014 this forces the dog to hold the 45-degree line without\ncollapsing to straight back. Then remove the overs and work angle back vs.\nstraight back \u2014 this sharpens the difference between a vertical arm and an angled\narm. Only when both isolations are clean do you put all five piles out together.\n\nStart close (10\u201315 yds) and stretch distance only after the dog is reading the\narm angle reliably. Handler arm consistency is everything \u2014 video yourself. The\nmost common cause of angle-back confusion in a trained dog is the handler giving\na different arm angle every session.\n","pass": "Right angle back 8/10, left angle back 8/10, each in isolation. Then all five\ncasts mixed randomly 8/10 with no self-selecting \u2014 across two sessions at 15+\nyds.\n","body": "","ifthen": [["Collapses angle back to straight back","The two destinations are too close in the dog's mind. Remove the straight-back pile and work angle back vs. over only until the 45-degree line holds."],["Peels off on the over instead of carrying the angle","Remove the over piles and work angle back vs. straight back only. The dog needs to feel the difference between a vertical arm and an angled arm without the over as a temptation."],["One angle back is clean, the other is sloppy","Dogs favor a dominant turning side. Drill the weak side in isolation \u2014 ten reps before reintroducing the strong side."],["Clean close, falls apart at distance","The arm angle is not readable at range. Exaggerate the distinction between vertical and 45 degrees and rebuild distance in 10 yd steps."]],"checks": [{"id": "c1","label": "Right angle back in isolation","hits": 8,"of": 10},{"id": "c2","label": "Left angle back in isolation","hits": 8,"of": 10},{"id": "c3","label": "All five casts mixed, no self-selecting","hits": 8,"of": 10,"sessions": 2}],"session_cap": null,"equipment": [],"requires": ["WH-6"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WH-8","id": "whistle.s8","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "stage","n": 8,"title": "Single T \u2192 Double T","drill": "Casting moves off the baseball diamond onto a lining pattern shaped like the\nletter T. The physical layout:\n\nSingle T \u2014 you stand at the bottom of the T. The stem is a straight-back\nline with a pile of bumpers at the far end (50-80 yds). The crossbar has\na pile on each end (left over and right over), set at roughly the midpoint\nof the stem. Send the dog down the back line, blow the whistle sit when the\ndog reaches the crossbar, and cast to one of the three piles. The dog must\nstop on a single whistle mid-run and take the cast cleanly \u2014 this is\nbaseball under momentum, which is harder than a static send from the mound.\n\nDouble T \u2014 same layout but with a second crossbar farther out, giving you\nfive piles total: two side piles at the near crossbar, two at the far\ncrossbar, and one at the back. This builds distance discipline. The dog\nmust hold the back line past the first crossbar when cast to the far pile,\nand stop at either crossbar on command.\n","pass": "Single T: stops mid-run on a single whistle and takes any of three casts cleanly,\n8/10 across two sessions. Double T at distance, 8/10 across two sessions.\n","body": "","ifthen": [["Popping (stops mid-run and looks back without being cast)","You over-handled. The dog expects a stop on every send. Let the dog run more lines without stopping it. Expensive to fix \u2014 catch it early."],["Veers off the line to the back pile","Suction from a side pile. Re-run the back line alone until it is a highway."],["Slows at the crossbar","The dog is anticipating a stop. Run several reps with no whistle at all."]],"checks": [{"id": "c1","label": "Single T: stop mid-run, three casts clean","hits": 8,"of": 10,"sessions": 2},{"id": "c2","label": "Double T at distance","hits": 8,"of": 10,"sessions": 2}],"session_cap": null,"equipment": [],"requires": ["WH-7"],"trigger": null,"blocked_note": null,"diagram": "wh-6"},{"code": "WH-9","id": "whistle.s9","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "stage","n": 9,"title": "Convergence \u2014 Whistle Meets Birds","drill": "Only now does the whistle rejoin the bird picture, and only as steadiness\ninsurance: sit on the line, sit after the retrieve, sit to honor (hold steady\nwhile another dog works). Still not a\nstop on a return from a mark \u2014 that creates a dog that slows down coming back,\nexpecting to be stopped. Handling on blinds is well past double T.\n\nThe test is whether the whistle sit holds under the excitement of a real bird\npicture without costing drive. If the dog gets slow or sticky after convergence,\nthe whistle comes back out of the bird picture immediately.\n","pass": "Whistle sit holds under bird pressure at the line without slowing drive to\nthe fall or the return.\n","body": "","ifthen": [["Delivery gets slow after convergence","Immediate red flag. Pull the whistle out of the bird picture for two weeks. Happy marks only."],["Won't sit at the line with a bird out","Bird pressure exceeds the training level. Dead bumpers, then frozen ducks, then flyers."],["Anticipates the whistle, self-sits","Over-drilled. More free retrieves, fewer reps."]],"checks": [{"id": "c1","label": "Whistle sit at the line under bird pressure, no loss of drive","hits": 9,"of": 10,"sessions": 3}],"session_cap": null,"equipment": [],"requires": ["WH-8","MK-4"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WH-R2","id": "whistle.ref_refusal","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "reference","n": null,"title": "If the Dog Ignores the Whistle","drill": "","pass": "","body": "1. No emotion. Do not yell. A whistle refusal punished in anger becomes a\nwhistle the dog dreads.\n2. Go get the dog. Walk out, take the collar, place the dog back on the exact\nspot where the whistle sounded. Silence the whole way.\n3. Re-sit, hold, release. Then run the same setup at a difficulty the dog can win.\n4. Never re-blow. One whistle. If ignored, you enforce \u2014 you do not repeat. A\nrepeated whistle teaches that the first one is optional.\n5. Two failures in a row means the dog is working above its training level, not\nbeing defiant. Drop back one stage \u2014 if the dog ignored the whistle in Stage 8,\ngo back to Stage 7 and re-pass before returning. Not a discipline problem. A\ntraining-level problem.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "failure","blocked_note": null,"diagram": null},{"code": "WH-R3","id": "whistle.ref_solo","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "reference","n": null,"title": "Working Solo","drill": "","pass": "","body": "\u2022 Piles beat throws. Stages 5\u20138 are built entirely on stationary piles \u2014 which is\nexactly why they work without a helper.\n\u2022 A remote launcher helps {ref:steadiness|track}, but it is not needed for {ref:whistle|track} at all.\nDo not wait on hardware to start whistle sit.\n\u2022 Use a longer lead than you think you need for Stage 2. Twenty feet of check\ncord is worth more than a helper.\n\u2022 Stake or flag your piles. Consistent pile locations are the single biggest\npredictor of clean casting.\n\u2022 Before {ref:whistle.s4}, walking out and placing the dog is your only enforcement. That\nwalk is what caps your working distance in Stage 2 \u2014 not the dog's ability.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "browse","blocked_note": null,"diagram": null},{"code": "WH-R4","id": "whistle.ref_stop","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "reference","n": null,"title": "Teaching the Stop in Motion","drill": "","pass": "","body": "Read before {ref:whistle.s2} step 3. The stop is built WITH the dog, not sprung\non it. Walk together off heel, blow once mid-stride, and KEEP MOVING \u2014 the dog\nmust key on the whistle, not on the handler stopping. The commonest handler\nmistake is the pause: if you stop walking when you blow the whistle, the dog\nlearns to key on your body language instead of the sound, and the whistle itself\nstays meaningless. Keep walking at least 10 steps past the blast every rep.\n\nClimb SPEED before DISTANCE \u2014 walk, trot, loose run, each clean before the\nnext \u2014 then stretch 10\u219220\u219230\u219240 yds. After the plant, WALK TO THE DOG and pay\nat the spot it stopped. Never recall off a stop while it is being built: the\nstop decays into a slow creep-in because the dog learns that stopping leads to\ncoming toward you anyway.\n\nMeasure the slide against a line on the ground \u2014 a football field's 5-yd marks\nare ideal. Pay behind the line the dog planted on, never ahead of it. If the\nslide grows past a body length, drop one speed class and re-climb. PASS lives\non {ref:whistle.s2}: 9/10 first-whistle stops at 40 in motion, slide under one\nbody length, two sessions.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "WH-G","id": "whistle.gate_convergence","track": "WH","trackName": "Whistle Sit \u2192 Casting","color": "#8C3B2A","type": "gate","n": null,"title": "Convergence Gate \u2014 Do Not Skip","drill": "","pass": "","body": "{ref:steadiness|track} and {ref:whistle|track} stay physically and temporally separate until Stage 4 is\ncomplete and holding for at least two weeks.\n\nIf you find yourself wanting to blow the whistle at a marking dog before then,\nthe answer is no.\n\nEvery trainer worth listening to on this \u2014 King, Standing Stone, Lone Duck \u2014\nsays the same thing: a whistle used to fix a marking problem creates a handling\nproblem that outlives the marking problem.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "LN-T","id": "lining.title","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "title","n": null,"title": "Lining & Blinds","drill": "","pass": "","body": "Stages 1\u20135 need no whistle, no casts, no handling \u2014 they are line mechanics\nand can start today. Stages 6\u20137 are blinds and are locked behind\n{ref:whistle.s8} (Single T). A dog that cannot be stopped at distance cannot be\ncorrected on a blind.\n\nThe progression: backstop lining builds confidence and straight lines, memory\nretrieves teach the dog to trust that something is out there, and pattern blinds\nbridge the gap to cold blinds run on unfamiliar ground.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "LN-1","id": "lining.s1","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "stage","n": 1,"title": "Backstop Line","drill": "Levee crown, treeline, fence, or canal bank as a backstop \u2014 a physical feature\nthat runs parallel to the line you want the dog to hold. The feature gives the\ndog a visual reference and makes drifting off-line obvious to both of you.\n\nBumper thrown 20\u201330 yds parallel to the feature, dog at heel, wind in its face.\nLine the dog up: position the dog at heel facing the bumper, align your body and\neyes down the line you want, and send with \"back.\" The dog has seen the fall \u2014\nthis is a seen retrieve, not a blind. The backstop is teaching the dog to hold a\nstraight line, which is the skill every blind retrieve will depend on.\n","pass": "5 of 5 out and back with no arc off the feature, clean delivery to hand.\n","body": "","ifthen": [["Arcs away from the feature","Move closer to it. The feature must be within a few feet of the line, not a distant landmark."],["Hunts short","The throw is too long for the ground. Shorten until the line is a highway, then stretch."],["Wide or slow coming back","PASS needs a clean delivery, not just a clean outrun. See {ref:steadiness.ref_parade}."]],"checks": [{"id": "c1","label": "Out and back, no arc, clean delivery","hits": 5,"of": 5}],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": "ln-1"},{"code": "LN-2","id": "lining.s2","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "stage","n": 2,"title": "Both Directions","drill": "Same ground, same backstop. Alternate throws left and right of your position,\nre-heeling and re-lining the dog every rep. The purpose is to break pattern\nmemory \u2014 the dog must take its line from how you set it up, not from where the\nlast bumper landed. If the dog always gets sent the same direction, it learns a\nhabit, not a skill.\n","pass": "Sets up on your line each time without drifting toward the previous side.\n5 of 5 both ways.\n","body": "","ifthen": [["Pre-loads on one side","Run three in a row on the weak side, then reintroduce alternation."],["Won't sit square to the line","That is a {ref:whistle.s3|full} problem. Fix it there, not here."]],"checks": [{"id": "c1","label": "Sets up on your line, alternating sides","hits": 5,"of": 5}],"session_cap": null,"equipment": [],"requires": ["LN-1"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "LN-3","id": "lining.s3","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "stage","n": 3,"title": "Distance & Wind","drill": "Same ground stretched to 50\u201370 yds. Throw into the wind so scent carries toward\nthe dog on the outrun \u2014 this helps the dog find the bumper and reinforces the\nstraight line. At this distance, a crosswind will push the dog off the feature,\nso start with a headwind until the line is solid.\n\nChange your start point along the feature so the ground stays familiar but the\npicture does not. The dog must hold the line because of the backstop and the\nsetup, not because it memorized where you always stand.\n","pass": "Straight line held at full distance. No hunting short, no swinging wide of the\nfeature.\n","body": "","ifthen": [["Line falls apart past 40 yds","Add ten yards at a time, not twenty. Back up to the last distance that held."],["Overruns with wind at the dog's back","Reset to throwing into the wind until the line is reliable at that distance."],["The feature runs out before the throw does","The feature must be longer than the mark or the start point cannot move. Run 50 yds on a 60 yd feature; save 70 for longer ground."]],"checks": [{"id": "c1","label": "Straight line held at 50-70 yds into the wind","hits": 5,"of": 5,"sessions": 2}],"session_cap": null,"equipment": [],"requires": ["LN-2"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "LN-4","id": "lining.s4","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "stage","n": 4,"title": "Memory Retrieve","drill": "This is the bridge between a seen retrieve and a blind \u2014 the dog watches the\nplant but must remember it while you walk away, building trust that something is\nout there even when the send happens from a distance.\n\nLead on. Walk the dog at heel down the backstop, plant the bumper, let the dog\nmark it, then about turn AWAY from the plant \u2014 never across the dog's line to\nit. If the dog heels on the left, that means a right about turn; turning left\nwould sweep you across the line to the plant and pull the dog off its memory of\nwhere the bumper is. Walk back to your send point, sit, lead off, send.\n","pass": "Clean send and straight line on a planted bumper at 40+ yds, with no creeping\nwhile you walk back. 5/5, two sessions.\n","body": "","ifthen": [["Creeps while you walk back","Lead stays on and under your foot. This is a {ref:steadiness.s1|full} picture \u2014 treat it as one."],["Forgets the fall","Shorten the walk-back and let the dog watch you plant it longer before you turn away."]],"checks": [{"id": "c1","label": "Memory retrieve at 40+ yds, no creeping","hits": 5,"of": 5,"sessions": 2}],"session_cap": null,"equipment": ["lead"],"requires": ["LN-3"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "LN-5","id": "lining.s5","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "stage","n": 5,"title": "Diversion Blind (Seen)","drill": "Two dummies down, both seen. THROW ORDER NEVER VARIES: far one first, near\none second, so the picture is the same every rep. Send the dog for the far one\nand walk out for the near one yourself. One send in four goes to the near one\ninstead, logged as a no-count \u2014 that is what stops the far bird becoming the\npattern.\n\nThis is the honor picture trained without a blind: the dog must hold a sent line\npast a visible temptation, which is exactly what a diversion blind on a hunt day\nwill demand. If the dog can resist a bumper it watched land, it can resist a\nfallen bird while running a blind.\n","pass": "Takes the sent line past a visible diversion 4 of 5, and sits quiet while you\ncollect the other. Near-bird sends are logged and never count.\n","body": "","ifthen": [["Takes the diversion","Widen the angle between the two and shorten the sent one until the dog wins, then rebuild."],["Whines while you pick up","Ignore it, finish, and release the dog on a different rep. Never send for the one it whined at."]],"checks": [{"id": "c1","label": "Takes the sent line past a visible diversion (far-bird sends only)","hits": 4,"of": 5}],"session_cap": null,"equipment": [],"requires": ["LN-4"],"trigger": null,"blocked_note": null,"diagram": "ln-5"},{"code": "LN-G","id": "lining.gate","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "gate","n": null,"title": "GATE \u2014 Stop Here","drill": "","pass": "","body": "Do not run Stages 6\u20137 until {ref:whistle|track} is complete through Single T\n({ref:whistle.s8}).\n\nThat means: sit on a single whistle at distance, and left over, right over, and\nback taken cleanly off that stop, including right and left hand backs\n({ref:whistle.s6}) and angle backs ({ref:whistle.s7}).\n\nA dog that cannot be stopped at distance cannot be corrected on a blind.\nRunning blinds early is how you build a dog that takes a wrong line at full\nspeed, or a dog that pops. Until the gate is cleared, the next two cards are a\nroadmap \u2014 not a to-do list.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "LN-R1","id": "lining.ref_factors","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "reference","n": null,"title": "Terrain Factors \u2014 What Pulls the Dog Off Line","drill": "","pass": "","body": "A factor is any terrain feature the dog must cross on the way to a blind\nor a mark. Ditches, roads, hedgerows, fence lines, strips of water on the\nway to a land retrieve, strips of land on the way to a water retrieve.\nDogs naturally cheat along terrain changes \u2014 they follow the ditch instead\nof crossing it, run the road instead of crossing it, climb onto a point of\nland instead of swimming past it.\n\nWhy factors matter: on a real hunt, almost every retrieve crosses at least\none terrain change. A dog that cannot hold a line across a ditch, through a\nfence gap, or over a levee is not a finished blind dog. Factors are what\nseparate a dog that lines a practice blind on a mowed field from a dog that\ncan run a blind across real hunting ground.\n\nTypes of factors and how the dog cheats each:\n\nDitch or creek \u2014 the dog turns and runs along it instead of crossing.\nFix: start with the narrowest crossing point and a bumper visible on the\nfar side. Build to wider crossings and blind retrieves.\n\nRoad or trail \u2014 the dog hits the hard surface and runs it. Roads are\neasier to run than cover on both sides. Fix: plant bumpers across the road,\nnot along it. Make crossing the road the payoff.\n\nHedgerow or fence \u2014 the dog runs along the barrier looking for a gap\ninstead of pushing through. Fix: start with a low, thin barrier with a\nvisible bumper on the other side. Build height and density.\n\nLand-water-land \u2014 the dog swims to a point of land and runs across it\ninstead of re-entering the water. This is the {term:swim_by} problem from\n{ref:water.s5}, but in the lining/blind context the dog must hold a\nstraight line that enters water, crosses land, and re-enters water.\n\nWater-land-water \u2014 on a land blind, the dog hits a strip of water and\nrefuses to cross it, or swims it but exits at the wrong point. Fix: start\nwith a narrow water crossing and a visible bumper.\n\nThe principle: introduce one factor at a time on familiar ground with a\nknown backstop. Never combine a new factor with a new blind location.\nThe factor is the variable \u2014 everything else should be easy.\n\nFactors appear in Stages 6 and 7 of this track and throughout\n{ref:water|track}. A dog that cannot handle factors on land will not handle\nthem in water.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": null},{"code": "LN-6","id": "lining.s6","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "stage","n": 6,"title": "Pattern Blind on Known Ground","drill": "This is the dog's first true blind \u2014 a retrieve the dog did not see planted.\nEverything before this was a seen retrieve or a memory retrieve. Now the dog must\ntrust the handler's line and drive to a destination on faith.\n\nThe same backstop you have used since Stage 1 \u2014 familiar ground reduces\nvariables. Plant the bumper with the dog out of sight. Line the dog up, send. If\nthe dog takes a wrong line, stop it with the whistle sit and recast to correct the\ndirection. Never recall (calling the dog back wastes the rep and teaches the dog\nthat a wrong line means quitting), and never re-send from the same spot without\na correction (that teaches the dog to ignore the first send).\n","pass": "3 of 3 pattern blinds at 60\u201380 yds with no more than one {term:handle} each.\n","body": "","ifthen": [["Pops \u2014 stops and looks back uncast","You over-handled. Run lines with no whistle before returning to blinds. See {ref:steadiness.ref_suppression}."],["No-go on the send","The dog does not believe there is anything out there. Show the plant for a few reps to rebuild confidence, then go back to planting out of sight."]],"checks": [{"id": "c1","label": "Pattern blind 60-80 yds, one handle or fewer","hits": 3,"of": 3}],"session_cap": null,"equipment": [],"requires": ["LN-5","WH-8"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "LN-7","id": "lining.s7","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "stage","n": 7,"title": "Blind with Diversion","drill": "Throw a diversion bumper the dog sees, at roughly 90 degrees to the blind line.\nSend the dog for the blind on the far side. You pick up the diversion yourself \u2014\nthe dog never gets rewarded for the temptation. As the dog succeeds, tighten the\nangle between the diversion and the blind \u2014 90 degrees to 45, then narrower.\nThe narrower the angle, the harder the test.\n\nThis is the picture the entire track has been building toward: on a hunt day, a\nbird falls and the dog must ignore it to run a blind to a different bird. In a\nhunt test, this is a Senior or Master level skill. The dog must hold the sent\nline past a known temptation and trust that the handler is sending it to\nsomething real.\n","pass": "Refuses the diversion and takes the blind line 3 of 4, with one handle or fewer.\n","body": "","ifthen": [["Suction to the diversion","Increase the angle between them and shorten the blind. Rebuild from a rep the dog can win."],["Handles well but slows down","Reduce reps. Blinds are expensive. End early and end on a win."]],"checks": [{"id": "c1","label": "Blind with diversion, one handle or fewer","hits": 3,"of": 4}],"session_cap": null,"equipment": [],"requires": ["LN-6"],"trigger": null,"blocked_note": null,"diagram": null},{"code": "LN-R2","id": "lining.ref_casts","track": "LN","trackName": "Lining & Blinds","color": "#9A7C42","type": "reference","n": null,"title": "Naming Casts","drill": "","pass": "","body": "Casts are named for your arm, not the dog's body.\n\nA right over means your right arm goes out and the dog moves in that direction.\nA right hand back means your right hand goes up and the dog spins away from it.\nEvery cast is described from the handler's perspective, always.\n\nThis sounds obvious until you are talking to another handler mid-session and say\n\"a bit further on the dog's left\" \u2014 which is your right. Pick handler-side, say\nit out loud in every session, and never describe a cast from the dog's point of\nview. The moment you are handling a dog at eighty yards in wind is the wrong\nmoment to work out which side you meant.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": "prerequisite","blocked_note": null,"diagram": "ln-r1"},{"code": "WA-T","id": "water.title","track": "WA","trackName": "Water","color": "#3F5A6B","type": "title","n": null,"title": "Water Work","drill": "","pass": "","body": "Water is where a duck dog earns its keep. Stages 1\u20133 are foundation water work\nand can start early in the program.\n\nStages 4\u20137 are pressure and casting in water and sit behind the gate card.\nOne axis at a time applies double here: the water is itself a difficulty, so\nnever add a second one in the same session.\n\nStage 3 runs parallel to {ref:steadiness|track} by design \u2014 it does not wait on\n{ref:steadiness.s4}. Water re-opens the break because the entry is its own\nexcitement, so steadiness gets rebuilt in miniature rather than assumed.\n","ifthen": [],"checks": [],"session_cap": null,"equipment": [],"requires": [],"trigger": null,"blocked_note": null,"diagram": null},{"code": "WA-1","id": "water.s1","track": "WA","trackName": "Water","color": "#3F5A6B","type": "stage","n": 1,"title": "Baseline \u2014 Swimmer, Entry, Delivery","drill": "Short happy singles, 15\u201325 yds, calm water, clean bank. This stage is measuring,\nnot teaching \u2014 confirming the dog swims level and relaxed, enters the water\nstraight without shopping the bank (running along the edge looking for a shallow\nor easy spot), and carries the bumper to hand without dropping it to shake. If\nthe dog puts it down once to shake, that becomes the habit. Delivery to hand\nstarts here or it never starts.\n","pass": "5/5 straight entries at 20 yds and 5/5 delivered to hand with no drop
