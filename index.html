<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reba">
<meta name="theme-color" content="#F3F2EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Reba — Gun Dog Program</title>
<style>
  :root{
    --ink:#232720; --muted:#6B6F64; --bg:#F2F1ED; --line:#D4D1C8;
    --alert:#A32E1E; --card:#FFFFFF; --accent:#2E7D4F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,system-ui,'Helvetica Neue',Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--ink); font-size:17px; line-height:1.47;
       padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  /* ── screens ── */
  .screen{min-height:100vh; min-height:100dvh;}
  /* ── home screen ── */
  .home-header{padding:56px 20px 12px; display:flex; justify-content:space-between; align-items:baseline;}
  .home-title{font-size:34px; font-weight:800; letter-spacing:-.02em;}
  .home-build{font-size:12px; color:var(--muted);}
  .home-dogs{padding:0 16px 40px;}
  .dog-card{display:flex; align-items:center; gap:16px; background:var(--card);
            border-radius:16px; padding:16px; margin-bottom:12px;
            box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer;
            transition:transform .1s ease;}
  .dog-card:active{transform:scale(.97);}
  .dog-avatar{width:60px; height:60px; border-radius:50%; background:var(--line);
              display:flex; align-items:center; justify-content:center;
              font-size:28px; overflow:hidden; flex-shrink:0;}
  .dog-avatar img{width:100%; height:100%; object-fit:cover;}
  .dog-info{flex:1; min-width:0;}
  .dog-name{font-size:20px; font-weight:700;}
  .dog-status{font-size:13px; color:var(--muted); margin-top:2px;}
  .dog-add{display:flex; align-items:center; justify-content:center; gap:10px;
           background:none; border:2px dashed var(--line); border-radius:16px;
           padding:20px; margin-top:4px; color:var(--muted); font-size:16px;
           font-weight:600; cursor:pointer; width:100%;
           transition:transform .1s ease;}
  .dog-add:active{transform:scale(.97);}
  /* ── hub screen ── */
  .hub-bar{position:sticky; top:0; z-index:10; display:flex; align-items:center;
           gap:10px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top));
           background:rgba(242,241,237,.85); -webkit-backdrop-filter:blur(12px);
           backdrop-filter:blur(12px); border-bottom:0.5px solid var(--line);}
  .hub-back,.tab-back{border:0; background:none; font-size:32px; font-weight:300;
                      color:var(--accent); padding:0 4px; line-height:1; cursor:pointer;}
  .hub-dog{display:flex; align-items:center; gap:8px; flex:1; min-width:0;}
  .hub-avatar{width:32px; height:32px; border-radius:50%; background:var(--line);
              overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .hub-avatar img{width:100%; height:100%; object-fit:cover;}
  .hub-name{font-size:17px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hub-edit{border:0; background:none; font-size:20px; color:var(--muted); cursor:pointer; padding:4px 8px;}
  .hub-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:20px 16px 40px;}
  .hub-tile{background:var(--card); border-radius:16px; padding:24px 16px 20px;
            text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer;
            transition:transform .1s ease; border:none; color:var(--ink); font-family:inherit;}
  .hub-tile:active{transform:scale(.95);}
  .hub-icon{font-size:36px; margin-bottom:8px; display:block;}
  .hub-label{font-size:15px; font-weight:700; letter-spacing:.04em;}
  .hub-sub{font-size:12px; color:var(--muted); margin-top:4px; min-height:16px;}
  /* ── tab screen bar ── */
  .tab-bar{position:sticky; top:0; z-index:10; display:flex; align-items:center;
           gap:8px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top));
           background:rgba(242,241,237,.85); -webkit-backdrop-filter:blur(12px);
           backdrop-filter:blur(12px); border-bottom:0.5px solid var(--line);}
  .tab-title{font-size:17px; font-weight:700; flex:1;}
  main{padding:12px 12px 90px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
  .chip{padding:11px 16px; border:1.5px solid var(--line); border-radius:22px; background:#fff;
        font-size:14px; font-weight:600; color:var(--muted); min-height:44px;}
  .chip.on{color:#fff; border-color:transparent;}
  .cardrow{display:flex; align-items:center; gap:12px; background:var(--card);
           border-radius:14px; padding:14px 16px; margin-bottom:8px;
           box-shadow:0 1px 3px rgba(0,0,0,.06); cursor:pointer;
           transition:transform .1s ease;}
  .cardrow:active{transform:scale(.98);}
  .cardrow .stripe{width:6px; align-self:stretch; border-radius:3px;}
  .cardrow .code{font-weight:800; font-size:14px; width:52px; letter-spacing:.03em;}
  .cardrow .ti{font-size:16px; flex:1;}
  .cardrow .ty{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  /* card detail */
  .detail{background:var(--card); border-radius:16px; overflow:hidden;
          box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .detail .head{color:#fff; padding:16px 18px;}
  .detail .head .code{font-size:13px; font-weight:700; letter-spacing:.1em; opacity:.85;}
  .detail .head .title{font-size:22px; font-weight:800; line-height:1.25; margin-top:2px;}
  .detail .sec{padding:16px 18px; border-top:1px solid var(--line);}
  .detail h4{margin:0 0 8px; font-size:12px; letter-spacing:.12em; color:var(--muted);}
  .detail .txt{white-space:pre-wrap; font-size:17px; line-height:1.5;}
  .big .txt{font-size:20px; line-height:1.55;}
  .ifrow{display:grid; grid-template-columns:1fr 1.6fr; gap:12px; padding:10px 0;
         border-top:1px dashed var(--line); font-size:16px; line-height:1.45;}
  .ifrow:first-of-type{border-top:0;}
  .ifrow .if{font-weight:700;}
  .checkrow{display:flex; gap:10px; padding:8px 0; font-size:16px; align-items:center;}
  .checkrow .num{font-weight:800; white-space:nowrap; font-size:17px;}
  .check-progress{height:4px; background:var(--line); border-radius:2px; flex:0 0 60px;}
  .check-fill{height:100%; background:var(--accent); border-radius:2px; transition:width .3s;}
  .capnote{background:#FBF6E9; border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-size:14px; margin-top:8px;}
  .backbtn{margin:0 0 10px; padding:8px 14px; border:1.5px solid var(--ink); background:#fff; border-radius:8px; font-weight:700;}
  .bigbtn{float:right; margin-bottom:10px; padding:8px 14px; border:1.5px solid var(--line); background:#fff; border-radius:8px; font-weight:700; color:var(--muted);}
  /* log form */
  .fs{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px;}
  .fs h3{margin:0 0 4px; font-size:13px; letter-spacing:.12em; color:var(--muted);}
  .fs .why{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
  label.f{display:block; font-size:13px; font-weight:700; margin:12px 0 4px;}
  label.f .hint{font-weight:400; color:var(--muted);}
  input[type=text],input[type=number],input[type=date],textarea{
    width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:8px; font-size:16px; background:#fff;}
  textarea{min-height:64px;}
  .row2{display:flex; gap:10px;} .row2>*{flex:1;}
  .req{color:var(--alert);}
  .cardlog{border:1.5px solid var(--line); border-radius:10px; padding:12px; margin-top:12px;}
  .cardlog .hd{display:flex; align-items:center; gap:8px; font-weight:800;}
  .cardlog .hd .dot{width:10px;height:10px;border-radius:5px;}
  .ckline{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
  .ckline .lb{flex:1 1 100%; font-size:14px;}
  .ckline input[type=number]{width:64px;}
  .ckline .of{color:var(--muted); font-weight:700;}
  .warn{color:var(--alert); font-weight:700; font-size:14px; margin-top:8px;}
  .crumb1{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
  .crumb1 .bigbtn{margin-left:auto;}
  .crumb2{display:flex; align-items:center; justify-content:space-between; gap:8px;
          margin-bottom:10px; padding:6px 8px; background:var(--gray);
          border:1px solid var(--line); border-radius:10px;}
  .crumbbtn{background:none; border:0; color:var(--ink); font:inherit; font-size:13px;
            font-weight:600; padding:4px 6px; cursor:pointer;}
  /* dead text, not a button — a control that goes where you already are reads as broken */
  .crumbnow{font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.04em; padding:4px 6px;}
  .crumbend{font-size:13px; color:var(--line); padding:4px 6px;}
  .export{background:#fff; border:1.5px solid var(--ink); border-radius:10px; padding:12px; margin-top:14px;}
  pre{white-space:pre-wrap; font-size:13px; background:var(--bg); padding:10px; border-radius:8px; max-height:340px; overflow:auto;}
  .go{width:100%; padding:14px; font-size:17px; font-weight:800; color:#fff; background:var(--ink); border:0; border-radius:10px;}
  .copy{width:100%; padding:12px; font-size:15px; font-weight:700; border:1.5px solid var(--ink); background:#fff; border-radius:10px; margin-top:8px;}
  .missing{background:#FDF0EE; border:1px solid var(--alert); border-radius:8px; padding:10px; margin-top:10px; font-size:14px;}
  .subtle{font-size:12.5px; color:var(--muted); text-align:center; margin-top:18px;}
  /* tracks */
  .trk{background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:12px; overflow:hidden;}
  .trk .th{color:#fff; padding:10px 12px;}
  .trk .th .nm{font-weight:800; font-size:16px;}
  .trk .th .cur{font-size:12.5px; opacity:.9;}
  .srow{display:flex; align-items:center; gap:9px; padding:9px 12px; border-top:1px solid var(--line); font-size:14.5px;}
  .srow.lock{color:var(--muted); background:#FAFAF8;}
  .srow .cd{font-weight:800; width:48px; font-size:13px;}
  .srow .nm{flex:1;}
  .badge{font-size:10.5px; font-weight:800; letter-spacing:.07em; padding:3px 7px; border-radius:10px; white-space:nowrap;}
  .b-banked{background:#2E7D4F; color:#fff;}
  .b-assert{background:#2E7D4F; color:#fff; opacity:.72;}
  .b-prog{background:var(--ink); color:#fff;}
  .b-short{background:var(--alert); color:#fff;}
  .b-lock{background:var(--line); color:#4a4f47;}
  .sd{padding:8px 12px 10px 60px; border-top:1px dashed var(--line); font-size:13px;
      background:#FDF0EE; color:#5d2a22;}
  .sd b{color:var(--alert);}
  .b-none{background:#EDEBE4; color:var(--muted);}
  .why{font-size:12.5px; color:var(--muted);}
  .ckmini{display:flex; gap:8px; padding:5px 12px 5px 60px; font-size:13px; color:var(--muted); border-top:1px dashed var(--line);}
  .ckmini .id{font-weight:800; width:22px;}
  .asof{font-size:12.5px; color:var(--muted); background:#FBF6E9; border:1px solid var(--line);
        border-radius:8px; padding:9px 11px; margin-bottom:12px;}
  /* week */
  .ribbon{display:flex; gap:10px; align-items:baseline; background:var(--ink); color:#fff;
          border-radius:10px; padding:10px 12px; margin-bottom:10px;}
  .ribbon .big{font-size:21px; font-weight:800; letter-spacing:.02em;}
  .ribbon .sub{font-size:12px; opacity:.82; flex:1;}
  .expo{font-size:12.5px; color:var(--muted); margin:-4px 2px 10px;}
  .strip{display:flex; gap:2px; margin-bottom:12px; align-items:center; flex-wrap:wrap;}
  .strip i{width:8px; height:8px; border-radius:4px; background:#E2E0D8; display:block; flex:0 0 8px;}
  .strip i.w{background:var(--ink);}
  .strip i.r{background:#fff; border:2px solid var(--line); width:8px; height:8px; border-radius:4px; box-sizing:border-box;}
  .strip i.t{outline:2px solid var(--alert); outline-offset:2px;}
  .strip .key{font-size:11px; color:var(--muted); width:100%; text-align:right; margin-top:2px;}
  .wknav{display:flex; gap:12px; margin-bottom:10px;}
  .wknav button{padding:12px 20px; border:1.5px solid var(--line); background:#fff;
                border-radius:8px; font-weight:800; color:var(--muted);}
  .wknav .lab{flex:1; text-align:center; font-weight:800; letter-spacing:.06em; font-size:13px; padding-top:10px;}
  .day{background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden;}
  .day.today{border:2px solid var(--ink);}
  .day .dh{display:flex; align-items:baseline; gap:8px; padding:9px 12px;
           font-size:12px; letter-spacing:.07em; color:var(--muted);}
  .day .dh b{font-size:15px; color:var(--ink); letter-spacing:0;}
  .day .dh .rt{margin-left:auto; font-size:10.5px; font-weight:800; letter-spacing:.08em;}
  .ran{display:flex; gap:9px; align-items:baseline; padding:7px 12px; border-top:1px solid var(--line); font-size:14.5px;}
  .ran .cd{font-weight:800; width:52px; font-size:13px;}
  .ran .sc{margin-left:auto; font-weight:800; font-size:13px;}
  .ran .sc.no{color:var(--muted); font-weight:600;}
  .rest{padding:11px 12px; border-top:1px solid var(--line); background:#EDEBE2;
        font-weight:800; letter-spacing:.09em; font-size:12.5px; text-align:center;}
  .empty{padding:9px 12px; border-top:1px solid var(--line); font-size:13px; color:var(--muted);}
  .slot{padding:9px 12px; border-top:1px solid var(--line); font-size:14px;}
  .slot .lb{font-size:10.5px; font-weight:800; letter-spacing:.09em; color:var(--muted);}
  .eq{font-size:12.5px; color:var(--muted); line-height:1.35;}
  .live{padding:9px 12px; border-top:1px solid var(--line); background:#FBF6E9; font-size:13px;}
  .horizon{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-top:16px;}
  .horizon h4{margin:0 0 2px; font-size:12px; letter-spacing:.12em; color:var(--muted);}
  .hz{display:flex; gap:9px; align-items:baseline; padding:8px 0; border-top:1px dashed var(--line); font-size:14px;}
  .hz:first-of-type{border-top:0;}
  .hz .cd{font-weight:800; width:52px; font-size:13px;}
  .hz .ago{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap;}
  .note{font-size:12.5px; color:var(--muted); margin:10px 2px 0;}
  /* diagram viewer */
  .dgmbtn{display:block; width:100%; margin:0 0 10px; padding:12px; border:1.5px solid var(--ink);
          background:#fff; border-radius:8px; font-weight:800; letter-spacing:.06em;}
  #dgm{position:fixed; inset:0; background:#fff; z-index:200; display:none;}
  #dgm .close{position:absolute; top:10px; right:12px; z-index:2; padding:9px 14px; border:1.5px solid var(--ink);
              background:#fff; border-radius:8px; font-weight:800;}
  #dgm .turn{position:absolute; bottom:12px; left:0; right:0; text-align:center; font-size:12px;
             letter-spacing:.08em; color:var(--muted);}
  #dgm .wrap{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  /* An SVG with a viewBox has an intrinsic 432x288 and will sit at that size
     unless it is told to fill. max-width alone caps it and never grows it,
     which put a 6x4 back on a phone at about a third of print size. */
  #dgm img{width:100%; height:100%; object-fit:contain; padding:6px;}
  @media (orientation:portrait){
    /* A 6x4 back shown portrait-fit lands at about 47% of print size and every
       7 pt label disappears. Rotated, it fills the screen and the handler turns
       the phone — which is what the specs assume. */
    #dgm .wrap{transform:rotate(90deg);}
    #dgm .wrap{width:100vh; height:100vw; top:50%; left:50%;
               transform:translate(-50%,-50%) rotate(90deg);}
  }
  @media (orientation:landscape){ #dgm .turn{display:none;} }
  /* floating export button */
  .fab-export{position:fixed; bottom:16px; left:12px; right:12px; z-index:20;
              padding:14px; font-size:17px; font-weight:800; color:#fff; background:var(--ink);
              border:0; border-radius:10px; text-align:center; box-shadow:0 4px 12px rgba(0,0,0,.25);
              display:none;}
  .fab-export.show{display:block;}
  /* validation error highlight */
  .field-highlight{animation:fieldFlash .6s ease-out;}
  @keyframes fieldFlash{0%{box-shadow:0 0 0 4px var(--alert);}100%{box-shadow:none;}}
  /* track group header in LOG card picker */
  .track-group-hdr{font-size:13px; font-weight:800; letter-spacing:.1em; margin:14px 0 4px; padding:4px 8px; border-left:4px solid; border-radius:2px;}
  /* days since last session */
  .days-since{font-size:13px; color:var(--muted); text-align:center; margin-bottom:10px; padding:6px 0;}
  /* clear confirm state */
  .copy.confirm-warn{background:#D4440A; color:#fff; border-color:#D4440A;}
  /* LOG toggle */
  .log-toggle{display:flex; gap:0; margin:0 0 12px; border:1.5px solid var(--line); border-radius:8px; overflow:hidden;}
  .log-toggle button{flex:1; padding:10px 0; border:0; background:#fff; font-size:13px; font-weight:700;
    letter-spacing:.08em; color:var(--muted); cursor:pointer;}
  .log-toggle button.on{background:var(--ink); color:#fff;}
  /* session history */
  .sh-outing{background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:8px; overflow:hidden;}
  .sh-head{padding:11px 12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .sh-date{font-weight:800; font-size:14px;}
  .sh-meta{font-size:12px; color:var(--muted);}
  .sh-body{padding:0 12px 10px; border-top:1px solid var(--line);}
  .sh-card{padding:6px 0; border-bottom:1px dashed var(--line);}
  .sh-card:last-child{border-bottom:0;}
  .sh-cname{font-weight:700; font-size:13px; letter-spacing:.03em;}
  .sh-check{display:flex; gap:8px; align-items:baseline; font-size:14px; padding:2px 0 2px 12px;}
  .sh-score{font-weight:700; font-family:monospace; min-width:44px;}
  .sh-pass{color:#2E7D4F;}
  .sh-fail{color:var(--alert);}
  .sh-label{color:var(--muted); font-size:13px;}
  /* per-card history in detail */
  .ch-row{display:flex; gap:8px; align-items:baseline; padding:4px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .ch-row:last-child{border-bottom:0;}
  .ch-date{font-weight:600; min-width:80px; font-size:13px;}
</style>
</head>
<body>

<!-- ── Screen: Home (dog selector) ──────────────────────────────────────── -->
<div id="scrHome" class="screen">
  <div class="home-header">
    <div class="home-title">Dogs</div>
    <div class="home-build" id="bstamp"></div>
  </div>
  <div id="dogList" class="home-dogs"></div>
</div>

<!-- ── Screen: Hub (2x2 icon grid per dog) ──────────────────────────────── -->
<div id="scrHub" class="screen" style="display:none">
  <div class="hub-bar">
    <button class="hub-back" onclick="haptic();goHome()" aria-label="Back">&#8249;</button>
    <div class="hub-dog">
      <div class="hub-avatar" id="hubAvatar"></div>
      <span class="hub-name" id="hubName"></span>
    </div>
    <button class="hub-edit" onclick="haptic();editDog()" aria-label="Edit">&#9998;</button>
  </div>
  <div id="hubGrid" class="hub-grid"></div>
</div>

<!-- ── Screen: Tab content (week/cards/tracks/log) ──────────────────────── -->
<div id="scrTab" class="screen" style="display:none">
  <div class="tab-bar">
    <button class="tab-back" onclick="haptic();goHub()" aria-label="Back">&#8249;</button>
    <span class="tab-title" id="tabTitle"></span>
  </div>
  <main>
    <div id="vWeek"></div>
    <div id="vCards" style="display:none"></div>
    <div id="vTracks" style="display:none"></div>
    <div id="vLog" style="display:none"></div>
  </main>
  <button id="fabExport" class="fab-export" onclick="haptic();doExport()">VALIDATE &amp; EXPORT</button>
</div>

<!-- ── Diagram overlay (unchanged) ──────────────────────────────────────── -->
<div id="dgm"><button class="close" onclick="closeDiagram()">CLOSE</button>
  <div class="wrap"><img id="dgmimg" alt=""></div>
  <div class="turn">TURN THE PHONE SIDEWAYS</div></div>

<script>
window.onerror = function(msg, src, line){
  var d = document.createElement('div');
  d.style.cssText = 'background:#FDF0EE;border:1px solid #A32E1E;border-radius:8px;padding:10px;margin:10px;font-size:13px';
  d.textContent = 'App error (screenshot this): ' + msg + ' @' + line;
  document.body.prepend(d);
};
</script>
<script>
/* DECK_START */
const DECK = {"build": "08-10·197", "version": "2026-08-10", "dog": "Reba", "palette": {"green": "#2F4A32", "rust": "#8C3B2A", "tan": "#9A7C42", "slate": "#3F5A6B", "clay": "#7A5240", "olive": "#6B6A2F", "teal": "#2C5B57", "indigo": "#3B426E", "plum": "#6A3B58", "alert": "#A32E1E", "gray": "#F3F2EE", "line": "#C6C2B6", "ink": "#232720", "muted": "#6B6F64"}, "cards": [{"code": "MK-T", "id": "steadiness.title", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "title", "n": null, "title": "Steadiness in Marking Drills", "drill": "", "pass": "", "body": "Marks and steadiness pull against each other. Buy steadiness by\npreventing the break, not punishing it. Marking desire comes first —\nnever trade it away. Add difficulty on one axis at a time; keep the mark\nitself easy whenever steadiness is the thing being tested.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "MK-1", "id": "steadiness.s1", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 1, "title": "Held Hold on Singles", "drill": "Short tab or lead at heel, or foot on the lead so hands are free. Throw an\neasy short single. Hold her sitting through the fall, pause 1–2 sec, release\nwith her name. The lead does the enforcing, not you — a break should be\nmechanically impossible.\n", "pass": "Holds through the fall with slack in the lead, not straining against it, across\n~10 reps and 2–3 sessions. The hold feels automatic before you ask for it\nwithout restraint.\n", "body": "", "ifthen": [["Straining against the lead", "Mark is too exciting. Shorten the throw, cut the delay to zero, rebuild."], ["You find yourself correcting", "Go back to foot-on-lead. At this stage you prevent, you do not correct."]], "checks": [{"id": "c1", "label": "Holds through the fall, slack in the lead", "hits": 10, "of": 10, "sessions": 3}], "session_cap": null, "equipment": ["lead"], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "MK-2", "id": "steadiness.s2", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 2, "title": "Release Delay", "drill": "Same easy single, still managed. Stretch the pause from 1–2 sec toward\n5–10+. Vary the timing every rep. Occasionally hold and pick the bumper up\nyourself (no-bird) — sparingly. She releases to her name, not to the throw.\n", "pass": "Sits quietly through delays up to 8–10 sec — no whining, creeping, or\nanticipating — and does not flinch toward a no-bird.\n", "body": "", "ifthen": [["Creeps as the delay stretches", "The delay grew on a schedule she can read. Randomize: 2 sec, 9 sec, 3 sec, 6 sec."], ["Sours on no-birds", "You are using them too often. One rep in eight at the very most."], ["Return goes wide, or she parades", "Off-axis for this stage, but it will not fix itself. See The Parading Return."]], "checks": [{"id": "c1", "label": "Quiet through randomized 8-10 sec delays", "hits": 8, "of": 10, "sessions": 2}, {"id": "c2", "label": "No flinch toward a no-bird", "hits": 3, "of": 3}], "session_cap": null, "equipment": [], "requires": ["MK-1"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "MK-3", "id": "steadiness.s3", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 3, "title": "Add Excitement — Noise Ladder", "drill": "Prereq: Marks 2 PASS and an honest return. Light (green) loads,\nlow angle. Tube geometry: see Solo Launcher Sessions.\n\nFIVE rungs, one at a time; each new noise resets the delay to 2 sec.\n1. A gun throws, no shot.\n2. Remote launch.\n3. Add the beep 1–2 sec ahead.\n4. Popper at the line, a gun throws.\n5. Handheld at the line.\n\nThe beep drops at rung 4. One rep in five is a shot with NO SEND.\nOn lead all stage.\n", "pass": "1. 6/6 at 2 sec, x2.\n2. 8/10 at randomized 8–10 sec.\n3. 8/10 with the beep, back to 8 sec.\n4. 8/10 with the popper.\n5. 8/10 with the handheld, x2.\nSix loud reps a session, max.\n", "body": "", "ifthen": [["Breaks when a new noise is added", "You stacked two. Pull the new one, re-establish, add it back alone at 2 sec."], ["Creeps or whines watching the tube", "The tube has become the cue. Not enough no-send reps — go to one in four."], ["Flinches or checks out at the report", "Stop. Do not push through. Tube to 100+ yds, happy retrieves only, rebuild over weeks."]], "checks": [{"id": "r1", "label": "A gun throws, no shot, 2 sec delay", "hits": 6, "of": 6, "sessions": 2, "needs_helper": true}, {"id": "r2", "label": "Remote launch, randomized 8-10 sec delay", "hits": 8, "of": 10}, {"id": "r3", "label": "Beep added, delay back to 8 sec", "hits": 8, "of": 10}, {"id": "r4", "label": "Popper at the line, a gun throws", "hits": 8, "of": 10, "needs_helper": true}, {"id": "r5", "label": "Handheld launcher at the line", "hits": 8, "of": 10, "sessions": 2}], "session_cap": {"reps": 6, "applies_to": "launcher and popper reps", "note": "Six loud reps a session, maximum. Thrown-bumper reps are not capped."}, "equipment": ["lead", "bumpers", "sidekick", "light_loads", "beeper", "poppers_12ga", "handheld_launcher"], "requires": ["MK-2", "MK-R4"], "trigger": null, "blocked_note": "Rungs 1 and 4 need a GUN in the field — a second person. Rungs 2, 3 and 5 run solo.", "diagram": "mk-3"}, {"code": "MK-4", "id": "steadiness.s4", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 4, "title": "Wean the Lead", "drill": "Drop the lead but keep a tab on and stay close enough to intercept. Start\nback at short delay plus easy mark, then rebuild delay and excitement off\nlead. You are transferring the hold from mechanical restraint to a chosen sit.\n", "pass": "Multiple clean sessions of off-lead singles — steady through fall, delay, and\ngun — with no break and no need to touch the tab.\n", "body": "", "ifthen": [["Breaks the moment the lead comes off", "She was holding the lead, not the sit. Back to Stage 1, foot on lead, for a week. See If She Breaks."], ["You keep reaching for the tab", "You moved into the stage too early. Stand closer — do not hold tighter."]], "checks": [{"id": "c1", "label": "Off-lead single, steady through fall/delay/gun", "hits": 10, "of": 10, "sessions": 3}], "session_cap": null, "equipment": [], "requires": ["MK-3"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "MK-5", "id": "steadiness.s5", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 5, "title": "Harder / Longer Marks", "drill": "Only now do you make the retrieve itself demanding, with steadiness already\nbanked. Add distance, cover, angles, terrain — one axis at a time. Cover means\nthe cover you hunt: standing timber, open-water bank, short grass. Cross Lake's\ncypress is the timber picture. You do not hunt marsh, so do not manufacture it.\n", "pass": "Steady on long and challenging singles, and marking them well. Drive and\nsteadiness both intact.\n", "body": "", "ifthen": [["Steadiness wobbles as marks get hard", "Drop the mark difficulty back down. Do not crank corrections to hold the line."], ["Hunting short, poor marks", "You added two axes at once. Distance or cover, not both in the same session."]], "checks": [{"id": "c1", "label": "Steady on long or cover singles, marking well", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["MK-4"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "MK-6", "id": "steadiness.s6", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 6, "title": "Doubles on Lead", "drill": "Lead back on. Mark the memory bird, HOLD; mark the go-bird, HOLD; release by\nname for the go-bird; then send back for the memory. Physical management\nthrough both falls. The second throw is the single biggest break trigger there is.\n", "pass": "Holds cleanly through both throws, on lead, until the pattern is boring. No\nlunge on the second fall.\n", "body": "", "ifthen": [["Lunges on the second throw", "Widen the two falls and lengthen the gap between them. Narrow it again later."], ["Forgets the memory bird", "Steadiness is eating her marking. Make the memory bird closer and easier."]], "checks": [{"id": "c1", "label": "On-lead double, holds through both throws", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": ["lead"], "requires": ["MK-5"], "trigger": null, "blocked_note": null, "diagram": "mk-67"}, {"code": "MK-7", "id": "steadiness.s7", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "stage", "n": 7, "title": "Doubles Off Lead", "drill": "Wean the lead on doubles exactly as you did on singles — tab on, stay close,\nrebuild. This is the finished picture, and it is a maintenance skill, not a\ncompleted one.\n", "pass": "Consistent off-lead doubles, steady through both throws and the gun, marking\nboth birds.\n", "body": "", "ifthen": [["Switching between birds", "Back to on-lead doubles with wider separation between the falls."], ["Steady but slow", "Read the over-suppression card. Pull steadiness work for a week and run happy marks."]], "checks": [{"id": "c1", "label": "Off-lead double, steady through both throws and gun", "hits": 8, "of": 10, "sessions": 3}], "session_cap": null, "equipment": [], "requires": ["MK-6"], "trigger": null, "blocked_note": null, "diagram": "mk-67"}, {"code": "MK-R1", "id": "steadiness.ref_breaks", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "If She Breaks", "drill": "", "pass": "", "body": "1. Ideal: she never does, because you managed it.\n2. Stop her with the tab. Walk her back to the exact spot. Reset.\n3. Re-throw or have the thrower pick it up — the break earns nothing.\n4. The lesson is simple and it is the only lesson: breaking = no retrieve.\n5. Save the e-collar nick-on-sit for a clear, deliberate break once the rule is\nplainly understood. Do not hammer a green dog at the line.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "failure", "blocked_note": null, "diagram": null}, {"code": "MK-R2", "id": "steadiness.ref_suppression", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "Over-Suppression — Back Off", "drill": "", "pass": "", "body": "Warning signs: going slow off the line or no-going · popping (stopping to look\nback for direction) · glancing back at you before the send · sticky or reluctant\nreleases.\n\nFix: fewer corrections. Throw fun free-for-all bumpers to rebuild drive.\nRe-introduce steadiness gentler. Marking desire first, always. A slow dog is a\nfar more expensive problem than a dog that breaks.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "failure", "blocked_note": null, "diagram": null}, {"code": "MK-R3", "id": "steadiness.ref_launcher", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "Solo Launcher Sessions", "drill": "", "pass": "", "body": "Anchor her so the break is prevented mechanically: place board, stake-out chain,\nor lead under your foot. Anchor → launch → HOLD → release by name. The place\nboard helps most: leaving it is an obvious, enforceable event.\n\nTube placement. Perpendicular to her running line, throwing across it. Never\naimed at the dog, at you, or across ground you will walk. What matters is\ntube-to-FALL, not tube-to-dog: a light load carries ~50 yds alone, so a tube at\n50 yds throwing flat gives a 70 yd mark. Lower the angle or move the tube in.\n\nSame side, same direction for the whole of Marks 3 — the excitement is the new\nvariable, not the geometry. Light green loads while steadiness is being built.\nNever dry fire a hand launcher: the dummy absorbs the charge. No dummy, no shot.\n\nSun behind her, wind quartering to her. Where they fight, take the sun — she has\nto SEE the fall, and a tailwind only costs scent on a mark she watched down.\nWind wins later, on blinds. The sunset bearing swings 40°+ from August to November.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null, "diagram": "mk-r3"}, {"code": "MK-R4", "id": "steadiness.ref_parade", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "The Parading Return", "drill": "", "pass": "", "body": "Parading is a recall problem with a bumper in her mouth, not a hold problem. Every lap pays her in possession.\n\nDiagnose. One consistent side is handler habit; either side is attitude. Stand still, do not reach.\n\nPrevent, do not correct. 50 ft cord on the ground, slack, at the distance the return is honest —\nblock the loop, never reel her in. Move away as she returns. Drop the platform ritual. No collar:\npressure plus possession buys a slow return. Pay every clean rep.\n\nFade ladder\n1. Corridor, fenced both sides, cord dragging untouched.\n2. Same corridor, line off-centre, last 10 yds outside the fence.\n3. Open ground, one feature on her arcing side — Lines 1's picture.\n4. Open ground, no feature, cord dragging.\n\nPASS — rung 4 only. Rungs 1–3 are logged and never count.\n9 of 10 straight to hand, cord dragging untouched.\nTwo sessions.\n", "ifthen": [], "checks": [{"id": "c1", "label": "Straight to hand, cord dragging untouched — RUNG 4 ONLY", "hits": 9, "of": 10, "sessions": 2, "rung": 4}], "session_cap": null, "equipment": ["check_cord"], "requires": [], "trigger": "failure", "blocked_note": null, "diagram": "mk-r4"}, {"code": "MK-R5", "id": "steadiness.ref_funrep", "track": "MK", "trackName": "Steadiness & Marking", "color": "#2F4A32", "type": "reference", "n": null, "title": "The Fun Rep", "drill": "", "pass": "", "body": "The fun bumper is the period at the end of the session — the no-pressure rep the\nstanding rules require. Her desire is not the problem, so this is not medicine;\nit is a ritual. Rationed and rules-lite, never rule-free.\n\nOne or two, never more. Announce it with its own release word, never a working\ncommand. Throw short, easy, seen, into open ground. Steadiness is waived —\nbreaking on the throw IS the fun.\n\nOne rule survives: the bumper still ends in your hand. No front sit, no\nformality. As she picks up, turn and walk toward the truck; she catches up\ncarrying and you take it at your side without reaching — or let her carry at\nheel the whole way. Possession WITH you pays what she wants, in your direction.\n\nNever chase, reach, or play keep-away. Never tug — possession is her fault\nline. If she parades: no correction, no second bumper. The game simply ends.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "browse", "blocked_note": null, "diagram": null}, {"code": "WH-T", "id": "whistle.title", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "title", "n": null, "title": "Whistle Sit → Casting", "drill": "", "pass": "", "body": "The one hard rule. The whistle never enters the bird picture until Stage 4 is\nfinished. No whistle on a return from a mark. No whistle on a dog driving to a\nfall. Whistle work lives on bare ground with piles and bumpers — no thrown marks,\nno flyers.\n\nSession 10–15 min, 2–3×/week, always after marking work. Never\ncollar-condition sit on a force-to-pile day. Never end on a pressure rep. If\nmarking goes sideways, skip Whistle work entirely that day.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WH-1", "id": "whistle.s1", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 1, "title": "Whistle Sit at Heel, On Lead", "drill": "One short blast. Butt hits the ground on the sound, not after it. Head comes up,\neyes find you. Walk, sit, release with a verbal. Then trot, sit, release. Both\ndirections.\n", "pass": "10/10 clean across three consecutive sessions, from a walk and from a trot,\nboth directions. Zero forward creep after the sit.\n", "body": "", "ifthen": [["Sits late, after a beat", "Your lead pop is too slow. Pop the instant the whistle sounds, not after she ignores it."], ["Creeps forward on the sit", "Heel her TOWARD a wall or fence and blast a stride short of it — the creep has nowhere to go. Re-sit every creep, no scolding."], ["Looks away after sitting", "Not a pressure fix yet. Step in, get the eyes with a hand at your chest, release."]], "checks": [{"id": "c1", "label": "Butt on the sound, from a walk and from a trot", "hits": 10, "of": 10, "sessions": 3}], "session_cap": null, "equipment": ["lead"], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WH-2", "id": "whistle.s2", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 2, "title": "Off Lead: Sit in Motion, Stop at Distance", "drill": "Prereq: Whistle 1 PASS. Momentum is the variable, not distance. Four\nsteps, in order. 1. Heel off lead, one blast, she plants — KEEP WALKING 10+\nsteps, no pause. 2. Remote stay: back to 10→20→30→40 yds. 3. The stop — loose\nand moving, no bumper, no pile — per Teaching the Stop in Motion. 4. Stop on\nrecall at ~15 yds.\n", "pass": "1. 10/10 both directions through 10 steps. 2. 5/5 at 40 yds, 30-sec hold, zero\ncreep. 3. 9/10 first-whistle stops at 40 in motion, two sessions, slide under\none body length. 4. 5/5 at 15 yds. Step 3 is the money skill.\n", "body": "", "ifthen": [["Stays in 2, busts the stop in 3", "A stay is not a stop. Drop to 10 yds in motion and re-climb."], ["Ignores the whistle at distance", "Halve the distance. Never re-blow. See If She Blows the Whistle."], ["Recall slows, or creeps in watching", "Stop drilled into recall. Max 3 stops a session; end on 2 free recalls."], ["Slides past a body length", "See Teaching the Stop in Motion."]], "checks": [{"id": "r1", "label": "Heel off lead, holds through 10 steps", "hits": 10, "of": 10}, {"id": "r2", "label": "Remote stay at 40 yds, 30 sec hold", "hits": 5, "of": 5}, {"id": "r3", "label": "Stop on recall at 15 yds", "hits": 5, "of": 5}, {"id": "r4", "label": "First-whistle stop at 40 yds in motion", "hits": 9, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["WH-1"], "trigger": null, "blocked_note": null, "diagram": "wh-2"}, {"code": "WH-3", "id": "whistle.s3", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 3, "title": "Sit and Look at Me", "drill": "On a place board at 10 yds, sit her facing you. Square is taught by resetting,\nnot repeating: if the hip cocks, step one pace sideways — she must re-rotate to\nface you — and pay only the square sit. Eye contact is paid from the front: mark\nthe instant her eyes find yours, treat at nose height. Climb 10→20→30 yds, then\nstretch the hold to 10 sec. End state: squared, facing, eyes held until you cast\nor release. A crooked or scanning dog cannot take a cast. Non-negotiable before\nany casting work.\n", "pass": "Square, facing, eyes locked, holding through a 10-second pause at 30 yards.\n", "body": "", "ifthen": [["Sits crooked, hip cocked", "She cannot cast left off a cocked right hip. Reset until it is square every single rep."], ["Eyes drift to the pile", "Pattern-guessing. Pause longer so the cast, not the pile, becomes the cue."], ["Fidgets and re-adjusts", "Shorten the hold, build back up. A fidgety sit becomes a break under bird pressure."]], "checks": [{"id": "c1", "label": "Square, facing, eyes locked through 10 sec at 30 yds", "hits": 9, "of": 10, "sessions": 2}], "session_cap": null, "equipment": ["place_board"], "requires": ["WH-2"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WH-4", "id": "whistle.s4", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 4, "title": "Collar-Condition the Sit", "drill": "Indirect pressure only. Momentary nick simultaneous with the whistle — not\nbefore, not after — on a command she already knows cold. Garmin Sport PRO:\nstart at the lowest level she acknowledges (a flick of the ear, not a yelp) and\nraise only if she ignores.\n", "pass": "Sits on the whistle at all distances with the collar on and with it off. No\nhesitation, no anticipation of the nick.\n", "body": "", "ifthen": [["Yelps or shuts down", "Level too high. Drop it now, return to Stage 1 on lead, rebuild trust before retrying."], ["Sits before the whistle", "Reading your body, not the sound. Vary posture and timing; whistle from odd positions."], ["Sticky or slow on retrieves", "You stacked pressure. Pull Whistle work for a week, run happy marks. See Over-Suppression."]], "checks": [{"id": "c1", "label": "Sits on the whistle at all distances, collar on", "hits": 10, "of": 10, "sessions": 2}, {"id": "c2", "label": "Same with the collar off", "hits": 10, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["WH-3"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WH-5", "id": "whistle.s5", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 5, "title": "Baseball — Three-Handed Casting", "drill": "Dog on the mound, three piles at 15 yds (left, right, back). Teach back first —\nit is the natural direction and the one she already wants. Then overs, one side\nat a time. Then mix. Angle backs come last.\n", "pass": "Clean singles on back, left over, and right over. Takes the cast on the first\nsignal — no re-cast, no self-selecting a pile.\n", "body": "", "ifthen": [["Takes the wrong pile", "She is guessing. Stop mixing. Ten straight reps of the failing cast, then reintroduce choice. See Naming Casts."], ["Won't leave on 'back'", "The pile is not established. Walk her to it, throw a bumper into it, restart at 5 yds."], ["Spins before casting", "The sit is not square. That is a Stage 3 failure — go back one card."]], "checks": [{"id": "c1", "label": "Back, first signal", "hits": 9, "of": 10}, {"id": "c2", "label": "Left over, first signal", "hits": 9, "of": 10}, {"id": "c3", "label": "Right over, first signal", "hits": 9, "of": 10}, {"id": "c4", "label": "Mixed casts, no self-selecting", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["WH-4"], "trigger": null, "blocked_note": null, "diagram": "wh-5"}, {"code": "WH-6", "id": "whistle.s6", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 6, "title": "Single T → Double T", "drill": "Casting transfers off the diamond onto a lining pattern. Single T: one pile\nstraight back, two side piles at the crossbar. Whistle-sit her midway, cast.\nDouble T adds a second crossbar to build distance discipline.\n", "pass": "Runs the pattern at distance, stops on a single whistle mid-run, takes any of\nthree casts cleanly and repeatedly.\n", "body": "", "ifthen": [["Popping (stops and looks back uncast)", "You over-handled. Let her run more lines without stopping her. Expensive to fix — catch it early."], ["Veers off the line to the back pile", "Suction from a side pile. Re-run the back line alone until it is a highway."], ["Slows at the crossbar", "She is anticipating a stop. Run several reps with no whistle at all."]], "checks": [{"id": "c1", "label": "Single T: stop mid-run, three casts clean", "hits": 8, "of": 10, "sessions": 2}, {"id": "c2", "label": "Double T at distance", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["WH-5"], "trigger": null, "blocked_note": null, "diagram": "wh-6"}, {"code": "WH-7", "id": "whistle.s7", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "stage", "n": 7, "title": "Convergence — Whistle Meets Birds", "drill": "Only now does the whistle rejoin the bird picture, and only as steadiness\ninsurance: sit on the line, sit after the retrieve, sit to honor. Still not a stop on\na return from a mark. Handling on blinds is Phase 3 — well past double T.\n", "pass": "Whistle sit holds under bird pressure at the line without slowing her drive to\nthe fall or her return.\n", "body": "", "ifthen": [["Delivery gets slow after convergence", "Immediate red flag. Pull the whistle out of the bird picture for two weeks. Happy marks only."], ["Won't sit at the line with a bird out", "Bird pressure exceeds her training level. Dead bumpers, then frozen ducks, then flyers."], ["Anticipates the whistle, self-sits", "Over-drilled. More free retrieves, fewer reps."]], "checks": [{"id": "c1", "label": "Whistle sit at the line under bird pressure, no loss of drive", "hits": 9, "of": 10, "sessions": 3}], "session_cap": null, "equipment": [], "requires": ["WH-6", "MK-4"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WH-R1", "id": "whistle.ref_refusal", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "reference", "n": null, "title": "If She Blows the Whistle", "drill": "", "pass": "", "body": "1. No emotion. Do not yell. A whistle refusal punished in anger becomes a\nwhistle the dog dreads.\n2. Go get her. Walk out, take her collar, place her back on the exact spot where\nthe whistle sounded. Silence the whole way.\n3. Re-sit, hold, release. Then run the same setup at a difficulty she can win.\n4. Never re-blow. One whistle. If she ignores it you enforce — you do not\nrepeat. A repeated whistle teaches that the first one is optional.\n5. Two failures in a row = drop a stage. Not a discipline problem. A\ntraining-level problem.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "failure", "blocked_note": null, "diagram": null}, {"code": "WH-R2", "id": "whistle.ref_solo", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "reference", "n": null, "title": "Working Solo", "drill": "", "pass": "", "body": "• Piles beat throws. Stages 5–6 are built entirely on stationary piles — which is\nexactly why they work without a helper.\n• A remote launcher helps Marks work, but it is not needed for Whistle work at all.\nDo not wait on hardware to start whistle sit.\n• Use a longer lead than you think you need for Stage 2. Twenty feet of check\ncord is worth more than a helper.\n• Stake or flag your piles. Consistent pile locations are the single biggest\npredictor of clean casting.\n• Before Whistle 4, walking out and placing her is your only enforcement. That walk is\nwhat caps your working distance in Stage 2 — not her ability.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "browse", "blocked_note": null, "diagram": null}, {"code": "WH-R3", "id": "whistle.ref_stop", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "reference", "n": null, "title": "Teaching the Stop in Motion", "drill": "", "pass": "", "body": "Read before Whistle 2 step 3. The stop is built WITH her, not sprung on\nher. Walk together off heel, blow once mid-stride, and KEEP MOVING — she must\nkey on the whistle, not on you stopping. The commonest handler mistake is the\npause: pause at the blast and the pause becomes the cue, and the whistle stays\nempty. Climb SPEED before DISTANCE — walk, trot, loose run, each clean before\nthe next — then stretch 10→20→30→40 yds. After the plant, WALK TO HER and pay\nat the spot she stopped. Never recall off a stop while it is being built: the\nstop decays into a slow creep-in. Measure the slide against a line on the\nground — a football field's 5-yd marks are ideal. Pay behind the line she\nplanted on, never ahead of it. If the slide grows past a body length, drop one\nspeed class and re-climb. PASS lives on Whistle 2: 9/10\nfirst-whistle stops at 40 in motion, slide under one body length, two sessions.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null, "diagram": null}, {"code": "WH-G", "id": "whistle.gate_convergence", "track": "WH", "trackName": "Whistle Sit → Casting", "color": "#8C3B2A", "type": "gate", "n": null, "title": "Convergence Gate — Do Not Skip", "drill": "", "pass": "", "body": "Marks work and Whistle work stay physically and temporally separate until Stage 4 is\ncomplete and holding for at least two weeks.\n\nIf you find yourself wanting to blow the whistle at a marking dog before then,\nthe answer is no.\n\nEvery trainer worth listening to on this — King, Standing Stone, Lone Duck —\nsays the same thing: a whistle used to fix a marking problem creates a handling\nproblem that outlives the marking problem.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "LN-T", "id": "lining.title", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "title", "n": null, "title": "Lining & Blinds", "drill": "", "pass": "", "body": "Stages 1–5 need no whistle, no casts, no handling — they are line mechanics\nand can start today. Stages 6–7 are blinds and are locked behind Whistle work single\nT. A dog that cannot be stopped at distance cannot be corrected on a blind.\n\nAdapted from Adem Fehmi (Dog-ease, Hertfordshire). Resequenced for a\ncollar-conditioned US program — commands, gating, and correction model are\nnot his.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "LN-1", "id": "lining.s1", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 1, "title": "Backstop Line", "drill": "Levee crown, treeline, fence, or canal bank as a backstop. Dummy thrown\n20–30 yds parallel to the feature, dog at heel, wind in her face. Line her up,\nsend with back. She has seen the fall.\n", "pass": "5 of 5 out and back with no arc off the feature, clean delivery to hand.\n", "body": "", "ifthen": [["Arcs away from the feature", "Move closer to it. The feature must be within a few feet of her line, not a distant landmark."], ["Hunts short", "The throw is too long for the ground. Shorten until the line is a highway, then stretch."], ["Wide or slow coming back", "PASS needs a clean delivery, not just a clean outrun. See The Parading Return in Marks."]], "checks": [{"id": "c1", "label": "Out and back, no arc, clean delivery", "hits": 5, "of": 5}], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": "ln-1"}, {"code": "LN-2", "id": "lining.s2", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 2, "title": "Both Directions", "drill": "Same ground, same backstop. Alternate throws left and right of your position,\nre-heeling and re-lining her every rep. The line must come from how you set her\nup, not from a habit.\n", "pass": "She sets up on your line each time without drifting toward the previous side.\n5 of 5 both ways.\n", "body": "", "ifthen": [["Pre-loads on one side", "Run three in a row on the weak side, then reintroduce alternation."], ["Won't sit square to the line", "That is a Whistle 3 problem. Fix it there, not here."]], "checks": [{"id": "c1", "label": "Sets up on your line, alternating sides", "hits": 5, "of": 5}], "session_cap": null, "equipment": [], "requires": ["LN-1"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "LN-3", "id": "lining.s3", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 3, "title": "Distance & Wind", "drill": "Same ground stretched to 50–70 yds, throw into the wind. Change your start\npoint along the feature so the ground stays familiar and the picture does not.\n", "pass": "Straight line held at full distance. No hunting short, no swinging wide of the\nfeature.\n", "body": "", "ifthen": [["Line falls apart past 40 yds", "Add ten yards at a time, not twenty. Back up to the last distance that held."], ["Overruns with wind at her back", "Reset to throwing into the wind until the line is reliable at that distance."], ["The feature runs out before the throw does", "The feature must be longer than the mark or the start point cannot move. Run 50 yds on a 60 yd feature; save 70 for longer ground."]], "checks": [{"id": "c1", "label": "Straight line held at 50-70 yds into the wind", "hits": 5, "of": 5, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["LN-2"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "LN-4", "id": "lining.s4", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 4, "title": "Memory Retrieve", "drill": "Lead on. Walk her to heel down the backstop, plant the dummy, let her mark it,\nthen about turn AWAY from the plant — never across her line to it. Heeling on\nthe left, that is a right about turn. Walk back, sit, lead off, send.\n", "pass": "Clean send and straight line on a planted dummy at 40+ yds, with no creeping\nwhile you walk back. 5/5, two sessions.\n", "body": "", "ifthen": [["Creeps while you walk back", "Lead stays on and under your foot. This is a Marks 1 picture — treat it as one."], ["Forgets the fall", "Shorten the walk-back and let her watch you plant it longer before you turn away."]], "checks": [{"id": "c1", "label": "Memory retrieve at 40+ yds, no creeping", "hits": 5, "of": 5, "sessions": 2}], "session_cap": null, "equipment": ["lead"], "requires": ["LN-3"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "LN-5", "id": "lining.s5", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 5, "title": "Honest Dog (Seen Diversion)", "drill": "Two dummies down, both seen. THROW ORDER NEVER VARIES: far one first, near\none second, so the picture is the same every rep. Send her for the far one\nand walk out for the near one yourself. One send in four goes to the near one\ninstead, logged as a no-count — that is what stops the far bird becoming the\npattern. The honor picture, trained without a blind.\n", "pass": "Takes the sent line past a visible diversion 4 of 5, and sits quiet while you\ncollect the other. Near-bird sends are logged and never count.\n", "body": "", "ifthen": [["Takes the diversion", "Widen the angle between the two and shorten the sent one until she wins, then rebuild."], ["Whines while you pick up", "Ignore it, finish, and release her on a different rep. Never send her for the one she whined at."]], "checks": [{"id": "c1", "label": "Takes the sent line past a visible diversion (far-bird sends only)", "hits": 4, "of": 5}], "session_cap": null, "equipment": [], "requires": ["LN-4"], "trigger": null, "blocked_note": null, "diagram": "ln-5"}, {"code": "LN-G", "id": "lining.gate", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "gate", "n": null, "title": "GATE — Stop Here", "drill": "", "pass": "", "body": "Do not run Stages 6–7 until Whistle work is complete through single T.\n\nThat means: sit on a single whistle at distance, and left over, right over, and\nback taken cleanly off that stop.\n\nA dog that cannot be stopped at distance cannot be corrected on a blind.\nRunning blinds early is how you build a dog that takes a wrong line at full\nspeed, or a dog that pops. Until the gate is cleared, the next two cards are a\nroadmap — not a to-do list.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "LN-6", "id": "lining.s6", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 6, "title": "Pattern Blind on Known Ground", "drill": "The same backstop you have used since Stage 1. Plant the dummy with her out\nof sight. Line her up, send. A wrong line gets a sit whistle and a recast — not a\nrecall, not a re-send.\n", "pass": "3 of 3 pattern blinds at 60–80 yds with no more than one handle each.\n", "body": "", "ifthen": [["Pops — stops and looks back uncast", "You over-handled. Run lines with no whistle before returning to blinds. See Over-Suppression."], ["No-go on the send", "She does not believe there is anything out there. Show her the plant for a few reps."]], "checks": [{"id": "c1", "label": "Pattern blind 60-80 yds, one handle or fewer", "hits": 3, "of": 3}], "session_cap": null, "equipment": [], "requires": ["LN-5", "WH-6"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "LN-7", "id": "lining.s7", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "stage", "n": 7, "title": "Blind with Diversion", "drill": "Throw a diversion dummy she sees, off to one side. Send her for the blind on the\nfar side. You pick the diversion yourself. This is the shoot-day picture and the\ntest picture.\n", "pass": "Refuses the diversion and takes the blind line 3 of 4, with one handle or fewer.\n", "body": "", "ifthen": [["Suction to the diversion", "Increase the angle between them and shorten the blind. Rebuild from a rep she can win."], ["Handles well but slows down", "Reduce reps. Blinds are expensive. End early and end on a win."]], "checks": [{"id": "c1", "label": "Blind with diversion, one handle or fewer", "hits": 3, "of": 4}], "session_cap": null, "equipment": [], "requires": ["LN-6"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "LN-R1", "id": "lining.ref_casts", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "reference", "n": null, "title": "Naming Casts", "drill": "", "pass": "", "body": "Casts are named for your arm, not her body.\n\nA right over means your right arm goes out and she moves in that direction.\n\nThe source video muddles this repeatedly — calling the same dummy \"on my\nright\" and then \"a bit further on her left\" within one rep. Pick handler-side, say\nit out loud in every session, and never describe a cast from her point of view.\nThe moment you are handling a dog at eighty yards in wind is the wrong\nmoment to work out which side you meant.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null, "diagram": "ln-r1"}, {"code": "LN-R2", "id": "lining.ref_import", "track": "LN", "trackName": "Lining & Blinds", "color": "#9A7C42", "type": "reference", "n": null, "title": "What Not to Import", "drill": "", "pass": "", "body": "The verbal. Fehmi uses one word — \"get out\" — for both left and right and lets\nthe hand carry the meaning. Reba is on back / here / sit. Do not add a third\nverbal mid-foundation.\n\nThe sequencing. He runs blinds off nothing but good seen and memory\nretrieves. That works in a no-collar picking-up program with a pro reading the\ndog. It does not transfer here.\n\nThe correction model. His answer to a bad rep is to drop back a step — keep\nthat. But your answer to a wrong line after the gate is a whistle stop and a\nrecast.\n\nThe about turn. He turns left on the memory retrieve. Reba heels on the left, so\na left turn sweeps you across her line to the plant. Turn away from the plant\ninstead — a right about turn here.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "browse", "blocked_note": null, "diagram": null}, {"code": "WA-T", "id": "water.title", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "title", "n": null, "title": "Water Work", "drill": "", "pass": "", "body": "Water is where a duck dog earns her keep, and it is the only track that gets\neasier in Louisiana heat. Stages 1–3 run now. Reba is already a confident\nswimmer, so Stage 1 is a check, not a build.\n\nStages 4–7 are pressure and casting in water and sit behind the gate card.\nOne axis at a time applies double here: the water is itself a difficulty, so\nnever add a second one in the same session.\n\nStage 3 runs parallel to Marks work by decision — it does not wait on\nMarks 4. Water re-opens the break because the entry is its own\nexcitement, so steadiness gets rebuilt in miniature rather than assumed.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-1", "id": "water.s1", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 1, "title": "Baseline — Swimmer, Entry, Delivery", "drill": "Short happy singles, 15–25 yds, calm water, clean bank. Measuring, not teaching:\nthat she swims level and relaxed, enters without shopping the bank, and carries\nto hand without dropping to shake. Let her put it down once and it is the habit.\n", "pass": "5/5 straight entries at 20 yds and 5/5 delivered to hand with no drop, across\ntwo sessions. Fail on delivery only — fix it here, do not carry it into Stage 2.\n", "body": "", "ifthen": [["Drops it at the bank to shake", "Back up as she lands so she must follow you to deliver. Never reach for it at the water's edge."], ["Arcs wide on the return, or parades", "Fails this PASS, not just Marks. Same dog, third context. See The Parading Return."], ["Shops the bank for a shallow entry", "That is bank running starting. Read the Bank Running card now, not in a year."], ["Swims low, thrashes, or tires fast", "Stop. Drop to 10 yds and rebuild. A confident swimmer is this track's prerequisite, not its goal."]], "checks": [{"id": "c1", "label": "Straight entry at 20 yds", "hits": 5, "of": 5, "sessions": 2}, {"id": "c2", "label": "To hand, no drop or shake first", "hits": 5, "of": 5, "sessions": 2}], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-2", "id": "water.s2", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 2, "title": "Entries — Straight Off the Bank", "drill": "The Cross Lake pictures, one at a time: clean bank, then mud, then cover, then\nthe dock. Wade each new entry before her first send off it — see Water Safety.\nLine her square and send. The entry must be straight off the line you gave her —\nno scanning for a better spot. Change entry type only when the current one is\nboring.\n", "pass": "5/5 straight entries on each of clean bank, mud, and cover at 25–40 yds. Dock\nentry counted separately, 5/5 — the height is a different variable.\n", "body": "", "ifthen": [["Runs the bank before entering", "Angle the setup so the bank offers no shortcut; shorten until she takes water straight. See Bank Running."], ["Balks at mud or cover", "She is unsure of the footing, not testing you. Walk in WITH her once, then send from 10 yds and rebuild distance."], ["Hesitates on the dock", "Height, not water. Sit her on the dock, throw short, let her choose to go. Never push a dog off a dock."]], "checks": [{"id": "c1", "label": "Clean bank entry, straight", "hits": 5, "of": 5}, {"id": "c2", "label": "Mud entry, straight", "hits": 5, "of": 5}, {"id": "c3", "label": "Cover entry, straight", "hits": 5, "of": 5}, {"id": "c4", "label": "Dock entry", "hits": 5, "of": 5}], "session_cap": null, "equipment": [], "requires": ["WA-1"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-3", "id": "water.s3", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 3, "title": "Water Singles with Steadiness", "drill": "Parallel to Marks work, not gated behind it. Rebuild the ladder in miniature\nbecause water re-opens the break. Three rungs: 1. Lead on, foot on the lead,\neasy 20 yd single, 1–2 sec delay. 2. Stretch the delay, randomized. 3. Launcher\nfired across the water. Off lead only once the on-lead hold is boring.\n", "pass": "1. 10/10 held on lead through the fall at 20 yds. 2. 8/10 through randomized\n8–10 sec delays. 3. 8/10 off lead. Two sessions at each rung.\n", "body": "", "ifthen": [["Steady on land, breaks at the water", "Expected. Different picture. Foot on the lead, back to a 1-sec delay, rebuild."], ["Whines at the water's edge", "Held too long too early. Halve the delay and build back up."], ["Loses drive into the water", "Pull steadiness for a week, run happy water marks. Water desire costs as much to rebuy as marking desire."]], "checks": [{"id": "r1", "label": "On lead, holds through the fall at 20 yds", "hits": 10, "of": 10, "sessions": 2}, {"id": "r2", "label": "Randomized 8-10 sec delay", "hits": 8, "of": 10, "sessions": 2}, {"id": "r3", "label": "Off lead, steady through fall and delay", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": ["lead"], "requires": ["WA-2"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-G", "id": "water.gate", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "gate", "n": null, "title": "GATE — Force to Water", "drill": "", "pass": "", "body": "Do not run Stages 4–7 until all three are true: land force to pile is complete\n(it is — Colten Ducote), Stages 1–3 have passed, and she is a happy, confident\nswimmer under no pressure at all.\n\nBeyond that, each late stage carries its own dependency. Swim-by additionally\nrequires Whistle 5. Water T requires Whistle 6. Water blinds require\nLines 6.\n\nForce to water run early buys a water-shy dog, and water shyness is the hardest\nthing on this list to undo. A dog that will not enter water is not a duck dog.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-4", "id": "water.s4", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 4, "title": "Force to Water", "drill": "Collar overlay on a command she already owns, in water she already likes. Short,\nstraight, shallow entries first — she must be able to walk out. Pressure only on\na refusal to enter, never on a slow return. Garmin at the lowest level she\nacknowledges. Never end a session on a pressure rep.\n", "pass": "10/10 immediate entries on command at three distances with the collar on, two\nconsecutive sessions. Then 10/10 with the collar off.\n", "body": "", "ifthen": [["Turns away, sniffs, freezes", "Avoidance. Level too high or picture too hard. Stop and run happy water marks for a week."], ["Enters well, returns slowly", "Not a force problem. Never add pressure to a return. Shorten the retrieve instead."], ["Sharp with the collar, sloppy without", "Collar-wise. Vary which sessions she wears it, and put it on for non-training days."]], "checks": [{"id": "c1", "label": "Immediate entry on command, collar on", "hits": 10, "of": 10, "sessions": 2}, {"id": "c2", "label": "Same with the collar off", "hits": 10, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["WA-3"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-5", "id": "water.s5", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 5, "title": "Swim-By", "drill": "Baseball in water. A cove or pond with a point she must swim past rather than\nround. Sit whistle in open water, then back, then overs one side at a time. The\ncast has to be taken in the water — the moment she touches bank the rep is over.\nTeach back first, same as on land.\n", "pass": "9/10 sit whistle held in open water. 8/10 each on back, left over, and right\nover, taken without touching bank. Two sessions.\n", "body": "", "ifthen": [["Cheats to the bank on the cast", "Move the setup so the bank is not a shortcut. Shorten until she wins. See Bank Running."], ["Will not sit in water", "Back to Whistle 4 on land. Open water is not where you teach a sit."], ["Pops mid-swim", "Over-handled. Run several water lines with no whistle at all before returning."]], "checks": [{"id": "c1", "label": "Sit whistle held in open water", "hits": 9, "of": 10}, {"id": "c2", "label": "Back, taken in water", "hits": 8, "of": 10, "sessions": 2}, {"id": "c3", "label": "Left over, taken in water", "hits": 8, "of": 10, "sessions": 2}, {"id": "c4", "label": "Right over, taken in water", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["WA-4", "WH-5"], "trigger": null, "blocked_note": null, "diagram": "wa-5"}, {"code": "WA-6", "id": "water.s6", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 6, "title": "Water T", "drill": "Single T moved onto water. Back pile across the pond, two side piles in the\nshallows or on the far bank. Whistle-sit her mid-swim and cast. This is distance\ndiscipline in a medium that costs her real effort.\n", "pass": "8/10 pattern runs with a clean mid-swim stop and any of three casts taken, across\ntwo sessions.\n", "body": "", "ifthen": [["Slows mid-swim anticipating the stop", "Run several reps with no whistle at all until the swim is honest again."], ["Veers toward the near bank", "Suction. Re-run the straight back line alone until it is a highway."], ["Tires fast", "Water T is physically expensive. Cut the rep count, never the standard. See Water Safety."]], "checks": [{"id": "c1", "label": "Mid-swim stop plus three casts clean", "hits": 8, "of": 10, "sessions": 2}], "session_cap": null, "equipment": [], "requires": ["WA-5", "WH-6"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-7", "id": "water.s7", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "stage", "n": 7, "title": "Water Blinds & Cheating Singles", "drill": "The hunt picture. A blind across water she has not seen planted, and cheating\nsingles — marks set so the bank looks cheaper than the swim. You pick the\ndiversion yourself. This is Cross Lake and Yang Ming in miniature.\n", "pass": "3/4 water blinds at 50–70 yds with one handle or fewer, and 4/5 cheating singles\ntaken straight through the water.\n", "body": "", "ifthen": [["Takes the bank route", "Shorten the blind, increase the angle so the bank costs more than it saves. See Bank Running."], ["Handles well but slows down", "Reduce reps. Water blinds are expensive. End early and end on a win."], ["No-go on the send", "She does not believe anything is out there. Show her the plant for a few reps."]], "checks": [{"id": "c1", "label": "Water blind 50-70 yds, one handle or fewer", "hits": 3, "of": 4}, {"id": "c2", "label": "Cheating single taken through the water", "hits": 4, "of": 5}], "session_cap": null, "equipment": [], "requires": ["WA-6", "LN-6"], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "WA-R1", "id": "water.ref_bank", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "reference", "n": null, "title": "Bank Running — Kill It Early", "drill": "", "pass": "", "body": "Bank running is the dog choosing the dry route. Every time it works it is\nreinforced by success — she still got the bumper.\n\nIt is not disobedience. It is efficiency, and she is right. Your job is to make\nthe straight line the cheap one, not to punish her for arithmetic.\n\nFixes: angle the setup so the bank offers no shortcut · shorten until she takes\nwater straight · use a channel or cove where dry land is not adjacent to the\nline · stop the rep the moment she climbs out, so a cheat never finishes.\n\nCatch it in Water 1. A three-year-old bank runner is a rebuild, not a fix.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "failure", "blocked_note": null, "diagram": null}, {"code": "WA-R2", "id": "water.ref_safety", "track": "WA", "trackName": "Water", "color": "#3F5A6B", "type": "reference", "n": null, "title": "Water Safety — Entry, Heat, Gulping", "drill": "", "pass": "", "body": "Submerged obstructions. Wade every entry before her first send off it, and again\nafter high water. A limb a swimming dog never touches sits at chest height for a\ndog launching off a bank at speed. Entries move with lake stage — pin each to a\nfixed object on the bank, not to the waterline.\n\nWater intoxication. Gulping while she retrieves can dilute blood sodium enough to\nswell brain cells. Onset is fast — hours. Signs: vomiting, staggering, lethargy,\nglazed eyes, dilated pupils, drooling, bloating; seizures or collapse when\nsevere. Emergency — go to a vet. Small dogs are at higher risk and Reba is 45 lb.\n\nPrevention: frequent breaks, a hard cap on continuous reps, and stop the session\nif she gulps on the swim.\n\nHeat: Louisiana water is warm and will not cool her. Watch for overheating in the\nlake, not just on the bank. Ears: dry them after every session.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": "prerequisite", "blocked_note": null, "diagram": null}, {"code": "HU-T", "id": "hunt.title", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "title", "n": null, "title": "Blind & Hunt Day", "drill": "", "pass": "", "body": "The track the other four are for. Most of it is environmental — a box, a\nspread, a boat, bad light — not new skill, so it runs alongside anything.\nWhere test polish and hunting utility diverge, hunting wins, and this is\nthe track where that matters most.\n\nTwo things here are not conditioning and will hurt her if run early: a gun\nfired inside a box she cannot leave, and a send made while a gun is still\nup. Both have their own cards. Read them first.\n\nSources: the program's own rulings and Jason's Yang Ming and Caddo\nexperience. Drafted with AI assistance; every number is Jason's.\n", "ifthen": [], "checks": [], "session_cap": null, "equipment": [], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-1", "id": "hunt.s1", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 1, "title": "Blind and Layout Manners", "drill": "Bare InvisiLab first — the mock blind is not built and does not gate this,\nruled 08-10. Kennel her onto the stand, then be a hunter around her: sit,\nstand, shoulder an unloaded gun, move the bag, work the call. She does not\nmove. NEVER run a correction on the stand — she loads voluntarily at meal\nprep and that is bought once.\n", "pass": "Settles inside 30 sec and holds 10 min — no whine, no exit, no second\ncommand — 3 sessions. Then 5/5 holds through you standing and shouldering\nan unloaded gun.\n", "body": "", "ifthen": [["Breaks the stand to follow you", "Shorten to 2 min and rebuild. Walk back and re-place her — never call her off and never correct her on it."], ["Whines but stays", "Duration ran ahead of her. Halve it, pay the quiet, build again. A whining dog in a blind is a dog nobody invites twice."], ["Winds up when you work the call", "The call has become a bird cue. See The Duck Call Is a Stillness Cue before another rep."]], "checks": [{"id": "c1", "label": "Settles inside 30 sec, holds 10 min, one command", "hits": 1, "of": 1, "sessions": 3}, {"id": "c2", "label": "Holds through the handler standing and shouldering an unloaded gun", "hits": 5, "of": 5}], "session_cap": null, "equipment": ["invisilab", "unloaded_gun", "blind_bag", "duck_call"], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-2", "id": "hunt.s2", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 2, "title": "Decoys — Through and Around", "drill": "LAND is a check, not a build — she has run marks through decoys and\nhabituated inside one session. Bumper past a 6-decoy spread at 20 yds; she\ngoes THROUGH out and back. WATER is the real build and is gated behind\nWater 1 and Water 2: a decoy floats at her eye level, rides\nthe chop, sits on a line she can foul, and she cannot step around it.\n", "pass": "Land 5/5 through a 6-decoy spread at 20 yds, no mouthing, no investigating,\n1 session. Water 5/5 through a 12-decoy spread, no mouthing, no diverting,\nno fouled line, 2 sessions. A head turn is a pass; a changed line is not.\n", "body": "", "ifthen": [["Picks a decoy up", "Stop the rep, take it, no correction. Shorten so the bumper is the obvious answer, then rebuild the spread."], ["Swims around the spread, not through", "That is bank running in a different coat. See Bank Running — Kill It Early."], ["Refuses to enter through decoys", "Open a lane, send through it, close the lane over sessions. Never push her into a spread."]], "checks": [{"id": "c1", "label": "LAND — 5/5 through a 6-decoy spread at 20 yds", "hits": 5, "of": 5}, {"id": "c2", "label": "WATER — 5/5 through a 12-decoy spread, nothing fouled", "hits": 5, "of": 5, "sessions": 2, "requires": ["WA-1", "WA-2"]}], "session_cap": null, "equipment": ["decoys", "bumpers"], "requires": [], "trigger": null, "blocked_note": null, "diagram": null}, {"code": "HU-3", "id": "hunt.s3", "track": "HU", "trackName": "Blind & Hunt Day", "color": "#7A5240", "type": "stage", "n": 3, "title": "Gunfire from the Blind", "drill": "Read Hunt work first. The gun starts OUTSIDE the stand at distance and\nwalks in over sessions — never the first gun of a day fired from inside.\nShot, then a mark. She is steady on the shot on open ground before any of\nthis: that is Marks 4 and it is the gate, not a suggestion.\n", "pass": "8/10 steady in the stand through a shot fired from inside, followed by a\nmark, 2 sessions.\n", "body": "", "ifthen": [["Flinches or checks out at the report", "STOP. Gun back outside and out to distance, happy retrieves only, rebuild over weeks. Do not push through."], ["Breaks off the stand on the shot", "Steadiness, not noise. Back to Marks 4 on open ground; the box makes a break worse, not better."], ["Fine outside, tense inside", "The box is the variable
